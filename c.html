<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>芯片学院 · 对齐样张 v2（iOS 26 玻璃语汇）</title>
<style>
/* ============================================================
   对齐样张 v2 · 设计令牌
   v2 升级（按评估结论）：
   1 按压反馈 = iOS 原生语言（按下高亮/变暗不位移，弃用缩放）
   2 玻璃通透化 + 高光描边（向 iOS 26 Liquid Glass 语汇靠，留七分保可读）
   3 功能图标 = 内联 SVG 线性图标（emoji 只留内容与状态语义）
   4 主页 = 内容流（单一焦点 + 横滑组），功能入口收敛给 Dock
   5 桌面细滚动条 / cell 17px / 返回键显示上一级标题
   ============================================================ */
:root{
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --bg:#F2F2F7; --bg-glow:#FFFFFF;
  --card:#FFFFFF; --fill:#E9E9EE; --fill-soft:rgba(120,120,128,.08);
  --ink:#1D1D1F; --ink2:#3C3C43; --muted:#86868B;
  --sep:rgba(60,60,67,.12);
  --green:#34C759; --green-soft:rgba(52,199,89,.13);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.1);
  --gold:#FF9500; --gold-soft:rgba(255,149,0,.16);
  --purple:#AF52DE; --purple-soft:rgba(175,82,222,.13);
  --glass:rgba(250,250,252,.62);            /* 通透：约六成，后层透出来 */
  --glass-edge:rgba(255,255,255,.5);        /* 玻璃高光描边 */
  --r-s:10px; --r-m:14px; --r-l:20px;
  --sh-card:0 1px 1.5px rgba(0,0,0,.02),0 2px 10px rgba(0,0,0,.035);
  --sh-float:0 14px 36px rgba(0,0,0,.16);
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#000; --bg-glow:#1C1C1E;
    --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
    --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
    --sep:rgba(84,84,88,.45);
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
    --green:#32D74B; --green-soft:rgba(48,209,88,.16);
    --red:#FF453A; --red-soft:rgba(255,69,58,.14);
    --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
    --purple:#BF5AF2; --purple-soft:rgba(191,90,242,.18);
    --glass:rgba(22,22,24,.55);
    --glass-edge:rgba(255,255,255,.14);
    --sh-card:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme=dark]{
  --bg:#000; --bg-glow:#1C1C1E;
  --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
  --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
  --sep:rgba(84,84,88,.45);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
  --green:#32D74B; --green-soft:rgba(48,209,88,.16);
  --red:#FF453A; --red-soft:rgba(255,69,58,.14);
  --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
  --purple:#BF5AF2; --purple-soft:rgba(191,90,242,.18);
  --glass:rgba(22,22,24,.55);
  --glass-edge:rgba(255,255,255,.14);
  --sh-card:0 1px 2px rgba(0,0,0,.5);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:17px;line-height:1.5;color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,var(--bg-glow),transparent),var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
img{max-width:100%;display:block}

/* 图标基础（内联 SVG，currentColor） */
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1em;height:1em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 尺寸兜底：嵌在固定容器里的图标不被 em 值挤歪 */
.ch-num .ic{width:16px;height:16px}
.ch-row .chev .ic{width:14px;height:14px}
.opt .mark .ic{width:20px;height:20px}

#app{display:flex;flex-direction:column;height:100dvh}

/* ============ 顶部工具栏：通透玻璃 + 高光描边 ============ */
#topbar{
  flex:none;height:54px;display:flex;align-items:center;gap:8px;
  padding:0 10px 0 14px;position:relative;z-index:30;
  background:var(--glass);
  -webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
}
/* 玻璃下缘高光：先投影淡线再深分隔，制造厚度 */
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(var(--glass-edge),rgba(120,120,128,.25));
}
#topbar .backbtn{
  display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 12px 0 6px;
  border-radius:10px;font-size:16px;color:var(--accent);font-weight:500;
  background:var(--fill-soft);transition:background .18s var(--ease),color .18s;
}
#topbar .backbtn .ic{width:16px;height:16px;color:var(--accent)}
#topbar .backbtn:disabled{opacity:.35;cursor:default;color:var(--muted)}
#topbar .backbtn:disabled .ic{color:var(--muted)}
#topbar .brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.12;pointer-events:none;max-width:44%}
#topbar .brand b{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px}
#topbar .homebtn{
  margin-left:auto;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--accent);display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);
  transition:background .18s var(--ease);
}
#topbar .homebtn .ic{width:15px;height:15px}

/* 触屏按压：iOS 语言，按下高亮变暗，无位移无缩放 */
@media (hover:none){
  #topbar .backbtn:active,#topbar .homebtn:active{background:var(--fill)}
}
@media (hover:hover){
  #topbar .backbtn:hover,#topbar .homebtn:hover{filter:brightness(.92)}
}

/* ============ 舞台与滚动条（桌面细 overlay） ============ */
#stage{flex:1;position:relative;overflow:hidden}
#scroller{
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:140px;
  scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.45) transparent;
}
@media (hover:hover){
  #scroller::-webkit-scrollbar{width:8px}
  #scroller::-webkit-scrollbar-track{background:transparent}
  #scroller::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px;border:2px solid transparent;background-clip:content-box}
  #scroller::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.6);border:2px solid transparent;background-clip:content-box}
}
.view{padding:20px 16px 30px;max-width:900px;margin:0 auto;will-change:transform,opacity}
.view.push{animation:pushIn .38s var(--ease)}
.view.pushBack{animation:pushBackIn .38s var(--ease)}
@keyframes pushIn{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pushBackIn{from{opacity:.3;transform:translateX(-52px)}to{opacity:1;transform:none}}

.kick{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}
.h1{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:5px}
.h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.cap{font-size:12px;color:var(--muted)}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.4px}

.card{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);padding:16px}
.card + .card,.card + .stack{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
  padding:4px 11px;border-radius:16px;background:var(--fill);color:var(--ink2)}
.pill.gold{background:var(--gold-soft);color:#C93400}
.pill.green{background:var(--green-soft);color:#1E9E4A}
:root[data-theme=dark] .pill.gold{color:#FFD60A}
:root[data-theme=dark] .pill.green{color:#32D74B}
.pill.blue{background:var(--accent-soft);color:var(--accent)}

/* hover（仅鼠标）：轻上浮强调；触屏按压全部走高亮不位移 */
@media (hover:hover){
  .lift{transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .18s}
  .lift:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}
  .lift:active{transform:translateY(0);filter:brightness(.95)}
}
@media (hover:none){
  .lift:active{filter:brightness(.88)}
  .tile:active,.ch-row:active,.snap-card:active{background:var(--fill)}
}

/* ============ Dock：悬浮玻璃片，仅三 Tab ============ */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#dock .dockbar{
  pointer-events:auto;display:flex;align-items:center;justify-content:center;
  background:var(--glass);
  -webkit-backdrop-filter:blur(44px) saturate(1.8);backdrop-filter:blur(44px) saturate(1.8);
  border:1px solid var(--sep);
  box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:26px;padding:5px 6px;
}
.dock-btn{
  width:66px;height:52px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative;
  color:var(--muted);transition:transform .24s var(--ease-spring),color .2s;
}
.dock-btn .d-ico{width:24px;height:24px}
.dock-btn span{font-size:10px;font-weight:600;letter-spacing:.2px}
.dock-btn.on{color:var(--accent)}
.dock-btn.on .d-ico{transform:translateY(-1px)}
@media (hover:hover){
  .dock-btn:hover{transform:translateY(-8px) scale(1.13);color:var(--accent);background:var(--fill-soft)}
}
@media (hover:none){
  .dock-btn:active{filter:brightness(.75)}
}

/* ============ 主页：内容流 ============ */
.hero-card{
  background:var(--card);
  border-radius:var(--r-l);padding:24px;color:var(--ink);display:flex;flex-direction:column;gap:13px;
  position:relative;overflow:hidden;
  border:1px solid var(--sep);box-shadow:var(--sh-card);
}
/* 几何装饰：芯片线框，低调线条 + accent 圆点 */
.hero-card .deco{position:absolute;right:10px;top:10px;width:66px;height:66px;
  color:var(--sep-strong)}
.hero-card .deco .geo-line{stroke:currentColor;stroke-width:1.6;fill:none}
.hero-card .deco .geo-dot{fill:var(--accent)}
.hero-card .hk{font-size:12px;font-weight:800;letter-spacing:2.2px;color:var(--accent)}
.hero-card .next{font-size:22px;font-weight:800;line-height:1.32;letter-spacing:-.3px;
  padding-right:72px}
.hero-card .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-card .btn-go{
  margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  padding:10px 20px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px var(--accent-soft);
}
.hero-card .btn-go .ic{width:15px;height:15px}
@media (hover:none){ .hero-card .btn-go:active{filter:brightness(.9)} }

/* 横滑组（App Store 式内容卷） */
.snap-row{
  display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.snap-row::-webkit-scrollbar{display:none}
.snap-card{
  flex:0 0 min(78%,340px);scroll-snap-align:start;border-radius:var(--r-m);
  background:var(--card);box-shadow:var(--sh-card);padding:16px;
  display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;overflow:hidden;
}
.snap-card .sc-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.snap-card .sc-ico .ic{width:20px;height:20px}
.snap-card b{font-size:16px;display:block;line-height:1.3}
.snap-card .cap{font-size:12.5px;line-height:1.45}
.snap-card .go{display:inline-flex;align-items:center;gap:3px;margin-top:auto;color:var(--accent);
  font-size:14px;font-weight:600;padding-top:4px}
.snap-card .go .ic{width:13px;height:13px}

/* 书架：最近章节直给 */
.ch-row{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);
  padding:12px 14px;min-height:60px;
}
.ch-row + .ch-row{margin-top:10px}
.ch-num{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#0A84FF,#5E5CE6);font-variant-numeric:tabular-nums}
.ch-row.done .ch-num{background:var(--green);color:#fff}
.ch-row.locked .ch-num{background:var(--fill);color:var(--muted)}
.ch-body{flex:1;min-width:0}
.ch-body b{font-size:17px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-body .cap{font-size:13px}
.ch-check{color:var(--green);flex:none;width:20px;height:20px}
.ch-row .chev{color:var(--sep-strong,var(--muted));width:16px;height:16px;opacity:.6}

/* 次级功能行（收敛后的小图标入口） */
.mini-row{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;
  background:var(--card);box-shadow:var(--sh-card);font-size:13.5px;font-weight:600;color:var(--ink2);
}
.mini-btn .ic{width:15px;height:15px;color:var(--accent)}
/* 主焦点大入口（章节课堂） */
.big-entry{
  width:100%;display:flex;align-items:center;gap:16px;text-align:left;
  border:1px solid var(--sep);box-shadow:var(--sh-card);
  padding:20px 22px;margin-top:16px;
}
.big-entry .be-ico{width:56px;height:56px;border-radius:16px;flex:none;display:flex;
  align-items:center;justify-content:center;color:var(--accent);
  background:transparent;border:1.5px solid var(--sep);
  box-shadow:inset 0 1px 0 var(--glass-edge,transparent)}
.big-entry .be-ico .ic{width:26px;height:26px}
.big-entry .be-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.big-entry .be-body b{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.big-entry .cap{font-size:13.5px;line-height:1.55;color:var(--muted)}
.big-entry .be-meta{margin-top:4px}
.big-entry .be-arrow{width:22px;height:22px;color:var(--sep-strong);flex:none}
.big-entry .be-arrow .ic{width:22px;height:22px}
@media (hover:none){ .mini-btn:active{background:var(--fill)} }

/* 课本章节页 / 讲义 / 题目（同 v1，字号微调） */
.lesson-body{font-size:17px;line-height:1.85;color:var(--ink)}
.lesson-body p{margin:14px 0}
.quote-box{background:var(--fill-soft);border-radius:var(--r-m);padding:16px 18px;margin:18px 0;
  border-left:4px solid var(--accent);font-size:16px;line-height:1.8;color:var(--ink2)}
.q-stem{font-size:18px;font-weight:600;line-height:1.5;margin:12px 0 6px}
.q-code{background:#1E1E1E;color:#D4D4D4;border-radius:12px;padding:14px 16px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13.5px;line-height:1.7;
  overflow-x:auto;margin:10px 0 14px;white-space:pre}
:root[data-theme=dark] .q-code{background:#0D0D0F;border:1px solid var(--sep)}
.opt{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border:1.5px solid var(--sep);border-radius:var(--r-m);
  padding:14px 16px;font-size:17px;margin-top:10px;transition:border-color .2s,background .2s;
}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .2s,color .2s}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.muted{opacity:.45}
.opt .mark{margin-left:auto;color:var(--green);width:22px;height:22px;display:none}
.opt.correct .mark{display:inline-flex}
/* 解析常驻卡：答题后固定在题下，不消失；:empty 自动隐藏 */
.why-note{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.7;
  display:flex;flex-direction:column;gap:10px}
.why-note:empty{display:none}
.why-note .why-body{display:flex;gap:9px;align-items:flex-start}
.why-note .why-ic{width:18px;height:18px;flex:none;margin-top:2px}
.why-ok{background:var(--green-soft);color:var(--ink)}
.why-ok .why-ic{color:#1E9E4A}
.why-no{background:var(--red-soft);color:var(--ink)}
.why-no .why-ic{color:var(--red)}
.why-note .why-body b{font-weight:700}
.retry-btn{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  font-size:14px;font-weight:600;color:var(--accent);padding:8px 16px;border-radius:10px;
  background:var(--card);box-shadow:var(--sh-card)}
@media (hover:none){ .retry-btn:active{filter:brightness(.9)} }
@media (hover:none){ .opt:active{background:var(--fill)} }
@media (hover:hover){ .opt:hover{border-color:var(--sep-strong,var(--sep))} }

/* 我的页：分组表（cell 17px 400，分隔线对齐文字左缘） */
.group{display:flex;flex-direction:column;border-radius:var(--r-m);overflow:hidden;
  background:var(--card);box-shadow:var(--sh-card);margin-top:12px}
.grow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  min-height:48px;padding:10px 16px;position:relative;background:var(--card);
}
.grow + .grow::before{content:"";position:absolute;left:61px;right:0;top:0;height:.5px;background:var(--sep)}
.grow .gi{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff}
.grow .gi .ic{width:18px;height:18px}
.grow b{font-size:17px;font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gv{font-size:15px;color:var(--muted)}
.grow .garr{color:var(--sep-strong,var(--muted));width:14px;height:14px;opacity:.7}
@media (hover:none){ .grow:active{background:var(--fill)} }
@media (hover:hover){ .grow:hover{background:var(--fill-soft)} }

/* 宫格 tile */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);
  padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left}
.tile .t-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .t-ico .ic{width:20px;height:20px}
.tile b{font-size:16px}
.tile .cap{font-size:12px;line-height:1.4}

/* 倒计时（同 v1） */
#timerBar{position:sticky;top:0;z-index:25;height:3px;background:var(--fill);overflow:hidden}
#timerBar i{display:block;height:100%;width:100%;background:var(--accent);transition:width 1s linear}
#timerChip{
  position:fixed;top:66px;right:16px;z-index:35;display:flex;align-items:center;gap:6px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-card);
  border-radius:20px;padding:6px 13px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;animation:chipIn .4s var(--ease-spring);
}
#timerChip .tdot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
#timerChip.warn .tdot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes chipIn{from{transform:translateY(-16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
#timerChip.out{animation:chipOut .25s var(--ease) forwards}
@keyframes chipOut{to{transform:translateY(-14px) scale(.92);opacity:0}}

/* 打卡月历 / 排行 / 称号 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;
  color:var(--muted);border-radius:10px}
.cal-day.lit{background:var(--green);color:#fff;font-weight:700}
.cal-day.today{box-shadow:0 0 0 2px var(--accent)}
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 2px}
.rank-row + .rank-row{border-top:.5px solid var(--sep)}
.rank-no{width:30px;font-size:15px;font-weight:700;color:var(--muted);text-align:center;flex:none}
.rank-row.me .rank-no{color:var(--accent)}
.rank-row b{font-size:16px;font-weight:500;flex:1}
.rank-row .cap{font-size:13px;font-variant-numeric:tabular-nums}
.rank-scale{margin-top:12px}
.rank-scale .rbar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.rank-scale .rbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD60A,#FF9500);
  border-radius:4px;transition:width .8s var(--ease)}
.rank-scale .rrow{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.rank-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rank-step{font-size:12px;padding:4px 10px;border-radius:14px;background:var(--fill);color:var(--muted)}
.rank-step.on{background:var(--gold-soft);color:#C93400;font-weight:600}
:root[data-theme=dark] .rank-step.on{color:#FFD60A}

/* toast */
#toastBox{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:9px;max-width:420px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:11px 17px;font-size:14.5px;font-weight:500;box-shadow:var(--sh-float);
  animation:toastIn .4s var(--ease-spring)}
:root[data-theme=dark] .toast{background:#F2F2F7;color:#1D1D1F}
.toast .t-ic{width:18px;height:18px;flex:none}
.toast.leaving{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(16px) scale(.96);opacity:0}}

/* 结算（多邻国式，庆祝表情保留为内容符号） */
#celebrate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;text-align:center;padding:24px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#celebrate.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#celebrate .c-card{animation:pop .6s var(--ease-spring)}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#celebrate .c-ring{width:132px;height:132px;margin:0 auto;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.35)}
#celebrate .c-ring i{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#30D158 0 72%,#FFD60A 72% 100%);animation:spinRing .9s var(--ease)}
@keyframes spinRing{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#celebrate .c-ring b{position:relative;z-index:2;width:104px;height:104px;border-radius:50%;
  background:var(--card);display:flex;align-items:center;justify-content:center}
#celebrate .c-ring b .ic{width:56px;height:56px;color:var(--green);stroke-width:2.2}
#celebrate h3{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.4px;margin-top:20px;
  animation:bounceIn .7s .15s var(--ease-spring) backwards}
#celebrate p{color:rgba(255,255,255,.88);font-size:16px;animation:fadeUp .5s .4s ease backwards}
#celebrate .btn-solid{background:#fff;color:#1D1D1F;font-weight:700;font-size:16px;padding:12px 30px;
  border-radius:14px;margin-top:20px;animation:fadeUp .5s .55s ease backwards}
#celebrate .btn-solid:active{filter:brightness(.9)}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

#confirmBox{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;flex-direction:column;
  align-items:stretch;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);
  border-top:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:24px 24px 0 0;animation:sheetUp .4s var(--ease-spring)}
#confirmBox.show{display:flex}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
#confirmBox .c-title{font-size:18px;font-weight:700;margin-bottom:4px}
#confirmBox .c-msg{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
#confirmBox .btn-row{display:flex;gap:10px}
#confirmBox .btn-solid{flex:1;background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  padding:14px;border-radius:14px;text-align:center}
#confirmBox .btn-line{flex:1;background:var(--fill);color:var(--ink);font-size:17px;font-weight:600;
  padding:14px;border-radius:14px;text-align:center}
#confirmBox .btn-solid:active,#confirmBox .btn-line:active{filter:brightness(.92)}

#demoTag{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:55;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);
  background:var(--glass);border:1px solid var(--sep);padding:3px 8px;border-radius:6px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
/* ============================================================
   学院壳公共 CSS 注入（唯一来源：design/对齐样张…体验版.html 之上追加）
   所有学院共用，禁止逐院改动；要改先改这里再全院重建。
   段：1 开始层  2 悬停v2  3 双层转场  4 圆角+导师卡  5 防缓存(在head)
   ============================================================ */

/* 1) 开始做题层（Duolingo 式 bottom sheet） */
#startSheet{position:fixed;inset:0;z-index:90;display:none}
#startSheet.show{display:block}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .28s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-card{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  background:var(--card);border-radius:30px 30px 0 0;
  box-shadow:var(--sh-float);padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(120%) scale(.92);
  transition:transform .52s cubic-bezier(.24,1.42,.4,1);
  border-top:1px solid var(--sep);
  will-change:transform;
}
#startSheet.show .ss-card{transform:translateY(0) scale(1)}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .32s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-grip{width:40px;height:4px;border-radius:2px;background:var(--fill);margin:0 auto 18px}
#startSheet .ss-kicker{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--accent)}
#startSheet .ss-title{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:4px;color:var(--ink)}
#startSheet .ss-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
#startSheet .ss-rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}
#startSheet .ss-row{display:flex;align-items:center;gap:11px;background:var(--bg);border-radius:14px;padding:11px 14px}
#startSheet .ss-row .ic{width:20px;height:20px;color:var(--accent);flex:none}
#startSheet .ss-row .ic svg{width:100%;height:100%}
#startSheet .ss-row b{font-size:15px;font-weight:600;color:var(--ink)}
#startSheet .ss-row span{font-size:13px;color:var(--muted)}
#startSheet .ss-start{
  width:100%;height:52px;margin-top:18px;border-radius:16px;border:none;
  background:var(--accent);color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;
  font-family:inherit;cursor:pointer;
  box-shadow:0 6px 18px var(--accent-soft);transition:filter .18s var(--ease);
}
#startSheet .ss-start:hover{filter:brightness(.94)}
@media (hover:none){ #startSheet .ss-start:active{filter:brightness(.85)} }
#startSheet .ss-cancel{width:100%;height:44px;margin-top:8px;border:none;background:transparent;
  color:var(--muted);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:12px}
@media (hover:none){ #startSheet .ss-cancel:active{background:var(--fill-soft)} }
@media (min-width:640px){ #startSheet .ss-card{border-radius:30px;bottom:14px;padding-bottom:20px} }

/* 2) 悬停语言 v2（Dock 款：上浮+微 scale+阴影，鼠哥 2026-09-04 定稿）
   只对可点元素生效：ch-row/grow 必须带 data-go* 才有点击语义；不可点静态行一律无 hover */
.ch-row{transition:transform .2s var(--ease),background .16s var(--ease)}
.ch-row[data-go],.ch-row[data-go-ch],.ch-row[data-go-drill],.ch-row[data-go-exam]{cursor:pointer}
.ch-row[data-go]{cursor:pointer}
.grow{cursor:default}
.grow[data-go]{cursor:pointer}
@media (hover:hover){
  .dock-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .dock-btn:hover{transform:translateY(-6px) scale(1.09)}
  .lift{cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s var(--ease),color .18s,background .18s}
  .lift:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 6px 14px rgba(0,0,0,.05),0 12px 30px rgba(0,0,0,.1)}
  .lift:active{transform:translateY(0) scale(1);filter:brightness(.97)}
  .ch-row[data-go]:hover,.ch-row[data-go-ch]:hover,.ch-row[data-go-drill]:hover,.ch-row[data-go-exam]:hover{transform:translateY(-1px);background:var(--fill-soft)}
  .grow[data-go]:hover,.grow[data-wipe]:hover{background:var(--fill-soft)}
  .opt{transition:border-color .18s var(--ease),background .18s}
  .opt:hover{border-color:var(--sep-strong,var(--sep))}
  /* 小按钮：与底栏 Dock 同款（上浮 + 微放大 + 强调色 + 圆底） */
  .mini-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .mini-btn:hover{transform:translateY(-6px) scale(1.09);color:var(--accent);background:var(--fill-soft)}
}

/* 3) 上下层覆盖转场：每层为整屏不透明屏（上层滑入完全遮住下层 → 文字零杂糅），只动 transform */
#scroller{position:relative}
.x-screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;
  will-change:transform;pointer-events:none}
.x-wrap{max-width:900px;margin:0 auto;padding:20px 16px 30px}
#view{will-change:transform,opacity;backface-visibility:hidden}

/* 4) 圆角体系（无尖角）+ 导师卡 */
:root{--r-s:12px;--r-m:18px;--r-l:26px}
.card,.hero-card,.big-entry,.snap-card{border-radius:var(--r-l)}
.opt,.ch-row,.tile,.mini-btn,.why-note,.fillin,.q-code{border-radius:18px}
.tutor-card{
  display:flex;align-items:center;gap:16px;margin-top:16px;
  background:linear-gradient(135deg,var(--card),rgba(0,122,255,.045));
  border:1px solid var(--sep);border-radius:var(--r-l);
  box-shadow:var(--sh-card);padding:18px;text-align:left;width:100%;
}
.tutor-photo{width:76px;height:76px;border-radius:22px;flex:none;object-fit:cover;
  box-shadow:0 4px 12px rgba(0,0,0,.14);border:2px solid #fff}
.tutor-body{flex:1;min-width:0}
.tutor-cap{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--accent)}
.tutor-quote{font-size:15px;font-weight:600;line-height:1.55;margin-top:3px;color:var(--ink)}
.tutor-name{font-size:12px;color:var(--muted);margin-top:4px}
@media (min-width:640px){ .tutor-photo{width:88px;height:88px} .tutor-quote{font-size:16px} }

/* ===== 跳转按钮统一 Dock 款 hover（鼠哥 2026-09-04）：凡可点跳转的按钮同底栏手感 ===== */
@media (hover:hover){
  .btn-go,.btn-solid,.ss-start,.mini-btn,.retry-btn,.btn-line{
    transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s,filter .18s;
    cursor:pointer;
  }
  .btn-go:hover,.btn-solid:hover,.ss-start:hover,.mini-btn:hover,.retry-btn:hover,.btn-line:hover{
    transform:translateY(-6px) scale(1.09);
  }
  .btn-go:hover,.btn-solid:hover,.ss-start:hover{filter:brightness(.94)}
  .mini-btn:hover,.btn-line:hover{color:var(--accent);background:var(--fill-soft)}
  .backbtn,.homebtn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s,filter .18s}
  .backbtn:hover,.homebtn:hover{transform:translateY(-6px) scale(1.09);color:var(--accent);background:var(--fill-soft);filter:none}
}

/* ===== 列表行/宫格防文字挤压（2026-09-04：我的页修挤字） ===== */
.grow b{min-width:0}
.grow .gv{max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.tile .cap,.tile b{overflow-wrap:break-word}
#view b,#view .cap,#view .sub{overflow-wrap:break-word}

/* 刷题/列表行排版统一：标题单行省略 + 右侧动作胶囊 */
.ch-row .rt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-row .rta{flex:none;background:var(--accent-soft);color:var(--accent);font-size:12px;padding:4px 12px;border-radius:980px}
.ch-row .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="backbtn" id="btnBack"><span class="ic" id="backIco"></span><span id="backTxt">返回</span></button>
    <div class="brand"><b id="brandName">芯片战争学院</b><span>CHIP WAR ACADEMY</span></div>
    <button class="homebtn" id="btnPortal"><span class="ic" id="portalIco"></span>总学院</button>
  </div>
  <div id="stage">
    <div id="timerBar" style="display:none"><i></i></div>
    <div id="timerChip" style="display:none"></div>
    <div id="scroller"><div class="view" id="view"></div></div>
  </div>
  <div id="dock">
    <div class="dockbar">
      <button class="dock-btn on" data-tab="learn"><span class="ic d-ico" data-i="bookopen"></span><span>学习</span></button>
      <button class="dock-btn" data-tab="drill"><span class="ic d-ico" data-i="pen"></span><span>练习</span></button>
      <button class="dock-btn" data-tab="mine"><span class="ic d-ico" data-i="person"></span><span>我的</span></button>
    </div>
  </div>
</div>
<div id="toastBox"></div>
<div id="confirmBox">
  <div class="c-title">⏳ 计时学习还没完成</div>
  <div class="c-msg" id="confirmMsg"></div>
  <div class="btn-row">
    <button class="btn-line" id="confirmStay">继续学习</button>
    <button class="btn-solid" id="confirmLeave">离开</button>
  </div>
</div>
<div id="celebrate">
  <div class="c-card">
    <div class="c-ring"><i></i><b><span class="ic" id="cCheck"></span></b></div>
    <h3 id="cTitle">章节完成！</h3>
    <p id="cSub"></p>
    <button class="btn-solid" id="cClose">收下</button>
  </div>
</div>
<div id="demoTag">对齐样张 v2 · 演示数据</div>

<script>
/* ============================================================
   对齐样张 v2 · 芯片战争学院（方向验证版）
   升级点见 CSS 头注释。核心逻辑同 v1：三 Tab / 真历史栈 /
   右滑返回 / 倒计时 / 结算动画 / toast / 震动闸门。
   ============================================================ */

var $=function(s){return document.querySelector(s)};
var view=$('#view'), scroller=$('#scroller');

defI('bookx','<path d="m14.5 7.5-5 5"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="m9.5 7.5 5 5"/>');
defI('pen','<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>');
defI('person','<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>');
defI('doc','<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>');
defI('trophy','<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>');
defI('target','<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>');
defI('calendar','<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>');
defI('flag','<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>');

function mountStaticIcons(){
  $('#backIco').innerHTML=I['back'];
  $('#portalIco').innerHTML=I['home'];
  $('#cCheck').innerHTML=I['check'];
  document.querySelectorAll('.d-ico').forEach(function(el){ var n=el.getAttribute('data-i'); if(I[n]) el.innerHTML=I[n]; });

function toast(msg){
  var box=$('#toastBox'); var el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="ic t-ic">'+I['check']+'</span><span>'+msg+'</span>';
  box.appendChild(el);
  if(box.children.length>2) box.removeChild(box.firstChild);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){el.remove()},300); },2400);
}

var STACK=[];
var META={
  home:{n:'首页',tab:'learn'},plan:{n:'学习计划',tab:'learn'},chapter:{n:'第 3 章 · 集成电路',tab:'learn'},
  hall:{n:'练习大厅',tab:'drill'},vol:{n:'小卷',tab:'drill'},wrong:{n:'错题集',tab:'drill'},fixed:{n:'已订正',tab:'drill'},
  mine:{n:'我的',tab:'mine'},rank:{n:'排行榜',tab:'mine'},calendar:{n:'打卡日历',tab:'mine'},
  honor:{n:'荣誉墙',tab:'mine'},lab:{n:'实验室',tab:'mine'},about:{n:'关于',tab:'mine'},manage:{n:'管理',tab:'mine'}
};
function renderView(id,isBack){
  var v=view;
  v.className='view '+(isBack?'pushBack':'push');
  v.innerHTML=renderers[id]?renderers[id]():'<div class="cap">页面不存在</div>';
  scroller.scrollTop=0;
  paintDock(id);
  var m=META[id]||{n:'芯片战争学院'};
  $('#brandName').textContent=m.n;
  /* 返回键：iOS 语义，显示上一级标题 */
  var prev=STACK.length?STACK[STACK.length-1]:null;
  if(prev && META[prev]){
    $('#backTxt').textContent=META[prev].n;
    $('#btnBack').disabled=false;
  }else{
    $('#backTxt').textContent='返回';
    $('#btnBack').disabled=true;
  }
  window._cur=id;
}
function go(id){
  if(window._cur===id) return;
  STACK.push(window._cur||'home');
  history.pushState({view:id},'');
  renderView(id,false);
}
function goBack(){
  if(!STACK.length){ toast('已经在最前面了'); return; }
  history.back();
}
window.addEventListener('popstate',function(e){
  var id=(e.state&&e.state.view)||'home';
  /* 学习计时中被浏览器回退/手势带走：推回本章并提示 */
  if(id!=='chapter' && window._cur==='chapter' && timerRunning){
    history.forward();
    toast('学习中：已回到章节，离开请点左上「返回」确认');
    return;
  }
  if(STACK.length && STACK[STACK.length-1]===id) STACK.pop();
  renderView(id,true);
});

/* 右滑返回 */
(function(){
  var sx=0,sy=0,swiping=false;
  scroller.addEventListener('touchstart',function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    swiping=(sx<window.innerWidth*0.3);
  },{passive:true});
  scroller.addEventListener('touchend',function(e){
    if(!swiping) return;
    var t=e.changedTouches[0]; var dx=t.clientX-sx,dy=t.clientY-sy;
    if(dx>70 && Math.abs(dy)<80){ tap(); guardedBack(); }
    swiping=false;
  },{passive:true});
})();

function paintDock(id){
  var m=META[id]||{}; var curTab=m.tab||'learn';
  document.querySelectorAll('.dock-btn').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-tab')===curTab);
  });
}

/* ---------- 工具 ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function store(k,v){ try{ localStorage.setItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k)); return v===null?d:v; }catch(e){ return d; } }
/* 迷你公式渲染（题干里极少出现；主要防 XSS 与转义） */
function parseMath(s){
  if(s===undefined||s===null) return '';
  return esc(s).replace(/\*\*/g,'^').replace(/(^|[^*])\*([^*]|$)/g,'$1·$2');
}
function numEq(a,b){
  function val(x){
    if(typeof x==='number') return x;
    var s=String(x).replace(/×/g,'*').replace(/√/g,'Math.sqrt(').replace(/π/g,'Math.PI').trim();
    if(/[a-zA-Z]/.test(s.replace(/Math\./g,''))) return NaN;
    try{ return eval(s); }catch(e){ return NaN; }
  }
  var A=val(a),B=val(b);
  if(isNaN(A)||isNaN(B)) return String(a).replace(/\s/g,'').toLowerCase()===String(b).replace(/\s/g,'').toLowerCase();
  return Math.abs(A-B)<1e-6;
}
/* ---------- 每日目标（全站共享键 daily_goal，4:00 为界）：l=学完一章 e=做完一份卷 ---------- */
function todayStr(){ var d=new Date(); if(d.getHours()<4) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyGoal(act){

    g[d]=g[d]||{}; g[d].chip=g[d].chip||{}; g[d].chip[act]=Date.now();
    localStorage.setItem('daily_goal',JSON.stringify(g));

}
function clearDailyGoal(id){
  try{

    Object.keys(g).forEach(function(d){ if(g[d]&&g[d][id]){ delete g[d][id]; chg=true; if(!Object.keys(g[d]).length) delete g[d]; } });
    if(chg) localStorage.setItem('daily_goal',JSON.stringify(g));

}

function keyOk(k){ var p=String(k).split('_'); if(p.length<2) return false; var c=CHAPTERS[+p[0]-1]; return !!(c&&c.quiz&&c.quiz.length&&p[1]>=0&&p[1]<c.quiz.length); }
function ekeyOk(k){ var p=String(k).split('_'); if(p[0][0]!=='e') return false; var id=+p[0].slice(1); var c=CHAPTERS[id-1]; return !!(c&&c.exam&&p[1]>=0&&p[1]<c.exam.length); }

wrongPool=wrongPool.filter(keyOk); fixedPool=fixedPool.filter(keyOk);
function poolMove(key,correct){
  var iw=wrongPool.indexOf(key), ifx=fixedPool.indexOf(key);
  if(correct){ if(iw>-1){ wrongPool.splice(iw,1); fixedPool.push(key); } }
  else { if(ifx>-1){ fixedPool.splice(ifx,1); wrongPool.push(key); } else if(iw===-1){ wrongPool.push(key); } }
  store('wrong',wrongPool); store('fixed',fixedPool);
}
/* 学习足迹：30 分钟内同一章连续活动并作一次 */
function logStudy(type,chId,chTitle){
  var now=Date.now(), _d=new Date(now), _p=function(x){ return (x<10?'0':'')+x; };
  var cat=_d.getFullYear()+'-'+_p(_d.getMonth()+1)+'-'+_p(_d.getDate())+' '+_p(_d.getHours())+':'+_p(_d.getMinutes())+':'+_p(_d.getSeconds());
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&now-last.end<30*60*1000&&last.ch===chId){ last.end=now; last.completed_at=cat; last.quizN=(last.quizN||0)+1; }
  else studyLog.push({start:now,end:now,ch:chId,title:chTitle,lessonN:0,quizN:type==='quiz'?1:0,completed_at:cat});
  if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  store('log',studyLog);
}
function sessionAcc(qs){ var c2=0,n=0; qs.forEach(function(k){ var v=quizStat[k]; if(v!==undefined){ n++; if(v===1) c2++; } }); return n?Math.round(c2/n*100):null; }
function sessionLog(ty,c,key,ok){
  var now=Date.now();
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&last.questions&&last.ty===ty&&last.ch===c.id&&(now-last.end)<30*60*1000){
    if(last.questions.indexOf(key)===-1) last.questions.push(key);
    last.end=now; last.ms=last.end-last.start; last.acc=sessionAcc(last.questions);
  } else {
    studyLog.push({ty:ty,ch:c.id,title:c.title,questions:[key],start:now,end:now,ms:0,acc:null});
    if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  }
  store('log',studyLog);
}
/* ---------- 章节进度 ---------- */
function chIsDone(c){ return chDone.indexOf(c.id)>-1; }

function chQuizDone(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]!==undefined) n++; }); return n; }
function chCorrect(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]===1) n++; }); return n; }
function chSummary(c){ var a=chQuizDone(c), t=chQuizCount(c); return {answered:a,total:t,correct:chCorrect(c),allDone:t>0&&a>=t,allCorrect:a>0&&chCorrect(c)>=t&&a>=t}; }
function nextChapter(){ for(var i=0;i<CHAPTERS.length;i++){ if(!chIsDone(CHAPTERS[i])) return CHAPTERS[i]; } return null; }

function examStatus(c){
  if(!c.exam||!c.exam.length) return {answered:0,correct:0,full:false,total:0};
  var answered=0,correct=0;
  c.exam.forEach(function(q,i){ var st=quizStat['e'+c.id+'_'+i]; if(st!==undefined){ answered++; if(st===1) correct++; } });
  return {answered:answered,correct:correct,full:answered>=c.exam.length,total:c.exam.length};
}

function curRank(pct){
  var name=RANKS[0][1],next=null,nextAt=null;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ name=RANKS[i][1]; nextAt=(i+1<RANKS.length)?RANKS[i+1][0]:null; next=(i+1<RANKS.length)?RANKS[i+1][1]:null; } }
  return {name:name,next:next,nextAt:nextAt,remain:nextAt!==null?(nextAt-pct):0};
}
function calcStats(){
  var totalC=CHAPTERS.length;
  var doneC=chDone.length;
  var examTotal=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length; }).length;
  var examFull=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length&&examStatus(c).full; }).length;
  var wrongN=fixedPool.length+wrongPool.length;
  var base=doneC/totalC*0.5+(examTotal?examFull/examTotal*0.3:0);
  var pct;
  if(wrongN){ pct=Math.round((base+fixedPool.length/wrongN*0.2)*100); }
  else { pct=Math.round(base/0.8*100); }
  return {doneC:doneC,totalC:totalC,examTotal:examTotal,examFull:examFull,wrongN:wrongN,fixedPool:fixedPool.length,wrongPool:wrongPool.length,pct:Math.min(100,pct),studyCount:studyLog.length};
}

/* ---------- 今日答题统计 ---------- */
function statTodayKey(){ return new Date().toDateString(); }
function initStat(){
  var k=statTodayKey();
  if(!stat||stat.day!==k){
    var base=stat||{};
    stat={ totalQ:base.totalQ||0,totalCorrect:base.totalCorrect||0,totalMs:base.totalMs||0,
      todayQ:0,todayCorrect:0,todayMs:0,todayReal:0,accQ:0,accC:0,day:k };
  }
  if(!stat._migrated){
    var qkeys=Object.keys(quizStat||{});
    stat.totalQ=qkeys.length; stat.accQ=qkeys.length;
    var cc=0; qkeys.forEach(function(kk){ if(quizStat[kk]===1) cc++; });
    stat.accC=cc; stat.totalCorrect=cc; stat._migrated=true;
  }
  storeStat();
}
function storeStat(){ store('stat',stat); }
function statRecordQ(ok){
  if(!stat) return;
  stat.totalQ++; stat.todayQ++; stat.todayReal++; stat.accQ++;
  if(ok) stat.accC++;
  if(ok){ stat.totalCorrect++; stat.todayCorrect++; }
  storeStat();
}
function todayRecord(ok){
  var d=new Date().toDateString();
  if(todayStat.d!==d){ todayStat={d:d,done:0,correct:0}; }
  todayStat.done++; if(ok) todayStat.correct++;
  store('tstat',todayStat);
}
function studyTimerEnter(){ if(window._studyStart===null||window._studyStart===undefined) window._studyStart=Date.now(); }
function studyTimerLeave(){
  if(window._studyStart){ if(stat){ stat.totalMs+=Date.now()-window._studyStart; stat.todayMs+=Date.now()-window._studyStart; storeStat(); } window._studyStart=null; }
}
/* ---------- 作答主流程（写库语义与线上一致） ---------- */
function answerQuestion(c,i,oi){
  var q=c.quiz[i], k=c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok);
  statRecordQ(ok);
  if(hallDone.indexOf(k)===-1){ hallDone.push(k); store('hall',hallDone); }
  logStudy('quiz',c.id,c.title);
  sessionLog('lesson',c,k,ok);
  return ok;
}
function answerVol(c,i,oi){
  var q=c.exam[i], k='e'+c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok); statRecordQ(ok);
  logStudy('quiz',c.id,c.title);
  return ok;
}
/* ---------- 结算：全答即通过（不要求全对），首次点亮打卡与完成 ---------- */
function settleChapter(c, mode){
  var sm=chSummary(c);
  if(!sm.allDone){ toast('还有 '+(sm.total-sm.answered)+' 题没做完，做完才能结算'); return false; }
  var first = chDone.indexOf(c.id)===-1;
  if(first){
    chDone.push(c.id); store('ch',chDone);
    dailyGoal('l');
    settleStore['settle_'+c.id]={ts:Date.now(),pct:Math.round(sm.correct/sm.total*100),allCorrect:sm.allCorrect};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章完成！';
    $('#cSub').textContent=(sm.allCorrect?'随堂全对通关 · ':'答完即结算 · ')+'今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('本章已结算过，可去下一章');
  return false;
}
function settleVol(c){
  var st=examStatus(c);
  if(!st.full){ toast('还有 '+(st.total-st.answered)+' 题没做完'); return false; }
  var k='vol_'+c.id;
  var first = !settleStore[k];
  if(first){
    dailyGoal('e');
    settleStore[k]={ts:Date.now(),correct:st.correct};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章小卷完成！';
    $('#cSub').textContent='卷子已点亮 · 今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('这份卷子已结算过');
  return false;
}

/* 从历史 quizStat 归位错题池（进入练习页时兜底一次） */
function resyncWrong(){
  Object.keys(quizStat).forEach(function(k){
    if(keyOk(k)&&quizStat[k]===0&&wrongPool.indexOf(k)===-1) wrongPool.push(k);
    if(keyOk(k)&&quizStat[k]===1&&fixedPool.indexOf(k)===-1&&wrongPool.indexOf(k)>-1) poolMove(k,true);
  });
  store('wrong',wrongPool); store('fixed',fixedPool);
}

/* ---------- 倒计时（30 分钟，可挂后台） ---------- */
var TIMER=30*60,timerLeft=TIMER,timerIv=null;
function fmtTime(s){ var m=Math.floor(s/60),r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function startTimer(){
  if(timerIv) return;
  timerLeft=TIMER;
  $('#timerBar').style.display='block';
  $('#timerChip').style.display='flex';
  $('#timerChip').classList.remove('out');
  updateTimerUI();
  timerIv=setInterval(function(){
    timerLeft--; updateTimerUI();
    if(timerLeft<=0){ stopTimer(); toast('30 分钟到，可继续作答，只是不再计时'); }
  },1000);
}
function stopTimer(){
  clearInterval(timerIv); timerIv=null; timerRunning=false;
  $('#timerBar').style.display='none';
  $('#timerChip').classList.add('out');
  setTimeout(function(){ $('#timerChip').style.display='none'; },260);
}
function updateTimerUI(){
  timerRunning=true;
  var el=$('#timerChip');
  el.innerHTML='<span class="tdot"></span>'+fmtTime(timerLeft);
  el.classList.toggle('warn',timerLeft<5*60);
  $('#timerBar i').style.width=(timerLeft/TIMER*100)+'%';
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&timerIv){ clearInterval(timerIv); timerIv=null; }
  else if(!document.hidden&&(window._cur==='chapter'||window._cur==='exam')&&timerRunning&&!timerIv){
    timerIv=setInterval(function(){ timerLeft--; updateTimerUI(); if(timerLeft<=0){ stopTimer(); } },1000);
  }
});

function poolKeyInfo(k){
  var p=String(k).split('_');
  if(p[0][0]==='e'){ var c2=chById(+p[0].slice(1)); return c2?('第 '+c2.id+' 章小卷 · '+(c2.exam&&c2.exam[+p[1]]?c2.exam[+p[1]].q:'')):k; }
  var c=chById(+p[0]);
  if(!c||!c.quiz) return k;
  var q=c.quiz[+p[1]];
  return '第 '+c.id+' 章 · '+(q?q.q:'Q'+(+p[1]+1));
}

function cMemDraw(){
  var cv=document.getElementById('cvMem'); if(!cv||!cv.getContext) return;
  var c=cv.getContext('2d'); var i=parseInt(document.getElementById('memS').value||0,10);
  var W=cv.width,H=cv.height, n=8, cell=Math.min(72,(W-80)/n);
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  var names=['a','b','c','d','e','f','g','h'],vals=[42,7,99,13,5,77,20,3];
  for(var k=0;k<n;k++){
    var x=60+k*(cell+14), y=50;
    c.fillStyle='#F2F3F7'; c.strokeStyle='#C7C9D1';
    c.beginPath(); c.roundRect?c.roundRect(x,y,cell,86,10):c.rect(x,y,cell,86); c.fill(); c.stroke();
    c.fillStyle='#3C3C43'; c.font='13px ui-monospace,Consolas,monospace';
    c.fillText('0x'+('10'+k).toString(16), x, y+16);
    c.fillStyle='#007AFF'; c.font='bold 22px ui-monospace,Consolas,monospace';
    c.fillText(''+vals[k], x+cell/2-12, y+56);
    c.fillStyle='#86868B'; c.font='12px sans-serif'; c.fillText(names[k], x+cell/2-6, y+78);
  }
  var ax=60+i*(cell+14);
  c.strokeStyle='#FF3B30'; c.lineWidth=3; c.beginPath(); c.moveTo(ax+cell/2, y-20); c.lineTo(ax+cell/2, y+6); c.stroke();
  c.fillStyle='#FF3B30'; c.font='bold 13px ui-monospace,Consolas,monospace';

  if(window._cur === 'chapter') return chById((_lastNav && _lastNav.chapter) || 1);

function sessDone(){

    var sm = chSummary(c);
    return sm.total > 0 && sm.answered >= sm.total;
  }
  if(window._cur === 'exam'){ var st = examStatus(c); return st.total > 0 && st.full; }
  return true;
}

/* toast 单例化：同一时刻只保留一条提示，新提示立即顶掉旧条（鼠哥 2026-09-04） */
function toast(msg){
  var box=document.getElementById('toastBox');
  if(!box) return;
  while(box.firstChild) box.removeChild(box.firstChild);
  var el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="ic t-ic">'+I['check']+'</span><span>'+msg+'</span>';
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); },2200);
}
function updatePgSub(){

scroller.addEventListener('click',function(e){

  if(setBtn){ tap(); var c=chById(+setBtn.getAttribute('data-settle')); if(c) settleChapter(c,'lesson'); return; }
  /* 答错后再答一次（随堂） */
  var retry=e.target.closest('[data-retry]');
  if(retry){
    tap();
    var rq=retry.getAttribute('data-retry');
    var cA=chById(_lastNav.chapter||1); if(!cA) return;
    var key=cA.id+'_'+rq;
    delete quizStat[key]; store('quizStat',quizStat);
    var qb=document.getElementById('qbox'+rq);
    if(qb){
      qb.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('correct','wrong','muted'); o.removeAttribute('data-lock');
        var m=o.querySelector('.mark'); if(m) m.style.display='';
      });
    }
    var wn=document.getElementById('whyNote'+rq); if(wn){ wn.className='why-note'; wn.innerHTML=''; }
    updatePgSub();
    return;
  }
  /* 答错后再答一次（小卷） */
  var etry=e.target.closest('[data-etry]');
  if(etry){
    tap();
    var eq2=etry.getAttribute('data-etry');
    var cV=chById(_lastNav.exam||1); if(!cV) return;
    var ekey='e'+cV.id+'_'+eq2;
    delete quizStat[ekey]; store('quizStat',quizStat);
    var eqb=document.getElementById('eqbox'+eq2);
    if(eqb){
      eqb.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('correct','wrong','muted'); o.removeAttribute('data-lock');
        var m=o.querySelector('.mark'); if(m) m.style.display='';
      });
    }
    var ewn=document.getElementById('ewhyNote'+eq2); if(ewn){ ewn.className='why-note'; ewn.innerHTML=''; }
    updatePgSub();
    return;
  }
  /* 随堂题作答（chapter 页 / 刷题） */
  var opt=e.target.closest('.opt[data-q]');
  if(opt){
    tap();
    var c=chById(_lastNav.chapter||1); if(!c||!c.quiz) return;
    if(opt.hasAttribute('data-lock')) return;
    var qi=+opt.getAttribute('data-q'), oi=+opt.getAttribute('data-i');
    var q=c.quiz[qi]; if(!q) return;
    var ok=answerQuestion(c,qi,oi);
    var box=document.getElementById('qbox'+qi);
    box.querySelectorAll('.opt').forEach(function(o){
      var ii=+o.getAttribute('data-i');
      o.setAttribute('data-lock','1');
      if(ii===oi) o.classList.add(ok?'correct':'wrong');
      else if(ii===q.answer) o.classList.add('correct','muted');
      if(ii===q.answer){ var m=o.querySelector('.mark'); if(m) m.style.display='inline-flex'; }
    });
    if(ok) noteOK('whyNote'+qi,'<b>答对了。</b>'+esc(q.explain||''));
    else noteNO('whyNote'+qi,'<b>答错了，正确答案：「'+parseMath(q.options[q.answer])+'」</b><br>'+esc(q.explain||'')+'<br><button class="retry-btn" data-retry="'+qi+'">↻ 再答一次</button>');
    toast(ok?'✓ 答对':'看解析，再试一次');
    updatePgSub();
    var sm=chSummary(c);
    if(sm.allDone&&!chIsDone(c)) setTimeout(function(){ settleChapter(c,'lesson'); },900);
    return;

    var eqi=+eopt.getAttribute('data-eq'), eoi=+eopt.getAttribute('data-i');
    var eq=cv.exam[eqi]; if(!eq) return;
    var eok=answerVol(cv,eqi,eoi);
    var ebox=document.getElementById('eqbox'+eqi);
    ebox.querySelectorAll('.opt').forEach(function(o){
      var ii=+o.getAttribute('data-i');
      o.setAttribute('data-lock','1');

    });
    if(eok) noteOK('ewhyNote'+eqi,'<b>答对了。</b>'+esc(eq.explain||''));
    else noteNO('ewhyNote'+eqi,'<b>答错了，正确答案：「'+parseMath(eq.options[eq.answer])+'」</b><br>'+esc(eq.explain||'')+'<br><button class="retry-btn" data-etry="'+eqi+'">↻ 再答一次</button>');
    toast(eok?'✓ 答对':'看解析，再试一次');
    updatePgSub();
    var est=examStatus(cv);
    if(est.full) setTimeout(function(){ settleVol(cv); },900);

    return;
  }
  var efgo=e.target.closest('[data-efillgo]');
  if(efgo){
    tap();
    var cV2=chById(_lastNav.exam||1); if(!cV2) return;

    return;
  }
  /* 外观切换（防抖 400ms，避免连点刷屏提示） */
  var tr=e.target.closest('#themeRow');
  if(tr){
    if(window._themeBusy) return;

  var c=chById(eid); if(!c||!c.exam) return '<div class="cap">本章暂无小卷</div>';

  html+='<div style="margin-top:16px;text-align:center"><button class="mini-btn lift" data-go="vol" style="background:var(--fill-soft);box-shadow:none"><span class="ic">'+IC('doc')+'</span>返回小卷列表</button></div>';

};
/* ---------- 备份 / 清除 ---------- */
function bkExport(){
  var pack={
    ch:chDone,hall:hallDone,quizStat:quizStat,quizPick:quizPick,
    wrong:wrongPool,fixed:fixedPool,settle:settleStore,stat:stat,tstat:todayStat,log:studyLog
  };
  var txt;
  try{ txt=btoa(unescape(encodeURIComponent(JSON.stringify(pack)))); }
  catch(e){ txt='ERR'; }
  var ta=document.getElementById('bkText');
  if(ta){ ta.value=txt; ta.focus(); ta.select(); }
  toast('已生成备份码（点击即全选，可复制）');
}
function bkImport(){
  var ta=document.getElementById('bkText');
  var raw=(ta&&ta.value||'').trim();
  if(!raw){ toast('先粘贴备份码'); return; }
  var pack=null;
  try{ pack=JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e){}
  if(!pack||!pack.quizStat){ toast('备份码无效'); return; }
  if(pack.ch) store('ch',pack.ch);
  if(pack.hall) store('hall',pack.hall);
  if(pack.quizStat) store('quizStat',pack.quizStat);
  if(pack.quizPick) store('quizPick',pack.quizPick);
  if(pack.wrong) store('wrong',pack.wrong);
  if(pack.fixed) store('fixed',pack.fixed);
  if(pack.settle) store('settle',pack.settle);
  if(pack.stat) store('stat',pack.stat);
  if(pack.tstat) store('tstat',pack.tstat);
  toast('导入成功');
  setTimeout(function(){ location.reload(); },600);
}
function doWipe(){
  if(!window.confirm('确定清除全部学习记录？将回到初始状态，不可恢复。')) return;

/* 分享学院：复制学习链接（带版本号防缓存），支持系统分享面板 */
function shareAcademy(){
  var url='https://ndshuge.github.io/ndshuge-academy/chip.html?v='+encodeURIComponent(APP_VER);
  var done=function(){ toast('已复制学习链接'); };
  if(navigator.share){ navigator.share({title:'芯片战争学院',text:'跟我一起读《芯片战争》：',url:url}).catch(function(){}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done,function(){ legacyCopy(url,done); });
  } else legacyCopy(url,done);
}
function legacyCopy(txt,ok){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.cssText='position:fixed;left:-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok&&ok(); }catch(e){}
  document.body.removeChild(ta);
}

document.getElementById('cClose').addEventListener('click',function(){

/* ---------- 开始做题层（Duolingo 式）：确认后才进题并计时 ---------- */
var startCtx=null;
function ssRow(ic,t,cap){ return '<div class="ss-row"><span class="ic">'+IC(ic)+'</span><div style="flex:1;min-width:0"><b style="display:block">'+t+'</b><span>'+cap+'</span></div></div>'; }
function showStart(kind,id){
  var c=chById(id); if(!c) return;
  startCtx={kind:kind,id:id};
  var kick,title,sub,rows='';
  if(kind==='exam'){
    var st=examStatus(c);
    kick='MINI EXAM '+('0'+id).slice(-2);
    title=esc(c.title)+' · 小卷';
    sub=st.full?'这份卷已结算 · 重做不改变记录':(st.answered>0?'继续上次作答':'答完自动结算点亮打卡');
    rows=ssRow('doc',(c.exam||[]).length+' 题','单选 · 即时批改 · 错题自动归档')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(st.answered>0?ssRow('check','已答 '+st.answered+'/'+st.total,'进度已保留'):'');
  } else {
    var sm=chSummary(c), isD=kind==='drill';
    kick='LESSON '+('0'+id).slice(-2);
    title=esc(c.title);
    sub=chIsDone(c)?'本章已点亮 · 可回来重读重做':(c.full?(isD?'按章刷题 · 答对自动移出错题':'讲义 + 随堂题 · 答完自动结算点亮章节'):'待米勒开讲');
    rows=ssRow('book',sm.total+' 道随堂题','答完即结算 · 不要求满分')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(sm.answered>0?ssRow(isD?'pen':'check','已答 '+sm.answered+'/'+sm.total,isD?'可反复重做':'继续上次进度'):'');
  }
  $('#ssKicker').textContent=kick;
  $('#ssTitle').textContent=title;
  $('#ssSub').textContent=sub;
  $('#ssRows').innerHTML=rows;
  /* 两拍式弹出：先显示落起始帧，再加 .show 触发弹簧过渡（rAF + setTimeout 双保险，防个别环境 rAF 节流导致无动画） */
  var sh=document.getElementById('startSheet');
  clearTimeout(sh._hideT);
  sh.classList.remove('show');
  sh.style.display='block';
  void sh.offsetWidth;
  var tryShow=function(){ sh.classList.add('show'); };
  if(window.requestAnimationFrame){ requestAnimationFrame(tryShow); setTimeout(tryShow, 40); }
  else tryShow();
  tap();
}
function closeStart(){
  startCtx=null;
  var el=document.getElementById('startSheet');
  if(el){
    el.classList.remove('show');
    clearTimeout(el._hideT);
    el._hideT=setTimeout(function(){ if(el && !el.classList.contains('show')) el.style.display='none'; },520);
  }
}
function beginStudy(){
  var ctx=startCtx; if(!ctx) return;
  closeStart();
  studyTimerEnter();
  if(ctx.kind==='exam'){ _lastNav.exam=ctx.id; go('exam',ctx.id); startTimer(); }
  else { _lastNav.chapter=ctx.id; _lastNav.mode=(ctx.kind==='drill')?'drill':'lesson'; go('chapter',ctx.id); startTimer(); }
}

/* 清除输入确认弹层 */
function showWipeDialog(){
  var wrap = document.createElement('div');
  wrap.id='wipeDlg';
  wrap.style.cssText='position:fixed;inset:0;background:rgba(10,10,14,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)';
  wrap.onclick=function(e){ if(e.target===wrap) closeWipeDialog(); };
  var box=document.createElement('div');
  box.style.cssText='background:var(--card);border-radius:24px;padding:24px;max-width:430px;width:100%;box-shadow:var(--sh-float)';
  box.innerHTML='<b style="color:var(--red);font-size:17px">⚠ 清除所有记录</b>'
    +'<div style="color:var(--ink2);font-size:13.5px;line-height:1.8;margin:10px 0">将永久清除全部学习数据：章节进度、徽章、名人堂、错题集、学习足迹。回到初始状态，不可撤销。<br>输入 <b style="color:var(--red)">清除记录</b> 确认：</div>'
    +'<input id="wipeWord" placeholder="输入「清除记录」" style="width:100%;box-sizing:border-box;border:1.5px solid var(--sep);border-radius:12px;padding:12px 14px;font:14.5px inherit;font-family:inherit;background:var(--bg);color:var(--ink);outline:none">'
    +'<div style="display:flex;gap:10px;margin-top:14px">'
    +'<button id="wipeDo" style="flex:1;height:44px;border:none;border-radius:12px;background:var(--red);color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer">确认清除</button>'
    +'<button id="wipeNo" style="flex:1;height:44px;border:none;border-radius:12px;background:var(--fill-soft);color:var(--ink2);font:600 14px inherit;font-family:inherit;cursor:pointer">取消</button></div>';
  wrap.appendChild(box);
  document.body.appendChild(wrap);
  var inp=document.getElementById('wipeWord'); if(inp) inp.focus();
  document.getElementById('wipeDo').onclick=function(){
    var v=(inp&&inp.value||'').trim();
    if(v!=='清除记录'){ toast('输入不一致，未清除'); return; }
    wipeAll();
    toast('已清除，回到初始态');
    setTimeout(function(){ location.reload(); },600);
  };
  document.getElementById('wipeNo').onclick=function(){ closeWipeDialog(); };
}
function closeWipeDialog(){ var w=document.getElementById('wipeDlg'); if(w) w.remove(); }
scroller.addEventListener('click', function(ev){
  if(ev.target.closest('#wipeOpen')){ showWipeDialog(); return; }
  var sg=ev.target.closest('[data-soulgo]');
  if(sg){
    var ta=document.getElementById('soulTa');
    var c=CHAPTERS[+sg.getAttribute('data-soulgo')-1];
    if(!c||!c.dialogue) return;
    var val=(ta&&ta.value||'').trim();
    if(!val){ toast('先写下你的想法'); return; }
    var ks=(c.dialogue.keys||[]);
    var hit=ks.filter(function(k){ return val.indexOf(k)>-1 || val.indexOf(k.replace(/^\s+|\s+$/g,''))>-1; });
    var note=document.getElementById('soulNote');
    if(note){
      if(hit.length>=Math.min(2,ks.length||2)){
        note.className='why-note why-ok';
        note.innerHTML='<div class="why-body"><span class="why-ic">'+IC('check')+'</span><span><b>自检通过。</b>你提到了 '+hit.length+' 个关键点（'+hit.slice(0,4).map(function(x){return '「'+x+'」';}).join('')+'），思路对路了。想看参考思路就点旁边的按钮。</span></div>';
      } else {
        note.className='why-note why-no';
        note.innerHTML='<div class="why-body"><span class="why-ic">'+IC('info')+'</span><span><b>再想想。</b>目前只踩到 '+hit.length+' 个关键点，试试从「'+((c.dialogue.keys||[]).slice(0,3).join('」「'))+'」这些角度说清楚因果。</span></div>';
      }
    }
    return;
  }
  var sm=ev.target.closest('[data-soulmodel]');
  if(sm){
    var c2=CHAPTERS[+sm.getAttribute('data-soulmodel')-1];
    var note2=document.getElementById('soulNote');
    if(note2&&c2&&c2.dialogue){
      note2.className='why-note why-ok';
      note2.innerHTML='<div class="why-body"><span class="why-ic">'+IC('info')+'</span><span><b>参考思路</b><br>'+esc(c2.dialogue.model||'')+'</span></div>';
    }
  }
});

/* ===== 学习离开守卫弹层（框架玻璃质感；继续做题 / 离开不保存） ===== */
function showLeaveGuard(){
  if (document.getElementById('lgWrap')) return;
  var wrap = document.createElement('div');
  wrap.id = 'lgWrap';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,14,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:22px;-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)';
  var card = document.createElement('div');
  card.style.cssText = 'background:var(--card);border-radius:24px;padding:24px;max-width:380px;width:100%;box-shadow:var(--sh-float);transform:translateY(16px) scale(.97);opacity:0;transition:transform .36s cubic-bezier(.24,1.42,.4,1),opacity .28s';
  requestAnimationFrame(function(){ card.style.transform = 'translateY(0) scale(1)'; card.style.opacity = '1'; });
  card.innerHTML = '<div style="width:54px;height:54px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:26px">⏳</div>'
    + '<b style="display:block;font-size:18px;margin-top:12px">学习还没完成</b>'
    + '<div style="color:var(--ink2);font-size:13.5px;line-height:1.8;margin:10px 0 4px">离开做题页后，<b>本次作答进度不会保存</b>。回来需要重新作答。<br>挂后台 / 锁屏不算离开，可放心切走再回来继续。</div>'
    + '<div style="display:flex;gap:10px;margin-top:16px">'
    + '<button id="lgStay" style="flex:1;height:46px;border:none;border-radius:14px;background:var(--accent);color:#fff;font:600 14.5px inherit;font-family:inherit;cursor:pointer">继续做题</button>'
    + '<button id="lgLeave" style="flex:1;height:46px;border:none;border-radius:14px;background:var(--red-soft);color:var(--red);font:600 14.5px inherit;font-family:inherit;cursor:pointer">离开不保存</button></div>';
  wrap.appendChild(card);
  wrap.onclick = function(e){ if (e.target === wrap) hideLeaveGuard(); };
  document.body.appendChild(wrap);
  document.getElementById('lgStay').onclick = hideLeaveGuard;
  document.getElementById('lgLeave').onclick = function(){
    var n = _pendingNav; _pendingNav = null;
    hideLeaveGuard();
    if (n) doRenderView(n.id, n.isBack);
  };
}
function hideLeaveGuard(){ var w = document.getElementById('lgWrap'); if (w) w.remove(); }
