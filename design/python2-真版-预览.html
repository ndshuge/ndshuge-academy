{
  id:10, no:'Ⅹ', title:'文件和异常', weeks:'第 10 周', diff:'★★★★', full:true,
  story:{tutor:'格蕾丝·赫柏（Grace Hopper, 1906–1992）', era:'美国 · 海军少将 · 编译器先驱 · 「bug」一词的命名者',
    fact:'1947 年，赫柏的团队在一台马克二型计算机里发现了一只卡在继电器里的飞蛾，她在日志上写下「First actual case of bug being found」，从此 bug 成了程序错误的代名词。她也是最早提出「程序不应该崩溃，应该处理异常」的人。今天你学的 try-except，源头可以追溯到这只飞蛾。文件读写则是程序记忆的延伸：数据不写进文件，关掉程序就蒸发。',
    quote:'「最危险的话是：我们一直都是这么做的。」 格蕾丝·赫柏',
    interact:{type:'print', title:'文件与异常：程序的两条命', desc:'文件让程序活过关闭；异常让程序挺过错误。', lines:['读取 pi_digits.txt','3.1415926535...','try:','    执行可能出错的操作','except FileNotFoundError:','    优雅处理，不崩溃'], note:'read 是输入，write 是输出；except 是安全网。'}},
  motto:'「数据不落盘，等于没算过。错误不处理，等于没写完。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['读取整个文件','文件路径','逐行读取','百万位大文件','包含生日检查','写入文件','写入多行','追加','异常','try-except-else','FileNotFoundError','分析文本','静默失败','json.dumps','json.loads','重构'],
  sections:[
    {t:'读取文件', p:'open(路径) 打开文件，read() 读全部，readlines() 读成行列表。用 with 语句自动关闭文件，不用管 close()。路径：相对路径相对当前工作目录，绝对路径从盘符写起。文件内容读出来是字符串，逐行处理用 for line in 文件对象。', code:'with open("pi_digits.txt") as file:\n    contents = file.read()\nprint(contents)\n# 逐行\nwith open("pi_digits.txt") as file:\n    for line in file:\n        print(line.rstrip())'},
    {t:'写入文件', p:'open(路径, "w") 写入模式：不存在会创建，存在会清空重写。<b>"a"</b> 追加模式不清空。<b>"r"</b> 读取（默认）。写入用 write()，记得加 \n 换行，多次 write 连续写入。编码中文建议 open(path, "w", encoding="utf-8")。', code:'with open("notes.txt", "w") as f:\n    f.write("第一行\n")\n    f.write("第二行\n")\n# 追加\nwith open("notes.txt", "a") as f:\n    f.write("第三行\n")'},
    {t:'异常：程序的安全带', p:'异常是程序运行时的错误。try-except 捕获：try 里放可能出错的操作，except 里放错误处理，else 里放成功时才执行的代码。ZeroDivisionError（除零）、FileNotFoundError（文件不存在）、ValueError（值不合法）是三大常见异常。异常处理让程序「优雅失败」而不是「当场猝死」。', code:'try:\n    answer = 10 / 0\nexcept ZeroDivisionError:\n    print("不能除以零！")\nelse:\n    print(answer)\ntry:\n    with open("missing.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("文件不存在，已优雅处理")'},
    {t:'用 json 存储数据', p:'json 是通用数据格式，Python 的 json 模块负责「对象到文本、文本到对象」。json.dumps(数据) 把字典/列表序列化成字符串，存进文件；json.loads(文本) 反序列化回 Python 对象。程序重启后数据不丢，这就是「持久化」。', code:'import json\nnumbers = [1, 2, 3, 4, 5]\nwith open("numbers.json", "w") as f:\n    json.dump(numbers, f)\nwith open("numbers.json") as f:\n    data = json.load(f)\nprint(data)  # [1, 2, 3, 4, 5]'},
    {t:'静默失败与重构', p:'有时错误不需要提示用户：except 里放 pass 静默忽略。但静默要克制，全静默 = 全盲。重构：把代码拆成函数，让主程序读起来像提纲。先写出能跑的代码，再重构得更清晰，这是程序员的日常节奏。', code:'try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    pass  # 静默失败：什么都不做\n# 重构示例：把读文件变成函数\ndef load_data(path):\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return []'}
  ],
  example:{q:'写代码处理除法：try 计算 10 / 0，except 输出 "不能除以零"', code:'try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print("不能除以零")', s:'try 里的 10/0 触发 ZeroDivisionError，程序跳到 except 分支，输出 不能除以零，程序不崩溃。这就是异常处理的意义：错误发生了，但程序活下来了，用户看到了友好的提示而不是一堆红字。'},
  traps:[
    '用 open() 忘了 with：文件不关闭，Windows 上可能锁文件。',
    '写入模式 "w" 会清空原文件：想保留旧内容用 "a"。',
    'except 后面不写异常类型：except: 会吞掉包括 KeyboardInterrupt 在内的一切错误，永远别这么写。',
    'json.dump 和 json.dumps 混用：dump 是写文件，dumps 是转字符串。',
    '文件路径不对：相对路径基准是工作目录，不是脚本所在目录。',
    '文件不存在时直接读：FileNotFoundError，先用 try 或 os.path.exists 检查。'
  ],
  quiz:[{type:'choice', q:'with open("a.txt") as f: 的好处是？', options:['自动创建文件','文件不加密','自动关闭文件','读取更快'], answer:2, explain:'with 语句块结束自动关闭文件，不用手动 close()。'},{type:'code', q:'用 try-except 处理：int("abc") 会抛 ValueError，捕获并输出 "无法转换"', code:'try:\n    n = int("abc")\nexcept ValueError:\n    print("无法转换")', expect:'无法转换', hint:'int() 收到非数字字符串抛 ValueError。'},{type:'choice', q:'open(path, "w") 的 "w" 模式表示？', options:['追加','写入（清空重写）','只读','二进制'], answer:1, explain:'w 是 write 模式，会清空已有内容；a 是追加。'},{type:'code', q:'使用 json：把列表 [1, 2, 3] 序列化为字符串并打印（用 dumps）', code:'import json\ndata = json.dumps([1, 2, 3])\nprint(data)', expect:'[1, 2, 3]', hint:'json.dumps 转字符串，打印出来是 [1, 2, 3]。'},{type:'choice', q:'try-except-else 中，else 里的代码什么时候执行？', options:['except 执行后','任何时候','try 没出错时','程序开始时'], answer:2, explain:'else 只在 try 块成功无异常时执行。'},{type:'code', q:'捕获 FileNotFoundError：open 一个不存在的文件，捕获后输出 "找不到文件"', code:'try:\n    with open("no_such_file.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("找不到文件")', expect:'找不到文件', hint:'文件不存在抛 FileNotFoundError。'},{type:'choice', q:'json.load() 的作用是？', options:['把对象写入文件','从文件读入并解析成 Python 对象','转成字符串','压缩数据'], answer:1, explain:'json.load(文件对象) 读取并反序列化；json.loads(字符串) 从字符串解析。'},{type:'code', q:'读取文件内容的字符串后，统计其中的单词数：text = "hello world hello"，用 split 输出单词个数', code:'text = "hello world hello"\nwords = text.split()\nprint(len(words))', expect:'3', hint:'split() 按空白拆分成单词列表，len 数个数。'},{type:'choice', q:'try-except 中 except 块的作用是？', options:['跳过代码','加速运行','定义函数','捕获并处理异常'], answer:3, explain:'except 处理 try 里抛出的异常。'},{type:'code', q:'捕获 ZeroDivisionError，输出 不能除零', code:'try:\n    x = 10 / 0\nexcept ZeroDivisionError:\n    print("不能除零")', expect:'不能除零', hint:'除零抛 ZeroDivisionError。'}],
  dialogue:{q:'程序报错（抛异常）到底好不好？为什么要捕获异常而不是让程序崩溃？',
    keys:['崩溃','用户','体验','处理','恢复','信息','可控','继续'],
    model:'异常是程序的「呼救信号」，报错本身是好事：它精确告诉你哪里出了问题。坏的是程序直接崩溃，用户看到一片红字，数据丢失，什么都做不了。捕获异常的意义是：错误已经发生，但程序还活着，还能给用户一个交代（提示、重试、保存现场）。工程上叫「优雅降级」：最坏情况下也要可预测。所以规则是：预料之中的错误，主动捕获；预料之外的，让它响，然后修。'}
  ,
  exam:[{type:'choice', q:'try: 1 / 0 except ZeroDivisionError 属于哪种处理？', options:['捕获除零异常','捕获语法错误','读取文件','网络请求'], answer:0, explain:'ZeroDivisionError 是除零错误，try-except 捕获后程序继续运行。'},{type:'code', q:'写文件：以追加模式写一行 "Hello again" 到 notes.txt（不需要读出来）', code:'with open("notes.txt", "a") as f:\n    f.write("Hello again\n")\nprint("写入完成")', expect:'写入完成', hint:'a 追加模式，写入后打印确认（浏览器环境文件操作可能受限，先跑通逻辑）。'},{type:'choice', q:'except:（不带异常类型）为什么不推荐？', options:['运行更快','会吞掉所有错误包括不该吞的','更简洁','没有异常可捕'], answer:1, explain:'裸 except 连 KeyboardInterrupt 都吞，问题被掩埋，后期难排查。'},{type:'code', q:'用 json.dumps 把字典 {"name": "鼠哥"} 转字符串并打印', code:'import json\nprint(json.dumps({"name": "鼠哥"}))', expect:'{"name": "鼠哥"}', hint:'dumps 序列化字典为 JSON 字符串。'},{type:'choice', q:'"a,b,c".split(",") 的结果是？', options:['"a b c"','["a,b,c"]','["a", "b", "c"]','错误'], answer:2, explain:'split 按逗号拆成列表。'},{type:'code', q:'"hello world".split() 后统计单词个数', code:'words = "hello world".split()\nprint(len(words))', expect:'2', hint:'split 无参按空白拆分。'}]
},
{
  id:11, no:'Ⅺ', title:'测试代码', weeks:'第 11 周', diff:'★★★★', full:true,
  story:{tutor:'肯·汤普森（Ken Thompson, 1943–）', era:'美国 · Unix 与 Go 语言之父 · 图灵奖得主',
    fact:'1971 年，汤普森和里奇用两周时间写出了 Unix 的第一个版本，随后几十年里，Unix 家族统治了服务器世界，靠的不是一次写对，而是无数次测试和修补。佩奇的 Google 有一条铁律：<b>没有测试的代码不许合入主分支</b>。测试不是写完代码后的负担，是让你敢改代码的底气：有测试兜底，改坏了一跑就知道。',
    quote:'「写测试是给未来的自己留一张安全网。」',
    interact:{type:'flow', title:'测试：断言即契约', desc:'assert 期望值 == 实际值，对了静悄悄，错了响警报。', lines:[{t:'def get_name(first, last):', hl:true},{t:'    return f"{first} {last}"', hl:true},{t:'assert get_name("ada", "lovelace") == "ada lovelace"', hl:true},{t:'通过：无输出，全绿', hl:false},{t:'不通过：AssertionError 响起', hl:false}], note:'pytest 收集 test_ 开头的函数，自动运行并汇报。'}},
  motto:'「测试是代码的体检报告。没测过，等于没写。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 pytest','测试函数','可通过的测试','运行测试','未通过的测试','修复测试','添加新测试','测试类','各种断言','fixture 夹具'],
  sections:[
    {t:'pytest：让测试自动化', p:'pytest 是 Python 最流行的测试框架。安装：pip install pytest。规则：测试函数以 test_ 开头，测试文件以 test_ 开头命名。写断言：assert 条件，条件为 True 测试通过，False 测试失败。运行：终端输入 pytest，自动发现并运行所有测试。', code:'# test_name.py\ndef test_full_name():\n    assert get_full_name("ada", "lovelace") == "Ada Lovelace"\n# 终端运行\n# pytest  → 全部通过：绿\n# pytest -v  → 详细报告'},
    {t:'测试函数：从输出到断言', p:'把「看输出对不对」升级成「断言输出对不对」。测试要覆盖：正常情况、边界情况、特殊情况（空输入）。未通过的测试显示 AssertionError 和期望/实际的差异。修改测试让失败变通过：要么修代码，要么确认测试本身写错了。', code:'def get_full_name(first, last):\n    return f"{first} {last}".title()\n\ndef test_first_last_name():\n    full = get_full_name("janis", "joplin")\n    assert full == "Janis Joplin"'},
    {t:'测试类：一组相关的测试', p:'把同一单元的测试组织成类，用各种断言方法：assertEqual(a, b)、assertNotEqual、assertIn(item, list)、assertTrue/assertFalse、assertRaises。测试类名 TestXxx，方法名 test_xxx。pytest 会自动收集 Test 开头的类。', code:'class TestAnonymousSurvey:\n    def test_store_single_response(self):\n        survey = AnonymousSurvey("什么语言最好？")\n        survey.store_response("Python")\n        assert "Python" in survey.responses\n    def test_store_three_responses(self):\n        survey = AnonymousSurvey("什么语言最好？")\n        responses = ["Python", "C", "Go"]\n        for r in responses:\n            survey.store_response(r)\n        for r in responses:\n            assert r in survey.responses'},
    {t:'fixture：测试的公共底座', p:'多个测试需要同样的准备（比如创建同一个实例），用 fixture 消除重复。pytest 里 @pytest.fixture 装饰的函数，测试参数里声明同名参数就自动注入。fixture 让每个测试独立、干净、互不干扰。', code:'import pytest\n@pytest.fixture\ndef survey():\n    return AnonymousSurvey("什么语言最好？")\n\ndef test_one(survey):\n    survey.store_response("Python")\n    assert "Python" in survey.responses'},
    {t:'测试的工程意义', p:'测试的价值不在当下，在以后：<b>你敢重构</b>（改坏了测试立刻红）；<b>你懂契约</b>（测试就是函数的使用说明书）；<b>你有底气</b>（合入新代码前全绿）。佩奇的团队规矩：先写测试再写实现（TDD）或至少同步写。你现在觉得测试麻烦，等你改一个月前的代码时就懂了。', code:'# 测试驱动开发节奏：红 → 绿 → 重构\n# 1. 写一个会失败的测试（红）\n# 2. 写最少代码让它通过（绿）\n# 3. 重构，保持全绿'}
  ],
  example:{q:'为函数 add(a, b) 写 pytest 测试并手动模拟断言', code:'def add(a, b):\n    return a + b\n\ndef test_add():\n    assert add(2, 3) == 5\n    assert add(-1, 1) == 0\n    assert add(0, 0) == 0\n\n# 手动跑一遍同样的逻辑：\nassert add(2, 3) == 5\nprint("测试通过：add(2, 3) = 5")', s:'测试的价值在于把「我猜它对了」变成「我证明它对」。三个断言覆盖常规、正负抵消、零值三种情况。pytest 里每个 assert 失败都会精确报告哪个用例、哪一步错了，比肉眼盯着输出靠谱一百倍。'},
  traps:[
    '测试函数名不以 test_ 开头：pytest 找不到它，等于没写。',
    '断言写反：assert 5 == add(2, 3) 能跑但报错信息难读，把期望写左边。',
    '测试依赖运行顺序：测试之间应完全独立，fixture 每次重建。',
    '只测正常路径不测边界：空字符串、0、负数、超大值，边界才容易翻车。',
    '测试里复制了业务逻辑：测试和实现犯同样的错，断言要写「期望值」而不是再算一遍。',
    '忘了装 pytest：import pytest 直接 ModuleNotFoundError。'
  ],
  quiz:[{type:'choice', q:'pytest 默认会收集哪些函数作为测试？', options:['test_ 开头的函数','任意函数','main 函数','print 函数'], answer:0, explain:'pytest 自动发现 test_ 前缀的函数并运行。'},{type:'code', q:'写一个函数 is_positive(n) 返回 n > 0 的布尔值，并用 assert 测试 is_positive(5) 为 True', code:'def is_positive(n):\n    return n > 0\nassert is_positive(5) == True\nprint("测试通过")', expect:'测试通过', hint:'assert 条件为真则无事发生，通过。'},{type:'choice', q:'断言失败时 pytest 会？', options:['静默跳过','报告哪个用例失败','自动修复代码','删除测试'], answer:1, explain:'pytest 精确报告失败的测试和断言，方便定位。'},{type:'code', q:'写函数 double(x) 返回 2 倍值，写 test_double 断言 double(21) == 42，手动运行断言并打印 "OK"', code:'def double(x):\n    return x * 2\nassert double(21) == 42\nprint("OK")', expect:'OK', hint:'断言通过后打印 OK。'},{type:'choice', q:'fixture 的作用是？', options:['让测试更快','提供测试共用的准备数据','替代断言','自动生成测试'], answer:1, explain:'fixture 提供公共的初始化（如实例、数据），避免重复代码。'},{type:'code', q:'测试字符串方法：断言 "hello".upper() 等于 "HELLO"，断言通过后打印 "字符串测试通过"', code:'assert "hello".upper() == "HELLO"\nprint("字符串测试通过")', expect:'字符串测试通过', hint:'upper() 全大写，断言为真。'},{type:'choice', q:'assert 1 == 2 会发生什么？', options:['AssertionError','通过','返回 False','打印 False'], answer:0, explain:'断言条件为假抛 AssertionError，测试失败。'},{type:'code', q:'测试列表：断言 3 在列表 [1, 2, 3] 中，通过后打印 "3 在列表中"', code:'assert 3 in [1, 2, 3]\nprint("3 在列表中")', expect:'3 在列表中', hint:'in 判断成员，为真则断言通过。'},{type:'choice', q:'pytest 会收集哪些函数作为测试？', options:['任意函数','main 函数','print 函数','test_ 开头的'], answer:3, explain:'pytest 自动发现 test_ 前缀函数。'},{type:'code', q:'断言 max(3, 1, 2) == 3，通过后输出 OK', code:'assert max(3, 1, 2) == 3\nprint("OK")', expect:'OK', hint:'max 返回最大值。'}],
  dialogue:{q:'「先写测试还是先写功能」？TDD 到底好在哪？',
    keys:['失败','红','先','需求','预期','边界','实现','安全网'],
    model:'TDD（测试驱动开发）的节奏：先写一个会失败的测试（红），再写最少代码让它通过（绿），然后重构保持全绿。好处有三个：一，<b>先想清楚再动手</b>，写测试逼你先定义「什么是正确」；二，<b>测试必然被写过</b>，不会沦为事后补的摆设；三，<b>每一步都可回退</b>，全绿是安全的锚点。新手不用死守 TDD，但至少做到：功能写完立刻写测试，不留裸奔代码。'}
  ,
  exam:[{type:'choice', q:'pytest 运行测试的命令是？', options:['run test','python test','test all','pytest'], answer:3, explain:'终端输入 pytest 自动发现运行所有测试。'},{type:'code', q:'写函数 max3(a, b, c) 返回三个数中最大的，用 assert 测 max3(3, 7, 5) == 7', code:'def max3(a, b, c):\n    return max(a, b, c)\nassert max3(3, 7, 5) == 7\nprint("OK")', expect:'OK', hint:'max() 内置函数，断言通过。'},{type:'choice', q:'测试覆盖边界情况的意义是？', options:['边界测试更快','必须覆盖所有情况','边界测试更简单','边界最容易出错'], answer:3, explain:'边界（0、空、极值）最容易暴露逻辑漏洞。'},{type:'code', q:'测试类：class Calculator 有方法 add，实例化后断言 add(1, 1) == 2', code:'class Calculator:\n    def add(self, a, b):\n        return a + b\ncalc = Calculator()\nassert calc.add(1, 1) == 2\nprint("OK")', expect:'OK', hint:'实例化后调用方法再断言。'},{type:'choice', q:'assert 条件为假时抛出？', options:['ValueError','TypeError','KeyError','AssertionError'], answer:3, explain:'断言失败抛 AssertionError。'},{type:'code', q:'定义 add(a, b)，断言 add(2, 2) == 4，通过后输出 通过', code:'def add(a, b):\n    return a + b\nassert add(2, 2) == 4\nprint("通过")', expect:'通过', hint:'断言通过继续执行。'}]
},

{
  id:12, no:'Ⅻ', title:'项目一：外星人入侵', weeks:'第 12-14 周', diff:'★★★★★', full:true,
  story:{tutor:'诺兰·布什内尔（Nolan Bushnell, 1943–）', era:'美国 · 雅达利创始人 · 电子游戏之父',
    fact:'1972 年，布什内尔用 500 美元造出了雅达利的第一台街机 Pong，把电子游戏带进大众生活。他说过：所有好游戏都是「简单规则 + 即时反馈 + 越玩越难」。外星人入侵项目就是把这句话翻译成代码：Pygame 窗口、飞船移动、外星人舰队、子弹碰撞、记分牌。等你做完，你就是写过完整游戏的人了。',
    quote:'「游戏是让人心甘情愿去解决难题的东西。」 诺兰·布什内尔'},
  motto:'「完成一个作品，胜过读完十本书。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 Pygame','创建窗口','飞船类','事件循环','移动飞船','子弹','外星人舰队','碰撞检测','结束游戏','Play 按钮','提高难度','记分'],
  sections:[
    {t:'项目规划：先画地图再出发', p:'写游戏之前，先想清楚三件事：<b>玩家做什么</b>（控制飞船左右移动、开炮）、<b>敌人怎么做</b>（外星人舰队逐渐逼近）、<b>怎么算赢</b>（消灭全部外星人、记分、闯关）。对应三个类：Ship（飞船）、Alien（外星人）、Bullet（子弹），再加一个控制状态的 Game 主类。先设计再写码，是佩奇的团队铁律：代码是地图，设计是航线。', code:'# 先列出类的骨架，再逐行填充\nclass Ship:\n    def __init__(self):\n        self.x = 0          # 位置\n    def update(self):\n        pass                # 待实现：左右移动\n\nclass Alien:\n    def __init__(self):\n        self.x = 0\n    def update(self):\n        pass                # 待实现：逼近飞船'},
    {t:'安装 Pygame 与创建窗口', p:'pip install pygame 安装。创建游戏三件套：<b>屏幕</b>（pygame.display.set_mode）、<b>时钟</b>（控制帧率，避免游戏跑太快）、<b>主循环</b>（while 循环一直运行直到退出）。pygame.init() 初始化所有模块，pygame.quit() 退出时清理。窗口就是你的画布，游戏的一切都发生在这块画布上。', code:'import pygame\npygame.init()\nscreen = pygame.display.set_mode((1200, 800))\npygame.display.set_caption("外星人入侵")\nclock = pygame.time.Clock()\n\nwhile True:          # 游戏主循环\n    pygame.display.flip()   # 刷新画面\n    clock.tick(60)          # 每秒 60 帧'},
    {t:'事件循环：游戏的心跳', p:'事件是玩家和系统发给游戏的信号：按了哪个键、点了关闭、鼠标动了。pygame.event.get() 一次取走所有待处理事件。主循环每圈做的三件事：<b>处理事件</b>（按需响应）→ <b>更新状态</b>（飞船位置、子弹飞行）→ <b>绘制画面</b>（把新状态画上去）。三步分离，游戏才不乱。', code:'while True:\n    # 第一步：处理事件\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            pygame.quit()\n            exit()\n        elif event.type == pygame.KEYDOWN:\n            if event.key == pygame.K_RIGHT:\n                ship.moving_right = True\n        elif event.type == pygame.KEYUP:\n            if event.key == pygame.K_RIGHT:\n                ship.moving_right = False\n    # 第二步：更新\n    ship.update()\n    # 第三步：绘制\n    screen.blit(ship.image, ship.rect)\n    pygame.display.flip()'},
    {t:'飞船与移动：类的用武之地', p:'飞船是游戏里的第一个对象。Ship 类存它的图像、位置、速度，update 方法根据按键状态移动。按住右键移动：用一个布尔标志 moving_right，按下为 True 松开为 False，update 里判断。这样移动是连续的而不是点一下动一下。你学的类，在这里第一次变成了活物。', code:'class Ship:\n    def __init__(self, screen):\n        self.screen = screen\n        self.image = pygame.image.load("ship.png")\n        self.rect = self.image.get_rect()\n        self.moving_right = False\n        self.x = float(self.rect.x)   # 用浮点数防抖动\n    def update(self):\n        if self.moving_right:\n            self.x += 1.5             # 每帧向右移动\n        self.rect.x = int(self.x)'},
    {t:'子弹与外星人：精灵与碰撞', p:'子弹、外星人都用 pygame.sprite.Sprite 组织成 group（编队）。group 的好处：一次 update 全部、一次 draw 全部、碰撞检测一条命令。检测碰撞：pygame.sprite.groupcollide(子弹组, 外星人组, True, True) 同时删除撞上的子弹和外星人。这就是「即时反馈」的实现：打中了，画面立刻有反应。', code:'from pygame.sprite import Sprite\n\nclass Bullet(Sprite):\n    def __init__(self, screen, ship):\n        super().__init__()\n        self.rect = pygame.Rect(0, 0, 3, 15)\n        self.rect.midtop = ship.rect.midtop\n        self.y = float(self.rect.y)\n    def update(self):\n        self.y -= 2                  # 子弹向上飞\n        self.rect.y = int(self.y)\n\n# 碰撞：删子弹也删外星人\nhits = pygame.sprite.groupcollide(bullets, aliens, True, True)'},
    {t:'记分与难度：越玩越难', p:'游戏要有「越玩越难」的曲线：每消灭整队外星人，等级 +1，外星人移动速度加快。得分显示在屏幕角落（用 font 渲染文字）。Play 按钮控制游戏开始/暂停，游戏结束时显示结算。这三样合起来，游戏就从「能跑」变成「好玩」。', code:'score = 0\nalien_speed = 1.0\n\nif not aliens:            # 全队消灭\n    level += 1            # 提高难度\n    alien_speed += 0.5\n    create_fleet()        # 生成新的一队\n\n# 显示得分\nfont = pygame.font.SysFont(None, 48)\ntext = font.render(f"Score: {score}", True, (255, 255, 255))\nscreen.blit(text, (10, 10))'}
  ],
  example:{q:'写一个最简游戏循环的骨架：处理退出事件、刷新画面、控制帧率', code:'import pygame\npygame.init()\nscreen = pygame.display.set_mode((800, 600))\nclock = pygame.time.Clock()\n\nrunning = True\nwhile running:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            running = False\n    pygame.display.flip()\n    clock.tick(60)\npygame.quit()', s:'这是 Pygame 的「最小可用循环」：running 标志控制主循环，事件循环捕获 QUIT 退出，flip 刷新画面，tick(60) 锁帧率。所有游戏都是从这个骨架长出来的——加飞船、加子弹、加外星人，都是在这个 while 里添砖加瓦。先在本地环境跑通这个骨架，再逐层加内容。'},

    {type:'code', q:'写一个 Alien 类：有 x 属性，update 方法让 x 每帧加 1（面向对象模拟，纯 Python 可运行）', code:'class Alien:\n    def __init__(self):\n        self.x = 0\n    def update(self):\n        self.x += 1\n\nalien = Alien()\nalien.update()\nprint(alien.x)', expect:'1', hint:'__init__ 初始化 x，update 里 self.x += 1。'},

    {type:'code', q:'用 random 模块生成一个 1 到 1200 的随机整数（外星人的 x 坐标）', code:'import random\nx = random.randint(1, 1200)\nprint(x)', expect:'', hint:'random.randint(1, 1200)，输出是随机的，判题只检查无报错。'},

  ,{type:'choice', q:'pygame.Surface 的 get_rect() 方法返回？', options:['矩形区域 Rect','坐标元组','图像列表','颜色值'], answer:0, explain:'get_rect() 返回一个 Rect 对象，包含位置和大小，用于定位和碰撞。'},{type:'code', q:'模拟飞船移动：x = 0，每帧 +1.5，跑 10 帧后打印 x', code:'x = 0\nfor i in range(10):\n    x += 1.5\nprint(x)', expect:'15.0', hint:'循环 10 次累加 1.5。'},{type:'choice', q:'精灵组 group 的 draw(screen) 方法作用是？', options:['删除所有精灵','移动所有精灵','检测碰撞','把所有精灵画到屏幕'], answer:3, explain:'draw 遍历组里所有精灵，把它们的图像画到指定屏幕。'},{type:'code', q:'模拟外星人舰队：生成 5 个外星人的 x 坐标（0, 60, 120, 180, 240）存列表并打印', code:'xs = [i * 60 for i in range(5)]\nprint(xs)', expect:'[0, 60, 120, 180, 240]', hint:'推导式 i*60。'}],
  dialogue:{q:'为什么游戏主循环要把「处理事件、更新状态、绘制画面」严格分开成三步？',
    keys:['顺序','稳定','事件','更新','绘制','分离','节奏','不卡'],
    model:'因为游戏是「每帧都要完整走一遍」的：不管玩家按没按键，画面都要刷新。如果把事件处理、状态更新、绘制混在一起，就会出现在一个循环里既要读输入又要画图，逻辑乱、帧率也不稳定。分开三步，每帧的节奏恒定：先听指令、再算变化、最后呈现。这也是程序设计的通用原则：职责分离，每段代码只做一件事。'}

{
  id:13, no:'ⅩⅢ', title:'项目二：数据可视化', weeks:'第 15-17 周', diff:'★★★★★', full:true,
  story:{tutor:'汉斯·罗斯林（Hans Rosling, 1948–2017）', era:'瑞典 · 数据可视化大师 · TED 演讲者',
    fact:'罗斯林用动态气泡图让全世界看懂了几十年的全球健康数据，他的 TED 演讲被观看超过 5000 万次。他说：数据本身不会说话，是可视化让数据开口。这个项目教你用 Matplotlib 画折线图和随机游走，用 Plotly 模拟掷骰子，用 CSV/JSON 分析真实数据，用 API 抓取 GitHub 热门仓库。',
    quote:'「数据是新时代的石油，可视化是炼油厂。」'},
  motto:'「会看图的人，能看见数据里的故事。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 Matplotlib','折线图','随机游走','Plotly 掷骰子','CSV 格式','JSON 数据','API 请求','Hacker News'],
  sections:[
    {t:'Matplotlib 入门：第一张图', p:'Matplotlib 是 Python 最经典的可视化库。三行出图：plt.plot(数据) 画折线、plt.scatter(数据) 画散点、plt.show() 显示。安装 pip install matplotlib。图形是「数据的翻译」：同样的数字，画成图一眼看懂趋势，这就是罗斯林说的「数据开口说话」。', code:'import matplotlib.pyplot as plt\n\nsquares = [1, 4, 9, 16, 25]\nplt.plot(squares)\nplt.title("平方数", fontsize=14)\nplt.xlabel("n", fontsize=12)\nplt.ylabel("n²", fontsize=12)\nplt.show()'},
    {t:'折线图与散点图：表达趋势与分布', p:'折线图适合连续趋势（气温变化、股价），散点图适合看分布和相关性（身高体重）。两者都能定制：线条颜色和宽度、点的颜色和尺寸、坐标轴范围。plt.style 可以换主题风格（如 seaborn）。图的每个细节都是信息：颜色、标签、标题，都是给别人看的线索。', code:'import matplotlib.pyplot as plt\n\nx = [1, 2, 3, 4, 5]\ny = [1, 8, 27, 64, 125]\n\nplt.scatter(x, y, c="red", s=80)   # 散点，红色，点大小 80\nplt.title("立方数", fontsize=16)\nplt.tick_params(axis="both", labelsize=12)\nplt.show()'},
    {t:'随机游走：用随机画一幅画', p:'随机游走：从原点出发，每次随机选一个方向走一步，走很多步画出来就是一幅抽象画。核心是 random 模块的随机决策。RandomWalk 类：存 x 和 y 两个列表，fill_walk 方法一步步走。这是「程序 + 随机」的第一次结合——你写的代码能产生你没想到的画面。', code:'import random\nfrom random import choice\n\nclass RandomWalk:\n    def __init__(self, num_points=5000):\n        self.num_points = num_points\n        self.x = [0]\n        self.y = [0]\n    def fill_walk(self):\n        while len(self.x) < self.num_points:\n            x_step = choice([-1, 1]) * choice([0, 1, 2])\n            y_step = choice([-1, 1]) * choice([0, 1, 2])\n            if x_step == 0 and y_step == 0:\n                continue\n            self.x.append(self.x[-1] + x_step)\n            self.y.append(self.y[-1] + y_step)\n\nrw = RandomWalk(100)\nrw.fill_walk()\nprint("走了", len(rw.x), "步")'},
    {t:'Plotly 与掷骰子：交互式图表', p:'Plotly 生成交互式图表（可缩放、悬停显示数值），浏览器里直接用。模拟掷骰子：random.randint(1, 6) 掷一次，掷几千次统计每个点数出现的次数，画成直方图。你会看到：掷得越多，各点数出现次数越接近——这就是大数定律，概率论最直观的验证。', code:'from random import randint\n\nclass Die:\n    def __init__(self, num_sides=6):\n        self.num_sides = num_sides\n    def roll(self):\n        return randint(1, self.num_sides)\n\ndie = Die()\nresults = [die.roll() for _ in range(1000)]\n# 统计每个点数出现次数\nfrequencies = [results.count(v) for v in range(1, 7)]\nprint(frequencies)  # 例如 [168, 165, 172, 155, 177, 163]'},
    {t:'CSV 数据：从真实世界读取', p:'CSV（逗号分隔值）是数据交换的通用格式。csv 模块逐行读：csv.reader() 返回行迭代器。真实数据通常有表头（第一行），用 next() 跳过。处理真实数据时：先看结构、再提取需要的列、最后可视化。全球气温、地震记录、股票数据都是 CSV——真实世界的数据，比课堂例题乱得多，但也真实得多。', code:'import csv\n\nwith open("data.csv") as f:\n    reader = csv.reader(f)\n    header = next(reader)      # 跳过表头\n    highs = []\n    for row in reader:\n        if row:                 # 跳过空行\n            highs.append(int(row[1]))  # 第二列是最高温\nprint(highs)'},
    {t:'API：让程序联网取数', p:'API 是网站提供的取数接口：你用请求 URL 拿到数据（通常是 JSON），然后解析、可视化。requests.get(url) 请求，response.json() 解析。GitHub API 不需要登录就能拿到热门仓库数据：仓库名、星标数、描述。你学到的是「程序联网」——从此你的代码不再只是计算，还能连接整个世界。', code:'import requests\n\nurl = "https://api.github.com/search/repositories?q=language:python&sort=stars"\nr = requests.get(url)\nresponse_dict = r.json()\n\nprint("找到仓库数:", response_dict.get("total_count"))\nrepos = response_dict.get("items", [])[:3]\nfor repo in repos:\n    print(repo["name"], "★", repo["stargazers_count"])\n    print("  ", repo["description"])'}
  ],
  example:{q:'用列表推导式生成 1 到 10 的平方数列表，并计算总和', code:'squares = [n**2 for n in range(1, 11)]\nprint(squares)\nprint(sum(squares))', s:'一行推导式生成 [1, 4, 9, ..., 100]，sum 求和得 385。推导式是「生成列表」的极简语法：把 for 循环压缩进方括号里。可视化项目里到处用它：生成 x 轴数据、批量算 y 值。'},

  quiz:[

    {type:'code', q:'用 random.randint 模拟掷一次骰子（1 到 6），打印结果', code:'from random import randint\nprint(randint(1, 6))', expect:'', hint:'randint 包含两端，输出随机，判题只看是否无报错。'},

    {type:'code', q:'用列表推导式生成 1 到 5 的平方，打印列表', code:'squares = [n**2 for n in range(1, 6)]\nprint(squares)', expect:'[1, 4, 9, 16, 25]', hint:'推导式：[表达式 for 变量 in 序列]。'},
    {type:'choice', q:'读取 CSV 文件用哪个模块？', options:['table','data','csv','excel'], answer:2, explain:'csv 模块处理逗号分隔值文件。'},

  ,{type:'choice', q:'plt.scatter(x, y) 绘制的是？', options:['折线图','柱状图','饼图','散点图'], answer:3, explain:'scatter 绘制散点，适合看分布和相关性。'},{type:'code', q:'模拟随机游走一步：x = 0，随机加 1 或减 1（用 random 模块），打印 x', code:'import random\nx = 0\nx += random.choice([-1, 1])\nprint(x)', expect:'', hint:'choice 从列表随机选，输出随机。'},{type:'choice', q:'Plotly 图表相比 Matplotlib 的优势是？', options:['只能画折线','离线可用','速度更快','交互式（可缩放悬停）'], answer:3, explain:'Plotly 生成交互式图表，鼠标可缩放、悬停看数值。'},{type:'code', q:'模拟掷骰子 100 次，统计点数为 6 出现多少次（用 count）', code:'import random\nresults = [random.randint(1, 6) for i in range(100)]\nprint(results.count(6))', expect:'', hint:'列表推导生成 100 次结果，count(6) 数出现次数。'}],
  dialogue:{q:'为什么说「一图胜千言」对数据分析特别重要？',
    keys:['趋势','直观','比较','发现','规律','异常','理解','传达'],
    model:'数据是一堆数字，人脑不擅长处理数字，但极擅长看图。一万行数字里藏着「逐年上升」的趋势，肉眼根本看不出来；画成折线图，一眼的事。更重要的是发现异常：图上突兀的一个尖峰，就是数据里的「反常」，可能是错误也可能是重大发现。可视化不是把数据画漂亮，而是把数据变成人能理解的语言——这也是佩奇做 Google 的核心理念：把信息组织成人能用的形式。'}
  ,

/* ============================================================
   芯片学院 · 真实引擎核心（键兼容线上：chip_* 前缀 / daily_goal 全站共享）
   本段替换样张 demo 数据；渲染器与动效 100% 沿用样张。
   ============================================================ */
/* ---------- 工具 ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function store(k,v){ try{ localStorage.setItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k)); return v===null?d:v; }catch(e){ return d; } }
/* 迷你公式渲染（题干里极少出现；主要防 XSS 与转义） */
function parseMath(s){
  if(s===undefined||s===null) return '';
  return esc(s).replace(/\*\*/g,'^').replace(/(^|[^*])\*([^*]|$)/g,'$1·$2');
}
function numEq(a,b){
  function val(x){
    if(typeof x==='number') return x;
    var s=String(x).replace(/×/g,'*').replace(/√/g,'Math.sqrt(').replace(/π/g,'Math.PI').trim();
    if(/[a-zA-Z]/.test(s.replace(/Math\./g,''))) return NaN;
    try{ return eval(s); }catch(e){ return NaN; }
  }
  var A=val(a),B=val(b);
  if(isNaN(A)||isNaN(B)) return String(a).replace(/\s/g,'').toLowerCase()===String(b).replace(/\s/g,'').toLowerCase();
  return Math.abs(A-B)<1e-6;
}
/* ---------- 每日目标（全站共享键 daily_goal，4:00 为界）：l=学完一章 e=做完一份卷 ---------- */
function todayStr(){ var d=new Date(); if(d.getHours()<4) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyGoal(act){
  try{
    var d=todayStr();
    var g=JSON.parse(localStorage.getItem('daily_goal')||'{}');
    g[d]=g[d]||{}; g[d].chip=g[d].chip||{}; g[d].chip[act]=Date.now();
    localStorage.setItem('daily_goal',JSON.stringify(g));
  }catch(e){}
}
function clearDailyGoal(id){
  try{
    var g=JSON.parse(localStorage.getItem('daily_goal')||'{}'), chg=false;
    Object.keys(g).forEach(function(d){ if(g[d]&&g[d][id]){ delete g[d][id]; chg=true; if(!Object.keys(g[d]).length) delete g[d]; } });
    if(chg) localStorage.setItem('daily_goal',JSON.stringify(g));
  }catch(e){}
}
function acadDaySet(){
  try{
    var g=JSON.parse(localStorage.getItem('daily_goal')||'{}'), out={};
    Object.keys(g).forEach(function(d){ if(g[d]&&Object.keys(g[d]).length) out[d]=1; });
    var leg=load('checkin',[]);
    if(leg&&leg.length) leg.forEach(function(x){ out[x]=1; });
    return out;
  }catch(e){ return {}; }
}
function calcStreak(){
  var set=acadDaySet(), streak=0, d=new Date();
  if(!set[todayStr()]) d.setDate(d.getDate()-1);
  while(set[d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function doCheckin(){ /* 打卡统一走 dailyGoal('l'|'e') */ }
/* ---------- 状态（键与线上一致） ---------- */
function keyOk(k){ var p=String(k).split('_'); if(p.length<2) return false; var c=CHAPTERS[+p[0]-1]; return !!(c&&c.quiz&&c.quiz.length&&p[1]>=0&&p[1]<c.quiz.length); }
function ekeyOk(k){ var p=String(k).split('_'); if(p[0][0]!=='e') return false; var id=+p[0].slice(1); var c=CHAPTERS[id-1]; return !!(c&&c.exam&&p[1]>=0&&p[1]<c.exam.length); }
var chDone = (load('ch',[])||[]).filter(function(x){ return CHAPTERS[x-1]; });
var hallDone = load('hall',[]);
var quizStat = load('quizStat',{});
var quizPick = load('quizPick',{});
var studyLog = load('log',[]);
var settleStore = load('settle',{});
var todayStat = load('tstat',{d:'',done:0,correct:0});
var stat = load('stat',null);
var wrongPool = load('wrong',null);
var fixedPool = load('fixed',[]);
if(wrongPool===null){ wrongPool=[]; Object.keys(quizStat).forEach(function(k){ if(keyOk(k)&&quizStat[k]===0) wrongPool.push(k); }); store('wrong',wrongPool); }
wrongPool=wrongPool.filter(keyOk); fixedPool=fixedPool.filter(keyOk);
function poolMove(key,correct){
  var iw=wrongPool.indexOf(key), ifx=fixedPool.indexOf(key);
  if(correct){ if(iw>-1){ wrongPool.splice(iw,1); fixedPool.push(key); } }
  else { if(ifx>-1){ fixedPool.splice(ifx,1); wrongPool.push(key); } else if(iw===-1){ wrongPool.push(key); } }
  store('wrong',wrongPool); store('fixed',fixedPool);
}
/* 学习足迹：30 分钟内同一章连续活动并作一次 */
function logStudy(type,chId,chTitle){
  var now=Date.now(), _d=new Date(now), _p=function(x){ return (x<10?'0':'')+x; };
  var cat=_d.getFullYear()+'-'+_p(_d.getMonth()+1)+'-'+_p(_d.getDate())+' '+_p(_d.getHours())+':'+_p(_d.getMinutes())+':'+_p(_d.getSeconds());
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&now-last.end<30*60*1000&&last.ch===chId){ last.end=now; last.completed_at=cat; last.quizN=(last.quizN||0)+1; }
  else studyLog.push({start:now,end:now,ch:chId,title:chTitle,lessonN:0,quizN:type==='quiz'?1:0,completed_at:cat});
  if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  store('log',studyLog);
}
function sessionAcc(qs){ var c2=0,n=0; qs.forEach(function(k){ var v=quizStat[k]; if(v!==undefined){ n++; if(v===1) c2++; } }); return n?Math.round(c2/n*100):null; }
function sessionLog(ty,c,key,ok){
  var now=Date.now();
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&last.questions&&last.ty===ty&&last.ch===c.id&&(now-last.end)<30*60*1000){
    if(last.questions.indexOf(key)===-1) last.questions.push(key);
    last.end=now; last.ms=last.end-last.start; last.acc=sessionAcc(last.questions);
  } else {
    studyLog.push({ty:ty,ch:c.id,title:c.title,questions:[key],start:now,end:now,ms:0,acc:null});
    if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  }
  store('log',studyLog);
}
/* ---------- 章节进度 ---------- */
function chIsDone(c){ return chDone.indexOf(c.id)>-1; }
function chQuizCount(c){ return c.quiz?c.quiz.length:0; }
function chQuizDone(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]!==undefined) n++; }); return n; }
function chCorrect(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]===1) n++; }); return n; }
function chSummary(c){ var a=chQuizDone(c), t=chQuizCount(c); return {answered:a,total:t,correct:chCorrect(c),allDone:t>0&&a>=t,allCorrect:a>0&&chCorrect(c)>=t&&a>=t}; }
function nextChapter(){ for(var i=0;i<CHAPTERS.length;i++){ if(!chIsDone(CHAPTERS[i])) return CHAPTERS[i]; } return null; }
/* ---------- 卷状态 ---------- */
function examStatus(c){
  if(!c.exam||!c.exam.length) return {answered:0,correct:0,full:false,total:0};
  var answered=0,correct=0;
  c.exam.forEach(function(q,i){ var st=quizStat['e'+c.id+'_'+i]; if(st!==undefined){ answered++; if(st===1) correct++; } });
  return {answered:answered,correct:correct,full:answered>=c.exam.length,total:c.exam.length};
}

var RANKS = [[0,'终端学徒'],[10,'脚本新手'],[20,'初级开发者'],[30,'列表指挥官'],[40,'逻辑判官'],[50,'中级开发者'],[60,'函数铸造师'],[70,'类建筑师'],[80,'高级开发者'],[90,'测试守门人'],[100,'Python 大师']];
function curRank(pct){
  var name=RANKS[0][1],next=null,nextAt=null;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ name=RANKS[i][1]; nextAt=(i+1<RANKS.length)?RANKS[i+1][0]:null; next=(i+1<RANKS.length)?RANKS[i+1][1]:null; } }
  return {name:name,next:next,nextAt:nextAt,remain:nextAt!==null?(nextAt-pct):0};
}
function calcStats(){
  var totalC=CHAPTERS.length;
  var doneC=chDone.length;
  var examTotal=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length; }).length;
  var examFull=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length&&examStatus(c).full; }).length;
  var wrongN=fixedPool.length+wrongPool.length;
  var base=doneC/totalC*0.5+(examTotal?examFull/examTotal*0.3:0);
  var pct;
  if(wrongN){ pct=Math.round((base+fixedPool.length/wrongN*0.2)*100); }
  else { pct=Math.round(base/0.8*100); }
  return {doneC:doneC,totalC:totalC,examTotal:examTotal,examFull:examFull,wrongN:wrongN,fixedPool:fixedPool.length,wrongPool:wrongPool.length,pct:Math.min(100,pct),studyCount:studyLog.length};
}

/* ---------- 今日答题统计 ---------- */
function statTodayKey(){ return new Date().toDateString(); }
function initStat(){
  var k=statTodayKey();
  if(!stat||stat.day!==k){
    var base=stat||{};
    stat={ totalQ:base.totalQ||0,totalCorrect:base.totalCorrect||0,totalMs:base.totalMs||0,
      todayQ:0,todayCorrect:0,todayMs:0,todayReal:0,accQ:0,accC:0,day:k };
  }
  if(!stat._migrated){
    var qkeys=Object.keys(quizStat||{});
    stat.totalQ=qkeys.length; stat.accQ=qkeys.length;
    var cc=0; qkeys.forEach(function(kk){ if(quizStat[kk]===1) cc++; });
    stat.accC=cc; stat.totalCorrect=cc; stat._migrated=true;
  }
  storeStat();
}
function storeStat(){ store('stat',stat); }
function statRecordQ(ok){
  if(!stat) return;
  stat.totalQ++; stat.todayQ++; stat.todayReal++; stat.accQ++;
  if(ok) stat.accC++;
  if(ok){ stat.totalCorrect++; stat.todayCorrect++; }
  storeStat();
}
function todayRecord(ok){
  var d=new Date().toDateString();
  if(todayStat.d!==d){ todayStat={d:d,done:0,correct:0}; }
  todayStat.done++; if(ok) todayStat.correct++;
  store('tstat',todayStat);
}
function studyTimerEnter(){ if(window._studyStart===null||window._studyStart===undefined) window._studyStart=Date.now(); }
function studyTimerLeave(){
  if(window._studyStart){ if(stat){ stat.totalMs+=Date.now()-window._studyStart; stat.todayMs+=Date.now()-window._studyStart; storeStat(); } window._studyStart=null; }
}
/* ---------- 作答主流程（写库语义与线上一致） ---------- */
function answerQuestion(c,i,oi){
  var q=c.quiz[i], k=c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok);
  statRecordQ(ok);
  if(hallDone.indexOf(k)===-1){ hallDone.push(k); store('hall',hallDone); }
  logStudy('quiz',c.id,c.title);
  sessionLog('lesson',c,k,ok);
  return ok;
}
function answerVol(c,i,oi){
  var q=c.exam[i], k='e'+c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok); statRecordQ(ok);
  logStudy('quiz',c.id,c.title);
  return ok;
}
/* ---------- 结算：全答即通过（不要求全对），首次点亮打卡与完成 ---------- */
function settleChapter(c, mode){
  var sm=chSummary(c);
  if(!sm.allDone){ toast('还有 '+(sm.total-sm.answered)+' 题没做完，做完才能结算'); return false; }
  var first = chDone.indexOf(c.id)===-1;
  if(first){
    chDone.push(c.id); store('ch',chDone);
    dailyGoal('l');
    settleStore['settle_'+c.id]={ts:Date.now(),pct:Math.round(sm.correct/sm.total*100),allCorrect:sm.allCorrect};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章完成！';
    $('#cSub').textContent=(sm.allCorrect?'随堂全对通关 · ':'答完即结算 · ')+'今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('本章已结算过，可去下一章');
  return false;
}
function settleVol(c){
  var st=examStatus(c);
  if(!st.full){ toast('还有 '+(st.total-st.answered)+' 题没做完'); return false; }
  var k='vol_'+c.id;
  var first = !settleStore[k];
  if(first){
    dailyGoal('e');
    settleStore[k]={ts:Date.now(),correct:st.correct};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章小卷完成！';
    $('#cSub').textContent='卷子已点亮 · 今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('这份卷子已结算过');
  return false;
}

function poolKeyInfo(k){
  var p=String(k).split('_');
  if(p[0][0]==='e'){ var c2=chById(+p[0].slice(1)); return c2?('第 '+c2.id+' 章小卷 · '+(c2.exam&&c2.exam[+p[1]]?c2.exam[+p[1]].q:'')):k; }
  var c=chById(+p[0]);
  if(!c||!c.quiz) return k;
  var q=c.quiz[+p[1]];
  return '第 '+c.id+' 章 · '+(q?q.q:'Q'+(+p[1]+1));
}

    +'<div class="sub">四院共通，跨学院不断签。今日连签 '+streak+' 天</div>';

/* toast 单例化：同一时刻只保留一条提示，新提示立即顶掉旧条（鼠哥 2026-09-04） */
function toast(msg){
  var box=document.getElementById('toastBox');
  if(!box) return;
  while(box.firstChild) box.removeChild(box.firstChild);
  var el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="ic t-ic">'+I['check']+'</span><span>'+msg+'</span>';
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); },2200);
}
function updatePgSub(){

}

scroller.addEventListener('click',function(e){
  /* 结算按钮 */
  var setBtn=e.target.closest('[data-settle]');
  if(setBtn){ tap(); var c=chById(+setBtn.getAttribute('data-settle')); if(c) settleChapter(c,'lesson'); return; }
  /* 答错后再答一次（随堂） */
  var retry=e.target.closest('[data-retry]');
  if(retry){
    tap();
    var rq=retry.getAttribute('data-retry');
    var cA=chById(_lastNav.chapter||1); if(!cA) return;
    var key=cA.id+'_'+rq;
    delete quizStat[key]; store('quizStat',quizStat);
    var qb=document.getElementById('qbox'+rq);
    if(qb){
      qb.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('correct','wrong','muted'); o.removeAttribute('data-lock');
        var m=o.querySelector('.mark'); if(m) m.style.display='';
      });
    }
    var wn=document.getElementById('whyNote'+rq); if(wn){ wn.className='why-note'; wn.innerHTML=''; }
    updatePgSub();
    return;
  }
  /* 答错后再答一次（小卷） */
  var etry=e.target.closest('[data-etry]');
  if(etry){
    tap();
    var eq2=etry.getAttribute('data-etry');
    var cV=chById(_lastNav.exam||1); if(!cV) return;
    var ekey='e'+cV.id+'_'+eq2;
    delete quizStat[ekey]; store('quizStat',quizStat);
    var eqb=document.getElementById('eqbox'+eq2);
    if(eqb){
      eqb.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('correct','wrong','muted'); o.removeAttribute('data-lock');
        var m=o.querySelector('.mark'); if(m) m.style.display='';
      });
    }
    var ewn=document.getElementById('ewhyNote'+eq2); if(ewn){ ewn.className='why-note'; ewn.innerHTML=''; }
    updatePgSub();
    return;
  }
  /* 随堂题作答（chapter 页 / 刷题） */
  var opt=e.target.closest('.opt[data-q]');
  if(opt){
    tap();
    var c=chById(_lastNav.chapter||1); if(!c||!c.quiz) return;
    if(opt.hasAttribute('data-lock')) return;
    var qi=+opt.getAttribute('data-q'), oi=+opt.getAttribute('data-i');
    var q=c.quiz[qi]; if(!q) return;
    var ok=answerQuestion(c,qi,oi);
    var box=document.getElementById('qbox'+qi);
    box.querySelectorAll('.opt').forEach(function(o){
      var ii=+o.getAttribute('data-i');
      o.setAttribute('data-lock','1');
      if(ii===oi) o.classList.add(ok?'correct':'wrong');
      else if(ii===q.answer) o.classList.add('correct','muted');
      if(ii===q.answer){ var m=o.querySelector('.mark'); if(m) m.style.display='inline-flex'; }
    });
    if(ok) noteOK('whyNote'+qi,'<b>答对了。</b>'+esc(q.explain||''));
    else noteNO('whyNote'+qi,'<b>答错了，正确答案：「'+parseMath(q.options[q.answer])+'」</b><br>'+esc(q.explain||'')+'<br><button class="retry-btn" data-retry="'+qi+'">↻ 再答一次</button>');
    toast(ok?'✓ 答对':'看解析，再试一次');
    updatePgSub();
    var sm=chSummary(c);
    if(sm.allDone&&!chIsDone(c)) setTimeout(function(){ settleChapter(c,'lesson'); },900);
    return;
  }
  /* 小卷题作答 */
  var eopt=e.target.closest('.opt[data-eq]');
  if(eopt){
    tap();
    var cv=chById(_lastNav.exam||1); if(!cv||!cv.exam) return;
    if(eopt.hasAttribute('data-lock')) return;
    var eqi=+eopt.getAttribute('data-eq'), eoi=+eopt.getAttribute('data-i');
    var eq=cv.exam[eqi]; if(!eq) return;
    var eok=answerVol(cv,eqi,eoi);
    var ebox=document.getElementById('eqbox'+eqi);
    ebox.querySelectorAll('.opt').forEach(function(o){
      var ii=+o.getAttribute('data-i');
      o.setAttribute('data-lock','1');
      if(ii===eoi) o.classList.add(eok?'correct':'wrong');
      else if(ii===eq.answer) o.classList.add('correct','muted');
      if(ii===eq.answer){ var m=o.querySelector('.mark'); if(m) m.style.display='inline-flex'; }
    });
    if(eok) noteOK('ewhyNote'+eqi,'<b>答对了。</b>'+esc(eq.explain||''));
    else noteNO('ewhyNote'+eqi,'<b>答错了，正确答案：「'+parseMath(eq.options[eq.answer])+'」</b><br>'+esc(eq.explain||'')+'<br><button class="retry-btn" data-etry="'+eqi+'">↻ 再答一次</button>');
    toast(eok?'✓ 答对':'看解析，再试一次');
    updatePgSub();
    var est=examStatus(cv);
    if(est.full) setTimeout(function(){ settleVol(cv); },900);
    return;
  }
  /* 填空作答 */
  var fgo=e.target.closest('[data-fillgo]');
  if(fgo){
    tap();
    var cF=chById(_lastNav.chapter||1); if(!cF) return;
    var fi=+fgo.getAttribute('data-fillgo');
    var inp=document.getElementById('fin'+fi);
    var val=(inp&&inp.value||'').trim();
    if(!val){ toast('先输入答案'); return; }
    var fok=answerQuestion(cF,fi,val);
    var fq=cF.quiz[fi];
    if(fok) noteOK('whyNote'+fi,'<b>答对了。</b>'+esc(fq.explain||''));
    else noteNO('whyNote'+fi,'<b>答错了。</b>'+esc(fq.explain||''));
    inp.disabled=true; fgo.disabled=true;
    toast(fok?'✓ 答对':'看解析');
    updatePgSub();
    var smF=chSummary(cF);
    if(smF.allDone&&!chIsDone(cF)) setTimeout(function(){ settleChapter(cF,'lesson'); },900);
    return;
  }
  var efgo=e.target.closest('[data-efillgo]');
  if(efgo){
    tap();
    var cV2=chById(_lastNav.exam||1); if(!cV2) return;
    var efi=+efgo.getAttribute('data-efillgo');
    var einp=document.querySelector('[data-efill="'+efi+'"]');
    var eval2=(einp&&einp.value||'').trim();
    if(!eval2){ toast('先输入答案'); return; }
    var efok=answerVol(cV2,efi,eval2);
    var efq=cV2.exam[efi];
    if(efok) noteOK('ewhyNote'+efi,'<b>答对了。</b>'+esc(efq.explain||''));
    else noteNO('ewhyNote'+efi,'<b>答错了。</b>'+esc(efq.explain||''));
    einp.disabled=true; efgo.disabled=true;
    toast(efok?'✓ 答对':'看解析');
    updatePgSub();
    if(examStatus(cV2).full) setTimeout(function(){ settleVol(cV2); },900);
    return;
  }
  /* 外观切换（防抖 400ms，避免连点刷屏提示） */
  var tr=e.target.closest('#themeRow');
  if(tr){
    if(window._themeBusy) return;
    window._themeBusy=true;
    setTimeout(function(){ window._themeBusy=false; },400);
    tap();
    var seq=['auto','dark','light'];
    var cur=load('theme','auto');
    var nx=seq[(seq.indexOf(cur)+1)%3];
    setTheme(nx,true);
    return;
  }
  /* 管理页按钮 */
  if(e.target.closest('#bkExport')){ bkExport(); return; }
  if(e.target.closest('#bkImport')){ bkImport(); return; }
  if(e.target.closest('#wipeBtn')){ doWipe(); return; }
  /* 外链 / 分享 */
  var ext=e.target.closest('[data-ext]');
  if(ext){ tap(); var url=ext.getAttribute('data-ext'); if(url) window.open(url,'_blank','noopener'); return; }
  var shb=e.target.closest('[data-share]');
  if(shb){ tap(); shareAcademy(); return; }
  /* 页面跳转：先弹「开始做题」（Duolingo 式），点开始才进题计时 */
  var gc=e.target.closest('[data-go-ch]');
  if(gc){ tap(); showStart('lesson',+gc.getAttribute('data-go-ch')); return; }
  var gd=e.target.closest('[data-go-drill]');
  if(gd){ tap(); showStart('drill',+gd.getAttribute('data-go-drill')); return; }
  var ge=e.target.closest('[data-go-exam]');
  if(ge){ tap(); showStart('exam',+ge.getAttribute('data-go-exam')); return; }
  var g=e.target.closest('[data-go]');
  if(g){
    tap();
    var go2=g.getAttribute('data-go');
    if(go2==='back'){ guardedBack(); }
    else if(renderers[go2]){ requestNav(function(){ go(go2); }); }
    else if(go2==='portal'){ location.href='https://ndshuge.github.io/ndshuge-academy/'; }
    return;
  }
});

function bkExport(){

    wrong:wrongPool,fixed:fixedPool,settle:settleStore,stat:stat,tstat:todayStat,log:studyLog

function bkImport(){
  var ta=document.getElementById('bkText');
  var raw=(ta&&ta.value||'').trim();
  if(!raw){ toast('先粘贴备份码'); return; }
  var pack=null;
  try{ pack=JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e){}
  if(!pack||!pack.quizStat){ toast('备份码无效'); return; }
  if(pack.ch) store('ch',pack.ch);
  if(pack.hall) store('hall',pack.hall);
  if(pack.quizStat) store('quizStat',pack.quizStat);
  if(pack.quizPick) store('quizPick',pack.quizPick);
  if(pack.wrong) store('wrong',pack.wrong);
  if(pack.fixed) store('fixed',pack.fixed);
  if(pack.settle) store('settle',pack.settle);
  if(pack.stat) store('stat',pack.stat);
  if(pack.tstat) store('tstat',pack.tstat);
  toast('导入成功');
  setTimeout(function(){ location.reload(); },600);
}

function shareAcademy(){

  } else legacyCopy(url,done);
}
function legacyCopy(txt,ok){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.cssText='position:fixed;left:-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok&&ok(); }catch(e){}
  document.body.removeChild(ta);
}

  go('home');
});
/* ---------- 开始做题层（Duolingo 式）：确认后才进题并计时 ---------- */
var startCtx=null;
function ssRow(ic,t,cap){ return '<div class="ss-row"><span class="ic">'+IC(ic)+'</span><div style="flex:1;min-width:0"><b style="display:block">'+t+'</b><span>'+cap+'</span></div></div>'; }
function showStart(kind,id){
  var c=chById(id); if(!c) return;
  startCtx={kind:kind,id:id};
  var kick,title,sub,rows='';
  if(kind==='exam'){
    var st=examStatus(c);
    kick='MINI EXAM '+('0'+id).slice(-2);
    title=esc(c.title)+' · 小卷';
    sub=st.full?'这份卷已结算 · 重做不改变记录':(st.answered>0?'继续上次作答':'答完自动结算点亮打卡');
    rows=ssRow('doc',(c.exam||[]).length+' 题','单选 · 即时批改 · 错题自动归档')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(st.answered>0?ssRow('check','已答 '+st.answered+'/'+st.total,'进度已保留'):'');
  } else {
    var sm=chSummary(c), isD=kind==='drill';
    kick='LESSON '+('0'+id).slice(-2);
    title=esc(c.title);
    sub=chIsDone(c)?'本章已点亮 · 可回来重读重做':(c.full?(isD?'按章刷题 · 答对自动移出错题':'讲义 + 随堂题 · 答完自动结算点亮章节'):'待米勒开讲');
    rows=ssRow('book',sm.total+' 道随堂题','答完即结算 · 不要求满分')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(sm.answered>0?ssRow(isD?'pen':'check','已答 '+sm.answered+'/'+sm.total,isD?'可反复重做':'继续上次进度'):'');
  }
  $('#ssKicker').textContent=kick;
  $('#ssTitle').textContent=title;
  $('#ssSub').textContent=sub;
  $('#ssRows').innerHTML=rows;
  /* 两拍式弹出：先显示落起始帧，再加 .show 触发弹簧过渡（rAF + setTimeout 双保险，防个别环境 rAF 节流导致无动画） */
  var sh=document.getElementById('startSheet');
  clearTimeout(sh._hideT);
  sh.classList.remove('show');
  sh.style.display='block';
  void sh.offsetWidth;
  var tryShow=function(){ sh.classList.add('show'); };
  if(window.requestAnimationFrame){ requestAnimationFrame(tryShow); setTimeout(tryShow, 40); }
  else tryShow();
  tap();
}
function closeStart(){
  startCtx=null;
  var el=document.getElementById('startSheet');
  if(el){
    el.classList.remove('show');
    clearTimeout(el._hideT);
    el._hideT=setTimeout(function(){ if(el && !el.classList.contains('show')) el.style.display='none'; },520);
  }
}
function beginStudy(){
  var ctx=startCtx; if(!ctx) return;
  closeStart();
  studyTimerEnter();
  if(ctx.kind==='exam'){ _lastNav.exam=ctx.id; go('exam',ctx.id); startTimer(); }
  else { _lastNav.chapter=ctx.id; _lastNav.mode=(ctx.kind==='drill')?'drill':'lesson'; go('chapter',ctx.id); startTimer(); }
}
/* ---------- 顶栏 / Dock 绑定 ---------- */
$('#btnBack').addEventListener('click',function(){ tap(); guardedBack(); });
$('#btnPortal').addEventListener('click',function(){
  tap();
  toast('正在前往总学院…');
  setTimeout(function(){ location.href='https://ndshuge.github.io/ndshuge-academy/'; },260);
});
document.querySelectorAll('.dock-btn').forEach(function(b){
  b.addEventListener('click',function(){
    tap();
    var t=b.getAttribute('data-tab');
    var homeId={learn:'home',drill:'hall',mine:'mine'}[t];
    requestNav(function(){ go(homeId,undefined,'tab'); });
  });
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ $('#celebrate').classList.remove('show'); dismissConfirm(); closeStart(); }
});
/* startSheet DOM 在 script 之后，绑定需等 DOM 就绪 */
document.addEventListener('DOMContentLoaded',function(){
  var goBtn=document.getElementById('ssStart');
  if(goBtn) goBtn.addEventListener('click',function(){ tap(); beginStudy(); });
  var ccBtn=document.getElementById('ssCancel');
  if(ccBtn) ccBtn.addEventListener('click',function(){ tap(); closeStart(); });
  var mk=document.querySelector('#startSheet .ss-mask');
  if(mk) mk.addEventListener('click',function(){ tap(); closeStart(); });
});
/* ---------- 启动 ---------- */
(function(){
  document.getElementById('demoTag').style.display='none';
  try{
    var t=load('theme','auto');
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    else if(t==='light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  initStat();
  mountStaticIcons();
  history.replaceState({view:'home'},'');
  renderView('home',false);
})();

</script>
<!-- 学院壳公共 DOM 注入（与 _shell.css 配套，来源唯一：样张） -->

  <div class="ss-mask"></div>
  <div class="ss-card">
    <div class="ss-grip"></div>
    <div class="ss-kicker" id="ssKicker"></div>
    <div class="ss-title" id="ssTitle"></div>
    <div class="ss-sub" id="ssSub"></div>
    <div class="ss-rows" id="ssRows"></div>
    <button class="ss-start" id="ssStart">开始做题</button>
    <button class="ss-cancel" id="ssCancel">先不学</button>
  </div>
</div>
