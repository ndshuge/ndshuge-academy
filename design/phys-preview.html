-color:transparent}html,body{height:100%}body{  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;  font-size:17px;line-height:1.5;color:var(--ink);  background:radial-gradient(1200px 600px at 20% -10%,var(--bg-glow),transparent),var(--bg);  -webkit-font-smoothing:antialiased;overflow:hidden;}button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}img{max-width:100%;display:block}/* 图标基础（内联 SVG，currentColor） */.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1em;height:1em}.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}/* 尺寸兜底：嵌在固定容器里的图标不被 em 值挤歪 */.ch-num .ic{width:16px;height:16px}.ch-row .chev .ic{width:14px;height:14px}.opt .mark .ic{width:20px;height:20px}#app{display:flex;flex-direction:column;height:100dvh}/* ============ 顶部工具栏：通透玻璃 + 高光描边 ============ */#topbar{  flex:none;height:54px;display:flex;align-items:center;gap:8px;  padding:0 10px 0 14px;position:relative;z-index:30;  background:var(--glass);  -webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);}/* 玻璃下缘高光：先投影淡线再深分隔，制造厚度 */#topbar::after{  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;  background:linear-gradient(var(--glass-edge),rgba(120,120,128,.25));}#topbar .backbtn{  display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 12px 0 6px;  border-radius:10px;font-size:16px;color:var(--accent);font-weight:500;  background:var(--fill-soft);transition:background .18s var(--ease),color .18s;}#topbar .backbtn .ic{width:16px;height:16px;color:var(--accent)}#topbar .backbtn:disabled{opacity:.35;cursor:default;color:var(--muted)}#topbar .backbtn:disabled .ic{color:var(--muted)}#topbar .brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.12;pointer-events:none;max-width:44%}#topbar .brand b{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#topbar .brand span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px}#topbar .homebtn{  margin-left:auto;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;  color:var(--accent);display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);  transition:background .18s var(--ease);}#topbar .homebtn .ic{width:15px;height:15px}/* 触屏按压：iOS 语言，按下高亮变暗，无位移无缩放 */@media (hover:none){  #topbar .backbtn:active,#topbar .homebtn:active{background:var(--fill)}}@media (hover:hover){  #topbar .backbtn:hover,#topbar .homebtn:hover{filter:brightness(.92)}}/* ============ 舞台与滚动条（桌面细 overlay） ============ */#stage{flex:1;position:relative;overflow:hidden}#scroller{  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:140px;  scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.45) transparent;}@media (hover:hover){  #scroller::-webkit-scrollbar{width:8px}  #scroller::-webkit-scrollbar-track{background:transparent}  #scroller::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px;border:2px solid transparent;background-clip:content-box}  #scroller::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.6);border:2px solid transparent;background-clip:content-box}}.view{padding:20px 16px 30px;max-width:900px;margin:0 auto;will-change:transform,opacity}.view.push{animation:pushIn .38s var(--ease)}.view.pushBack{animation:pushBackIn .38s var(--ease)}@keyframes pushIn{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}@keyframes pushBackIn{from{opacity:.3;transform:translateX(-52px)}to{opacity:1;transform:none}}.kick{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}.h1{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:5px}.h2{font-size:22px;font-weight:700;letter-spacing:-.3px}.sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5}.cap{font-size:12px;color:var(--muted)}.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.4px}.card{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);padding:16px}.card + .card,.card + .stack{margin-top:12px}.stack{display:flex;flex-direction:column;gap:12px}.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;  padding:4px 11px;border-radius:16px;background:var(--fill);color:var(--ink2)}.pill.gold{background:var(--gold-soft);color:#C93400}.pill.green{background:var(--green-soft);color:#1E9E4A}:root[data-theme=dark] .pill.gold{color:#FFD60A}:root[data-theme=dark] .pill.green{color:#32D74B}.pill.blue{background:var(--accent-soft);color:var(--accent)}/* hover（仅鼠标）：轻上浮强调；触屏按压全部走高亮不位移 */@media (hover:hover){  .lift{transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .18s}  .lift:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}  .lift:active{transform:translateY(0);filter:brightness(.95)}}@media (hover:none){  .lift:active{filter:brightness(.88)}  .tile:active,.ch-row:active,.snap-card:active{background:var(--fill)}}/* ============ Dock：悬浮玻璃片，仅三 Tab ============ */#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}#dock .dockbar{  pointer-events:auto;display:flex;align-items:center;justify-content:center;  background:var(--glass);  -webkit-backdrop-filter:blur(44px) saturate(1.8);backdrop-filter:blur(44px) saturate(1.8);  border:1px solid var(--sep);  box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);  border-radius:26px;padding:5px 6px;}.dock-btn{  width:66px;height:52px;border-radius:20px;display:flex;flex-direction:column;  align-items:center;justify-content:center;gap:2px;position:relative;  color:var(--muted);transition:transform .24s var(--ease-spring),color .2s;}.dock-btn .d-ico{width:24px;height:24px}.dock-btn span{font-size:10px;font-weight:600;letter-spacing:.2px}.dock-btn.on{color:var(--accent)}.dock-btn.on .d-ico{transform:translateY(-1px)}@media (hover:hover){  .dock-btn:hover{transform:translateY(-8px) scale(1.13);color:var(--accent);background:var(--fill-soft)}}@media (hover:none){  .dock-btn:active{filter:brightness(.75)}}/* ============ 主页：内容流 ============ */.hero-card{  background:var(--card);  border-radius:var(--r-l);padding:24px;color:var(--ink);display:flex;flex-direction:column;gap:13px;  position:relative;overflow:hidden;  border:1px solid var(--sep);box-shadow:var(--sh-card);}/* 几何装饰：芯片线框，低调线条 + accent 圆点 */.hero-card .deco{position:absolute;right:10px;top:10px;width:66px;height:66px;  color:var(--sep-strong)}.hero-card .deco .geo-line{stroke:currentColor;stroke-width:1.6;fill:none}.hero-card .deco .geo-dot{fill:var(--accent)}.hero-card .hk{font-size:12px;font-weight:800;letter-spacing:2.2px;color:var(--accent)}.hero-card .next{font-size:22px;font-weight:800;line-height:1.32;letter-spacing:-.3px;  padding-right:72px}.hero-card .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hero-card .btn-go{  margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:15px;  padding:10px 20px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;  box-shadow:0 4px 14px var(--accent-soft);}.hero-card .btn-go .ic{width:15px;height:15px}@media (hover:none){ .hero-card .btn-go:active{filter:brightness(.9)} }/* 横滑组（App Store 式内容卷） */.snap-row{  display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;  scroll-snap-type:x mandatory;scrollbar-width:none;}.snap-row::-webkit-scrollbar{display:none}.snap-card{  flex:0 0 min(78%,340px);scroll-snap-align:start;border-radius:var(--r-m);  background:var(--card);box-shadow:var(--sh-card);padding:16px;  display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;overflow:hidden;}.snap-card .sc-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}.snap-card .sc-ico .ic{width:20px;height:20px}.snap-card b{font-size:16px;display:block;line-height:1.3}.snap-card .cap{font-size:12.5px;line-height:1.45}.snap-card .go{display:inline-flex;align-items:center;gap:3px;margin-top:auto;color:var(--accent);  font-size:14px;font-weight:600;padding-top:4px}.snap-card .go .ic{width:13px;height:13px}/* 书架：最近章节直给 */.ch-row{  width:100%;display:flex;align-items:center;gap:13px;text-align:left;  background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);  padding:12px 14px;min-height:60px;}.ch-row + .ch-row{margin-top:10px}.ch-num{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;  justify-content:center;font-size:14px;font-weight:700;color:#fff;  background:linear-gradient(135deg,#0A84FF,#5E5CE6);font-variant-numeric:tabular-nums}.ch-row.done .ch-num{background:var(--green);color:#fff}.ch-row.locked .ch-num{background:var(--fill);color:var(--muted)}.ch-body{flex:1;min-width:0}.ch-body b{font-size:17px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch-body .cap{font-size:13px}.ch-check{color:var(--green);flex:none;width:20px;height:20px}.ch-row .chev{color:var(--sep-strong,var(--muted));width:16px;height:16px;opacity:.6}/* 次级功能行（收敛后的小图标入口） */.mini-row{display:flex;gap:8px;flex-wrap:wrap}.mini-btn{  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;  background:var(--card);box-shadow:var(--sh-card);font-size:13.5px;font-weight:600;color:var(--ink2);}.mini-btn .ic{width:15px;height:15px;color:var(--accent)}/* 主焦点大入口（章节课堂） */.big-entry{  width:100%;display:flex;align-items:center;gap:16px;text-align:left;  border:1px solid var(--sep);box-shadow:var(--sh-card);  paddin one;opacity:1}}@keyframes toastOut{to{transform:translateY(16px) scale(.96);opacity:0}}/* 结算（多邻国式，庆祝表情保留为内容符号） */#celebrate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;  flex-direction:column;gap:6px;text-align:center;padding:24px;  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}#celebrate.show{display:flex;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}#celebrate .c-card{animation:pop .6s var(--ease-spring)}@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}#celebrate .c-ring{width:132px;height:132px;margin:0 auto;border-radius:50%;position:relative;  display:flex;align-items:center;justify-content:center;  box-shadow:0 0 0 8px rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.35)}#celebrate .c-ring i{position:absolute;inset:0;border-radius:50%;  background:conic-gradient(#30D158 0 72%,#FFD60A 72% 100%);animation:spinRing .9s var(--ease)}@keyframes spinRing{from{transform:rotate(0)}to{transform:rotate(360deg)}}#celebrate .c-ring b{position:relative;z-index:2;width:104px;height:104px;border-radius:50%;  background:var(--card);display:flex;align-items:center;justify-content:center}#celebrate .c-ring b .ic{width:56px;height:56px;color:var(--green);stroke-width:2.2}#celebrate h3{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.4px;margin-top:20px;  animation:bounceIn .7s .15s var(--ease-spring) backwards}#celebrate p{color:rgba(255,255,255,.88);font-size:16px;animation:fadeUp .5s .4s ease backwards}#celebrate .btn-solid{background:#fff;color:#1D1D1F;font-weight:700;font-size:16px;padding:12px 30px;  border-radius:14px;margin-top:20px;animation:fadeUp .5s .55s ease backwards}#celebrate .btn-solid:active{filter:brightness(.9)}@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}#confirmBox{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;flex-direction:column;  align-items:stretch;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);  background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);  border-top:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);  border-radius:24px 24px 0 0;animation:sheetUp .4s var(--ease-spring)}#confirmBox.show{display:flex}@keyframes sheetUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}#confirmBox .c-title{font-size:18px;font-weight:700;margin-bottom:4px}#confirmBox .c-msg{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}#confirmBox .btn-row{display:flex;gap:10px}#confirmBox .btn-solid{flex:1;background:var(--accent);color:#fff;font-size:17px;font-weight:600;  padding:14px;border-radius:14px;text-align:center}#confirmBox .btn-line{flex:1;background:var(--fill);color:var(--ink);font-size:17px;font-weight:600;  padding:14px;border-radius:14px;text-align:center}#confirmBox .btn-solid:active,#confirmBox .btn-line:active{filter:brightness(.92)}#demoTag{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:55;  font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);  background:var(--glass);border:1px solid var(--sep);padding:3px 8px;border-radius:6px;  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* ===== 多邻国式答对庆祝 toast ===== */
.toast.ok{
  background:linear-gradient(135deg,#58CC02,#46A302);
  color:#fff;border-radius:18px;padding:13px 22px;
  box-shadow:0 10px 28px rgba(88,204,2,.45),0 2px 6px rgba(0,0,0,.12);
  border:1px solid rgba(255,255,255,.25);
  animation:duoPop .6s cubic-bezier(.34,1.8,.44,1), okPulse 1.4s ease .5s;
  position:relative;overflow:visible;
}
.toast.ok .tk{
  font-size:26px;line-height:1;font-weight:900;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);
  text-shadow:0 2px 0 rgba(0,0,0,.12);
}
.toast.ok .tt{font-size:16px;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 0 rgba(0,0,0,.1)}
@keyframes duoPop{
  0%{transform:translateY(90px) scale(.55);opacity:0}
  55%{transform:translateY(-8px) scale(1.08);opacity:1}
  75%{transform:translateY(3px) scale(.98)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes okPulse{
  0%,100%{box-shadow:0 10px 28px rgba(88,204,2,.45)}
  50%{box-shadow:0 12px 36px rgba(88,204,2,.75)}
}
.toast.ok .spark{
  position:absolute;left:50%;top:50%;font-size:17px;font-weight:700;
  pointer-events:none;opacity:0;animation:sparkFly .7s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes sparkFly{
  0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot,40deg))}
}
.toast.no{
  background:linear-gradient(135deg,#FF4D4D,#D70015);
  color:#fff;border-radius:16px;
  animation:noShake .5s cubic-bezier(.36,.07,.19,.97), noPulse 1.2s ease .5s;
}
.toast.no .t-ic{color:#fff}
@keyframes noShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px) rotate(-1deg)}
  40%{transform:translateX(6px) rotate(1deg)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}
@keyframes noPulse{
  0%,100%{box-shadow:0 10px 26px rgba(255,77,77,.4)}
  50%{box-shadow:0 12px 34px rgba(255,77,77,.7)}
}
/* ============================================================
   UI 动效强化（chip 内容层 · 不删任何内容，纯增强）
   荣誉墙 / 做题界面 / 卡片入场 / 判题反馈
   ============================================================ */
/* ---- 卡片入场（整页切换后内容有序浮现） ---- */
@keyframes uiRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes uiPop{0%{opacity:0;transform:scale(.94) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
#view .card{animation:uiRise .5s cubic-bezier(.22,.9,.3,1) both}
#view .hero-card{animation:uiPop .55s cubic-bezier(.24,1.2,.4,1) both}
#view .big-entry,#view .tutor-card{animation:uiRise .55s cubic-bezier(.22,.9,.3,1) both}
#view .big-entry{animation-delay:.06s}
#view .tutor-card{animation-delay:.12s}

/* ---- 荣誉墙 ---- */
#legacy-honor .rank-step{animation:uiPop .4s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .hw-card{animation:uiPop .45s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .mh-card{animation:uiPop .45s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .card h3 .rw{animation:uiRise .4s both}
/* 称号阶梯：完成=绿光呼吸；当前=金环脉冲 */
@keyframes rankBreath{0%,100%{box-shadow:0 0 0 0 rgba(74,107,74,.25)}50%{box-shadow:0 0 0 6px rgba(74,107,74,0)}}
#legacy-honor .rank-step.done{animation:rankBreath 2.4s ease-in-out infinite}
@keyframes goldPulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 0 2px rgba(255,149,0,.25)}50%{box-shadow:0 0 0 2px var(--gold),0 0 0 9px rgba(255,149,0,0)}}
#legacy-honor .rank-step.cur{animation:goldPulse 2s ease-in-out infinite}
/* 徽章墙：已解锁徽章柔和金光脉动；悬停浮起 */
@keyframes hwGlow{0%,100%{box-shadow:0 2px 10px rgba(184,134,11,.12)}50%{box-shadow:0 2px 16px rgba(184,134,11,.32)}}
#legacy-honor .hw-card.got{animation:uiPop .45s both,hwGlow 3s ease-in-out 1s infinite}
@media (hover:hover){
  #legacy-honor .hw-card,#legacy-honor .rank-step{
    transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,border-color .22s;
  }
  #legacy-honor .hw-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 22px rgba(0,0,0,.12)}
  #legacy-honor .rank-step:hover{transform:translateY(-2px)}
}
/* 名人堂：已点亮卡点击脉冲、悬停弹簧上浮 */
#legacy-honor .mh-card{transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .22s,filter .3s,opacity .3s}
#legacy-honor .mh-card.lit:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 26px rgba(184,134,11,.3)}
#legacy-honor .mh-card.lit:active{transform:translateY(0) scale(.97)}
@keyframes mhFlash{0%{box-shadow:0 0 0 0 rgba(255,149,0,.5)}100%{box-shadow:0 0 0 0 rgba(255,149,0,0)}}
#legacy-honor .mh-card.lit{animation:uiPop .4s both}
/* 名人头像旋转入场后的稳持（轻）。 */
#legacy-honor .mh-avatar{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#legacy-honor .mh-card.lit:hover .mh-avatar{transform:scale(1.08)}

/* ---- 做题界面：题目卡 & 选项反馈 ---- */
#legacy-chapter .quiz{animation:uiRise .45s cubic-bezier(.22,.9,.3,1) both}
@keyframes optPop{0%{transform:scale(.92)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes optShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}55%{transform:translateX(2px)}80%{transform:translateX(-1px)}}
/* framework 与 legacy 题选项共用 class：correct=绿弹、wrong=红抖 */
.opt.correct,#legacy-chapter .opt.correct{animation:optPop .5s cubic-bezier(.3,1.4,.4,1)}
.opt.wrong,#legacy-chapter .opt.wrong{animation:optShake .3s ease}
/* 判题批改条滑入 */
.why-note.why-ok,.why-note.why-no,#legacy-chapter .why-note.why-ok,#legacy-chapter .why-note.why-no{animation:uiRise .32s cubic-bezier(.22,.9,.3,1)}
/* 结算战报出现 */
#legacy-chapter .settle-wrap{animation:uiPop .5s cubic-bezier(.3,1.4,.4,1)}
/* 选项悬停：上浮 + 箭头感（桌面） */
@media (hover:hover){
  #legacy-chapter .opt:not([data-lock]):hover{
    transform:translateY(-2px) scale(1.012);
    box-shadow:0 6px 14px rgba(0,0,0,.08);
  }
}
/* 已锁定题卡轻轻压平，提示“已作答” */
#legacy-chapter .quiz.done{animation:uiRise .45s both}
@media (prefers-reduced-motion:reduce){ #view .card,#legacy-honor .rank-step,#legacy-honor .hw-card,#legacy-honor .mh-card,#legacy-chapter .quiz{animation:none} }
/* ============================================================
   统一按压语言（chip 内容层）：页面可点元素 = Dock 底栏同款动效
   桌面：hover 上浮 + 阴影；触屏：按下高亮（无位移，iOS 语言）
   仅作用于页面内容区 #view（topbar/dock 自带动效，不受影响）
   ============================================================ */
@media (hover:hover){
  #view button:not(:disabled),
  #view .opt:not([data-lock]),
  #view .mh-card.lit{
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), filter .18s, background .18s, border-color .18s;
  }
  #view button:not(:disabled):hover,
  #view .opt:not([data-lock]):hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.07), 0 8px 20px rgba(0,0,0,.05);
  }
  #view button:not(:disabled):hover{
    filter:brightness(.985);
  }
  #view button:not(:disabled):active,
  #view .opt:not([data-lock]):active{
    transform:translateY(0) scale(.985);
    filter:brightness(.93);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  #view .mh-card.lit:active{
    transform:translateY(0) scale(.985);
    filter:brightness(.96);
  }
}
@media (hover:none){
  #view button:not(:disabled):active,
  #view .opt:not([data-lock]):active{
    filter:brightness(.85);
  }
  #view .mh-card.lit:active{
    filter:brightness(.9);
  }
}
/* 已锁定/不可点状态不参与按压 */
#view .opt[data-lock]{pointer-events:none}
#view button:disabled{pointer-events:none}

/* ============ topbar 左右按钮：Dock 三键同款丝滑动效 ============ */
#topbar .backbtn,#topbar .homebtn{
  transition:transform .24s var(--ease-spring), background .18s, box-shadow .2s, color .15s;
}
@media (hover:hover){
  #topbar .backbtn:hover,#topbar .homebtn:hover{
    transform:translateY(-2px) scale(1.06);
    background:var(--fill-soft);
    box-shadow:0 3px 8px rgba(0,0,0,.06);
    filter:none;
  }
  #topbar .backbtn:active,#topbar .homebtn:active{
    transform:translateY(0) scale(.97);
    filter:brightness(.92);
    box-shadow:none;
  }
}
@media (hover:none){
  #topbar .backbtn:active,#topbar .homebtn:active{
    background:var(--fill);
    transform:scale(.96);
    filter:none;
  }
}

/* 首页：导读人卡 与 下一站 之间留出呼吸间距 */
#view .hero-card{margin-top:26px}

/* 导读人卡：名字加大（照片头像） */
#view .tutor-card .tutor-name-big{font-size:22px;font-weight:800;letter-spacing:.3px;color:var(--ink);margin-top:1px;line-height:1.2}
#view .tutor-card .tutor-quote{margin-top:6px}
#view .tutor-card .tutor-photo{border-radius:16px}
@media (min-width:640px){ #view .tutor-card .tutor-name-big{font-size:24px} }
/* ============================================================
   章节讲义 · 整块移用自 chip.html.bak-ios（旧版原样观感）
   作用域隔离：#legacy-chapter 容器前缀，仅讲义页生效。
   容器内重定义旧纸感变量，保证排版与旧版一致，不影响外壳。
   ============================================================ */
#legacy-chapter{
  --bg:#FBF7EE; --ink:#2A2622; --ink2:#4A433C; --muted:#6B6158;
  --blue:#537D96; --blue2:#3F6179; --blue-bg:rgba(83,125,150,.08);
  --green:#4A6B4A; --red:#8B2C1F; --orange:#9D5F4D; --ochre:#8a6d1f;
  --line:#D8CFBE; --shadow:0 2px 12px rgba(80,70,50,.08);
  --card:#FFFFFF; --radius:14px;

/* ============================================================
   荣誉墙 · 整块移用自 chip.html.bak-ios（内容结构不变）
   v2 视觉重排（2026-09-05）：纸面展板容器 + 舒适间距/字号层级
   作用域：#legacy-honor（弹层 .mh-modal 共享变量）
   ============================================================ */
#legacy-honor,
.mh-modal{
  --ink:#2A2622; --ink2:#3F3A33; --muted:#8B8177;
  --blue:#3F6E8E; --blue-bg:rgba(63,110,142,.08);
  --green:#4E7A54; --red:#A44A3A; --ochre:#8a6d1f; --gold:#C8932A;
  --line:#E6DFD1; --card:#FFFFFF;
  --shadow:0 6px 20px rgba(64,54,38,.06);
}
/* 纸面展板：与讲义同一视觉语言，白卡浮在米纸上 */
#legacy-honor{
  background:linear-gradient(180deg,#FDFBF6 0%,#F5EFE2 100%);
  border:1px solid var(--sep);
  border-radius:24px;
  padding:20px 18px 2px;
  box-shadow:var(--sh-card);
}
#legacy-honor .card{
  background:rgba(255,255,255,.92);

  border-radius:18px;

  box-shadow:0 2px 10px rgba(64,54,38,.05);
}
#legacy-honor .card h3{
  font-size:15px; font-weight:800; letter-spacing:.3px;

#legacy-honor .card h3::before{

/* ---- 称号阶梯 ---- */
#legacy-honor .rank-stairs{

#legacy-honor .mh-era{font-size:12px; color:var(--muted); margin:3px 0 7px; line-height:1.5}
#legacy-honor .mh-quote{

#legacy-honor .mh-open{font-size:11.5px; color:#7A5A12; margin-top:8px; font-weight:700}

/* ============================================================
   学院壳公共 CSS 注入（唯一来源：design/对齐样张…体验版.html 之上追加）
   所有学院共用，禁止逐院改动；要改先改这里再全院重建。
   段：1 开始层  2 悬停v2  3 双层转场  4 圆角+导师卡  5 防缓存(在head)
   ============================================================ */

/* 1) 开始做题层（Duolingo 式 bottom sheet） */
#startSheet{position:fixed;inset:0;z-index:90;display:none}
#startSheet.show{display:block}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .28s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-card{
  position:absolute;left:0;right:0;bottom:-26px;margin:0 auto;max-width:560px;
  background:var(--card);border-radius:30px 30px 0 0;
  box-shadow:var(--sh-float);padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(120%);
   transition:transform .38s cubic-bezier(.33,1,.68,1);
  
  border-top:1px solid var(--sep);
  will-change:transform;
}
#startSheet.show .ss-card{animation:ssIn .62s cubic-bezier(.22,.8,.36,1) both}
@keyframes ssIn{0%{transform:translateY(120%)}60%{transform:translateY(-20px)}78%{transform:translateY(5px)}90%{transform:translateY(-2px)}100%{transform:translateY(0)}}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .32s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-grip{width:40px;height:4px;border-radius:2px;background:var(--fill);margin:0 auto 18px}
#startSheet .ss-kicker{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--accent)}
#startSheet .ss-title{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:4px;color:var(--ink)}
#startSheet .ss-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
#startSheet .ss-rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}
#startSheet .ss-row{display:flex;align-items:center;gap:11px;background:var(--bg);border-radius:14px;padding:11px 14px}
#startSheet .ss-row .ic{width:20px;height:20px;color:var(--accent);flex:none}
#startSheet .ss-row .ic svg{width:100%;height:100%}
#startSheet .ss-row b{font-size:15px;font-weight:600;color:var(--ink)}
#startSheet .ss-row span{font-size:13px;color:var(--muted)}
#startSheet .ss-start{
  width:100%;height:52px;margin-top:18px;border-radius:16px;border:none;
  background:var(--accent);color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;
  font-family:inherit;cursor:pointer;
  box-shadow:0 6px 18px var(--accent-soft);transition:filter .18s var(--ease);
}
#startSheet .ss-start:hover{filter:brightness(.94)}
@media (hover:none){ #startSheet .ss-start:active{filter:brightness(.85)} }
#startSheet .ss-cancel{width:100%;height:44px;margin-top:8px;border:none;background:transparent;
  color:var(--muted);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:12px}
@media (hover:none){ #startSheet .ss-cancel:active{background:var(--fill-soft)} }
@media (min-width:640px){ #startSheet .ss-card{border-radius:30px;bottom:14px;padding-bottom:20px} }

/* 2) 悬停语言 v2（Dock 款：上浮+微 scale+阴影，鼠哥 2026-09-04 定稿）
   只对可点元素生效：ch-row/grow 必须带 data-go* 才有点击语义；不可点静态行一律无 hover */
.ch-row{transition:transform .2s var(--ease),background .16s var(--ease)}
.ch-row[data-go],.ch-row[data-go-ch],.ch-row[data-go-drill],.ch-row[data-go-exam]{cursor:pointer}
.ch-row[data-go]{cursor:pointer}
.grow{cursor:default}
.grow[data-go]{cursor:pointer}
@media (hover:hover){
  .dock-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .dock-btn:hover{transform:translateY(-6px) scale(1.09)}
  .lift{cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s var(--ease),color .18s,background .18s}
  .lift:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 6px 14px rgba(0,0,0,.05),0 12px 30px rgba(0,0,0,.1)}
  .lift:active{transform:translateY(0) scale(1);filter:brightness(.97)}
  .ch-row[data-go]:hover,.ch-row[data-go-ch]:hover,.ch-row[data-go-drill]:hover,.ch-row[data-go-exam]:hover{transform:translateY(-1px);background:var(--fill-soft)}
  .grow[data-go]:hover,.grow[data-wipe]:hover{background:var(--fill-soft)}
  .opt{transition:border-color .18s var(--ease),background .18s}
  .opt:hover{border-color:var(--sep-strong,var(--sep))}
  /* 小按钮：与底栏 Dock 同款（上浮 + 微放大 + 强调色 + 圆底） */
  .mini-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .mini-btn:hover{transform:translateY(-6px) scale(1.09);color:var(--accent);background:var(--fill-soft)}
}

   "p": "两个同方向、同频率的简谐振动可以写成 x1 = A1 cos(ωt + φ1)、x2 = A2 cos(ωt + φ2)。直接代入三角恒等式去加很麻烦，但有一个几何捷径：由于两者频率相同，「你转我也转，我落后你多少始终不变」，于是可以把每个振动看成一支以角速度 ω 匀速旋转的矢量（旋转矢量），矢量长度等于振幅，初始与 x 轴的夹角等于初相。两个矢量同步旋转，它们的夹角 Δφ = φ2 - φ1 保持恒定，合矢量就是平行四边形的对角线，且同样以 ω 旋转。合振动仍是同频率的简谐振动，振幅由余弦定理给出。",

function parseMath(s){
  if(s===undefined||s===null) return '';
  return esc(s).replace(/\*\*/g,'^').replace(/(^|[^*])\*([^*]|$)/g,'$1·$2');
}
function numEq(a,b){
  function val(x){
    if(typeof x==='number') return x;
    var s=String(x).replace(/×/g,'*').replace(/√/g,'Math.sqrt(').replace(/π/g,'Math.PI').trim();
    if(/[a-zA-Z]/.test(s.replace(/Math\./g,''))) return NaN;
    try{ return eval(s); }catch(e){ return NaN; }
  }
  var A=val(a),B=val(b);
  if(isNaN(A)||isNaN(B)) return String(a).replace(/\s/g,'').toLowerCase()===String(b).replace(/\s/g,'').toLowerCase();
  return Math.abs(A-B)<1e-6;
}

function quizCardsHTML(c,mode){
  var isLesson=mode!=='drill';
  var h='';
  (c.quiz||[]).forEach(function(q,qi){
    var k=c.id+'_'+qi;
    var hist=(isLesson)?(quizStat[k]):undefined;
    var done=hist!==undefined;
    var pv=quizPick[k];
    h+='<div class="quiz'+(done?' done':'')+'" data-k="'+k+'">'
      +'<div class="q"><span class="qn">Q'+(qi+1)+'</span>'+(done?'<span class="hall-done-tag">✓ 已做</span>':'')+parseMath(q.q)+'</div>';
    if(q.type==='fill'){
      h+='<div class="fillrow"><input id="fin'+qi+'" data-fill="'+qi+'" placeholder="输入答案"'+(done&&pv!==undefined?' value="'+esc(pv)+'" disabled':'')+'><button data-fillgo="'+qi+'"'+(done?' disabled':'')+'>批改</button></div>';
    } else {
      h+='<div class="opts" id="qbox'+qi+'">';
      ['A','B','C','D'].slice(0,(q.options||[]).length).forEach(function(k2,i){
        var cls='opt';
        if(done){
          cls+=' lock';
          if(hist===1){ if(i===q.answer) cls+=' correct'; }
          else { if(i===pv&&i!==q.answer) cls+=' wrong'; if(i===q.answer) cls+=' correct muted'; }
        }
        h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'" data-o="'+i+'"'+(done?' data-lock="1"':'')+'>'+k2+'. '+parseMath(q.options[i])+'<span class="mark" style="display:none"></span></div>';
      });
      h+='</div>';
    }
    h+='<div class="why-note'+(hist===1?' why-ok':(hist===0?' why-no':''))+'" id="whyNote'+qi+'">';
    if(hist===1) h+='<div class="why-body"><span class="why-ic"></span><span><b>上次答对了。</b>'+esc(q.explain||'')+'</span></div>';
    else if(hist===0) h+='<div class="why-body"><span class="why-ic"></span><span><b>上次答错，正确答案已标出：</b>'+esc(q.explain||'')+'</span></div>'+(q.type==='code'?'<button class="retry-btn" data-retry="'+qi+'">↻ 重新作答</button>':'');
    h+='</div></div>';
  });
  return h;
}

function poolKeyInfo(k){
  var p=String(k).split('_');

  var c=chById(+p[0]);
  if(!c||!c.quiz) return k;
  var q=c.quiz[+p[1]];
  return '第 '+c.id+' 章 · '+(q?q.q:'Q'+(+p[1]+1));
}

renderers.stats=function(){
  var s=calcStats(), streak=calcStreak(), rk=curRank(s.pct);
  var tq=(stat&&stat.totalQ)?stat.totalQ:0, tc=(stat&&stat.totalCorrect)?stat.totalCorrect:0;
  var bd=badgeState(s), gotN=bd.filter(function(b){return b.got;}).length;
  var acc = tq ? Math.round(tc/tq*100) : 0;
  var pct=s.pct;
  /* 当前档与下一档（进度条刻度） */
  var curAt=0, nextAt=rk.nextAt, curName=rk.name, nextName=rk.next;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ curAt=RANKS[i][0]; curName=RANKS[i][1]; } }
  var span=(nextAt!==null&&nextAt!==undefined)?(nextAt-curAt):1;
  var innerPct=Math.max(0,Math.min(1,(pct-curAt)/span));
  /* 荣誉调色板（随档位轮换） */
  var PALS=[
    ['linear-gradient(135deg,#0A84FF,#5E5CE6)','#0A84FF'],
    ['linear-gradient(135deg,#FF9F0A,#FF7A00)','#FF9F0A'],
    ['linear-gradient(135deg,#FF453A,#D70015)','#FF453A'],
    ['linear-gradient(135deg,#34C759,#28A745)','#34C759'],
    ['linear-gradient(135deg,#AF52DE,#7D2AE0)','#AF52DE'],
    ['linear-gradient(135deg,#FFD60A,#FF9500)','#FF9500']
  ];
  var idx=0; for(var pi=0;pi<RANKS.length;pi++){ if(pct>=RANKS[pi][0]) idx=pi; }
  var pal=PALS[(idx+1)%PALS.length];
  var C=pal[1], Cg=pal[0];
  /* 进度环（SVG） */
  var R=54, CIRC=2*Math.PI*R;
  var ring='<div style="position:relative;width:132px;height:132px;flex:none">'
    +'<svg width="132" height="132" viewBox="0 0 132 132" style="transform:rotate(-90deg)">'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="var(--fill)" stroke-width="10"/>'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+C+'" stroke-width="10" stroke-linecap="round" '
    +'stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC*(1-pct/100)+'" style="transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)"/>'
    +'</svg>'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<b style="font-size:26px;color:var(--ink);line-height:1">'+pct+'<span style="font-size:14px">%</span></b>'
    +'<span class="cap" style="margin-top:2px">总进度</span></div></div>';
  var h='<div class="kick">OVERVIEW</div><div class="h1">进度总览</div>'
    +'<div class="sub">'+rk.name+' · 距「'+(rk.next||'满级')+'」还差 '+(rk.nextAt!==null&&rk.nextAt!==undefined?rk.nextAt-pct:'0')+'%</div>';
  /* 称号横幅 */
  h+='<div style="border-radius:24px;padding:20px;color:#fff;background:'+Cg+';box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden">'
    +'<div style="position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)"></div>'
    +'<div style="position:absolute;right:30px;bottom:-50px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)"></div>'
    +'<div style="width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;backdrop-filter:blur(4px)">'
    +(idx===0?'🌱':idx>=RANKS.length-2?'👑':'🏆')+'</div>'
    +'<div style="flex:1;min-width:0;position:relative;z-index:1">'
    +'<div style="font-size:11px;font-weight:800;letter-spacing:1.6px;opacity:.85">CURRENT RANK</div>'
    +'<b style="font-size:21px;display:block;margin-top:2px">'+curName+'</b>'
    +'<div style="height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:9px;overflow:hidden">'
    +'<i style="display:block;height:100%;width:'+Math.round(innerPct*100)+'%;background:#fff;border-radius:3px;transition:width .8s"></i></div>'
    +'<div style="font-size:11.5px;opacity:.9;margin-top:5px;display:flex;justify-content:space-between"><span>'+curAt+'%</span><span>'+(rk.next||'满级')+' · '+(nextAt!==null&&nextAt!==undefined?nextAt+'%':'MAX')+'</span></div>'
    +'</div></div>';
  /* 中央行：进度环 + 今日/连签 */
  h+='<div style="display:flex;align-items:center;gap:18px;margin-top:14px">'
    +ring
    +'<div style="flex:1;display:grid;grid-template-columns:1fr;gap:8px">'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🔥</span><div><b style="font-size:15px;display:block">'+streak+' 天</b><span class="cap">连续打卡</span></div></div>'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🎯</span><div><b style="font-size:15px;display:block">'+acc+'%</b><span class="cap">答题正确率</span></div></div>'
    +'</div></div>';
  /* 数据六宫格 */
  var D=[
    {ico:'📖',v:s.doneC+'/'+s.totalC,l:'已学章节'},
    {ico:'📝',v:s.examFull+'/'+s.examTotal,l:'小卷已做'},
    {ico:'🧮',v:tq,l:'累计答题'+(tc?'':'')},
    {ico:'✍️',v:tc,l:'累计答对'},
    {ico:'🎖️',v:gotN+'/'+bd.length,l:'徽章解锁'},
    {ico:'🧹',v:s.wrongPool,l:'待订正错题'}
  ];
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">';
  D.forEach(function(d){
    h+='<div style="background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh-card);border:1px solid var(--sep)">'
      +'<div style="font-size:20px;line-height:1">'+d.ico+'</div>'
      +'<b style="font-size:17px;display:block;margin-top:5px">'+d.v+'</b>'
      +'<span class="cap" style="display:block;margin-top:2px">'+d.l+'</span></div>';
  });
  h+='</div>';
  return h;
};

/* 实验室画布（移植自旧引擎） */
function drawDope(){
  var cv = document.getElementById('cvDope'); if(!cv || !cv.getContext) return;
  var c = cv.getContext('2d'); var d = +document.getElementById('dopeS').value;
  c.clearRect(0,0,cv.width,cv.height);
  var x=40, y=50, w=cv.width-80, h=80; var g=d/10;
  c.fillStyle='rgb('+Math.round(25+200*g)+','+Math.round(70+150*g)+','+Math.round(100+110*g)+')';
  c.fillRect(x,y,w,h); c.strokeStyle='#3fb950'; c.strokeRect(x,y,w,h);
  var n=Math.round(d*9);
  for(var i=0;i<n;i++){ var px=x+22+((i*137)%(w-44)), py=y+14+((i*61)%(h-28));
    c.fillStyle='#8affc1'; c.beginPath(); c.arc(px,py,3,0,7); c.fill(); }
  var label = d===0?'纯硅：绝缘体（电流被挡住）': d<4?'轻掺杂：半导体（电流开始流动）': d<8?'中等掺杂：导电性大增':'重掺杂：接近导体（但失去开关能力）';
  c.fillStyle='#d8e1ea'; c.font='15px sans-serif'; c.fillText(label, x, y-14);
  c.fillStyle='#7d8896'; c.font='12px sans-serif'; c.fillText('掺杂（doping）：向硅里掺入杂质，改变导电性', x, y+h+28);
  var st=document.getElementById('stDope');
  st.textContent = d===0?'硅像玻璃一样堵住电流——半导体平时是「断」的。': d<4?'掺入杂质后电流能流动了：材料从「死」变「可控」。': d<8?'导电性大增——但别太重，太重就变导体了。':'重掺杂让硅几乎成了导体，但也失去了「开关」能力——开关需要可控，不是全通。';
}

function drawLitho(){
  var cv=document.getElementById('cvLitho'); if(!cv || !cv.getContext) return;
  var c=cv.getContext('2d'); var t=+document.getElementById('lithoS').value;
  c.clearRect(0,0,cv.width,cv.height);
  c.fillStyle='#537D96'; c.fillRect(40,30,210,140);
  c.fillStyle='#FBF7EE'; c.fillRect(80,55,55,35); c.fillRect(155,90,60,45);
  c.fillStyle='#d8e1ea'; c.font='13px sans-serif'; c.fillText('掩模（不透光，开窗透光）', 40, 188);
  c.fillStyle='#e3b341';
  for(var i=0;i<6;i++){ var ax=265, ay=45+i*22; c.beginPath(); c.moveTo(ax,ay); c.lineTo(ax+46,ay); c.lineTo(ax+36,ay-5); c.moveTo(ax+46,ay); c.lineTo(ax+36,ay+5); c.fill(); }
  c.fillStyle='#d8e1ea'; c.font='12px sans-serif'; c.fillText('光', 280, 14);
  var x=360,y=30,w=240,h=140;
  c.fillStyle='#1a212b'; c.fillRect(x,y,w,h);
  var ex=t/100;
  c.fillStyle='rgba(227,179,65,'+(0.25+0.65*ex)+')'; c.fillRect(x,y,w*ex,h);
  c.strokeStyle='#3fb950'; c.strokeRect(x,y,w,h);
  c.fillStyle='#d8e1ea'; c.font='13px sans-serif'; c.fillText('晶圆 + 光刻胶（左→右曝光）', x, y+h+22);
  var st=document.getElementById('stLitho');
  st.textContent = t<30?'光刚照上，光刻胶还没反应。': t<70?'曝光区光刻胶开始变性：光正在把掩模的图案「印」上晶圆。':'显影完成！被光照到的胶溶解，掩模图案转移到了晶圆上——photolithography，用光印刷。';
}

function drawYield(){
  var cv=document.getElementById('cvYield'); if(!cv || !cv.getContext) return;
  var c=cv.getContext('2d'); var dust=+document.getElementById('yieldS').value;
  c.clearRect(0,0,cv.width,cv.height);
  var cx=cv.width/2, cy=cv.height/2+5, R=135;
  c.fillStyle='#1a212b'; c.beginPath(); c.arc(cx,cy,R,0,7); c.fill();
  c.strokeStyle='#2b3440'; c.stroke();
  var n=5, cell=R*1.85/n, dead=0, total=n*n;
  for(var i=0;i<n;i++) for(var j=0;j<n;j++){
    var px=cx-R*0.92+i*cell, py=cy-R*0.92+j*cell;
    var hit = Math.random() < (dust/100)*(0.5+0.5*Math.random());
    if(hit) dead++;
    c.fillStyle = hit ? '#f85149' : '#3fb950';
    c.fillRect(px+2,py+2,cell-4,cell-4);
  }
  var yp=Math.round((total-dead)/total*100);
  c.fillStyle='#d8e1ea'; c.font='16px sans-serif'; c.fillText('良率 '+(total-dead)+'/'+total+' = '+yp+'%', cx-80, cy+R+28);
  var st=document.getElementById('stYield');
  st.textContent = dust<20?'晶圆很干净，芯片大多存活。': dust<50?'灰尘开始砸中芯片——一粒灰毁一颗芯。': '看这堆红色坏片：这就是为什么芯片厂的无尘室比手术室还干净，也是良率决定芯片成本的原因。';
}

function drawMoore(){
  var cv=document.getElementById('cvMoore'); if(!cv || !cv.getContext) return;
  var c=cv.getContext('2d'); var yr=+document.getElementById('mooreS').value;
  c.clearRect(0,0,cv.width,cv.height);
  var x0=50,y0=cv.height-36,w=cv.width-70,h=cv.height-66;
  c.strokeStyle='#2b3440'; c.strokeRect(x0,y0-h,w,h);
  c.fillStyle='#7d8896'; c.font='12px sans-serif';
  c.fillText('1965', x0, y0+16); c.fillText('2020', x0+w-30, y0+16);
  c.fillText('晶体管数（对数刻度）', x0, 14);
  var MAXLOG=Math.log10(Math.pow(2,27.5));
  c.strokeStyle='#3fb950'; c.lineWidth=2; c.beginPath();
  for(var x=0;x<=w;x++){
    var yy=1965+x/w*(2020-1965);
    var logv=Math.log10(Math.pow(2,(yy-1965)/2))/MAXLOG;
    var px=x0+x, py=y0-logv*h;
    if(x===0) c.moveTo(px,py); else c.lineTo(px,py);
  }
  c.stroke();
  var v=Math.pow(2,(yr-1965)/2), log2=Math.log10(v)/MAXLOG;
  var px2=x0+(yr-1965)/(2020-1965)*w, py2=y0-log2*h;
  c.fillStyle='#e3b341'; c.beginPath(); c.arc(px2,py2,6,0,7); c.fill();
  c.fillStyle='#d8e1ea'; c.font='14px sans-serif';
  var txt = yr+' 年 ≈ '+ (v>=1e9?(v/1e9).toFixed(1)+'B': v>=1e6?(v/1e6).toFixed(1)+'M': v>=1e3?(v/1e3).toFixed(1)+'K': v.toFixed(0)) +' 个晶体管';
  c.fillText(txt, x0, y0-h-10);
  var st=document.getElementById('stMoore');
  st.textContent = '摩尔定律：元件数约每两年翻一倍。指数增长在头几年不起眼，后来越来越陡——1965 年的预测，跑了半个世纪。';
}

/* toast 单例化：同一时刻只保留一条提示，新提示立即顶掉旧条（鼠哥 2026-09-04） */
function toast(msg, type){
  var box=document.getElementById('toastBox');
  if(!box) return;
  while(box.firstChild) box.removeChild(box.firstChild);
  var isOk = type==='ok' || (msg && msg.indexOf('✓')===0 && typeof type==='undefined');
  var el=document.createElement('div');
  if(isOk){
    el.className='toast ok';
    el.innerHTML='<span class="tk">✓</span><span class="tt">'+msg.replace(/^✓\s*/,'')+'</span>';
    /* 星星粒子（多邻国式欢庆） */
    var P=['★','✦','✓','+1','⭐'];
    var colors=['#FFD900','#FF9600','#FF4D4D','#58CC02','#2B8AFF'];
    for(var i=0;i<8;i++){
      var sp=document.createElement('span');
      sp.className='spark';
      sp.textContent=P[Math.floor(Math.random()*P.length)];
      var a=Math.random()*Math.PI*2, dist=44+Math.random()*52;
      var dx=Math.cos(a)*dist, dy=Math.sin(a)*dist-18;
      sp.style.setProperty('--dx',dx.toFixed(0)+'px');
      sp.style.setProperty('--dy',dy.toFixed(0)+'px');
      sp.style.background='none';
      sp.style.color=colors[Math.floor(Math.random()*colors.length)];
      sp.style.animationDelay=(Math.random()*0.12)+'s';
      el.appendChild(sp);
    }
  } else {
    el.className = type==='no' ? 'toast no' : 'toast';
    el.innerHTML='<span class="ic t-ic">'+(type==='no'?'✕':'✓')+'</span><span>'+msg+'</span>';
  }
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },320); }, isOk?1900:2200);
}

    var o = {}, a = local[k] || {}, b = cloud[k] || {};
    if(typeof a !== 'object') a = {}; if(typeof b !== 'object') b = {};
    Object.keys(a).forEach(function(x){ o[x] = a[x]; }); Object.keys(b).forEach(function(x){ o[x] = b[x]; });
    out[k] = o;
  });
  /* 每日打卡（daily_goal 中本 app 的日期集合）取并集 */
  var dgo = {};
  var dga = (typeof local['dg'] === 'object' && local['dg']) ? local['dg'] : {};
  var dgb = (typeof cloud['dg'] === 'object' && cloud['dg']) ? cloud['dg'] : {};
  Object.keys(dga).forEach(function(d){ dgo[d] = 1; });
  Object.keys(dgb).forEach(function(d){ dgo[d] = 1; });
  out['dg'] = dgo;
  return out;
}
function sbApplyLocal(m){
  try{
    if(m.ch){ chDone = m.ch; store('ch', chDone); }
    if(m.hall){ hallDone = m.hall; store('hall', hallDone); }
    if(m.wrong){ wrongPool = m.wrong; store('wrong', wrongPool); }
    if(m.fixed){ fixedPool = m.fixed; store('fixed', fixedPool); }
    if(m.quizStat){ quizStat = m.quizStat; store('quizStat', quizStat); }
    if(m.quizPick){ quizPick = m.quizPick; store('quizPick', quizPick); }
    if(m.settle){ settleStore = m.settle; store('settle', settleStore); }
    if(m.tstat){ todayStat = m.tstat; store('tstat', todayStat); }
    if(m.dg && typeof m.dg === 'object'){
      try{
        var g2 = JSON.parse(localStorage.getItem('daily_goal') || '{}'), chg = false;
        Object.keys(m.dg).forEach(function(d){
          if(!g2[d]) g2[d] = {};
          if(!g2[d][SB_APP]){ g2[d][SB_APP] = { l: Date.now() }; chg = true; }
        });
        if(chg) localStorage.setItem('daily_goal', JSON.stringify(g2));
      }catch(e2){}
    }
  }catch(e){}
}
function sbCloudData(d){ return (d && d.data && d.data[SB_APP]) ? d.data[SB_APP] : null; }

/* ---------- 拉取并合并云端（打开学院 / 手动同步） ---------- */
async function sbSyncFromCloud(silent){
  var s = sbSession(); if(!s || !s.user){ if(!silent) toast('未登录，去总院登录后可云同步'); return false; }
  if(!(await sbEnsureToken())){ if(!silent) toast('登录已失效，请去总院重新登录'); return false; }
  var h = sbAuthHeaders(); if(!h) return false;
  if(!silent) toast('正在同步并合并两端进度…');
  try{
    var r = await fetch(SB_URL + '/rest/v1/progress?select=data&user_id=eq.' + s.user.id, { headers: h });
    var rows = await r.json();
    var d = sbCloudData(rows && rows.length ? rows[0] : null);
    if(d){
      var merged = sbMerge(sbPack(), d);
      sbApplyLocal(merged);
      if(!silent) toast('✅ 已合并云端进度（取并集，不丢数据）');
    } else if(!silent) {
      toast('云端暂无记录，本次先上传');
    }
    await sbPush(true);
    try{ if(window._cur === 'mine' || window._cur === 'home' || window._cur === 'hall'){ doRenderView(window._cur, true); } }catch(e){}
    return true;
  }catch(e){ if(!silent) toast('云端同步失败，请检查网络'); return false; }
}

/* ---------- 推送（防抖 2s；推送前合并云端最新防覆盖） ---------- */
var sbTimer = null;
async function sbPush(immediate){
  var s = sbSession(); if(!s) return;
  if(!immediate){ clearTimeout(sbTimer); sbTimer = setTimeout(function(){ sbPush(true); }, 2000); return; }
  if(!(await sbEnsureToken())) return;
  try{
    var h = sbAuthHeaders(); if(!h) return;
    var r = await fetch(SB_URL + '/rest/v1/progress?select=data&user_id=eq.' + s.user.id, { headers: h });
    var rows = await r.json();
    var row = rows && rows.length ? rows[0] : null;
    var data2 = (row && row.data && typeof row.data === 'object') ? row.data : {};
    var cloudD = sbCloudData(row);
    var calc = sbPack();
    if(cloudD){ var merged = sbMerge(calc, cloudD); sbApplyLocal(merged); data2[SB_APP] = merged; }
    else { data2[SB_APP] = calc; }
    var hh = Object.assign({}, h, { 'Prefer': 'resolution=merge-duplicates' });
    if(row){
      await fetch(SB_URL + '/rest/v1/progress?user_id=eq.' + s.user.id, { method: 'PATCH', headers: h, body: JSON.stringify({ data: data2 }) });
    } else {
      await fetch(SB_URL + '/rest/v1/progress', { method: 'POST', headers: hh, body: JSON.stringify({ user_id: s.user.id, data: data2 }) });
    }
    sbPushRank();
  }catch(e){}
}
function sbNotify(){ try{ if(sbSession()) sbPush(false); }catch(e){} }

/* ---------- 排行榜推送（app=chip） ---------- */
function sbPushRank(){
  try{
    var s = sbSession(); if(!s || !s.user) return;
    var st = calcStats(), p = sbProfile(); if(!p) return;
    var rk = curRank(st.pct);
    var h = sbAuthHeaders(); if(!h) return;
    var hh = Object.assign({}, h, { 'Prefer': 'resolution=merge-duplicates' });
    var rb = { user_id: s.user.id, app: SB_APP, username: p.username || '同学', avatar: p.avatar || '🐹', pct: st.pct, done: st.doneC, lessons: st.doneC, rank_name: rk.name, updated_at: new Date().toISOString() };
    fetch(SB_URL + '/rest/v1/leaderboard', { method: 'POST', headers: hh, body: JSON.stringify(rb) }).catch(function(){});
  }catch(e){}
}

/* ---------- 清云端（本院命名空间，供清除记录联动） ---------- */
function sbClearCloud(done){
  try{
    var s = sbSession(); if(!s || !s.user){ if(typeof done === 'function') done(); return; }
    sbEnsureToken().then(function(ok){
      if(!ok){ if(typeof done === 'function') done(); return; }
      var h = sbAuthHeaders(); if(!h){ if(typeof done === 'function') done(); return; }
      fetch(SB_URL + '/rest/v1/progress?select=data&user_id=eq.' + s.user.id, { headers: h })
        .then(function(r){ return r.json(); })
        .then(function(rows){
          var data = (rows && rows.length && rows[0].data && typeof rows[0].data === 'object') ? rows[0].data : {};
          if(data[SB_APP]) delete data[SB_APP];
          if(rows && rows.length) return fetch(SB_URL + '/rest/v1/progress?user_id=eq.' + s.user.id, { method: 'PATCH', headers: h, body: JSON.stringify({ data: data }) });
          return null;
        })
        .then(function(){
          var h2 = sbAuthHeaders();
          if(h2) fetch(SB_URL + '/rest/v1/leaderboard?user_id=eq.' + s.user.id + '&app=eq.' + SB_APP, { method: 'DELETE', headers: h2 }).catch(function(){});
          if(typeof done === 'function') done();
        })
        .catch(function(){ if(typeof done === 'function') done(); });
    });
  }catch(e){ if(typeof done === 'function') done(); }
}

function sbSaveProfile(upd, cb){
  var s=sbSession(); if(!s||!s.user){ toast('未登录'); if(cb) cb(false); return; }
  sbEnsureToken().then(function(ok){
    if(!ok){ toast('登录已失效，请重新登录'); if(cb) cb(false); return; }
    var h=sbAuthHeaders(); if(!h) return;
    var body={};
    if(upd.username!==undefined) body.username=upd.username;
    if(upd.avatar!==undefined) body.avatar=upd.avatar;
    /* 先确保云端有 profile 行（老账号可能没有，直接 PATCH 打空枪） */
    fetch(SB_URL+'/rest/v1/profiles?select=user_id&user_id=eq.'+s.user.id, { headers:h })
      .then(function(r){ return r.json(); })
      .then(function(rows){
        var has = rows && rows.length;
        var hh = Object.assign({}, h, { 'Prefer':'return=minimal' });
        if(has) return fetch(SB_URL+'/rest/v1/profiles?user_id=eq.'+s.user.id, { method:'PATCH', headers:h, body: JSON.stringify(body) });
        var p2 = JSON.parse(JSON.stringify(body)); p2.user_id=s.user.id;
        return fetch(SB_URL+'/rest/v1/profiles', { method:'POST', headers:hh, body: JSON.stringify(p2) });
      })
      .then(function(rr){
        if(rr && !rr.ok && rr.status!==204) throw new Error('HTTP'+rr.status);
        var p=sbProfile()||{};
        if(upd.username!==undefined) p.username=upd.username;
        if(upd.avatar!==undefined) p.avatar=upd.avatar;
        p.user_id=s.user.id;
        try{ localStorage.setItem('acad_profile', JSON.stringify(p)); }catch(e){}
        toast('✅ 已保存');
        sbPushRank();
        sbRefreshMine();
        if(cb) cb(true);
      })
      .catch(function(){ toast('保存失败（昵称可能已被占用）'); if(cb) cb(false); });
  });
}

    +'<textarea id="fbText" rows="5" placeholder="写下你的意见、建议或遇到的 Bug…" style="width:100%;box-sizing:border-box;border:1.5px solid var(--sep);border-radius:14px;padding:12px 14px;font:14.5px/1.8 inherit;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical"></textarea>'
    +'<button class="btn-go" id="fbSend" style="width:100%;justify-content:center;margin-top:12px">发送反馈</button></div>';
  return h;
};
function sendFeedback(){
  var u2=(typeof sbUser==='function')?sbUser():null;
  if(!u2){ toast('请先登录再反馈'); return; }
  var el=document.getElementById('fbText');
  var c=(el&&el.value||'').trim();
  if(!c){ toast('先写下你的意见'); return; }
  var h=sbAuthHeaders(); if(!h){ toast('登录已失效，请去总院重新登录'); return; }
  var hh=Object.assign({}, h, { 'Prefer': 'return=minimal' });
  fetch(SB_URL+'/rest/v1/feedback', { method:'POST', headers: hh, body: JSON.stringify({ user_id: u2.id, username: u2.nick, avatar: u2.avatar, content: c, app: SB_APP }) })
    .then(function(r){ if(r.ok){ toast('✅ 已发送，感谢反馈！'); if(el) el.value=''; } else { toast('发送失败，请稍后再试'); } })
    .catch(function(){ toast('发送失败，请检查网络'); });
}
scroller.addEventListener('click', function(ev){
  var fb=ev.target.closest('#fbSend');
  if(fb){ tap(); sendFeedback(); }
});

/* ---------- 讨论区（app=chip · feedback 表承载，content 以 [讨论] 前缀区分） ---------- */
var BD_TAG = '[讨论] ';
renderers.board=function(){
  var u=sbUser?sbUser():null;
  var h='<div class="kick">BOARD</div><div class="h1">讨论区</div>'
    +'<div class="sub">同学间说说话 · 分享进度与心得（登录后发言）</div>';
  if(!u){
    h+='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:30px 20px">'
      +'<span style="font-size:40px">💬</span><div class="h2" style="margin-top:10px">登录后参与讨论</div>'
      +'<div class="cap" style="margin-top:6px;line-height:1.7">先去总院登录一次，就能在这和大家聊天了。</div>'
      +'<div style="margin-top:14px"><a href="' + SB_PORTAL + '" class="btn-go" style="text-decoration:none;display:inline-flex">去总院登录</a></div></div>';
    return h;
  }
  h+='<div style="display:flex;gap:8px;margin-bottom:12px">'
    +'<input id="bdText" placeholder="说点什么…（按 Enter 发送）" style="flex:1;border:1.5px solid var(--sep);border-radius:14px;padding:12px 14px;font:15px inherit;font-family:inherit;background:var(--card);color:var(--ink)">'
    +'<button id="bdSend" style="flex:none;border:none;border-radius:14px;background:var(--accent);color:#fff;padding:0 22px;font:600 14px inherit;font-family:inherit;cursor:pointer">发送</button></div>'
    +'<div id="boardList"><div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载中…</div></div>';
  setTimeout(function(){ bdLoad(); }, 60);
  return h;
};
function bdLoad(){
  var list=document.getElementById('boardList'); if(!list) return;
  list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载中…</div>';
  fetch(SB_URL+'/rest/v1/feedback?select=user_id,username,avatar,content,created_at&app=eq.'+SB_APP+'&order=created_at.desc&limit=60', { headers: sbAuthHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){ bdPaint(rows||[]); })
    .catch(function(){ list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载失败，请检查网络</div>'; });
}
function bdPaint(rows){
  var list=document.getElementById('boardList'); if(!list) return;
  var mine=(sbUser?sbUser():{id:''}).id;
  var items=rows.filter(function(x){ return x && x.content && x.content.indexOf(BD_TAG)===0; });
  if(!items.length){
    list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:30px"><span style="font-size:36px">💬</span><div class="cap" style="margin-top:8px">还没有人发言，来抢沙发！</div></div>';
    return;
  }
  var html='';
  items.forEach(function(x){
    var t=new Date(x.created_at);
    var p=function(n){return (n<10?'0':'')+n;};
    var isMe=(mine && x.user_id===mine);
    html+='<div class="card" style="border-radius:var(--r-l);padding:14px 16px;margin-bottom:10px;border-color:'+(isMe?'var(--accent)':'var(--sep)')+'">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
      +'<span style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff">'+esc(x.avatar||'🐹')+'</span>'
      +'<b style="font-size:13.5px">'+esc(x.username||'同学')+(isMe?'<span style="color:var(--accent);font-size:11px;margin-left:5px">我</span>':'')+'</b>'
      +'<span style="font-size:11px;color:var(--muted)">'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes())+'</span></div>'
      +'<div style="font-size:14.5px;color:var(--ink2);line-height:1.7;white-space:pre-wrap;word-break:break-word">'+esc(x.content.slice(BD_TAG.length))+'</div></div>';
  });
  list.innerHTML=html;
}
function bdSend(){
  var u=(typeof sbUser==='function')?sbUser():null;
  if(!u){ toast('登录后才能发言'); return; }
  var el=document.getElementById('bdText');
  var v=(el&&el.value||'').trim();
  if(!v){ toast('先写点什么'); return; }
  var h=sbAuthHeaders(); if(!h){ toast('登录已失效'); return; }
  var hh=Object.assign({}, h, { 'Prefer': 'return=minimal' });
  fetch(SB_URL+'/rest/v1/feedback', { method:'POST', headers: hh, body: JSON.stringify({ user_id: u.id, username: u.nick, avatar: u.avatar, content: BD_TAG + v, app: SB_APP }) })
    .then(function(r){ if(r.ok){ if(el) el.value=''; bdLoad(); } else { toast('发送失败，稍后再试'); } })
    .catch(function(){ toast('发送失败，请检查网络'); });
}
scroller.addEventListener('click', function(ev){
  var bd=ev.target.closest('#bdSend');
  if(bd){ tap(); bdSend(); }
});
var bdInp=null;
scroller.addEventListener('keydown', function(ev){
  if(ev.target && ev.target.id==='bdText' && ev.key==='Enter'){ ev.preventDefault(); bdSend(); }
});

/* ---------- 启动：恢复登录态并拉取合并 ---------- */
function cloudInit(){
  if(!sbSession()) return;
  try{
    sbSyncFromCloud(true).then(function(){ sbPushRank(); }).catch(function(){});
  }catch(e){}
  /* 回前台静默同步 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && sbSession()){ try{ sbSyncFromCloud(true); }catch(e){} }
  });
}

/* 启动即同步（登录态来自总院共享会话） */
try{ cloudInit(); }catch(_e){}
