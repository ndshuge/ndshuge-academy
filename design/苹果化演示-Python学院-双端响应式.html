<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 学院 · Apple 化演示（macOS / iOS 双形态）</title>
<style>
/* ============================================================
   设计令牌 Design Tokens
   双端共享底层血脉，数值分化。8px 网格。
   字体栈带 Windows 回退（-apple-system / SF 只在 Apple 平台存在，
   回退链末尾必须有 Segoe UI Variable，否则 Windows 上观感崩）
   ============================================================ */
:root{
  /* 主色：Apple systemBlue */
  --accent:#007AFF;
  --accent-press:#0060DF;
  --accent-soft:rgba(0,122,255,.12);

  /* systemGray 灰阶（浅色） */
  --bg:#F5F5F7;            /* 桌面内容区底 */
  --bg-deep:#000000;       /* 移动深色底 */
  --card:#FFFFFF;
  --card2:#F2F2F7;         /* 分组表底 / 侧栏输入底 */
  --ink:#1D1D1F;
  --ink2:#3C3C43;          /* 次级文字（Apple 用透明度，这里给实色保证对比） */
  --muted:#86868B;
  --sep:rgba(60,60,67,.12);
  --sep-strong:rgba(60,60,67,.22);
  --sidebar-blur:rgba(246,246,248,.72);
  --tabbar-blur:rgba(250,250,252,.8);
  --glass-line:rgba(255,255,255,.5);
  --hover:rgba(0,0,0,.045);
  --press:rgba(0,0,0,.08);
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  --shadow-float:0 8px 24px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);

  /* 圆角：桌面克制小圆角，移动大圆角逼近 squircle 观感 */
  --r-sm:6px;    /* 小件 */
  --r-md:10px;   /* 桌面卡片 */
  --r-lg:14px;   /* 桌面大卡 / 移动小组件 */
  --r-xl:22px;   /* 移动大卡片 */
  --r-cell:12px; /* 移动列 cell（Apple 官方 12） */

  /* 间距 8px 网格 */
  --pad-1:8px; --pad-2:16px; --pad-3:24px; --pad-4:32px; --pad-5:40px;

  /* 字号：桌面紧凑，移动宽松 */
  --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-17:17px;
  --fs-20:20px; --fs-22:22px; --fs-28:28px; --fs-34:34px;
  --lh:1.4; --lh-lo:1.5;

  /* 触控热区下限（移动端 44pt，桌面可收紧） */
  --tap:44px;

  /* Apple 动效曲线 */
  --ease-apple:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

/* 深色模式：跟系统，可被预览工具手动覆盖 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#1E1E1E; --bg-deep:#000000;
    --card:#1C1C1E; --card2:#2C2C2E;
    --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
    --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
    --sidebar-blur:rgba(38,38,40,.72);
    --tabbar-blur:rgba(24,24,26,.72);
    --glass-line:rgba(255,255,255,.08);
    --hover:rgba(255,255,255,.06);
    --press:rgba(255,255,255,.1);
    --accent:#0A84FF; --accent-press:#409CFF; --accent-soft:rgba(10,132,255,.2);
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    --shadow-float:0 8px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme=dark]{
  --bg:#1E1E1E; --bg-deep:#000000;
  --card:#1C1C1E; --card2:#2C2C2E;
  --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(84,84,88,.75);
  --sidebar-blur:rgba(38,38,40,.72);
  --tabbar-blur:rgba(24,24,26,.72);
  --glass-line:rgba(255,255,255,.08);
  --hover:rgba(255,255,255,.06);
  --press:rgba(255,255,255,.1);
  --accent:#0A84FF; --accent-press:#409CFF; --accent-soft:rgba(10,132,255,.2);
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  --shadow-float:0 8px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:var(--fs-13); line-height:var(--lh);
  color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  opacity:0;transition:opacity .2s ease;
}
body.ready{opacity:1}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* ============================================================
   骨架 Shell：mac 形态（侧栏 + 内容） / ios 形态（全宽 + 底栏）
   平台形态由 html[data-form=mac|ios] 决定，而非媒体查询：
   真实部署时 data-form 由 JS 按宽度自动设置（见底部），
   演示时可用预览工具强制切换。两种形态共用同一套 DOM。
   ============================================================ */
#app{display:flex;height:100dvh;overflow:hidden}
#shell-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}

/* ---------- macOS 形态 ---------- */
html[data-form=mac] #sidebar{
  width:264px;flex:none;display:flex;flex-direction:column;
  background:var(--sidebar-blur);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  border-right:1px solid var(--sep);
}
/* iOS 形态默认隐藏侧栏与 mac 顶栏 */
html[data-form=ios] #sidebar{display:none}
html[data-form=ios] #macbar{display:none}
html[data-form=mac] #tabbar{display:none}
html[data-form=mac] #ios-title{display:none}

/* ============================================================
   macOS 形态细节：窗口顶栏（交通灯）、菜单栏、侧栏
   ============================================================ */
#macbar{
  height:34px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--sep);
  background:var(--sidebar-blur);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  -webkit-user-select:none;user-select:none;
}
/* 交通信号灯：纯氛围点缀，web 里没有真窗口可关 */
.traffic{display:flex;gap:8px;align-items:center}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic i:nth-child(1){background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.traffic i:nth-child(2){background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.traffic i:nth-child(3){background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
#macbar .menus{display:flex;gap:2px;align-items:center;font-size:var(--fs-13);font-weight:500}
#macbar .menus button{padding:4px 9px;border-radius:5px;font-size:var(--fs-13)}
#macbar .menus button:hover{background:var(--hover)}
#macbar .menus button.on{background:var(--accent);color:#fff}
#macbar .doc-title{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--muted);font-weight:500}
#macbar .doc-title b{color:var(--ink);font-weight:600}

#sidebar .side-brand{
  display:flex;align-items:center;gap:10px;padding:18px 18px 12px;
}
#sidebar .side-brand .logo{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#0A84FF,#5E5CE6);
  color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(10,132,255,.35);
}
#sidebar .side-brand b{font-size:var(--fs-15);letter-spacing:.2px}
#sidebar .side-brand small{display:block;font-size:var(--fs-12);color:var(--muted);font-weight:400;margin-top:1px}
#side-nav{flex:1;overflow-y:auto;padding:6px 10px}
.side-sep{
  font-size:var(--fs-12);font-weight:600;color:var(--muted);
  padding:14px 10px 5px;letter-spacing:.4px;
}
.side-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:0 10px;height:32px;border-radius:7px;
  font-size:var(--fs-13);color:var(--ink2);text-align:left;
  transition:background .2s ease;
}
.side-item .ico{width:18px;text-align:center;font-size:14px;filter:saturate(.9)}
.side-item:hover{background:var(--hover)}
.side-item.on{background:var(--accent);color:#fff;font-weight:500}
.side-item.on .ico{filter:none}
.side-item .bdg{
  margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);
  background:var(--card2);border-radius:8px;padding:1px 7px;
}
.side-item.on .bdg{background:rgba(255,255,255,.25);color:#fff}
.side-item:active{transform:translateY(1px)}
.side-foot{
  padding:12px 16px 16px;border-top:1px solid var(--sep);
  font-size:var(--fs-12);color:var(--muted);
}
.side-foot .prog-label{display:flex;justify-content:space-between;margin-bottom:6px}
.side-foot .bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.side-foot .bar i{display:block;height:100%;width:46%;border-radius:3px;background:linear-gradient(90deg,#0A84FF,#5E5CE6)}
.side-foot .streak{margin-top:8px;display:flex;align-items:center;gap:6px}

/* ============================================================
   macOS 内容区：白卡网格，紧凑密度
   ============================================================ */
html[data-form=mac] #content{padding:var(--pad-4) var(--pad-5) 60px}
.page-head{display:none} /* mac 用 sidebar 定位，页头收敛 */
html[data-form=mac] .view{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:var(--pad-2)}
.mac-h1{font-size:var(--fs-22);font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.mac-sub{font-size:var(--fs-13);color:var(--muted);margin-bottom:var(--pad-2)}

.mac-grid{display:grid;gap:var(--pad-2)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.card{
  background:var(--card);border-radius:var(--r-md);
  border:1px solid var(--sep);box-shadow:var(--shadow-card);
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
html[data-form=mac] .card.hoverlift:hover{
  transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.08);
}
.card-pad{padding:var(--pad-2)}
.card h4{font-size:var(--fs-15);font-weight:600;display:flex;align-items:center;gap:8px}
.card .sub{font-size:var(--fs-12);color:var(--muted);margin-top:2px}
.card .num{font-size:var(--fs-28);font-weight:700;letter-spacing:-.5px;margin-top:8px}
.card .num small{font-size:var(--fs-13);color:var(--muted);font-weight:500;letter-spacing:0}

/* 进度环 */
.ring{width:64px;height:64px;border-radius:50%;flex:none;
  background:conic-gradient(var(--accent) 0 68%, var(--card2) 68% 100%);
  display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font-size:var(--fs-15)}

/* 战役行（Things 3 式：勾选圆 + 标题 + 进度） */
.battle-row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-bottom:1px solid var(--sep);
}
.battle-row:last-child{border-bottom:none}
.b-check{
  width:22px;height:22px;border-radius:50%;flex:none;position:relative;
  border:1.5px solid var(--sep-strong);transition:all .2s var(--ease-apple);
  background:transparent;cursor:pointer;
}
html[data-form=ios] .b-check{width:26px;height:26px}
.b-check.done{background:var(--accent);border-color:var(--accent)}
.b-check.done::after{content:"";position:absolute;left:50%;top:46%;width:9px;height:5px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translate(-50%,-50%) rotate(-45deg)}
.b-check.curr{border-color:var(--accent)}
.b-check.curr::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
.battle-body{flex:1;min-width:0}
.battle-body b{font-size:var(--fs-15);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.battle-body span{font-size:var(--fs-12);color:var(--muted)}
.battle-pct{font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* 章节讲义网格项 */
.ch-item{padding:var(--pad-2);cursor:pointer;position:relative;text-align:left}
.ch-item .no{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.ch-item h4{margin-top:4px;font-size:var(--fs-15)}
.ch-item .meta{display:flex;gap:6px;margin-top:8px;font-size:11px;color:var(--muted)}
.ch-item .tag{background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:5px;font-weight:600}
.ch-item:active{transform:scale(.985)}

/* 大入口（学习 Hub 四大金刚） */
.entry{
  display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;text-align:left;
}
html[data-form=mac] .entry{min-height:78px}
.entry .e-ico{
  width:44px;height:44px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.entry b{font-size:var(--fs-15);display:flex;align-items:center;gap:6px}
.entry .sub{font-size:var(--fs-12);color:var(--muted);margin-top:2px}
.entry .arrow{margin-left:auto;color:var(--muted);font-size:18px;font-weight:300}
.entry:active{transform:scale(.98)}

/* ============================================================
   iOS 形态细节：安全区、大标题滚动收缩、cell 表、底部 TabBar
   ============================================================ */
html[data-form=ios] body{background:var(--bg-deep)}
html[data-form=ios] #content{
  padding:calc(env(safe-area-inset-top,0px) + 6px) 0 calc(env(safe-area-inset-bottom,0px) + 96px);
}
html[data-form=ios] .view{
  padding:0 16px;
  animation:iosIn .34s var(--ease-apple);
}
@keyframes iosIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 顶部大标题：随滚动收缩（标题在滚动容器里做视差） */
html[data-form=ios] #ios-title{
  display:block;padding:8px 20px 2px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg-deep) 72%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:background .2s ease;
}
html[data-form=ios] #ios-title h1{
  font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.15;
}
html[data-form=ios] #ios-title .date{font-size:13px;color:var(--muted);margin-top:2px}
html[data-form=ios] #ios-title.scrolled h1{font-size:26px}
html[data-form=ios] #ios-title.scrolled{background:var(--tabbar-blur);box-shadow:0 .5px 0 var(--sep)}

/* iOS 列表 cell：圆角分组（Apple 风格单元格，左右 16 安全留白已由 .view 提供） */
.ios-list{display:flex;flex-direction:column;gap:10px}
.ios-group{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-cell)}
.ios-group .ghead{font-size:13px;color:var(--muted);padding:6px 16px 4px}
.cell{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--card);padding:0 16px;min-height:var(--tap);text-align:left;
  position:relative;transition:transform .12s var(--ease-apple);
}
.cell + .cell::before{
  content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);
}
html[data-form=ios] .cell{border-radius:0}
html[data-form=ios] .cell:first-child{border-radius:var(--r-cell) var(--r-cell) 0 0}
html[data-form=ios] .cell:last-child{border-radius:0 0 var(--r-cell) var(--r-cell)}
html[data-form=ios] .cell:only-child{border-radius:var(--r-cell)}
.cell .c-ico{
  width:30px;height:30px;border-radius:7px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.cell b{font-size:var(--fs-17);font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .c-val{font-size:var(--fs-15);color:var(--muted);flex:none}
.cell .c-arrow{color:var(--sep-strong);font-size:17px;font-weight:400;flex:none}
html[data-form=ios] .cell:active{background:var(--press)}
html[data-form=mac] .cell{min-height:40px}
html[data-form=mac] .cell b{font-size:var(--fs-13)}

/* iOS 大卡片（错题 / 荣誉 / hub 模块） */
.big-card{
  background:var(--card);border-radius:var(--r-xl);
  padding:20px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow-card);
}
.big-card h3{font-size:var(--fs-20);font-weight:700;letter-spacing:-.3px}
.big-card .sub{font-size:var(--fs-15);color:var(--muted);line-height:var(--lh-lo)}

/* iOS 底部 TabBar */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:none;
  padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 6px);
  background:var(--tabbar-blur);
  -webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);
  border-top:1px solid var(--sep);
}
html[data-form=ios] #tabbar{display:flex}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:52px;justify-content:center;border-radius:12px;
  color:var(--muted);transition:color .2s ease;position:relative;
}
.tab-btn .t-ico{font-size:22px;line-height:1;filter:grayscale(.2);transition:transform .3s var(--ease-spring)}
.tab-btn span{font-size:10px;font-weight:500;letter-spacing:.2px}
.tab-btn.on{color:var(--accent)}
.tab-btn.on .t-ico{transform:translateY(-1px) scale(1.06);filter:none}
.tab-btn:active .t-ico{transform:scale(.92)}

/* 通用组件 */
.btn-primary{
  background:var(--accent);color:#fff;border-radius:10px;
  font-size:var(--fs-17);font-weight:600;min-height:var(--tap);
  padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 2px 8px var(--accent-soft);
  transition:transform .15s var(--ease-apple), background .2s ease;
}
.btn-primary:active{transform:scale(.97)}
html[data-form=mac] .btn-primary{min-height:34px;font-size:var(--fs-13);border-radius:8px}
.btn-primary.blue-bg{background:linear-gradient(135deg,#0A84FF,#5E5CE6);box-shadow:0 4px 14px rgba(10,132,255,.3)}
.btn-secondary{
  background:var(--card2);color:var(--accent);border-radius:10px;
  font-size:var(--fs-17);font-weight:600;min-height:var(--tap);padding:0 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s var(--ease-apple), background .2s ease;
}
.btn-secondary:active{transform:scale(.97)}
html[data-form=mac] .btn-secondary{min-height:34px;font-size:var(--fs-13);border-radius:8px}

/* 题目卡 */
.q-opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--sep);border-radius:var(--r-lg);
  padding:14px 16px;font-size:var(--fs-17);transition:all .2s var(--ease-apple);
}
html[data-form=mac] .q-opt{font-size:var(--fs-13);padding:10px 14px}
.q-opt .opt-key{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--card2);color:var(--muted);font-weight:600;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
html[data-form=mac] .q-opt .opt-key{width:22px;height:22px;font-size:12px}
.q-opt.correct{border-color:var(--accent);background:var(--accent-soft)}
.q-opt.correct .opt-key{background:var(--accent);color:#fff}
.q-opt.wrong{border-color:#FF3B30;background:rgba(255,59,48,.08)}
.q-opt.wrong .opt-key{background:#FF3B30;color:#fff}

/* ============================================================
   平台识别 + 震动闸门（评审修订版）
   - 桌面标志：(hover:hover) and (pointer:fine)
   - 震动仅当：(hover:none) and (pointer:coarse) 且非 Windows
     ——Windows 触屏本几乎总报 fine，天然静默；iOS 无 Vibration API，判 false
   - 震动只在用户手势回调里调用，绝不进加载/滚动/自动动画
   ============================================================ */
var isDesktop  = matchMedia('(hover: hover) and (pointer: fine)').matches;
var isCoarse   = matchMedia('(hover: none) and (pointer: coarse)').matches;
var isWin      = /win/i.test(navigator.platform || (navigator.userAgentData && navigator.userAgentData.platform) || '');
var isTouchMobile = isCoarse && !isWin;
var canVibrate = isTouchMobile && typeof navigator.vibrate === 'function';

function vibrateTap(){
  if(!canVibrate) return;                       // 闸门：非触屏移动真机直接 return
  try{ navigator.vibrate(10); }catch(e){ /* 静默降级，绝不报错 */ }
}

/* ============================================================

   真机自动：宽度断点 860px（跟随设计文档），演示可被工具条强制覆盖
   ============================================================ */
var formOverride = null;   // null=自动, 'mac'/'ios'=强制

function applyForm(){
  var f = formOverride || (window.innerWidth >= 860 ? 'mac' : 'ios');
  document.documentElement.setAttribute('data-form', f);
  /* 演示工具条按钮态 */
  document.querySelectorAll('#formSeg button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-form') === f);
  });
  titleShrink(document.getElementById('content'));
  refreshReadout();
}

/* ============================================================
   主题：auto 跟系统，light/dark 手动覆盖
   ============================================================ */
var themeOverride = 'auto';
function applyTheme(){
  var root = document.documentElement;
  if(themeOverride === 'auto'){
    root.removeAttribute('data-theme');
  }else{
    root.setAttribute('data-theme', themeOverride);
  }
  document.querySelectorAll('#themeSeg button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-theme') === themeOverride);
  });
}

/* ============================================================
   演示读数：当前平台判定 & 震动可用性（让 Windows 上的鼠哥直观看到闸门）
   ============================================================ */
function refreshReadout(){
  var dot = document.getElementById('rdDot');
  var txt = document.getElementById('rdText');
  var form = document.documentElement.getAttribute('data-form');
  var msgs = [];
  msgs.push('形态:' + (form === 'mac' ? 'macOS' : 'iOS'));
  if(isDesktop) msgs.push('pointer:fine');
  if(isWin) msgs.push('win');
  if(canVibrate)       { dot.className = 'dot ok';   txt.innerHTML = msgs.join(' · ') + ' · <span class="vib-flag">震动 开</span>'; }
  else if(isTouchMobile){ dot.className = 'dot vib';  txt.innerHTML = msgs.join(' · ') + ' · <span class="vib-flag">真机才有马达</span>'; }
  else                  { dot.className = 'dot no';   txt.innerHTML = msgs.join(' · ') + ' · 震动 静默'; }
}

     + ['今日已练 <b style="font-size:20px">24</b> 题','连续正确 <b style="font-size:20px;color:#30D158">13</b> 题','卡路里 <b style="font-size:20px">≈ 0</b> kcal','用时 <b style="font-size:20px">28</b> 分钟'].map(function(x,i){
         return '<div style="padding:10px 14px;background:var(--card2);border-radius:10px;font-size:12px;color:var(--muted)">'+x+'</div>';
       }).join('')
     + '</div></div>';
  h += '<div class="card card-pad" style="margin-bottom:16px"><div style="display:flex;gap:8px;flex-wrap:wrap" id="tagRow">'
     + ['全部','列表','字典','函数','字符串','循环','异常'].map(function(t,i){
         return '<button class="qtag" data-tag="'+i+'" style="'+(i===0?'background:var(--accent);color:#fff;':'background:var(--card2);color:var(--ink2);')+'padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500">'+t+'</button>';
       }).join('') + '</div></div>';
  h += '<div class="card card-pad" id="quizCard" style="margin-bottom:16px">'
     + '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Q · 单选题 · 已答对 0/1 · 计时中 00:12</div>'
     + '<h4 style="font-size:17px;line-height:1.5">'+QUIZ.stem+'</h4>'
     + '<pre style="background:var(--card2);border-radius:10px;padding:14px;font-size:13px;line-height:1.6;margin:12px 0;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace">'+QUIZ.code+'</pre>'
     + '<div style="display:flex;flex-direction:column;gap:10px" id="optBox">';
  ['A','B','C','D'].forEach(function(k, i){
    h += '<button class="q-opt" data-i="'+i+'"><span class="opt-key">'+k+'</span><span>'+QUIZ.opts[i].t+'</span></button>';
  });
  h += '</div><div id="qNote" class="hidden" style="margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:10px;font-size:13px;line-height:1.6"></div></div>';
  h += '<div style="display:flex;gap:10px"><button class="btn-primary" data-nav="exam">下一题</button><button class="btn-secondary" data-nav="wrong">查看错题</button></div>';
  view.innerHTML = h;
  bindNav();
  /* 选题交互：点击 → 判断 → 震动（真机才会震） */
  var box = document.getElementById('optBox');
  if(box) box.addEventListener('click', function(ev){
    var btn = ev.target.closest('.q-opt'); if(!btn) return;
    var i = +btn.getAttribute('data-i');
    box.querySelectorAll('.q-opt').forEach(function(b){ b.classList.remove('correct','wrong'); b.style.pointerEvents='none'; });
  /* 标签筛选：演示态交互（真实版由引擎接管） */
  var tagRow = document.getElementById('tagRow');
  if(tagRow) tagRow.addEventListener('click', function(ev){
    var b = ev.target.closest('.qtag'); if(!b) return;
    vibrateTap();
    tagRow.querySelectorAll('.qtag').forEach(function(x){ x.style.background='var(--card2)'; x.style.color='var(--ink2)'; });
    b.style.background='var(--accent)'; b.style.color='#fff';
  });
    var ok = QUIZ.opts[i].ok;
    btn.classList.add(ok?'correct':'wrong');
    vibrateTap();                       // 唯一震动入口：用户点击
    var note = document.getElementById('qNote');
    note.classList.remove('hidden');
    note.innerHTML = (ok ? '✅ 正确。' : '❌ 错了，正确答案是 B。') + QUIZ.note;
    document.getElementById('quizCard').style.borderColor = ok ? 'rgba(52,199,89,.5)' : 'rgba(255,59,48,.5)';
  });
};

/* ---------- 错题本 / 已订正 ---------- */
function wrongView(mode){
  var isWrong = (mode==='wrong');
  var list = isWrong ? WRONG : WRONG.slice(0,2).map(function(w){ w.fixed=true; return w; });
  var h = '<div class="mac-h1">'+(isWrong?'错题本':'已订正')+'</div><div class="mac-sub">'+(isWrong?'12 道错题 · 订正后自动移入已订正':'9 道曾经错过、现已掌握的题')+'</div>';
  if(!isWrong && !list.length){
    h += '<div class="card empty"><div class="e-face">😌</div>暂无错题，继续保持</div>';
    view.innerHTML = h; return;
  }
  var head = WRONG.map(function(w){ return '❌ '+w.q; }).join('<br>');
  if(isWrong){
    h += '<div class="card card-pad" style="margin-bottom:14px"><h4>📌 高频错因</h4><div class="sub" style="margin-top:8px;line-height:1.9">'+head+'</div></div>';
  }
  h += '<div class="mac-grid g2">';
  (isWrong ? WRONG : WRONG.slice(0,2)).forEach(function(w){
    h += '<div class="card card-pad"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
       + '<span style="font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:5px">'+w.tag+'</span>'
       + '<span style="font-size:12px;color:var(--muted)">错了 '+w.wrong+' 次</span></div>'
       + '<h4 style="font-size:15px;line-height:1.5">'+w.q+'</h4>'
       + '<div class="sub" style="margin-top:8px">'+w.ans+'</div>'
       + '<button class="btn-secondary" style="margin-top:14px;font-size:12px;min-height:32px">'+(isWrong?'✓ 我订正了':'复习一遍')+'</button></div>';
  });
  h += '</div>';
  view.innerHTML = h;
  bindNav();
}
VIEWS.wrong = function(){ wrongView('wrong'); };
VIEWS.fixed = function(){ wrongView('fixed'); };

/* ---------- 视图分发 & 导航高亮 ---------- */
var current = 'home';
function go(id){
  var nav = navFor(id);
  if(!nav){ id='home'; nav=navFor(id); }
  current = id;
  document.getElementById('macTitle').textContent = nav.macTitle;
  document.getElementById('macSub').textContent  = nav.macSub;
  document.getElementById('iosH1').textContent   = nav.t;
  document.getElementById('iosDate').textContent = fmtDate();
  if(VIEWS[id]) VIEWS[id](); else VIEWS.home();
  document.getElementById('content').scrollTop = 0;
  document.getElementById('content').scrollTo({top:0});
  paintNav();
}

function fmtDate(){
  var d = new Date();
  var w = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+w+' · ' + (current==='home'?'今天也要亲手敲代码 💪':'');
}

function paintNav(){
  var nav = navFor(current);
  /* 侧栏 */
  var side = document.getElementById('side-nav');
  var groups = ['学院','修炼场','记录'];
  var html = '';
  groups.forEach(function(g){
    html += '<div class="side-sep">'+g+'</div>';
    NAVS.forEach(function(n){
      if(n.grp!==g) return;
      var on = (n.id===current);
      var bdg = (n.id==='wrong' ? STAT.wrong : n.id==='hall' ? STAT.done+'题' : '');
      html += '<button class="side-item'+(on?' on':'')+'" data-nav="'+n.id+'"><span class="ico">'+n.ico+'</span>'+n.t
            + (bdg?'<span class="bdg">'+bdg+'</span>':'') + '</button>';
    });
  });
  side.innerHTML = html;
  /* 底部 Tab */
  var tb = document.getElementById('tabbar');
  var th = '';
  TABS.forEach(function(t, ti){
    var tabNavs = NAVS.filter(function(n){ return n.tab===t.id; });
    var active = tabNavs.some(function(n){ return n.id===current; });
    th += '<button class="tab-btn'+(active?' on':'')+'" data-tab="'+t.id+'"><span class="t-ico">'+t.ico+'</span><span>'+t.id+'</span></button>';
  });
  tb.innerHTML = th;
  tb.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){
      vibrateTap();
      var tid = b.getAttribute('data-tab');
      var first = NAVS.filter(function(n){ return n.tab===tid; })[0];
      go(first.id);
    });
  });
  bindNav();
}

/* 全局导航绑定（data-nav 元素） */
function bindNav(){
  var root = view;
  var items = root.querySelectorAll('[data-nav]');
  for(var i=0;i<items.length;i++){
    (function(el){
      var id = el.getAttribute('data-nav');
      if(!id) return;
      el.addEventListener('click', function(){ vibrateTap(); go(id); });
    })(items[i]);
  }
}

/* iOS 大标题滚动收缩 */
function titleShrink(scroller){
  var t = document.getElementById('ios-title');
  if(!t) return;
  t.classList.toggle('scrolled', scroller.scrollTop > 8);
}

/* ============================================================
   入口 & 演示工具条绑定
   ============================================================ */
document.getElementById('formSeg').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  formOverride = b.getAttribute('data-form');
  applyForm();
});
document.getElementById('themeSeg').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;
  themeOverride = b.getAttribute('data-theme');
  applyTheme();
});
window.addEventListener('resize', function(){ if(!formOverride) applyForm(); });

/* 引导首屏 */
function boot(){
  applyTheme();
  applyForm();
  go('home');
  if(isDesktop){
    /* 桌面下把 iOS 相关按钮留在可点状态即可 */
  }
  document.title = 'Python 学院 · Apple 化演示';
}
boot();
document.body.classList.add('ready');
