<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>apple-ui 动效实验室 · HIG 最后 30%</title>
<style>
/* ============================================================
   apple-ui 技能参数样张
   本页所有数值照抄 skills/apple-ui/SKILL.md（§二 令牌 / §三 交互 / §四 图标）
   ============================================================ */
:root{
  --bg:#F2F2F7; --bg-glow:#FFFFFF; --card:#FFFFFF; --fill:#E9E9EE; --fill-soft:rgba(120,120,128,.08);
  --ink:#1D1D1F; --ink2:#3C3C43; --muted:#86868B; --sep:rgba(60,60,67,.12); --sep-strong:rgba(60,60,67,.26);
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --green:#34C759; --green-soft:rgba(52,199,89,.13);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.1);
  --gold:#FF9500; --gold-soft:rgba(255,149,0,.16);
  --glass:rgba(250,250,252,.62); --glass-edge:rgba(255,255,255,.5);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-cell:12px;
  --sh-card:0 1px 1.5px rgba(0,0,0,.02),0 2px 10px rgba(0,0,0,.035);
  --sh-float:0 14px 36px rgba(0,0,0,.16);
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#000; --bg-glow:#1C1C1E; --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
    --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93; --sep:rgba(84,84,88,.45); --sep-strong:rgba(84,84,88,.7);
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
    --green:#32D74B; --green-soft:rgba(48,209,88,.16);
    --red:#FF453A; --red-soft:rgba(255,69,58,.14);
    --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
    --glass:rgba(22,22,24,.55); --glass-edge:rgba(255,255,255,.14);
    --sh-card:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme=dark]{
  --bg:#000; --bg-glow:#1C1C1E; --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
  --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93; --sep:rgba(84,84,88,.45); --sep-strong:rgba(84,84,88,.7);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
  --green:#32D74B; --green-soft:rgba(48,209,88,.16);
  --red:#FF453A; --red-soft:rgba(255,69,58,.14);
  --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
  --glass:rgba(22,22,24,.55); --glass-edge:rgba(255,255,255,.14);
  --sh-card:0 1px 2px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:17px;line-height:1.5;color:var(--ink);background:radial-gradient(900px 480px at 18% -8%,var(--bg-glow),transparent),var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1em;height:1em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;flex-direction:column;height:100dvh}

/* 顶栏（返回显示上一级标题 · iOS 语义） */
#topbar{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;position:relative;z-index:30;
  background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(var(--glass-edge),rgba(120,120,128,.25))}
#topbar .backbtn{display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 12px 0 6px;border-radius:10px;
  font-size:16px;color:var(--accent);font-weight:500;background:var(--fill-soft)}
#topbar .backbtn .ic{width:16px;height:16px}
#topbar .brand{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#topbar .brand b{font-size:15px;font-weight:600;display:block;white-space:nowrap}
#topbar .brand span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px}
#topbar .themeBtn{margin-left:auto;height:36px;width:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:var(--accent);background:var(--accent-soft)}
#topbar .themeBtn .ic{width:18px;height:18px}

#stage{flex:1;position:relative;overflow:hidden}
#scroller{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:150px;
  scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.45) transparent}
@media (hover:hover){
  #scroller::-webkit-scrollbar{width:8px}
  #scroller::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px}
}
.view{padding:20px 16px 30px;max-width:900px;margin:0 auto}
.view.push{animation:pushIn .38s var(--ease)}
.view.pushBack{animation:pushBackIn .38s var(--ease)}
@keyframes pushIn{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pushBackIn{from{opacity:.3;transform:translateX(-52px)}to{opacity:1;transform:none}}

.kick{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}
.h1{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:5px}
.sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.cap{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--sep);box-shadow:var(--sh-card);border-radius:var(--r-m);padding:16px}
.card+.card{margin-top:12px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.4px}

/* hover 仅鼠标：轻上浮 */
@media (hover:hover){
  .lift{transition:transform .22s var(--ease),box-shadow .22s}
  .lift:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}
}
/* 触屏按压 = 高亮变暗，无 scale（apple-ui 戒律 3） */
@media (hover:none){
  .tile:active,.cell:active{background:var(--fill)}
  .btn-solid:active,.btn-line:active,.btn-go:active{filter:brightness(.9)}
  .card:active{filter:brightness(.95)}
}

/* 简约几何 hero：白卡 hairline + 线框几何 */
.hero{border-radius:var(--r-l);border:1px solid var(--sep);background:var(--card);
  box-shadow:var(--sh-card);padding:24px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:13px}
.hero .geo{position:absolute;right:10px;top:10px;width:70px;height:70px;color:var(--sep-strong)}
.hero .geo .gline{stroke:currentColor;stroke-width:1.6;fill:none}
.hero .geo .gdot{fill:var(--accent)}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.3px;padding-right:76px;line-height:1.35}
.hero .hero-cap{font-size:13.5px;color:var(--muted);line-height:1.6}
.hero .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
  padding:4px 11px;border-radius:16px;background:var(--fill);color:var(--ink2)}
.pill.gold{background:var(--gold-soft);color:#C93400}
:root[data-theme=dark] .pill.gold{color:#FFD60A}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.btn-go{margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  padding:10px 20px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px var(--accent-soft)}
.btn-go .ic{width:15px;height:15px}

/* 按钮演示 */
.btn-solid{background:var(--accent);color:#fff;font-size:16px;font-weight:600;min-height:46px;
  padding:0 24px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-line{background:var(--fill);color:var(--ink);font-size:16px;font-weight:600;min-height:46px;
  padding:0 24px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* 答题 + 常驻解析 */
.q-stem{font-size:18px;font-weight:600;line-height:1.5;margin:4px 0 6px}
.opt{width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border:1.5px solid var(--sep);border-radius:var(--r-m);
  padding:13px 16px;font-size:16.5px;margin-top:10px}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
.opt .mark{margin-left:auto;width:22px;height:22px;color:var(--green);display:none}
.opt .mark .ic{width:20px;height:20px}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.correct .mark{display:inline-flex}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.muted{opacity:.45}
@media (hover:none){.opt:active{background:var(--fill)}}
.why-note{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.7;
  display:flex;flex-direction:column;gap:10px}
.why-note:empty{display:none}
.why-note .why-body{display:flex;gap:9px;align-items:flex-start}
.why-note .why-ic{width:18px;height:18px;flex:none;margin-top:2px}
.why-ic .ic{width:18px;height:18px}
.why-ok{background:var(--green-soft)}
.why-ok .why-ic{color:#1E9E4A}
.why-no{background:var(--red-soft)}
.why-no .why-ic{color:var(--red)}
.retry-btn{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  font-size:14px;font-weight:600;color:var(--accent);padding:8px 16px;border-radius:10px;
  background:var(--card);box-shadow:var(--sh-card)}

/* cell 分组表（17/400 · 分隔线从文字左缘 · 44 热区） */
.group{display:flex;flex-direction:column;border-radius:var(--r-m);overflow:hidden;
  background:var(--card);border:1px solid var(--sep);box-shadow:var(--sh-card)}
.cell{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  min-height:48px;padding:10px 16px;position:relative;background:var(--card)}
.cell+.cell::before{content:"";position:absolute;left:61px;right:0;top:0;height:.5px;background:var(--sep)}
.cell .gi{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff}
.cell .gi .ic{width:18px;height:18px}
.cell b{font-size:17px;font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .gv{font-size:15px;color:var(--muted)}
.cell .garr{width:14px;height:14px;color:var(--sep-strong)}
@media (hover:none){.cell:active{background:var(--fill)}}
@media (hover:hover){.cell:hover{background:var(--fill-soft)}}

/* Dock：三 Tab 玻璃片，无选中点无侧键 */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#dock .dockbar{pointer-events:auto;display:flex;align-items:center;justify-content:center;
  background:var(--glass);-webkit-backdrop-filter:blur(44px) saturate(1.8);backdrop-filter:blur(44px) saturate(1.8);
  border:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:26px;padding:5px 6px}
.dock-btn{width:76px;height:52px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);
  transition:transform .24s var(--ease-spring),color .2s}
.dock-btn .d-ico{width:24px;height:24px}
.dock-btn span{font-size:10px;font-weight:600;letter-spacing:.2px}
.dock-btn.on{color:var(--accent)}
.dock-btn.on .d-ico{transform:translateY(-1px)}
@media (hover:hover){
  .dock-btn:hover{transform:translateY(-8px) scale(1.13);color:var(--accent);background:var(--fill-soft)}
}
@media (hover:none){.dock-btn:active{filter:brightness(.75)}}

/* toast（短提示专用） */
#toastBox{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:8px;max-width:420px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:11px 17px;font-size:14.5px;font-weight:500;box-shadow:var(--sh-float);
  animation:toastIn .35s var(--ease-spring)}
:root[data-theme=dark] .toast{background:#F2F2F7;color:#1D1D1F}
.toast .t-ic{width:18px;height:18px}
.toast.leaving{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(16px) scale(.96);opacity:0}}

/* 长按操作表（iOS Action Sheet 风，玻璃上滑） */
#sheetBox{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;flex-direction:column;
  padding:14px 16px calc(env(safe-area-inset-bottom,0px)+16px);
  background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);
  border-top:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:24px 24px 0 0;animation:sheetUp .4s var(--ease-spring)}
#sheetBox.show{display:flex}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
#sheetBox .sh-cap{text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
#sheetBox .sh{width:100%;min-height:52px;border-radius:14px;font-size:17px;font-weight:500;margin-top:8px;
  display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);
  border:1px solid var(--sep)}
#sheetBox .sh.danger{color:var(--red);font-weight:600}
#sheetBox .sh:active{filter:brightness(.9)}
.lp-cell.pressing{filter:brightness(.85)}

/* 设计令牌墙（配色速览，纯展示） */
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tok{border-radius:var(--r-m);padding:10px;border:1px solid var(--sep);background:var(--card)}
.tok .sw{height:44px;border-radius:9px;margin-bottom:8px;border:1px solid rgba(0,0,0,.05)}
.tok b{font-size:12px;display:block}
.tok .cap{font-size:10.5px}

/* ============================================================
   动效实验室新增（apple-hig 最后 30%：手势物理化/时空连续/多模态）
   ============================================================ */
/* 任务 2 · View Transitions 共享元素（detail 头图恒定命名） */
.dt-hero{view-transition-name:mv-hero}
::view-transition-old(root),::view-transition-new(root){
  animation-duration:.3s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(mv-hero),::view-transition-new(mv-hero){
  animation-duration:.5s;animation-timing-function:cubic-bezier(.32,.72,0,1)}

/* 任务 1 · Interactive Pop：双层舞台（前景跟手 + 背景静态微缩） */
#stage{will-change:transform;transform-origin:center 22%}
#viewBack{position:absolute;inset:0;z-index:1;opacity:0;transform:scale(.95);
  pointer-events:none;overflow:hidden;will-change:transform,opacity}
#viewBack.show{opacity:1}
#scroller{position:absolute;inset:0;z-index:2;will-change:transform}
body.pop-active{overflow:hidden;-webkit-user-select:none;user-select:none}
#view{will-change:transform,opacity}
#view.pop-shadow{box-shadow:-10px 0 30px rgba(0,0,0,.16)}

/* 任务 3 · 滚动视觉降噪：大标题 sticky + 塌缩 */
.hd{position:sticky;top:0;z-index:6;margin:0 -16px;padding:4px 16px 10px;
  background:linear-gradient(var(--bg) 82%,rgba(0,0,0,0));
  transition:padding .3s cubic-bezier(.32,.72,0,1)}
.hd .kick{transition:opacity .18s,height .3s,margin .3s;margin-bottom:6px}
.hd .h1{transition:transform .34s cubic-bezier(.32,.72,0,1);transform-origin:left bottom}
.hd.collapsed{padding:0 16px 2px}
.hd.collapsed .kick{opacity:0;height:0;overflow:hidden;margin:0}
.hd.collapsed .h1{transform:translateY(-6px) scale(.6);margin-bottom:-4px}
/* 底栏智能隐藏 */
#dock{transition:transform .44s cubic-bezier(.32,.72,0,1)}
#dock.hidden{transform:translateY(130%)}

/* 任务 4 · 环境光遮罩 + Sheet 玻璃（覆盖原 sheet 动画定义） */
#dim{position:fixed;inset:0;z-index:65;background:rgba(18,16,40,.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  opacity:0;pointer-events:none;transition:opacity .32s cubic-bezier(.32,.72,0,1);will-change:opacity}
#dim.show{opacity:1;pointer-events:auto}
#sheetBox{z-index:72;animation:none}
#sheetBox.show{animation:sheetUp .46s cubic-bezier(.34,1.25,.64,1)}
#sheetBox.out{animation:sheetDown .3s cubic-bezier(.32,.72,0,1) forwards}
@keyframes sheetDown{to{transform:translateY(110%)}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="backbtn" id="btnBack"><span class="ic" id="backIco"></span><span id="backTxt">返回</span></button>
    <div class="brand"><b id="brandName">UI 演示</b><span>APPLE-UI PARAMS</span></div>
    <button class="themeBtn" id="btnTheme" aria-label="切换深浅色"><span class="ic" id="themeIco"></span></button>
  </div>
  <div id="stage">
    <div id="viewBack"><div class="view" id="vbView"></div></div>
    <div id="scroller"><div class="view" id="view"></div></div>
  </div>
  <div id="dock"><div class="dockbar" id="dockbar"></div></div>
</div>
<div id="dim"></div>
<div id="toastBox"></div>
<div id="sheetBox"></div>

<script>
/* ---------- Lucide 图标（官方 path 内联） ---------- */
var I={};
function d(n,p){ I[n]='<svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">'+p+'</g></svg>'; }
d('back','<path d="m15 18-6-6 6-6"/>');
d('home','<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
d('book','<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>');
d('pen','<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>');
d('person','<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>');
d('check','<path d="M20 6 9 17l-5-5"/>');
d('info','<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>');
d('chev-r','<path d="m9 18 6-6-6-6"/>');
d('moon','<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>');
d('sun','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
d('arrow-r','<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>');
d('calendar','<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>');
function IC(n){ return '<span class="ic">'+I[n]+'</span>'; }

var $=function(s){return document.querySelector(s)};

/* 长按识别：pointerdown 起 500ms，位移 >10px 取消；拦截系统 contextmenu */
function bindLongPress(el, fn){
  if(el._lp) return; el._lp=1;
  var start=null,id=null;
  el.addEventListener('pointerdown',function(e){
    start={x:e.clientX,y:e.clientY};
    el.classList.add('pressing');
    id=setTimeout(function(){ id=null;
      el.classList.remove('pressing');
      tapV(); fn();
    },500);
  });
  el.addEventListener('pointermove',function(e){
    if(!start) return;
    if(Math.abs(e.clientX-start.x)>10||Math.abs(e.clientY-start.y)>10){
      clearTimeout(id); id=null; el.classList.remove('pressing'); start=null;
    }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    el.addEventListener(ev,function(){
      if(start){ clearTimeout(id); id=null; el.classList.remove('pressing'); start=null; }
    });
  });
  el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
}

  if(on) s.animate([{transform:'scale(1)'},{transform:'scale(.93)'}],
    {duration:360,easing:'cubic-bezier(.34,1.25,.64,1)',fill:'forwards'});
  else s.animate([{transform:'scale(.93)'},{transform:'scale(1)'}],

}

function renderView(id,isBack,noAnim){
  view.className='view'+((!noAnim&&isBack)?' pushBack':(!noAnim&&!isBack)?' push':'');
  view.innerHTML=renderers[id]?renderers[id]():'';

function go(id,opt){
  opt=opt||{};
  if(window._cur===id) return;

  hideViewBack();
  if(opt.mv){ mvSource=opt.mv; }

  history.pushState({v:id},'');
  if(opt.mv&&document.startViewTransition){
    view.classList.remove('push','pushBack');
    document.startViewTransition(function(){ renderView(id,false,true); });
  }else{ renderView(id,false,false); }
}

  renderView(id,true,popDone);
  popDone=false;
  hideViewBack();
});
/* ---- 任务 1 · Spring 引擎（dampingRatio 0.8 / response 0.3s，对应 UISpringTimingParameters） ----
   单值解算：质量 1，ω=2π/response≈20.94，stiffness=ω²≈438，damping=2ζω≈33.5。
   若你的项目已有 Spring 库，把下方 springTo 替换成它的接口即可（见文末胶水注释）。 */
function springTo(x0,target,fn,onDone){
  var z=.8,r=.3,w=2*Math.PI/r,x=x0,v=0,t0=performance.now(),prev=t0,running=true;
  function step(now){
    if(!running) return;
    var dt=Math.min((now-prev)/1000,.033); prev=now;
    var a=-2*z*w*v - w*w*(x-target);
    v+=a*dt; x+=v*dt;
    fn(x);
    if(Math.abs(x-target)<.5&&Math.abs(v)<.4){ fn(target); running=false; if(onDone) onDone(); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  return function(){ running=false; }; /* 打断：cancel 后接管 */
}
/* ---- 任务 3 · IntersectionObserver 驱动滚动降噪（无 scroll 监听，每次渲染重建） ---- */
var scrollIOs=[];
function bindScrollUI(){
  scrollIOs.forEach(function(io){ try{ io.disconnect(); }catch(e){} });
  scrollIOs=[];
  var hd=document.getElementById('hdWrap'); if(!hd) return;
  var sentinel=document.querySelector('#view .hero')||document.querySelector('#view .card');
  if(!sentinel) return;
  function makeIO(margin,onCross){
    var crossed=false;
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){
        var now=!en.isIntersecting;
        if(now!==crossed){ crossed=now; onCross(now); }
      });
    },{root:scroller,rootMargin:margin,threshold:[0,1]});
    io.observe(sentinel);
    scrollIOs.push(io);
  }
  makeIO('-104px 0px 0px 0px',function(off){ hd.classList.toggle('collapsed',off); });
  makeIO('-150px 0px 0px 0px',function(off){ document.getElementById('dock').classList.toggle('hidden',off); });
}
function paintDock(tab){

  }).join('');
}
$('#dockbar').addEventListener('click',function(e){
  var b=e.target.closest('.dock-btn'); if(!b) return;
  go({learn:'home',drill:'parts',mine:'mine'}[b.getAttribute('data-tab')]);
});

/* ---------- 工具 ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function store(k,v){ try{ localStorage.setItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem((k==='sb_session'||k==='profile'?'academy_':'chip_')+k)); return v===null?d:v; }catch(e){ return d; } }
/* 迷你公式渲染（题干里极少出现；主要防 XSS 与转义） */
function parseMath(s){
  if(s===undefined||s===null) return '';
  return esc(s).replace(/\*\*/g,'^').replace(/(^|[^*])\*([^*]|$)/g,'$1·$2');
}
function numEq(a,b){
  function val(x){
    if(typeof x==='number') return x;
    var s=String(x).replace(/×/g,'*').replace(/√/g,'Math.sqrt(').replace(/π/g,'Math.PI').trim();
    if(/[a-zA-Z]/.test(s.replace(/Math\./g,''))) return NaN;
    try{ return eval(s); }catch(e){ return NaN; }
  }
  var A=val(a),B=val(b);
  if(isNaN(A)||isNaN(B)) return String(a).replace(/\s/g,'').toLowerCase()===String(b).replace(/\s/g,'').toLowerCase();
  return Math.abs(A-B)<1e-6;
}

}

}

function poolMove(key,correct){
  var iw=wrongPool.indexOf(key), ifx=fixedPool.indexOf(key);
  if(correct){ if(iw>-1){ wrongPool.splice(iw,1); fixedPool.push(key); } }

}
/* 学习足迹：30 分钟内同一章连续活动并作一次 */
function logStudy(type,chId,chTitle){
  var now=Date.now(), _d=new Date(now), _p=function(x){ return (x<10?'0':'')+x; };
  var cat=_d.getFullYear()+'-'+_p(_d.getMonth()+1)+'-'+_p(_d.getDate())+' '+_p(_d.getHours())+':'+_p(_d.getMinutes())+':'+_p(_d.getSeconds());
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&now-last.end<30*60*1000&&last.ch===chId){ last.end=now; last.completed_at=cat; last.quizN=(last.quizN||0)+1; }
  else studyLog.push({start:now,end:now,ch:chId,title:chTitle,lessonN:0,quizN:type==='quiz'?1:0,completed_at:cat});
  if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  store('log',studyLog);
}
function sessionAcc(qs){ var c2=0,n=0; qs.forEach(function(k){ var v=quizStat[k]; if(v!==undefined){ n++; if(v===1) c2++; } }); return n?Math.round(c2/n*100):null; }
function sessionLog(ty,c,key,ok){
  var now=Date.now();
  var last=studyLog.length?studyLog[studyLog.length-1]:null;
  if(last&&last.questions&&last.ty===ty&&last.ch===c.id&&(now-last.end)<30*60*1000){
    if(last.questions.indexOf(key)===-1) last.questions.push(key);
    last.end=now; last.ms=last.end-last.start; last.acc=sessionAcc(last.questions);
  } else {
    studyLog.push({ty:ty,ch:c.id,title:c.title,questions:[key],start:now,end:now,ms:0,acc:null});
    if(studyLog.length>3000) studyLog=studyLog.slice(-3000);
  }
  store('log',studyLog);
}
/* ---------- 章节进度 ---------- */
function chIsDone(c){ return chDone.indexOf(c.id)>-1; }
function chQuizCount(c){ return c.quiz?c.quiz.length:0; }
function chQuizDone(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]!==undefined) n++; }); return n; }
function chCorrect(c){ var n=0; if(c.quiz) c.quiz.forEach(function(q,i){ if(quizStat[c.id+'_'+i]===1) n++; }); return n; }
function chSummary(c){ var a=chQuizDone(c), t=chQuizCount(c); return {answered:a,total:t,correct:chCorrect(c),allDone:t>0&&a>=t,allCorrect:a>0&&chCorrect(c)>=t&&a>=t}; }
function nextChapter(){ for(var i=0;i<CHAPTERS.length;i++){ if(!chIsDone(CHAPTERS[i])) return CHAPTERS[i]; } return null; }
/* ---------- 卷状态 ---------- */
function examStatus(c){
  if(!c.exam||!c.exam.length) return {answered:0,correct:0,full:false,total:0};
  var answered=0,correct=0;
  c.exam.forEach(function(q,i){ var st=quizStat['e'+c.id+'_'+i]; if(st!==undefined){ answered++; if(st===1) correct++; } });
  return {answered:answered,correct:correct,full:answered>=c.exam.length,total:c.exam.length};
}

var RANKS=[[0,'初入晶圆厂'],[10,'材料学徒'],[18,'开关手'],[25,'集成匠'],[32,'光刻学徒'],[40,'代工学徒'],[48,'海峡观察员'],[58,'断供老兵'],[70,'芯片战争史官'],[85,'晶圆领主'],[100,'芯片传人']];
function curRank(pct){
  var name=RANKS[0][1],next=null,nextAt=null;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ name=RANKS[i][1]; nextAt=(i+1<RANKS.length)?RANKS[i+1][0]:null; next=(i+1<RANKS.length)?RANKS[i+1][1]:null; } }
  return {name:name,next:next,nextAt:nextAt,remain:nextAt!==null?(nextAt-pct):0};
}
function calcStats(){
  var totalC=CHAPTERS.length;
  var doneC=chDone.length;
  var examTotal=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length; }).length;
  var examFull=CHAPTERS.filter(function(c){ return c.exam&&c.exam.length&&examStatus(c).full; }).length;
  var wrongN=fixedPool.length+wrongPool.length;
  var base=doneC/totalC*0.5+(examTotal?examFull/examTotal*0.3:0);
  var pct;
  if(wrongN){ pct=Math.round((base+fixedPool.length/wrongN*0.2)*100); }
  else { pct=Math.round(base/0.8*100); }
  return {doneC:doneC,totalC:totalC,examTotal:examTotal,examFull:examFull,wrongN:wrongN,fixedPool:fixedPool.length,wrongPool:wrongPool.length,pct:Math.min(100,pct),studyCount:studyLog.length};
}

/* ---------- 今日答题统计 ---------- */
function statTodayKey(){ return new Date().toDateString(); }
function initStat(){
  var k=statTodayKey();
  if(!stat||stat.day!==k){
    var base=stat||{};
    stat={ totalQ:base.totalQ||0,totalCorrect:base.totalCorrect||0,totalMs:base.totalMs||0,
      todayQ:0,todayCorrect:0,todayMs:0,todayReal:0,accQ:0,accC:0,day:k };
  }
  if(!stat._migrated){
    var qkeys=Object.keys(quizStat||{});
    stat.totalQ=qkeys.length; stat.accQ=qkeys.length;
    var cc=0; qkeys.forEach(function(kk){ if(quizStat[kk]===1) cc++; });
    stat.accC=cc; stat.totalCorrect=cc; stat._migrated=true;
  }
  storeStat();
}
function storeStat(){ store('stat',stat); }
function statRecordQ(ok){
  if(!stat) return;
  stat.totalQ++; stat.todayQ++; stat.todayReal++; stat.accQ++;
  if(ok) stat.accC++;
  if(ok){ stat.totalCorrect++; stat.todayCorrect++; }
  storeStat();
}
function todayRecord(ok){
  var d=new Date().toDateString();
  if(todayStat.d!==d){ todayStat={d:d,done:0,correct:0}; }
  todayStat.done++; if(ok) todayStat.correct++;
  store('tstat',todayStat);
}
function studyTimerEnter(){ if(window._studyStart===null||window._studyStart===undefined) window._studyStart=Date.now(); }
function studyTimerLeave(){
  if(window._studyStart){ if(stat){ stat.totalMs+=Date.now()-window._studyStart; stat.todayMs+=Date.now()-window._studyStart; storeStat(); } window._studyStart=null; }
}
/* ---------- 作答主流程（写库语义与线上一致） ---------- */
function answerQuestion(c,i,oi){
  var q=c.quiz[i], k=c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok);
  statRecordQ(ok);
  if(hallDone.indexOf(k)===-1){ hallDone.push(k); store('hall',hallDone); }
  logStudy('quiz',c.id,c.title);
  sessionLog('lesson',c,k,ok);
  return ok;
}
function answerVol(c,i,oi){
  var q=c.exam[i], k='e'+c.id+'_'+i;
  var ok = q.type==='fill' ? (q.accept||[]).some(function(a){ return numEq(a,oi); }) : (oi===q.answer);
  quizPick[k]=oi; store('quizPick',quizPick);
  quizStat[k]=ok?1:0; store('quizStat',quizStat);
  poolMove(k,ok);
  todayRecord(ok); statRecordQ(ok);
  logStudy('quiz',c.id,c.title);
  return ok;
}
/* ---------- 结算：全答即通过（不要求全对），首次点亮打卡与完成 ---------- */
function settleChapter(c, mode){
  var sm=chSummary(c);
  if(!sm.allDone){ toast('还有 '+(sm.total-sm.answered)+' 题没做完，做完才能结算'); return false; }
  var first = chDone.indexOf(c.id)===-1;
  if(first){
    chDone.push(c.id); store('ch',chDone);
    dailyGoal('l');
    settleStore['settle_'+c.id]={ts:Date.now(),pct:Math.round(sm.correct/sm.total*100),allCorrect:sm.allCorrect};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章完成！';
    $('#cSub').textContent=(sm.allCorrect?'随堂全对通关 · ':'答完即结算 · ')+'今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('本章已结算过，可去下一章');
  return false;
}
function settleVol(c){
  var st=examStatus(c);
  if(!st.full){ toast('还有 '+(st.total-st.answered)+' 题没做完'); return false; }
  var k='vol_'+c.id;
  var first = !settleStore[k];
  if(first){
    dailyGoal('e');
    settleStore[k]={ts:Date.now(),correct:st.correct};
    store('settle',settleStore);
    stopTimer();
    $('#cTitle').textContent='第 '+c.id+' 章小卷完成！';
    $('#cSub').textContent='卷子已点亮 · 今日打卡 +1';
    $('#celebrate').classList.add('show');
    tap();
    return true;
  }
  toast('这份卷子已结算过');
  return false;
}

function resyncWrong(){
  Object.keys(quizStat).forEach(function(k){
    if(keyOk(k)&&quizStat[k]===0&&wrongPool.indexOf(k)===-1) wrongPool.push(k);
    if(keyOk(k)&&quizStat[k]===1&&fixedPool.indexOf(k)===-1&&wrongPool.indexOf(k)>-1) poolMove(k,true);
  });
  store('wrong',wrongPool); store('fixed',fixedPool);
}

/* ============================================================
   任务 1 · Interactive Pop：左缘拖动跟手 + 可打断 + 弹簧回正/飞出
   对应 iOS「照片 App 从全屏图右滑返回列表」原型。
   ============================================================ */
var popGuardUntil=0;
var pop={on:false,started:false,x0:0,y0:0,dx:0,cur:0,cancel:null,samples:[]};
function popCan(){
  return STACK.length>0 && window._cur && window._cur!=='home' && META[window._cur] && !dimEl.classList.contains('show');
}
function popApply(x){
  pop.cur=x; var W=pop.W||window.innerWidth;
  var s=1-(x/W)*.08;                       /* 前景随位移线性压到 0.92 */
  view.style.transform='translate3d('+x+'px,0,0) scale('+s+')';
  view.classList.toggle('pop-shadow',x>2);
}
function popReset(){
  pop.on=false; pop.started=false;
  view.style.transform=''; view.classList.remove('pop-shadow');
  document.body.classList.remove('pop-active');
  hideViewBack();
}
scroller.addEventListener('pointerdown',function(e){
  if(!popCan()) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  if(e.clientX>36) return;                  /* 仅屏幕左缘 36px 触发（iOS 手势热区） */
  if(pop.cancel){ pop.cancel(); pop.cancel=null; }  /* 打断进行中动画并接管 */
  pop.on=true; pop.started=false;
  pop.x0=e.clientX; pop.y0=e.clientY; pop.dx=0; pop.cur=0; pop.samples=[];
  pop.W=scroller.clientWidth;
  scroller.style.touchAction='none';        /* 拖拽期间禁浏览器滚动/缩放（任务5） */
  document.body.classList.add('pop-active');
  try{ scroller.setPointerCapture(e.pointerId); }catch(err){}
},true);
scroller.addEventListener('pointermove',function(e){
  if(!pop.on) return;
  var dx=e.clientX-pop.x0;
  if(!pop.started){
    if(Math.abs(e.clientY-pop.y0)>14){ popReset(); return; }  /* 变竖滚，放弃 */
    if(dx<6) return;                          /* 等位移过阈值再开始 */
  }
  pop.started=true;
  pop.dx=Math.max(0,dx);
  showViewBack();                             /* 背景页（已 scale .95 静态微缩）透出 */
  pop.samples.push({t:performance.now(),x:pop.dx});
  if(pop.samples.length>4) pop.samples.shift();
  popApply(pop.dx);
});
function popEnd(){
  if(!pop.on) return;
  pop.on=false;
  var W=pop.W||window.innerWidth;
  var vel=0;
  if(pop.samples.length>1){ var a=pop.samples[0],b=pop.samples[pop.samples.length-1];
    if(b.t>a.t) vel=(b.x-a.x)/(b.t-a.t); }    /* px/ms 松手速度 */
  var goFwd = pop.dx>W*.3 || vel>.5;          /* 位移>30%屏宽 或 速度>0.5px/ms → 完成 */
  scroller.style.touchAction='';
  if(goFwd){
    popGuardUntil=performance.now()+450;      /* 防手势后的误 click */
    pop.cancel=springTo(pop.dx,W,function(x){ popApply(x); },function(){
      pop.cancel=null; popReset(); popDone=true; goBack();
    });
  }else{
    pop.cancel=springTo(pop.dx,0,function(x){ popApply(x); },function(){
      pop.cancel=null; popReset();
    });
  }
}
scroller.addEventListener('pointerup',popEnd);
scroller.addEventListener('pointercancel',popEnd);
/* 任务 2 · 源卡片点击 → Magic Move 进详情（源与头图同名 mv-hero 自动 morph） */

/* 判题委托（chip 命名空间） */
scroller.addEventListener('click',function(e){
  var qz=e.target.closest('.opt[data-qz]');
  if(qz){ tap(); doQ(e,qz,'chapter'); return; }
  var ez=e.target.closest('.opt[data-ez]');
  if(ez){ tap(); doQ(e,ez,'exam'); return; }
  var rq=e.target.closest('[data-retry]');
  if(rq){ retryQ(+rq.getAttribute('data-retry'),'chapter'); return; }
  var rv=e.target.closest('[data-etry]');
  if(rv){ retryQ(+rv.getAttribute('data-etry'),'exam'); return; }
});
function doQ(e,opt,mode){
  if(opt.hasAttribute('data-lock')) return;
  var c = mode==='chapter'?chById(_lastNav.chapter||1):chById(_lastNav.exam||1);
  if(!c) return;
  var qs = mode==='chapter'?c.quiz:c.exam;
  var qi=+opt.getAttribute(mode==='chapter'?'data-qz':'data-ez');
  var oi=+opt.getAttribute('data-oi');
  var q=qs[qi]; if(!q) return;
  var ok=oi===q.answer;
  if(mode==='chapter') answerQuestion(c,qi,oi); else answerVol(c,qi,oi);
  var box=opt.parentNode;
  box.querySelectorAll('.opt').forEach(function(o){
    o.setAttribute('data-lock','1');
    var ii=+o.getAttribute('data-oi');
    if(ii===oi) o.classList.add(ok?'correct':'wrong');
    else if(ii===q.answer) o.classList.add('correct','muted');
    if(ii===q.answer){ var mk=o.querySelector('.mark'); if(mk) mk.style.display='inline-flex'; }
  });
  var wid=mode==='chapter'?'whyC':'whyE';
  var note=document.getElementById(wid+qi);
  if(note){
    note.className='why-note '+(ok?'why-ok':'why-no');
    note.innerHTML=ok
      ?'<div class="why-body"><span class="why-ic">'+IC('check')+'</span><span><b>答对了。</b>'+esc(q.explain||'')+'</span></div>'
      :'<div class="why-body"><span class="why-ic">'+IC('info')+'</span><span><b>答错，正确答案：「'+parseMath(q.options[q.answer])+'」</b><br>'+esc(q.explain||'')+'</span></div>'
        +(mode==='chapter'?'<button class="retry-btn" data-retry="'+qi+'">↻ 再答一次</button>':'<button class="retry-btn" data-etry="'+qi+'">↻ 再答一次</button>');
  }
  toast(ok?'✓ 答对':'看解析');
  if(mode==='chapter'&&chSummary(c).allDone&&!chIsDone(c)) setTimeout(function(){ settleChapter(c,'lesson'); },900);
  if(mode==='exam'&&examStatus(c).full) setTimeout(function(){ settleVol(c); },900);
}
function retryQ(qi,mode){
  tap();
  var c=mode==='chapter'?chById(_lastNav.chapter||1):chById(_lastNav.exam||1);
  if(!c) return;
  var key=mode==='chapter'?(c.id+'_'+qi):('e'+c.id+'_'+qi);
  delete quizStat[key]; store('quizStat',quizStat);
  var note=document.getElementById((mode==='chapter'?'whyC':'whyE')+qi);
  var sel=(mode==='chapter'?'[data-qz="'+qi+'"]':'[data-ez="'+qi+'"]');
  var box=note?note.parentNode:null;
  if(box){ box.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('correct','wrong','muted'); o.removeAttribute('data-lock'); var mk=o.querySelector('.mark'); if(mk) mk.style.display=''; }); }
  if(note){ note.className='why-note'; note.innerHTML=''; }
}

    +'<div style="font-size:22px;font-weight:800;margin-top:2px">'+esc(c.title)+(kind==='exam'?' · 小卷':'')+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px"><b>'+(kind==='exam'?(c.exam||[]).length+' 题卷':'随堂 '+sm.total+' 题')+'</b><span class="cap">答完自动结算</span></div>'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px"><b>参考计时</b><span class="cap">30 分钟 · 可挂后台</span></div>'
    +(sm.answered>0?'<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px"><b>进度</b><span class="cap">已答 '+sm.answered+'/'+sm.total+' · 继续</span></div>':'')
    +'</div>';
  document.getElementById('ssK3').innerHTML=rows;
  var el=document.getElementById('startSheetC3');
  el.classList.remove('show3'); el.style.display='block'; void el.offsetWidth;
  var go=function(){ el.classList.add('show3'); };
  if(window.requestAnimationFrame){ requestAnimationFrame(go); setTimeout(go,40); } else go();
  tap();
}
function closeStart(){ startC3=null; var el=document.getElementById('startSheetC3'); if(el){ el.classList.remove('show3'); setTimeout(function(){ if(el&&!el.classList.contains('show3')) el.style.display='none'; },540); } }
function beginStudy(){
  var ctx=startC3; if(!ctx) return;
  closeStart();
  if(ctx.kind==='exam'){ _lastNav.exam=ctx.id; go('exam',ctx.id); }
  else { _lastNav.chapter=ctx.id; _lastNav.mode=(ctx.kind==='drill')?'drill':'lesson'; go('chapter',ctx.id); }
}
document.addEventListener('click',function(e){
  if(e.target.closest('#ssGo3')){ beginStudy(); return; }
  if(e.target.closest('#ssNo3')||e.target.closest('.ssmask3')){ closeStart(); }
  if(e.target.closest('#bkGo3')){ bk3(true); return; }
  if(e.target.closest('#bkIn3')){ bk3(false); return; }
  if(e.target.closest('#wipe3')){ if(window.confirm('确定清除全部学习记录？不可恢复。')){ wipeAll(); toast('已清除'); } return; }
});
function bk3(exp){
  var ta=document.getElementById('bkText3');
  if(exp){
    var pack={ch:chDone,quizStat:quizStat,quizPick:quizPick,wrong:wrongPool,fixed:fixedPool};
    try{ ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(pack)))); ta.focus(); ta.select(); toast('备份码已生成，可复制'); }
    catch(e){ toast('生成失败'); }
  } else {
    var raw=(ta&&ta.value||'').trim();
    try{
      var pack=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(pack.ch) store('ch',pack.ch);
      if(pack.quizStat) store('quizStat',pack.quizStat);
      if(pack.quizPick) store('quizPick',pack.quizPick);
      if(pack.wrong) store('wrong',pack.wrong);
      if(pack.fixed) store('fixed',pack.fixed);
      toast('导入成功'); setTimeout(function(){ location.reload(); },500);
    }catch(e){ toast('备份码无效'); }
  }
}
function shareAcademy(){
  var url='https://ndshuge.github.io/ndshuge-academy/chip.html?v=chip3';
  function ok(){ toast('已复制学习链接'); }
  if(navigator.share){ navigator.share({title:'芯片战争学院',text:'跟我一起读《芯片战争》：',url:url}).catch(function(){}); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(ok,function(){ leg(url,ok); }); } else leg(url,ok);
}
function leg(txt,ok){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok&&ok(); }catch(e){} document.body.removeChild(ta); }
