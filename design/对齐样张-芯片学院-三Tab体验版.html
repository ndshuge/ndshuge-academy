<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>芯片学院 · 对齐样张 v2（iOS 26 玻璃语汇）</title>
<style>
/* ============================================================
   对齐样张 v2 · 设计令牌
   v2 升级（按评估结论）：
   1 按压反馈 = iOS 原生语言（按下高亮/变暗不位移，弃用缩放）
   2 玻璃通透化 + 高光描边（向 iOS 26 Liquid Glass 语汇靠，留七分保可读）
   3 功能图标 = 内联 SVG 线性图标（emoji 只留内容与状态语义）
   4 主页 = 内容流（单一焦点 + 横滑组），功能入口收敛给 Dock
   5 桌面细滚动条 / cell 17px / 返回键显示上一级标题
   ============================================================ */
:root{
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --bg:#F2F2F7; --bg-glow:#FFFFFF;
  --card:#FFFFFF; --fill:#E9E9EE; --fill-soft:rgba(120,120,128,.08);
  --ink:#1D1D1F; --ink2:#3C3C43; --muted:#86868B;
  --sep:rgba(60,60,67,.12);
  --green:#34C759; --green-soft:rgba(52,199,89,.13);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.1);
  --gold:#FF9500; --gold-soft:rgba(255,149,0,.16);
  --purple:#AF52DE; --purple-soft:rgba(175,82,222,.13);
  --glass:rgba(250,250,252,.62);            /* 通透：约六成，后层透出来 */
  --glass-edge:rgba(255,255,255,.5);        /* 玻璃高光描边 */
  --r-s:10px; --r-m:14px; --r-l:20px;
  --sh-card:0 1px 1.5px rgba(0,0,0,.02),0 2px 10px rgba(0,0,0,.035);
  --sh-float:0 14px 36px rgba(0,0,0,.16);
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#000; --bg-glow:#1C1C1E;
    --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
    --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
    --sep:rgba(84,84,88,.45);
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
    --green:#32D74B; --green-soft:rgba(48,209,88,.16);
    --red:#FF453A; --red-soft:rgba(255,69,58,.14);
    --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
    --purple:#BF5AF2; --purple-soft:rgba(191,90,242,.18);
    --glass:rgba(22,22,24,.55);
    --glass-edge:rgba(255,255,255,.14);
    --sh-card:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme=dark]{
  --bg:#000; --bg-glow:#1C1C1E;
  --card:#1C1C1E; --fill:#2C2C2E; --fill-soft:rgba(120,120,128,.16);
  --ink:#F5F5F7; --ink2:#C7C7CC; --muted:#8E8E93;
  --sep:rgba(84,84,88,.45);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
  --green:#32D74B; --green-soft:rgba(48,209,88,.16);
  --red:#FF453A; --red-soft:rgba(255,69,58,.14);
  --gold:#FF9F0A; --gold-soft:rgba(255,159,10,.18);
  --purple:#BF5AF2; --purple-soft:rgba(191,90,242,.18);
  --glass:rgba(22,22,24,.55);
  --glass-edge:rgba(255,255,255,.14);
  --sh-card:0 1px 2px rgba(0,0,0,.5);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro SC","Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:17px;line-height:1.5;color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,var(--bg-glow),transparent),var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
img{max-width:100%;display:block}

/* 图标基础（内联 SVG，currentColor） */
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1em;height:1em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 尺寸兜底：嵌在固定容器里的图标不被 em 值挤歪 */
.ch-num .ic{width:16px;height:16px}
.ch-row .chev .ic{width:14px;height:14px}
.opt .mark .ic{width:20px;height:20px}

#app{display:flex;flex-direction:column;height:100dvh}

/* ============ 顶部工具栏：通透玻璃 + 高光描边 ============ */
#topbar{
  flex:none;height:54px;display:flex;align-items:center;gap:8px;
  padding:0 10px 0 14px;position:relative;z-index:30;
  background:var(--glass);
  -webkit-backdrop-filter:blur(40px) saturate(1.7);backdrop-filter:blur(40px) saturate(1.7);
}
/* 玻璃下缘高光：先投影淡线再深分隔，制造厚度 */
#topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(var(--glass-edge),rgba(120,120,128,.25));
}
#topbar .backbtn{
  display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 12px 0 6px;
  border-radius:10px;font-size:16px;color:var(--accent);font-weight:500;
  background:var(--fill-soft);transition:background .18s var(--ease),color .18s;
}
#topbar .backbtn .ic{width:16px;height:16px;color:var(--accent)}
#topbar .backbtn:disabled{opacity:.35;cursor:default;color:var(--muted)}
#topbar .backbtn:disabled .ic{color:var(--muted)}
#topbar .brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.12;pointer-events:none;max-width:44%}
#topbar .brand b{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px}
#topbar .homebtn{
  margin-left:auto;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--accent);display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);
  transition:background .18s var(--ease);
}
#topbar .homebtn .ic{width:15px;height:15px}

/* 触屏按压：iOS 语言，按下高亮变暗，无位移无缩放 */
@media (hover:none){
  #topbar .backbtn:active,#topbar .homebtn:active{background:var(--fill)}
}
@media (hover:hover){
  #topbar .backbtn:hover,#topbar .homebtn:hover{filter:brightness(.92)}
}

/* ============ 舞台与滚动条（桌面细 overlay） ============ */
#stage{flex:1;position:relative;overflow:hidden}
#scroller{
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:140px;
  scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.45) transparent;
}
@media (hover:hover){
  #scroller::-webkit-scrollbar{width:8px}
  #scroller::-webkit-scrollbar-track{background:transparent}
  #scroller::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px;border:2px solid transparent;background-clip:content-box}
  #scroller::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.6);border:2px solid transparent;background-clip:content-box}
}
.view{padding:20px 16px 30px;max-width:900px;margin:0 auto;will-change:transform,opacity}
.view.push{animation:pushIn .38s var(--ease)}
.view.pushBack{animation:pushBackIn .38s var(--ease)}
@keyframes pushIn{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pushBackIn{from{opacity:.3;transform:translateX(-52px)}to{opacity:1;transform:none}}

.kick{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}
.h1{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:5px}
.h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.cap{font-size:12px;color:var(--muted)}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.4px}

.card{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);padding:16px}
.card + .card,.card + .stack{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
  padding:4px 11px;border-radius:16px;background:var(--fill);color:var(--ink2)}
.pill.gold{background:var(--gold-soft);color:#C93400}
.pill.green{background:var(--green-soft);color:#1E9E4A}
:root[data-theme=dark] .pill.gold{color:#FFD60A}
:root[data-theme=dark] .pill.green{color:#32D74B}
.pill.blue{background:var(--accent-soft);color:var(--accent)}

/* hover（仅鼠标）：轻上浮强调；触屏按压全部走高亮不位移 */
@media (hover:hover){
  .lift{transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .18s}
  .lift:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}
  .lift:active{transform:translateY(0);filter:brightness(.95)}
}
@media (hover:none){
  .lift:active{filter:brightness(.88)}
  .tile:active,.ch-row:active,.snap-card:active{background:var(--fill)}
}

/* ============ Dock：悬浮玻璃片，仅三 Tab ============ */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#dock .dockbar{
  pointer-events:auto;display:flex;align-items:center;justify-content:center;
  background:var(--glass);
  -webkit-backdrop-filter:blur(44px) saturate(1.8);backdrop-filter:blur(44px) saturate(1.8);
  border:1px solid var(--sep);
  box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:26px;padding:5px 6px;
}
.dock-btn{
  width:66px;height:52px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative;
  color:var(--muted);transition:transform .24s var(--ease-spring),color .2s;
}
.dock-btn .d-ico{width:24px;height:24px}
.dock-btn span{font-size:10px;font-weight:600;letter-spacing:.2px}
.dock-btn.on{color:var(--accent)}
.dock-btn.on .d-ico{transform:translateY(-1px)}
@media (hover:hover){
  .dock-btn:hover{transform:translateY(-8px) scale(1.13);color:var(--accent);background:var(--fill-soft)}
}
@media (hover:none){
  .dock-btn:active{filter:brightness(.75)}
}

/* ============ 主页：内容流 ============ */
.hero-card{
  background:var(--card);
  border-radius:var(--r-l);padding:24px;color:var(--ink);display:flex;flex-direction:column;gap:13px;
  position:relative;overflow:hidden;
  border:1px solid var(--sep);box-shadow:var(--sh-card);
}
/* 几何装饰：芯片线框，低调线条 + accent 圆点 */
.hero-card .deco{position:absolute;right:10px;top:10px;width:66px;height:66px;
  color:var(--sep-strong)}
.hero-card .deco .geo-line{stroke:currentColor;stroke-width:1.6;fill:none}
.hero-card .deco .geo-dot{fill:var(--accent)}
.hero-card .hk{font-size:12px;font-weight:800;letter-spacing:2.2px;color:var(--accent)}
.hero-card .next{font-size:22px;font-weight:800;line-height:1.32;letter-spacing:-.3px;
  padding-right:72px}
.hero-card .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-card .btn-go{
  margin-left:auto;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  padding:10px 20px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px var(--accent-soft);
}
.hero-card .btn-go .ic{width:15px;height:15px}
@media (hover:none){ .hero-card .btn-go:active{filter:brightness(.9)} }

/* 横滑组（App Store 式内容卷） */
.snap-row{
  display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.snap-row::-webkit-scrollbar{display:none}
.snap-card{
  flex:0 0 min(78%,340px);scroll-snap-align:start;border-radius:var(--r-m);
  background:var(--card);box-shadow:var(--sh-card);padding:16px;
  display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;overflow:hidden;
}
.snap-card .sc-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.snap-card .sc-ico .ic{width:20px;height:20px}
.snap-card b{font-size:16px;display:block;line-height:1.3}
.snap-card .cap{font-size:12.5px;line-height:1.45}
.snap-card .go{display:inline-flex;align-items:center;gap:3px;margin-top:auto;color:var(--accent);
  font-size:14px;font-weight:600;padding-top:4px}
.snap-card .go .ic{width:13px;height:13px}

/* 书架：最近章节直给 */
.ch-row{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);
  padding:12px 14px;min-height:60px;
}
.ch-row + .ch-row{margin-top:10px}
.ch-num{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#0A84FF,#5E5CE6);font-variant-numeric:tabular-nums}
.ch-row.done .ch-num{background:var(--green);color:#fff}
.ch-row.locked .ch-num{background:var(--fill);color:var(--muted)}
.ch-body{flex:1;min-width:0}
.ch-body b{font-size:17px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-body .cap{font-size:13px}
.ch-check{color:var(--green);flex:none;width:20px;height:20px}
.ch-row .chev{color:var(--sep-strong,var(--muted));width:16px;height:16px;opacity:.6}

/* 次级功能行（收敛后的小图标入口） */
.mini-row{display:flex;gap:8px;flex-wrap:wrap}
.mini-btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;
  background:var(--card);box-shadow:var(--sh-card);font-size:13.5px;font-weight:600;color:var(--ink2);
}
.mini-btn .ic{width:15px;height:15px;color:var(--accent)}
/* 主焦点大入口（章节课堂） */
.big-entry{
  width:100%;display:flex;align-items:center;gap:16px;text-align:left;
  border:1px solid var(--sep);box-shadow:var(--sh-card);
  padding:20px 22px;margin-top:16px;
}
.big-entry .be-ico{width:56px;height:56px;border-radius:16px;flex:none;display:flex;
  align-items:center;justify-content:center;color:var(--accent);
  background:transparent;border:1.5px solid var(--sep);
  box-shadow:inset 0 1px 0 var(--glass-edge,transparent)}
.big-entry .be-ico .ic{width:26px;height:26px}
.big-entry .be-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.big-entry .be-body b{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.big-entry .cap{font-size:13.5px;line-height:1.55;color:var(--muted)}
.big-entry .be-meta{margin-top:4px}
.big-entry .be-arrow{width:22px;height:22px;color:var(--sep-strong);flex:none}
.big-entry .be-arrow .ic{width:22px;height:22px}
@media (hover:none){ .mini-btn:active{background:var(--fill)} }

/* 课本章节页 / 讲义 / 题目（同 v1，字号微调） */
.lesson-body{font-size:17px;line-height:1.85;color:var(--ink)}
.lesson-body p{margin:14px 0}
.quote-box{background:var(--fill-soft);border-radius:var(--r-m);padding:16px 18px;margin:18px 0;
  border-left:4px solid var(--accent);font-size:16px;line-height:1.8;color:var(--ink2)}
.q-stem{font-size:18px;font-weight:600;line-height:1.5;margin:12px 0 6px}
.q-code{background:#1E1E1E;color:#D4D4D4;border-radius:12px;padding:14px 16px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13.5px;line-height:1.7;
  overflow-x:auto;margin:10px 0 14px;white-space:pre}
:root[data-theme=dark] .q-code{background:#0D0D0F;border:1px solid var(--sep)}
.opt{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border:1.5px solid var(--sep);border-radius:var(--r-m);
  padding:14px 16px;font-size:17px;margin-top:10px;transition:border-color .2s,background .2s;
}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .2s,color .2s}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.muted{opacity:.45}
.opt .mark{margin-left:auto;color:var(--green);width:22px;height:22px;display:none}
.opt.correct .mark{display:inline-flex}
/* 解析常驻卡：答题后固定在题下，不消失；:empty 自动隐藏 */
.why-note{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.7;
  display:flex;flex-direction:column;gap:10px}
.why-note:empty{display:none}
.why-note .why-body{display:flex;gap:9px;align-items:flex-start}
.why-note .why-ic{width:18px;height:18px;flex:none;margin-top:2px}
.why-ok{background:var(--green-soft);color:var(--ink)}
.why-ok .why-ic{color:#1E9E4A}
.why-no{background:var(--red-soft);color:var(--ink)}
.why-no .why-ic{color:var(--red)}
.why-note .why-body b{font-weight:700}
.retry-btn{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  font-size:14px;font-weight:600;color:var(--accent);padding:8px 16px;border-radius:10px;
  background:var(--card);box-shadow:var(--sh-card)}
@media (hover:none){ .retry-btn:active{filter:brightness(.9)} }
@media (hover:none){ .opt:active{background:var(--fill)} }
@media (hover:hover){ .opt:hover{border-color:var(--sep-strong,var(--sep))} }

/* 我的页：分组表（cell 17px 400，分隔线对齐文字左缘） */
.group{display:flex;flex-direction:column;border-radius:var(--r-m);overflow:hidden;
  background:var(--card);box-shadow:var(--sh-card);margin-top:12px}
.grow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  min-height:48px;padding:10px 16px;position:relative;background:var(--card);
}
.grow + .grow::before{content:"";position:absolute;left:61px;right:0;top:0;height:.5px;background:var(--sep)}
.grow .gi{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff}
.grow .gi .ic{width:18px;height:18px}
.grow b{font-size:17px;font-weight:400;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gv{font-size:15px;color:var(--muted)}
.grow .garr{color:var(--sep-strong,var(--muted));width:14px;height:14px;opacity:.7}
@media (hover:none){ .grow:active{background:var(--fill)} }
@media (hover:hover){ .grow:hover{background:var(--fill-soft)} }

/* 宫格 tile */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);
  padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left}
.tile .t-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .t-ico .ic{width:20px;height:20px}
.tile b{font-size:16px}
.tile .cap{font-size:12px;line-height:1.4}

/* 倒计时（同 v1） */
#timerBar{position:sticky;top:0;z-index:25;height:3px;background:var(--fill);overflow:hidden}
#timerBar i{display:block;height:100%;width:100%;background:var(--accent);transition:width 1s linear}
#timerChip{
  position:fixed;top:66px;right:16px;z-index:35;display:flex;align-items:center;gap:6px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-card);
  border-radius:20px;padding:6px 13px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;animation:chipIn .4s var(--ease-spring);
}
#timerChip .tdot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
#timerChip.warn .tdot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes chipIn{from{transform:translateY(-16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
#timerChip.out{animation:chipOut .25s var(--ease) forwards}
@keyframes chipOut{to{transform:translateY(-14px) scale(.92);opacity:0}}

/* 打卡月历 / 排行 / 称号 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;
  color:var(--muted);border-radius:10px}
.cal-day.lit{background:var(--green);color:#fff;font-weight:700}
.cal-day.today{box-shadow:0 0 0 2px var(--accent)}
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 2px}
.rank-row + .rank-row{border-top:.5px solid var(--sep)}
.rank-no{width:30px;font-size:15px;font-weight:700;color:var(--muted);text-align:center;flex:none}
.rank-row.me .rank-no{color:var(--accent)}
.rank-row b{font-size:16px;font-weight:500;flex:1}
.rank-row .cap{font-size:13px;font-variant-numeric:tabular-nums}
.rank-scale{margin-top:12px}
.rank-scale .rbar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.rank-scale .rbar i{display:block;height:100%;background:linear-gradient(90deg,#FFD60A,#FF9500);
  border-radius:4px;transition:width .8s var(--ease)}
.rank-scale .rrow{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--muted)}
.rank-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rank-step{font-size:12px;padding:4px 10px;border-radius:14px;background:var(--fill);color:var(--muted)}
.rank-step.on{background:var(--gold-soft);color:#C93400;font-weight:600}
:root[data-theme=dark] .rank-step.on{color:#FFD60A}

/* toast */
#toastBox{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:9px;max-width:420px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:11px 17px;font-size:14.5px;font-weight:500;box-shadow:var(--sh-float);
  animation:toastIn .4s var(--ease-spring)}
:root[data-theme=dark] .toast{background:#F2F2F7;color:#1D1D1F}
.toast .t-ic{width:18px;height:18px;flex:none}
.toast.leaving{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(16px) scale(.96);opacity:0}}

/* 结算（多邻国式，庆祝表情保留为内容符号） */
#celebrate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;text-align:center;padding:24px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#celebrate.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#celebrate .c-card{animation:pop .6s var(--ease-spring)}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#celebrate .c-ring{width:132px;height:132px;margin:0 auto;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(255,255,255,.22),0 14px 40px rgba(0,0,0,.35)}
#celebrate .c-ring i{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#30D158 0 72%,#FFD60A 72% 100%);animation:spinRing .9s var(--ease)}
@keyframes spinRing{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#celebrate .c-ring b{position:relative;z-index:2;width:104px;height:104px;border-radius:50%;
  background:var(--card);display:flex;align-items:center;justify-content:center}
#celebrate .c-ring b .ic{width:56px;height:56px;color:var(--green);stroke-width:2.2}
#celebrate h3{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.4px;margin-top:20px;
  animation:bounceIn .7s .15s var(--ease-spring) backwards}
#celebrate p{color:rgba(255,255,255,.88);font-size:16px;animation:fadeUp .5s .4s ease backwards}
#celebrate .btn-solid{background:#fff;color:#1D1D1F;font-weight:700;font-size:16px;padding:12px 30px;
  border-radius:14px;margin-top:20px;animation:fadeUp .5s .55s ease backwards}
#celebrate .btn-solid:active{filter:brightness(.9)}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

#confirmBox{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;flex-direction:column;
  align-items:stretch;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);
  border-top:1px solid var(--sep);box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);
  border-radius:24px 24px 0 0;animation:sheetUp .4s var(--ease-spring)}
#confirmBox.show{display:flex}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
#confirmBox .c-title{font-size:18px;font-weight:700;margin-bottom:4px}
#confirmBox .c-msg{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:16px}
#confirmBox .btn-row{display:flex;gap:10px}
#confirmBox .btn-solid{flex:1;background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  padding:14px;border-radius:14px;text-align:center}
#confirmBox .btn-line{flex:1;background:var(--fill);color:var(--ink);font-size:17px;font-weight:600;
  padding:14px;border-radius:14px;text-align:center}
#confirmBox .btn-solid:active,#confirmBox .btn-line:active{filter:brightness(.92)}

#demoTag{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:55;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);
  background:var(--glass);border:1px solid var(--sep);padding:3px 8px;border-radius:6px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
</style>
</head>

  <div id="topbar">
    <button class="backbtn" id="btnBack"><span class="ic" id="backIco"></span><span id="backTxt">返回</span></button>
    <div class="brand"><b id="brandName">芯片战争学院</b><span>CHIP WAR ACADEMY</span></div>

<script>
/* ============================================================

var $=function(s){return document.querySelector(s)};
var view=$('#view'), scroller=$('#scroller');

defI('doc','<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>');
defI('trophy','<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>');
defI('target','<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>');

defI('flag','<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>');
defI('flask','<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>');  /* code：芯片实验室 */
defI('chat','<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>');
defI('trash','<path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>');
defI('moon','<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>');
defI('phone','<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>');
defI('info','<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>');
defI('chev-r','<path d="m9 18 6-6-6-6"/>');
defI('check','<path d="M20 6 9 17l-5-5"/>');
defI('bolt','<path d="M15.914 4a1.5 1.5 0 0 0-2.474-1.561l-9 9A1.5 1.5 0 0 0 5.5 14h4.002a.5.5 0 0 1 .471.666L8.086 20a1.5 1.5 0 0 0 2.475 1.56l9-9A1.5 1.5 0 0 0 18.5 10h-3.997a.5.5 0 0 1-.472-.667z"/>');
defI('arrow-r','<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>');

function IC(name, cls){ return '<span class="ic '+(cls||'')+'">'+I[name]+'</span>'; }

/* 注入静态图标 */
function mountStaticIcons(){
  $('#backIco').innerHTML=I['back'];
  $('#portalIco').innerHTML=I['home'];
  $('#cCheck').innerHTML=I['check'];
  document.querySelectorAll('.d-ico').forEach(function(el){ var n=el.getAttribute('data-i'); if(I[n]) el.innerHTML=I[n]; });
}

/* ---------- 数据 ---------- */
var CH=[
  {id:1,t:'从钢到硅',done:true},{id:2,t:'开关',done:true},
  {id:3,t:'集成电路',done:false,open:true},{id:4,t:'起飞',done:false}
];
var STAT={chDone:2,chTotal:36,volDone:1,volTotal:36,streak:12,today:true};
var CAL_LIT={1:true,2:true,3:true,4:true,5:true,6:true,9:true,10:true,11:true,12:true,13:true,16:true,17:true,18:true,19:true,20:true,23:true,24:true,25:true,26:true,27:true,30:true};
var RANKLIST=[
  {n:'鼠哥',me:true,v:'已学 8 章 · 卷 3 份'},
  {n:'硅谷小霸王',v:'已学 5 章 · 卷 2 份'},
  {n:'封装测试工',v:'已学 3 章 · 卷 1 份'}
];
var LESSON3=[
  {p:'1958 年，德州仪器的基尔比把几个元件做在了一块锗片上，用金丝把它们连起来。几个月后，仙童的诺伊斯想出了更好的办法：既然晶体管本来就是用光刻做的，那为什么不直接在一整块硅片上把元件和连线一起印出来？'},

  {q:'集成电路为什么最终取代了分立元件电路？',code:'',opts:[
    {t:'因为单个芯片更便宜',ok:false,why:'起初并不是。诺伊斯的版本贵 50 倍，成本是劣势。'},
    {t:'因为可以在硅片上成批制造，单位成本随规模骤降',ok:true,why:'光刻把电路“印”在整片硅上，一片晶圆同时造几百颗芯片，量越大单颗越便宜，这才是它赢的原因。'},
    {t:'因为基尔比发明了更好的材料',ok:false,why:'材料还是硅，基尔比的贡献是把元件做在一块锗片上，不是发明新材料。'}
  ]},

    {t:'光刻机的零件',ok:false,why:'光刻机是制造工具，chip 指的是产品本身。'},

  ]}
];
var WRONG=[
  {t:'「摩尔定律」的原始表述是关于什么的？',tag:'常识',wrong:2},
  {t:'诺伊斯版集成电路相比基尔比版的本质优势？',tag:'第3章',wrong:1}
];

/* ---------- toast / 触感 ---------- */
function toast(msg){
  var box=$('#toastBox'); var el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="ic t-ic">'+I['check']+'</span><span>'+msg+'</span>';
  box.appendChild(el);
  if(box.children.length>2) box.removeChild(box.firstChild);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){el.remove()},300); },2400);
}
var isDesktop=matchMedia('(hover:hover) and (pointer:fine)').matches;
var isWin=/win/i.test(navigator.platform||(navigator.userAgentData&&navigator.userAgentData.platform)||'');
var canVibrate=matchMedia('(hover:none) and (pointer:coarse)').matches && !isWin && typeof navigator.vibrate==='function';
function tap(){ if(canVibrate){ try{navigator.vibrate(10)}catch(e){} } }

/* ---------- 路由：真历史栈 + 推入转场 + 返回键显示上一级标题 ---------- */
var STACK=[];
var META={
  home:{n:'首页',tab:'learn'},plan:{n:'学习计划',tab:'learn'},chapter:{n:'第 3 章 · 集成电路',tab:'learn'},
  hall:{n:'练习大厅',tab:'drill'},vol:{n:'小卷',tab:'drill'},wrong:{n:'错题集',tab:'drill'},fixed:{n:'已订正',tab:'drill'},
  mine:{n:'我的',tab:'mine'},rank:{n:'排行榜',tab:'mine'},calendar:{n:'打卡日历',tab:'mine'},
  honor:{n:'荣誉墙',tab:'mine'},lab:{n:'实验室',tab:'mine'},about:{n:'关于',tab:'mine'},manage:{n:'管理',tab:'mine'}
};
function renderView(id,isBack){
  var v=view;
  v.className='view '+(isBack?'pushBack':'push');
  v.innerHTML=renderers[id]?renderers[id]():'<div class="cap">页面不存在</div>';
  scroller.scrollTop=0;
  paintDock(id);
  var m=META[id]||{n:'芯片战争学院'};
  $('#brandName').textContent=m.n;
  /* 返回键：iOS 语义，显示上一级标题 */
  var prev=STACK.length?STACK[STACK.length-1]:null;
  if(prev && META[prev]){
    $('#backTxt').textContent=META[prev].n;
    $('#btnBack').disabled=false;
  }else{
    $('#backTxt').textContent='返回';
    $('#btnBack').disabled=true;
  }
  window._cur=id;
}
function go(id){
  if(window._cur===id) return;
  STACK.push(window._cur||'home');
  history.pushState({view:id},'');
  renderView(id,false);
}
function goBack(){
  if(!STACK.length){ toast('已经在最前面了'); return; }
  history.back();
}
window.addEventListener('popstate',function(e){
  var id=(e.state&&e.state.view)||'home';
  /* 学习计时中被浏览器回退/手势带走：推回本章并提示 */
  if(id!=='chapter' && window._cur==='chapter' && timerRunning){
    history.forward();
    toast('学习中：已回到章节，离开请点左上「返回」确认');
    return;
  }
  if(STACK.length && STACK[STACK.length-1]===id) STACK.pop();
  renderView(id,true);
});

/* 右滑返回 */
(function(){
  var sx=0,sy=0,swiping=false;
  scroller.addEventListener('touchstart',function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    swiping=(sx<window.innerWidth*0.3);
  },{passive:true});
  scroller.addEventListener('touchend',function(e){
    if(!swiping) return;
    var t=e.changedTouches[0]; var dx=t.clientX-sx,dy=t.clientY-sy;
    if(dx>70 && Math.abs(dy)<80){ tap(); guardedBack(); }
    swiping=false;
  },{passive:true});
})();

function paintDock(id){
  var m=META[id]||{}; var curTab=m.tab||'learn';
  document.querySelectorAll('.dock-btn').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-tab')===curTab);

scroller.addEventListener('click',function(e){
  /* 答错后“再选一次”：重置本题 */
  var retry=e.target.closest('[data-retry]');
  if(retry){
    tap();
    var rq=retry.getAttribute('data-retry');
    if(rq==='hall'){
      document.querySelectorAll('.opt[data-pq]').forEach(function(o){
        o.classList.remove('correct','wrong'); o.style.pointerEvents='';
        var m=o.querySelector('.mark'); if(m) m.style.display='none';
      });
      var hw=document.getElementById('hallWhy'); if(hw){ hw.className='why-note'; hw.innerHTML=''; }
      toast('再来一次');
    }else{
      var qb=document.getElementById('qbox'+rq);
      qb.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('correct','wrong','muted'); o.style.pointerEvents='';
        var m=o.querySelector('.mark'); if(m) m.style.display='none';
      });
      var wn=document.getElementById('whyNote'+rq); if(wn){ wn.className='why-note'; wn.innerHTML=''; }
      delete quizState.answers[rq];
    }
    return;
  }
  var opt=e.target.closest('.opt');
  if(opt){
    tap();
    var qAttr=opt.getAttribute('data-q');
    if(qAttr===null){
      /* 练习大厅占位示例题（data-pq）：判定 + 常驻解析 */
      var pi=opt.getAttribute('data-pq');
      if(pi!==null){
        var right=(+pi===0);
        opt.classList.add(right?'correct':'wrong');
        opt.style.pointerEvents='none';
        if(right && opt.querySelector('.mark')) opt.querySelector('.mark').style.display='inline-flex';
        if(!right){
          document.querySelectorAll('.opt[data-pq]').forEach(function(o){
            if(+o.getAttribute('data-pq')===0){ o.classList.add('correct','muted'); var m=o.querySelector('.mark'); if(m) m.style.display='inline-flex'; }
          });
        }
        var hw2=document.getElementById('hallWhy');
        if(right){
          hw2.className='why-note why-ok';
          hw2.innerHTML='<div class="why-body"><span class="why-ic">'+IC('check')+'</span><span><b>对。</b>关税是明牌，协议签署后日本半导体产业让出市场，产业格局才彻底改写。</span></div>';
          toast('✓ 答对');
        }else{
          hw2.className='why-note why-no';
          hw2.innerHTML='<div class="why-body"><span class="why-ic">'+IC('info')+'</span><span><b>答错了。</b>真正的转折点是 1986 年美日半导体协议：美国用关税逼日本让步，产业主导权开始易手。</span></div>'
            +'<button class="retry-btn" data-retry="hall">↻ 再选一次</button>';
          toast('看解析，再试一次');
        }
      }
      return;
    }
    var q=+qAttr,i=+opt.getAttribute('data-i');
    var opts=LESSON3.filter(function(b){return b.q})[q].opts;
    var ok=opts[i].ok;
    var box=document.getElementById('qbox'+q);
    box.querySelectorAll('.opt').forEach(function(o){
      o.style.pointerEvents='none';
      var oi=+o.getAttribute('data-i');
      if(oi===i) o.classList.add(ok?'correct':'wrong');
      else if(opts[oi].ok) o.classList.add('correct','muted');
      if(opts[oi].ok && o.querySelector('.mark')) o.querySelector('.mark').style.display='inline-flex';
    });
    quizState.answers[q]=ok;
    var correctTxt='';
    opts.forEach(function(o){ if(o.ok) correctTxt=o.t; });
    var note=document.getElementById('whyNote'+q);
    if(ok){
      note.className='why-note why-ok';
      note.innerHTML='<div class="why-body"><span class="why-ic">'+IC('check')+'</span><span><b>答对了。</b>'+opts[i].why+'</span></div>';
      toast('✓ 答对');
    }else{
      note.className='why-note why-no';
      note.innerHTML='<div class="why-body"><span class="why-ic">'+IC('info')+'</span><span><b>答错了，正确答案：「'+correctTxt+'」</b><br>'+opts[i].why+'</span></div>'
        +'<button class="retry-btn" data-retry="'+q+'">↻ 再选一次</button>';
      toast('看解析，再试一次');
    }
    var all=Object.keys(quizState.answers).length;
    if(all===2 && quizState.answers[0] && quizState.answers[1]){
      setTimeout(function(){ settleChapter(); },1200);
    }
    return;
  }
  var gBtn=e.target.closest('[data-go]');
  if(gBtn){
    tap();
    var g=gBtn.getAttribute('data-go');
    if(g==='back'){ goBack(); }
    else if(renderers[g]){ go(g); }
    else if(g==='portal'){ toast('样张里去总学院 = 跳四院门户'); }
    return;
  }
});

/* 全局导航守卫：计时学习中，离开当前学习页（返回/Tab/总学院/右滑）一律先弹确认 */
var leaveAfter=null,timerRunning=false;
function requestNav(action){
  if(window._cur==='chapter' && timerRunning){
    leaveAfter=action;
    $('#confirmMsg').textContent='本次学习计时还剩 '+fmtTime(timerLeft)+'。现在出去会丢失本次做题进度（已答题目不保留）。切后台（锁屏/换 App）则计时挂起，回来接着学。';
    $('#confirmBox').classList.add('show');
    return;
  }
  action();
}
function dismissConfirm(){ leaveAfter=null; $('#confirmBox').classList.remove('show'); }
$('#confirmStay').addEventListener('click',dismissConfirm);
$('#confirmLeave').addEventListener('click',function(){
  dismissConfirm();
  stopTimer();
  if(leaveAfter){ var f=leaveAfter; leaveAfter=null; f(); }
});
function guardedBack(){ requestNav(function(){ goBack(); }); }

/* 倒计时 */
var TIMER=30*60,timerLeft=TIMER,timerIv=null;
function fmtTime(s){ var m=Math.floor(s/60),r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function startTimer(){
  if(timerIv) return;
  timerLeft=TIMER;
  $('#timerBar').style.display='block';
  $('#timerChip').style.display='flex';
  $('#timerChip').classList.remove('out');
  updateTimerUI();
  timerIv=setInterval(function(){
    timerLeft--; updateTimerUI();
    if(timerLeft<=0){ stopTimer(); toast('30 分钟到，可继续作答，只是不再计时'); }
  },1000);
}
function stopTimer(){
  clearInterval(timerIv); timerIv=null; timerRunning=false;
  $('#timerBar').style.display='none';
  $('#timerChip').classList.add('out');
  setTimeout(function(){ $('#timerChip').style.display='none'; },260);
}
function updateTimerUI(){
  timerRunning=true;
  var el=$('#timerChip');
  el.innerHTML='<span class="tdot"></span>'+fmtTime(timerLeft);
  el.classList.toggle('warn',timerLeft<5*60);
  $('#timerBar i').style.width=(timerLeft/TIMER*100)+'%';
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden && timerIv){ clearInterval(timerIv); timerIv=null; }
  else if(!document.hidden && window._cur==='chapter' && timerRunning && !timerIv){
    timerIv=setInterval(function(){ timerLeft--; updateTimerUI(); if(timerLeft<=0){ stopTimer(); } },1000);
  }
});

    h+='<div class="'+cls+'">'+d+'</div>';
  }
  h+='</div></div>';
  return h;
};
renderers.rank=function(){
  var h='<div class="kick">LEADERBOARD</div><div class="h1">排行榜</div><div class="sub">比的是读了多少，不比百分比</div>';
  h+='<div class="card" style="border-radius:var(--r-l);padding:6px 16px">';

    h+='<div class="rank-row'+(r.me?' me':'')+'"><span class="rank-no">'+badge+'</span><b>'+r.n+'</b>'
      +'<span class="cap">'+r.v+'</span></div>';
  });
  h+='</div>';

};

  [['🚀','硅谷来客'],['⚡','百题斩'],['🎯','九成命中'],['🔒','晶圆领主']].forEach(function(b,bi){

  if(e.key==='Escape'){ $('#celebrate').classList.remove('show'); dismissConfirm(); }
});

history.replaceState({view:'home'},'');
