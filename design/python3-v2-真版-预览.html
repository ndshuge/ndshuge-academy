ight:1.12;pointer-events:none;max-width:44%}#topbar .brand b{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#topbar .brand span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.6px}#topbar .homebtn{  margin-left:auto;height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;  color:var(--accent);display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);  transition:background .18s var(--ease);}#topbar .homebtn .ic{width:15px;height:15px}/* 触屏按压：iOS 语言，按下高亮变暗，无位移无缩放 */@media (hover:none){  #topbar .backbtn:active,#topbar .homebtn:active{background:var(--fill)}}@media (hover:hover){  #topbar .backbtn:hover,#topbar .homebtn:hover{filter:brightness(.92)}}/* ============ 舞台与滚动条（桌面细 overlay） ============ */#stage{flex:1;position:relative;overflow:hidden}#scroller{  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:140px;  scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.45) transparent;}@media (hover:hover){  #scroller::-webkit-scrollbar{width:8px}  #scroller::-webkit-scrollbar-track{background:transparent}  #scroller::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:4px;border:2px solid transparent;background-clip:content-box}  #scroller::-webkit-scrollbar-thumb:hover{background:rgba(120,120,128,.6);border:2px solid transparent;background-clip:content-box}}.view{padding:20px 16px 30px;max-width:900px;margin:0 auto;will-change:transform,opacity}.view.push{animation:pushIn .38s var(--ease)}.view.pushBack{animation:pushBackIn .38s var(--ease)}@keyframes pushIn{from{opacity:.3;transform:translateX(60px)}to{opacity:1;transform:none}}@keyframes pushBackIn{from{opacity:.3;transform:translateX(-52px)}to{opacity:1;transform:none}}.kick{font-size:12px;font-weight:800;letter-spacing:1.8px;color:var(--accent);margin-bottom:8px}.h1{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:5px}.h2{font-size:22px;font-weight:700;letter-spacing:-.3px}.sub{font-size:15px;color:var(--muted);margin-bottom:18px;line-height:1.5}.cap{font-size:12px;color:var(--muted)}.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.4px}.card{background:var(--card);border-radius:var(--r-m);box-shadow:var(--sh-card);padding:16px}.card + .card,.card + .stack{margin-top:12px}.stack{display:flex;flex-direction:column;gap:12px}.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;  padding:4px 11px;border-radius:16px;background:var(--fill);color:var(--ink2)}.pill.gold{background:var(--gold-soft);color:#C93400}.pill.green{background:var(--green-soft);color:#1E9E4A}:root[data-theme=dark] .pill.gold{color:#FFD60A}:root[data-theme=dark] .pill.green{color:#32D74B}.pill.blue{background:var(--accent-soft);color:var(--accent)}/* hover（仅鼠标）：轻上浮强调；触屏按压全部走高亮不位移 */@media (hover:hover){  .lift{transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .18s}  .lift:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}  .lift:active{transform:translateY(0);filter:brightness(.95)}}@media (hover:none){  .lift:active{filter:brightness(.88)}  .tile:active,.ch-row:active,.snap-card:active{background:var(--fill)}}/* ============ Dock：悬浮玻璃片，仅三 Tab ============ */#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}#dock .dockbar{  pointer-events:auto;display:flex;align-items:center;justify-content:center;  background:var(--glass);  -webkit-backdrop-filter:blur(44px) saturate(1.8);backdrop-filter:blur(44px) saturate(1.8);  border:1px solid var(--sep);  box-shadow:inset 0 1px 0 var(--glass-edge),var(--sh-float);  border-radius:26px;padding:5px 6px;}.dock-btn{  width:66px;height:52px;border-radius:20px;display:flex;flex-direction:column;  align-it /* ===== 多邻国式答对庆祝 toast ===== */
.toast.ok{
  background:linear-gradient(135deg,#58CC02,#46A302);
  color:#fff;border-radius:18px;padding:13px 22px;
  box-shadow:0 10px 28px rgba(88,204,2,.45),0 2px 6px rgba(0,0,0,.12);
  border:1px solid rgba(255,255,255,.25);
  animation:duoPop .6s cubic-bezier(.34,1.8,.44,1), okPulse 1.4s ease .5s;
  position:relative;overflow:visible;
}
.toast.ok .tk{
  font-size:26px;line-height:1;font-weight:900;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);
  text-shadow:0 2px 0 rgba(0,0,0,.12);
}
.toast.ok .tt{font-size:16px;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 0 rgba(0,0,0,.1)}
@keyframes duoPop{
  0%{transform:translateY(90px) scale(.55);opacity:0}
  55%{transform:translateY(-8px) scale(1.08);opacity:1}
  75%{transform:translateY(3px) scale(.98)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes okPulse{
  0%,100%{box-shadow:0 10px 28px rgba(88,204,2,.45)}
  50%{box-shadow:0 12px 36px rgba(88,204,2,.75)}
}
.toast.ok .spark{
  position:absolute;left:50%;top:50%;font-size:17px;font-weight:700;
  pointer-events:none;opacity:0;animation:sparkFly .7s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes sparkFly{
  0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot,40deg))}
}
.toast.no{
  background:linear-gradient(135deg,#FF4D4D,#D70015);
  color:#fff;border-radius:16px;
  animation:noShake .5s cubic-bezier(.36,.07,.19,.97), noPulse 1.2s ease .5s;
}
.toast.no .t-ic{color:#fff}
@keyframes noShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px) rotate(-1deg)}
  40%{transform:translateX(6px) rotate(1deg)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}
@keyframes noPulse{
  0%,100%{box-shadow:0 10px 26px rgba(255,77,77,.4)}
  50%{box-shadow:0 12px 34px rgba(255,77,77,.7)}
}
/* ===== 代码题模块（CodeMirror 编辑器）质感样式 ===== */
.codebox{margin-top:12px;border:1px solid var(--sep);border-radius:18px;overflow:hidden;background:var(--bg);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05)}
.cb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(180deg,rgba(120,120,128,.10),rgba(120,120,128,.04));font-size:12.5px;flex-wrap:wrap;
  border-bottom:1px solid rgba(120,120,128,.10)}
.cb-head .lb{color:var(--ink2);font-weight:500;letter-spacing:.2px}
.cb-head .lb b{color:var(--ink)}
/* CodeMirror 编辑器本体：深色 darcula，圆角内嵌 */
.codebox .CodeMirror{height:auto;border-radius:0;font-family:ui-monospace,'Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace;
  font-size:14px;line-height:1.7;background:#282A36}
.codebox .CodeMirror-gutters{background:#24252e;border-right:1px solid rgba(255,255,255,.06)}
.codebox .CodeMirror-linenumber{color:rgba(255,255,255,.28);padding:0 10px 0 6px}
.codebox .CodeMirror-lines{padding:10px 0 12px}
.codebox .CodeMirror pre.CodeMirror-line, .codebox .CodeMirror pre.CodeMirror-line-like{padding:0 10px}
.codebox .CodeMirror-focused .CodeMirror-activeline-background{background:rgba(255,255,255,.05)}
.codebox .CodeMirror-cursor{border-left:2px solid #f8f8f2}
.codebox .CodeMirror-selected{background:rgba(255,255,255,.14)!important}
.codebox .CodeMirror-foldgutter-open,.codebox .CodeMirror-foldgutter-folded{color:rgba(255,255,255,.4)}
/* 代码区动作按钮：主判题、次运行、轻参考 */
.code-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--bg)}
.code-actions .mini-btn{height:34px;border:none;border-radius:11px;padding:0 15px;font:600 13px inherit;font-family:inherit;
  cursor:pointer;background:var(--fill-soft);color:var(--ink);box-shadow:none;display:inline-flex;align-items:center;gap:5px;
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
.code-actions .mini-btn:hover:not([disabled]){filter:brightness(.96)}
.code-actions .mini-btn:active:not([disabled]){transform:scale(.97)}
.code-actions .mini-btn[disabled]{opacity:.42;cursor:default}
/* 输出区：终端感 */
.pyout{display:none;margin:0;padding:12px 16px;background:#1b1c22;color:#e8e8ea;font-family:ui-monospace,Consolas,Menlo,monospace;
  font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-top:1px solid rgba(255,255,255,.07);
  max-height:240px;overflow:auto}
/* 状态条：判题反馈 */
.py-status{font-size:12.5px;line-height:1.7;padding:9px 16px;color:var(--ink2);border-top:1px solid var(--sep);
  display:flex;align-items:center;gap:6px}
.py-status.ok{color:var(--green);background:rgba(52,199,89,.06)}
.py-status.no{color:var(--red);background:rgba(255,59,48,.05)}
/* 代码填空（fill） */
.fill-code{margin:0;padding:12px 16px;background:#1b1c22;color:#e8e8ea;font-family:ui-monospace,Consolas,Menlo,monospace;
  font-size:13.5px;line-height:1.9;overflow-x:auto;white-space:pre}
.fill-code .fill-in{background:rgba(255,255,255,.12);color:#ffd76e;border:1px solid rgba(255,215,110,.45);border-radius:6px;
  font-family:inherit;font-size:13.5px;padding:1px 6px;width:auto;min-width:44px;text-align:center;outline:none}
.fill-code .fill-in:focus{border-color:#ffd76e;background:rgba(255,215,110,.18)}
.fill-tips{margin:8px 12px 2px;display:flex;flex-wrap:wrap;gap:6px}
/* 代码题头部 hint */
.code-hint{margin-top:6px;color:var(--muted);font-size:12.5px;line-height:1.7}
/* darcula 基础 token 微调保证可读 */
.codebox .cm-s-darcula.CodeMirror, .codebox .cm-s-darcula .CodeMirror-gutters{background:#282A36}
.codebox .cm-s-darcula .CodeMirror-guttermarker, .codebox .cm-s-darcula .CodeMirror-guttermarker-subtle{color:rgba(255,255,255,.35)}

/* placeholder：浅色引导 */
.codebox .CodeMirror-placeholder{color:rgba(255,255,255,.32);font-style:italic}
/* 代码区留白呼吸 */
.codebox .CodeMirror{margin:0}
.codebox .CodeMirror-lines{padding:14px 0 16px}
.codebox .CodeMirror pre.CodeMirror-line, .codebox .CodeMirror pre.CodeMirror-line-like{padding:0 12px}
.codebox .CodeMirror-linenumber{padding:0 12px 0 8px}
/* ============================================================
   UI 动效强化（chip 内容层 · 不删任何内容，纯增强）
   荣誉墙 / 做题界面 / 卡片入场 / 判题反馈
   ============================================================ */
/* ---- 卡片入场（整页切换后内容有序浮现） ---- */
@keyframes uiRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes uiPop{0%{opacity:0;transform:scale(.94) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
#view .card{animation:uiRise .5s cubic-bezier(.22,.9,.3,1) both}
#view .hero-card{animation:uiPop .55s cubic-bezier(.24,1.2,.4,1) both}
#view .big-entry,#view .tutor-card{animation:uiRise .55s cubic-bezier(.22,.9,.3,1) both}
#view .big-entry{animation-delay:.06s}
#view .tutor-card{animation-delay:.12s}

/* ---- 荣誉墙 ---- */
#legacy-honor .rank-step{animation:uiPop .4s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .hw-card{animation:uiPop .45s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .mh-card{animation:uiPop .45s cubic-bezier(.3,1.3,.4,1) both}
#legacy-honor .card h3 .rw{animation:uiRise .4s both}
/* 称号阶梯：完成=绿光呼吸；当前=金环脉冲 */
@keyframes rankBreath{0%,100%{box-shadow:0 0 0 0 rgba(74,107,74,.25)}50%{box-shadow:0 0 0 6px rgba(74,107,74,0)}}
#legacy-honor .rank-step.done{animation:rankBreath 2.4s ease-in-out infinite}
@keyframes goldPulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 0 2px rgba(255,149,0,.25)}50%{box-shadow:0 0 0 2px var(--gold),0 0 0 9px rgba(255,149,0,0)}}
#legacy-honor .rank-step.cur{animation:goldPulse 2s ease-in-out infinite}
/* 徽章墙：已解锁徽章柔和金光脉动；悬停浮起 */
@keyframes hwGlow{0%,100%{box-shadow:0 2px 10px rgba(184,134,11,.12)}50%{box-shadow:0 2px 16px rgba(184,134,11,.32)}}
#legacy-honor .hw-card.got{animation:uiPop .45s both,hwGlow 3s ease-in-out 1s infinite}
@media (hover:hover){
  #legacy-honor .hw-card,#legacy-honor .rank-step{
    transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,border-color .22s;
  }
  #legacy-honor .hw-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 22px rgba(0,0,0,.12)}
  #legacy-honor .rank-step:hover{transform:translateY(-2px)}
}
/* 名人堂：已点亮卡点击脉冲、悬停弹簧上浮 */
#legacy-honor .mh-card{transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .22s,filter .3s,opacity .3s}
#legacy-honor .mh-card.lit:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 26px rgba(184,134,11,.3)}
#legacy-honor .mh-card.lit:active{transform:translateY(0) scale(.97)}
@keyframes mhFlash{0%{box-shadow:0 0 0 0 rgba(255,149,0,.5)}100%{box-shadow:0 0 0 0 rgba(255,149,0,0)}}
#legacy-honor .mh-card.lit{animation:uiPop .4s both}
/* 名人头像旋转入场后的稳持（轻）。 */
#legacy-honor .mh-avatar{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#legacy-honor .mh-card.lit:hover .mh-avatar{transform:scale(1.08)}

/* ---- 做题界面：题目卡 & 选项反馈 ---- */
#legacy-chapter .quiz{animation:uiRise .45s cubic-bezier(.22,.9,.3,1) both}
@keyframes optPop{0%{transform:scale(.92)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes optShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}55%{transform:translateX(2px)}80%{transform:translateX(-1px)}}
/* framework 与 legacy 题选项共用 class：correct=绿弹、wrong=红抖 */
.opt.correct,#legacy-chapter .opt.correct{animation:optPop .5s cubic-bezier(.3,1.4,.4,1)}
.opt.wrong,#legacy-chapter .opt.wrong{animation:optShake .3s ease}
/* 判题批改条滑入 */
.why-note.why-ok,.why-note.why-no,#legacy-chapter .why-note.why-ok,#legacy-chapter .why-note.why-no{animation:uiRise .32s cubic-bezier(.22,.9,.3,1)}
/* 结算战报出现 */
#legacy-chapter .settle-wrap{animation:uiPop .5s cubic-bezier(.3,1.4,.4,1)}
/* 选项悬停：上浮 + 箭头感（桌面） */
@media (hover:hover){
  #legacy-chapter .opt:not([data-lock]):hover{
    transform:translateY(-2px) scale(1.012);
    box-shadow:0 6px 14px rgba(0,0,0,.08);
  }
}
/* 已锁定题卡轻轻压平，提示“已作答” */
#legacy-chapter .quiz.done{animation:uiRise .45s both}
@media (prefers-reduced-motion:reduce){ #view .card,#legacy-honor .rank-step,#legacy-honor .hw-card,#legacy-honor .mh-card,#legacy-chapter .quiz{animation:none} }
/* ============================================================
   统一按压语言（chip 内容层）：页面可点元素 = Dock 底栏同款动效
   桌面：hover 上浮 + 阴影；触屏：按下高亮（无位移，iOS 语言）
   仅作用于页面内容区 #view（topbar/dock 自带动效，不受影响）
   ============================================================ */
@media (hover:hover){
  #view button:not(:disabled),
  #view .opt:not([data-lock]),
  #view .mh-card.lit{
    transition:transform .22s var(--ease), box-shadow .22s var(--ease), filter .18s, background .18s, border-color .18s;
  }
  #view button:not(:disabled):hover,
  #view .opt:not([data-lock]):hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.07), 0 8px 20px rgba(0,0,0,.05);
  }
  #view button:not(:disabled):hover{
    filter:brightness(.985);
  }
  #view button:not(:disabled):active,
  #view .opt:not([data-lock]):active{
    transform:translateY(0) scale(.985);
    filter:brightness(.93);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  #view .mh-card.lit:active{
    transform:translateY(0) scale(.985);
    filter:brightness(.96);
  }
}
@media (hover:none){
  #view button:not(:disabled):active,
  #view .opt:not([data-lock]):active{
    filter:brightness(.85);
  }
  #view .mh-card.lit:active{
    filter:brightness(.9);
  }
}
/* 已锁定/不可点状态不参与按压 */
#view .opt[data-lock]{pointer-events:none}
#view button:disabled{pointer-events:none}

/* ============ topbar 左右按钮：Dock 三键同款丝滑动效 ============ */
#topbar .backbtn,#topbar .homebtn{
  transition:transform .24s var(--ease-spring), background .18s, box-shadow .2s, color .15s;
}
@media (hover:hover){
  #topbar .backbtn:hover,#topbar .homebtn:hover{
    transform:translateY(-2px) scale(1.06);
    background:var(--fill-soft);
    box-shadow:0 3px 8px rgba(0,0,0,.06);
    filter:none;
  }
  #topbar .backbtn:active,#topbar .homebtn:active{
    transform:translateY(0) scale(.97);
    filter:brightness(.92);
    box-shadow:none;
  }
}
@media (hover:none){
  #topbar .backbtn:active,#topbar .homebtn:active{
    background:var(--fill);
    transform:scale(.96);
    filter:none;
  }
}

   所有学院共用，禁止逐院改动；要改先改这里再全院重建。
   段：1 开始层  2 悬停v2  3 双层转场  4 圆角+导师卡  5 防缓存(在head)

/* 1) 开始做题层（Duolingo 式 bottom sheet） */
#startSheet{position:fixed;inset:0;z-index:90;display:none}
#startSheet.show{display:block}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .28s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-card{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;
  background:var(--card);border-radius:30px 30px 0 0;
  box-shadow:var(--sh-float);padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(110%);
  transition:transform .5s cubic-bezier(.33,1,.68,1);
  border-top:1px solid var(--sep);
  will-change:transform;
}
#startSheet.show .ss-card{transform:translateY(0)}
#startSheet .ss-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .32s var(--ease)}
#startSheet.show .ss-mask{opacity:1}
#startSheet .ss-grip{width:40px;height:4px;border-radius:2px;background:var(--fill);margin:0 auto 18px}
#startSheet .ss-kicker{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--accent)}
#startSheet .ss-title{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:4px;color:var(--ink)}
#startSheet .ss-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
#startSheet .ss-rows{margin-top:16px;display:flex;flex-direction:column;gap:10px}
#startSheet .ss-row{display:flex;align-items:center;gap:11px;background:var(--bg);border-radius:14px;padding:11px 14px}
#startSheet .ss-row .ic{width:20px;height:20px;color:var(--accent);flex:none}
#startSheet .ss-row .ic svg{width:100%;height:100%}
#startSheet .ss-row b{font-size:15px;font-weight:600;color:var(--ink)}
#startSheet .ss-row span{font-size:13px;color:var(--muted)}
#startSheet .ss-start{
  width:100%;height:52px;margin-top:18px;border-radius:16px;border:none;
  background:var(--accent);color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;
  font-family:inherit;cursor:pointer;
  box-shadow:0 6px 18px var(--accent-soft);transition:filter .18s var(--ease);
}
#startSheet .ss-start:hover{filter:brightness(.94)}
@media (hover:none){ #startSheet .ss-start:active{filter:brightness(.85)} }
#startSheet .ss-cancel{width:100%;height:44px;margin-top:8px;border:none;background:transparent;
  color:var(--muted);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:12px}
@media (hover:none){ #startSheet .ss-cancel:active{background:var(--fill-soft)} }
@media (min-width:640px){ #startSheet .ss-card{border-radius:30px;bottom:14px;padding-bottom:20px} }

/* 2) 悬停语言 v2（Dock 款：上浮+微 scale+阴影，鼠哥 2026-09-04 定稿）
   只对可点元素生效：ch-row/grow 必须带 data-go* 才有点击语义；不可点静态行一律无 hover */
.ch-row{transition:transform .2s var(--ease),background .16s var(--ease)}
.ch-row[data-go],.ch-row[data-go-ch],.ch-row[data-go-drill],.ch-row[data-go-exam]{cursor:pointer}
.ch-row[data-go]{cursor:pointer}
.grow{cursor:default}
.grow[data-go]{cursor:pointer}
@media (hover:hover){
  .dock-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .dock-btn:hover{transform:translateY(-6px) scale(1.09)}
  .lift{cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s var(--ease),color .18s,background .18s}
  .lift:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 6px 14px rgba(0,0,0,.05),0 12px 30px rgba(0,0,0,.1)}
  .lift:active{transform:translateY(0) scale(1);filter:brightness(.97)}
  .ch-row[data-go]:hover,.ch-row[data-go-ch]:hover,.ch-row[data-go-drill]:hover,.ch-row[data-go-exam]:hover{transform:translateY(-1px);background:var(--fill-soft)}
  .grow[data-go]:hover,.grow[data-wipe]:hover{background:var(--fill-soft)}
  .opt{transition:border-color .18s var(--ease),background .18s}
  .opt:hover{border-color:var(--sep-strong,var(--sep))}
  /* 小按钮：与底栏 Dock 同款（上浮 + 微放大 + 强调色 + 圆底） */
  .mini-btn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s}
  .mini-btn:hover{transform:translateY(-6px) scale(1.09);color:var(--accent);background:var(--fill-soft)}
}

/* 3) 上下层覆盖转场：每层为整屏不透明屏（上层滑入完全遮住下层 → 文字零杂糅），只动 transform */
#scroller{position:relative}
.x-screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;
  will-change:transform;pointer-events:none}
.x-wrap{max-width:900px;margin:0 auto;padding:20px 16px 30px}
#view{will-change:transform,opacity;backface-visibility:hidden}

/* 4) 圆角体系（无尖角）+ 导师卡 */
:root{--r-s:12px;--r-m:18px;--r-l:26px}
.card,.hero-card,.big-entry,.snap-card{border-radius:var(--r-l)}
.opt,.ch-row,.tile,.mini-btn,.why-note,.fillin,.q-code{border-radius:18px}
.tutor-card{
  display:flex;align-items:center;gap:16px;margin-top:16px;
  background:linear-gradient(135deg,var(--card),rgba(0,122,255,.045));
  border:1px solid var(--sep);border-radius:var(--r-l);
  box-shadow:var(--sh-card);padding:18px;text-align:left;width:100%;
}
.tutor-photo{width:76px;height:76px;border-radius:22px;flex:none;object-fit:cover;
  box-shadow:0 4px 12px rgba(0,0,0,.14);border:2px solid #fff}
.tutor-body{flex:1;min-width:0}
.tutor-cap{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--accent)}
.tutor-quote{font-size:15px;font-weight:600;line-height:1.55;margin-top:3px;color:var(--ink)}
.tutor-name{font-size:12px;color:var(--muted);margin-top:4px}
@media (min-width:640px){ .tutor-photo{width:88px;height:88px} .tutor-quote{font-size:16px} }

/* ===== 跳转按钮统一 Dock 款 hover（鼠哥 2026-09-04）：凡可点跳转的按钮同底栏手感 ===== */
@media (hover:hover){
  .btn-go,.btn-solid,.ss-start,.mini-btn,.retry-btn,.btn-line{
    transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s,filter .18s;
    cursor:pointer;
  }
  .btn-go:hover,.btn-solid:hover,.ss-start:hover,.mini-btn:hover,.retry-btn:hover,.btn-line:hover{
    transform:translateY(-6px) scale(1.09);
  }
  .btn-go:hover,.btn-solid:hover,.ss-start:hover{filter:brightness(.94)}
  .mini-btn:hover,.btn-line:hover{color:var(--accent);background:var(--fill-soft)}
  .backbtn,.homebtn{transition:transform .26s cubic-bezier(.34,1.56,.64,1),color .18s,background .18s,filter .18s}
  .backbtn:hover,.homebtn:hover{transform:translateY(-6px) scale(1.09);color:var(--accent);background:var(--fill-soft);filter:none}
}

/* ===== 列表行/宫格防文字挤压（2026-09-04：我的页修挤字） ===== */
.grow b{min-width:0}
.grow .gv{max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.tile .cap,.tile b{overflow-wrap:break-word}
#view b,#view .cap,#view .sub{overflow-wrap:break-word}

/* 刷题/列表行排版统一：标题单行省略 + 右侧动作胶囊 */
.ch-row .rt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-row .rta{flex:none;background:var(--accent-soft);color:var(--accent);font-size:12px;padding:4px 12px;border-radius:980px}
.ch-row .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

种修正，只要输出一致即可。", "explain_note": ""}, {"type": "choice", "q": "print(2 + 3 * 2) 输出？", "options": ["10", "8", "12", "7"], "answer": 1, "explain": "乘除先于加减：3*2=6，2+6=8。"}, {"type": "choice", "q": "哪行能正确输出带空格的问候？", "options": ["print(\"Hi\" + \"!\" )", "print(\"Hi\",\"Bob\")", "print(\"Hi\" \"Bob\")", "print(\"Hi\" - \"Bob\")"], "answer": 1, "explain": "逗号打印多项自动加空格。"}, {"type": "code", "q": "输出三行：第1行 python 第2行 是 第3行 有趣的", "code": "print(\"python\")\nprint(\"是\")\nprint(\"有趣的\")", "expect": "python\n是\n有趣的", "hint": "三行三个 print。"}, {"type": "choice", "q": "NameError 表示？", "options": ["名字拼错/未定义", "语法括号错", "数字溢出", "文件没保存"], "answer": 0, "explain": "NameError = 用了一个没定义的名字，多半拼错变量名。"}, {"type": "code", "q": "用两个 print 输出：5 + 3 = 8（前后两行分开打：先打 5 + 3 = 再打 8）", "code": "print(\"5 + 3 =\")\nprint(8)", "expect": "5 + 3 =\n8", "hint": "第一个 print 打字符串，第二个打数字。"}, {"type": "choice", "q": "代码第一行是 print(\"开始\") 第二行是 # 注释 第三行 print(\"结束\")，输出？", "options": ["开始 结束", "开始", "结束", "开始\n结束"], "answer": 3, "explain": "注释行不执行，两行 print 各输出一行。"}], "exam": [{"type": "choice", "q": "Python 是一门什么类型的语言？", "options": ["编译型", "解释型", "机器语言", "汇编语言"], "answer": 1, "explain": "解释型：边解释边执行，适合边写边试。"}, {"type": "choice", "q": "注释符号是？", "options": ["//", "/* */", "#", "--"], "answer": 2, "explain": "Python 用 # 表示注释。"}, {"type": "code", "q": "输出一行：你好，世界", "code": "print(\"你好，世界\")", "expect": "你好，世界", "hint": "print 加中文字符串。"}, {"type": "choice", "q": "报错信息里写着 line 3，意思是？", "options": ["程序要运行 3 次", "错误在第 3 行附近", "第 3 个变量错了", "文件只有 3 行"], "answer": 1, "explain": "line N 指错误出现在第 N 行附近，逐行往上找。"}, {"type": "code", "q": "（改错★）下面代码报 SyntaxError，请修正：print(\"加油!", "code": "print(\"加油!\")", "expect": "加油!", "hint": "字符串少了右引号，补上即可。"}, {"type": "choice", "q": "print(1 + 1) 输出什么？", "options": ["\"1 + 1\"", "11", "2", "报错"], "answer": 2, "explain": "数字相加就是数学加法，输出 2。"}, {"type": "code", "q": "输出乘法口诀第一行：1 x 1 = 1", "code": "print(\"1 x 1 = 1\")", "expect": "1 x 1 = 1", "hint": "整行作为字符串打印。"}, {"type": "choice", "q": "print(\"a\"
