, "answer": 2, "explain": "不能数字开头、不能有空格、class 是关键字。"}, {"type": "code", "q": "定义变量 w=6, h=4，输出矩形的面积（乘法用 *）", "code": "w = 6\nh = 4\nprint(w * h)", "expect": "24", "hint": "面积 = 长 × 宽。"}, {"type": "code", "q": "（改错★）下面代码报错，请修正让它输出 我今年 18 岁：age = 18; print(\"我今年 \" + age + \" 岁\")", "code": "age = 18\nprint(\"我今年 \" + str(age) + \" 岁\")", "expect": "我今年 18 岁", "hint": "字符串和 int 不能直接 +，用 str(age) 转换。"}, {"type": "choice", "q": "a = 5; b = a; b = 10; print(a) 输出？", "options": ["10", "5", "报错", "15"], "answer": 1, "explain": "b=a 把 5 复制给 b，之后改 b 不影响 a。"}, {"type": "choice", "q": "int(3.99) 返回？", "options": ["4", "3.99", "3", "报错"], "answer": 2, "explain": "int() 直接截断小数部分，不四舍五入。"}, {"type": "code", "q": "num = \"7\"，把它当数字加 3 输出", "code": "num = \"7\"\nprint(int(num) + 3)", "expect": "10", "hint": "先 int() 转换。"}, {"type": "choice", "q": "哪个变量名非法？", "options": ["_temp", "myVar2", "2fast", "中文名"], "answer": 2, "explain": "不能以数字开头。中文变量名合法但不推荐。"}, {"type": "code", "q": "摄氏 25 度 = 华氏多少度：F = C * 9 / 5 + 32，输出结果", "code": "C = 25\nF = C * 9 / 5 + 32\nprint(F)", "expect": "77.0", "hint": "25*9/5+32 = 77.0。"}, {"type": "choice", "q": "x = \"3.5\"; type(x) 是？", "options": ["float", "int", "str", "bool"], "answer": 2, "explain": "有引号就是字符串，不管内容像不像数字。"}], "exam": [{"type": "choice", "q": "type(\"42\") 返回？", "options": ["int", "float", "str", "list"], "answer": 2, "explain": "\"42\" 有引号是字符串。"}, {"type": "choice", "q": "x = 3.0 的类型是？", "options": ["int", "float", "str", "bool"], "answer": 1, "explain": "3.0 是小数即 float。"}, {"type": "code", "q": "把字符串 \"2026\" 转成整数并 +1 输出", "code": "n = int(\"2026\")\nprint(n + 1)", "expect": "2027", "hint": "int() 转换后再加。"}, {"type": "choice", "q": "下列哪行会报 TypeError？", "options": ["print(\"a\" + \"b\")", "print(\"a\" + 1)", "print(1 + 2)", "print(\"1\" + \"2\")"], "answer": 1, "explain": "字符串和整数不能直接相加。"}, {"type": "code", "q": "（思考★）身高 1.75 米存进变量 h，输出：身高 175.0 厘米", "code": "h = 1.75\nprint(\"身高\", h * 100, \"厘米\")", "expect": "身高 175.0 厘米", "hint": "米转厘米乘 100，1.75*100=175.0（float）。"}, {"type": "choice", "q": "int(\"3.14\") 会？", "options": ["返回 3", "返回 3.14", "报 ValueError", "返回 314"], "answer": 2, "explain": "\"3.14\" 不是整数字面量，int() 转换会抛 ValueError。"}, {"type": "code", "q": "交换两个变量：a=1,b=2 变成 a=2,b=1 并输出 a b", "code": "a, b = 1, 2\na, b = b, a\nprint(a, b)", "expect": "2 1", "hint": "Python 支持一行交换 a, b = b, a。"}, {"type": "choice", "q": "x = 5; x = \"五\"; print(type(x)) 输出？", "options": ["int", "str", "报错", "5"], "answer": 1, "explain": "变量可以重新赋不同类型，最后是字符串。"}, {"type": "code", "q": "把整数 99 转成字符串并与 \"分\" 拼接输出", "code": "s = str(99) + \"分\"\nprint(s)", "expect": "99分", "hint": "str() 转换后拼接。"}, {"type": "choice", "q": "float(\"abc\") 会？", "options": ["返回 0.0", "报 ValueError", "返回 abc", "返回 NaN"], "answer": 1, "explain": "非数字字符串转 float 抛 ValueError。"}]}, {"id": 3, "no": "Ⅲ", "title": "字符串方法", "weeks": "第 2 周", "diff": "★★☆", "full": true, "story": {"tutor": "格蕾丝·赫柏（Grace Hopper）", "era": "美国 · 编译先驱", "fact": "赫柏说「在编程里，与其道歉不如先验证」。她发明了最早的编译器之一，坚信人类该用接近自然语言的符号写程序。字符串处理正是程序员的日常：清洗、拼接、查找——机器读的和你读的，都是字符串。", "quote": "「生活中最容易的事情是说『做不到』。」—— Grace Hopper"}, "map": ["大小写三兄弟", "strip 清洗", "查找与替换", "拼接与拆解"], "sections": [{"t": "大小写：title/upper/lower", "p": "字符串方法是「值.方法()」。title() 每个词首字母大写、upper() 全大写、lower() 全小写。方法返回<strong>新字符串</strong>——原字符串不变，要保存结果得重新赋值。", "code": "name = \"ada lovelace\"\nprint(name.title())\nprint(name.upper())\nprint(name)          # 原串没变"}, {"t": "strip：清理两侧空白", "p": "数据常常带着多余空格（用户输入、文件读取）。strip() 去掉两侧空白，lstrip/rstrip 去左/右。习惯：读进来的字符串先 strip 再处理，避免 \"abc\" != \"abc \" 的坑。", "code": "s = \"  python  \"\nprint(s.strip())\nprint(s.lstrip())\nprint(s.rstrip())"}, {"t": "查找替换：find/replace", "p": "find(\"x\") 返回 x 第一次出现的位置（找不到返回 -1）；replace(a, b) 把所有 a 换成 b。还有 in 运算符判断「某串在不在里面」，返回 True/False。", "code": "msg = \"I love Python\"\nprint(msg.find(\"love\"))   # 2\nprint(\"Python\" in msg)    # True\nprint(msg.replace(\"love\", \"like\"))"}, {"t": "拼接与拆解", "p": "+ 拼接、join 用分隔符拼列表、split 按分隔符拆成列表。split/join 是数据清洗的黄金组合。", "code": "words = [\"2026\", \"09\", \"01\"]\nprint(\"-\".join(words))\ndate = \"2026-09-01\"\nprint(date.split(\"-\"))"}], "quiz": [{"type": "choice", "q": "\"hello\".upper() 返回？", "options": ["Hello", "HELLO", "hello", "报错"], "answer": 1, "explain": "upper() 全大写。"}, {"type": "choice", "q": "\"a b \".strip() 的结果是？", "options": ["\"a b\"", "\"ab\"", "\" a b\"", "\"a b \""], "answer": 0, "explain": "strip 只去两端空白，中间的保留。"}, {"type": "code", "q": "把名字 \"  xiao ming  \" 清理两侧空格并首字母大写输出", "code": "name = \"  xiao ming  \"\nprint(name.strip().title())", "expect": "Xiao Ming", "hint": "先 strip 再 title，链式调用。"}, {"type": "code", "q": "（思考★）判断邮箱是否合法小写：user@X.COM 转小写后判断是否包含 \"@\"，分别输出 合法/不合法", "code": "email = \"USER@X.COM\"\nif \"@\" in email.lower():\n    print(\"合法\")\nelse:\n    print(\"不合法\")", "expect": "合法", "hint": "lower() 后 in 判断。"}, {"type": "choice", "q": "\"hello world\".replace(\"l\",\"L\") 的结果含几个 L？", "options": ["1", "2", "3", "0"], "answer": 2, "explain": "hello 有 2 个 l、world 有 1 个 l，共 3 个 l 全部换成 L。"}, {"type": "choice", "q": "\"ABcd\".lower() == \"abcd\" 的返回？", "options": ["True", "False", "报错", "比较对象不同"], "answer": 0, "explain": "lower 后两边都是 abcd，相等为 True。"}, {"type": "code", "q": "把句子中所有的 2 换成 3：\"2 x 2 = 4\"", "code": "s = \"2 x 2 = 4\"\nprint(s.replace(\"2\", \"3\"))", "expect": "3 x 3 = 4", "hint": "replace 替换所有出现。"}, {"type": "choice", "q": "\"racecar\" 用 split(\"c\") 得到？", "options": ["[\"ra\",\"e\",\"ar\"]", "[\"r\",\"e\",\"r\"]", "[\"race\",\"car\"]", "报错"], "answer": 0, "explain": "按 c 拆成三节：ra、e、ar。", "note": ""}, {"type": "code", "q": "判断 \"python\" 是否在 \"I love python\" 中，输出 在 或 不在", "code": "s = \"I love python\"\nif \"python\" in s:\n    print(\"在\")\nelse:\n    print(\"不在\")", "expect": "在", "hint": "in 判断子串。"}, {"type": "choice", "q": "\"  a  b  \".strip() 结果是？", "options": ["\"a b\"", "\"a  b\"", "\"ab\"", "\"  a  b\""], "answer": 1, "explain": "strip 只去首尾空白，中间两个空格保留。"}], "exam": [{"type": "choice", "q": "\"PYTHON\".lower() 输出？", "options": ["PYTHON", "python", "Python", "报错"], "answer": 1, "explain": "lower 全小写。"}, {"type": "choice", "q": "\"banana\".replace(\"a\", \"o\") 输出？", "options": ["bonono", "banono", "banona", "报错"], "answer": 0, "explain": "replace 替换所有 a 为 o。"}, {"type": "code", "q": "s = \"  hello world  \"，strip 后 split 成单词，打印列表", "code": "s = \"  hello world  \"\nprint(s.strip().split(\" \"))", "expect": "['hello', 'world']", "hint": "注意输出的是列表字面量。"}, {"type": "choice", "q": "\"abc\".find(\"z\") 返回？", "options": ["0", "-1", "报错", "3"], "answer": 1, "explain": "找不到返回 -1。"}, {"type": "code", "q": "把 \"2026/09/01\" 按 / 拆开，输出中间的 09", "code": "d = \"2026/09/01\"\nprint(d.split(\"/\")[1])", "expect": "09", "hint": "split 得 [\"2026\",\"09\",\"01\"]，取下标 1。"}, {"type": "choice", "q": "\"python is fun\".title() 输出？", "options": ["Python Is Fun", "python is fun", "Python is fun", "PYTHON IS FUN"], "answer": 0, "explain": "title 每个单词首字母大写。"}, {"type": "code", "q": "（思考★）用户输入可能带空格和大小写，判断内容是否为 \"quit\"（容忍两侧空格和大写）", "code": "cmd = \"  QUIT  \"\nif cmd.strip().lower() == \"quit\":\n    print(\"退出\")\nelse:\n    print(\"继续\")", "expect": "退出", "hint": "先 strip 再 lower 再比较。"}, {"type": "choice", "q": "len(\"你好py\") 返回？", "options": ["4", "5", "6", "8"], "answer": 0, "explain": "len 数字符个数，\"你好\"2 个 + \"py\"2 个 = 4。"}, {"type": "code", "q": "取 \"python-2026\" 中 \"2026\"（用 split 按 - 拆）", "code": "s = \"python-2026\"\nprint(s.split(\"-\")[1])", "expect": "2026", "hint": "split(\"-\") 取下标 1。"}, {"type": "choice", "q": "\"hello\".find(\"ll\") 返回？", "options": ["1", "2", "3", "-1"], "answer": 1, "explain": "ll 从下标 2 开始：h(0)e(1)l(2)l(3)，find 返回 2。"}]}, {"id": 4, "no": "Ⅳ", "title": "f-string 与数字", "weeks": "第 2 周", "diff": "★★☆", "full": true, "story": {"tutor": "玛格丽特·汉密尔顿（Margaret Hamilton）", "era": "美国 · 阿波罗软件工程", "fact": "阿波罗登月导航软件总负责人汉密尔顿，最懂「数字的精度」：一个小数点能决定一次着陆。她推动的容错设计理念——程序要处理异常输入——至今仍是软件工程的基石。数字格式化和精度控制，就是她的战场。", "quote": "「在软件的世界里，出错不是选项。」—— Margaret Hamilton"}, "map": ["f-string 是什么", "格式化数字", "算术与优先级", "除法的两种结果"], "sections": [{"t": "f-string：把变量嵌进字符串", "p": "f 前缀 + 花括号：f\"{变量}\"。花括号里的表达式会先求值再变成字符串。比 + 拼接干净百倍，Python 3.6+ 标配。", "code": "name = \"鼠哥\"\nscore = 98\nprint(f\"{name} 考了 {score} 分\")\nprint(f\"明年 {score + 1} 分的目标\")"}, {"t": "格式化数字：对齐与精度", "p": "f\"{x:.2f}\" 保留两位小数；f\"{x:>6}\" 右对齐宽度 6；f\"{pct:.1%}\" 百分比。输出报表对齐、价格保留两位，全靠这些。", "code": "price = 3.14159\nprint(f\"{price:.2f}\")\nprint(f\"{price:8.2f}\")   # 右对齐宽 8\nprint(f\"{0.1856:.1%}\")    # 18.6%"}, {"t": "算术与优先级", "p": "+ - * /（真除法 7/2=3.5）//（整除 7//2=3）%（取余 7%2=1）**（幂）。优先级跟数学一样：括号 > 幂 > 乘除 > 加减。", "code": "print(7 / 2)   # 3.5\nprint(7 // 2)  # 3\nprint(7 % 2)   # 1\nprint(2 ** 3)  # 8"}, {"t": "整除与取余：秒转时分秒", "p": "// 取商、% 取余，配合能拆解单位：总秒数 → 小时/分钟/秒。这是「拆单位」的万能模板。", "code": "total = 3661\nh = total // 3600\nm = (total % 3600) // 60\ns = total % 60\nprint(f\"{h}时{m}分{s}秒\")   # 1时1分1秒"}], "quiz": [{"type": "choice", "q": "7 // 2 的结果是？", "options": ["3.5", "3", "4", "报错"], "answer": 1, "explain": "// 整除向下取整，7//2=3。"}, {"type": "choice", "q": "f\"{5 + 3}\" 输出？", "options": ["\"5 + 3\"", "8", "53", "报错"], "answer": 1, "explain": "花括号内表达式先算 5+3=8。"}, {"type": "code", "q": "x = 3.14159，用 f-string 保留两位小数输出", "code": "x = 3.14159\nprint(f\"{x:.2f}\")", "expect": "3.14", "hint": ":.2f 保留两位。"}, {"type": "code", "q": "（思考★）秒数 total = 90，输出格式 m 分 s 秒（90 秒 = 1 分 30 秒）", "code": "total = 90\nprint(f\"{total // 60}分{total % 60}秒\")", "expect": "1分30秒", "hint": "分钟 = total//60，秒 = total%60。"}, {"type": "choice", "q": "10 // 3 与 10 % 3 分别是？", "options": ["3 和 1", "3 和 0.333", "3.3 和 0.1", "1 和 3"], "answer": 0, "explain": "10=3*3+1，商 3 余 1。"}, {"type": "choice", "q": "f\"{3.5:.0f}\" 输出？", "options": ["3", "4", "3.5", "3.0"], "answer": 1, "explain": ".0f 保留 0 位小数并四舍五入到整数：3.5 → 4。"}, {"type": "code", "q": "f-string 输出 3 的平方是 9（用变量 x=3）", "code": "x = 3\nprint(f\"{x} 的平方是 {x ** 2}\")", "expect": "3 的平方是 9", "hint": "花括号内做运算。"}, {"type": "choice", "q": "7 % 2 == 1 用来判断什么？", "options": ["是否整除", "奇偶", "大小", "正负"], "answer": 1, "explain": "n%2 得 1 是奇数、0 是偶数，判奇偶的标准写法。"}, {"type": "code", "q": "把 0.1234 格式化成 12.3%（百分号一位小数）", "code": "print(f\"{0.1234:.1%}\")", "expect": "12.3%", "hint": ":.1% 自动乘 100 加 %。"}, {"type": "choice", "q": "(5 > 3) 的 print 结果是？", "options": ["True", "False", "1", "5"], "answer": 0, "explain": "比较运算返回布尔 True/False。"}], "exam": [{"type": "choice", "q": "17 % 5 的结果是？", "options": ["3", "2", "12", "3.4"], "answer": 1, "explain": "17 = 5*3 + 2，余 2。"}, {"type": "choice", "q": "f\"{name}!\" name=\"Hi\" 输出？", "options": ["Hi!", "{name}!", "Hi !", "报错"], "answer": 0, "explain": "花括号内 name 的值替换。"}, {"type": "code", "q": "输出 2 的 10 次方", "code": "print(2 ** 10)", "expect": "1024", "hint": "** 是幂运算。"}, {"type": "choice", "q": "下列哪个是浮点数？", "options": ["5", "\"5\"", "5.0", "5 + 0"], "answer": 2, "explain": "5.0 带小数点才是 float。"}, {"type": "code", "q": "a=5,b=2，输出 a 除以 b 的精确商（非整除）", "code": "a, b = 5, 2\nprint(a / b)", "expect": "2.5", "hint": "/ 是真除法。"}, {"type": "choice", "q": "f\"{12345:,}\" 输出？", "options": ["12345", "12,345", "12345,", "报错"], "answer": 1, "explain": ", 是千位分隔符。"}, {"type": "code", "q": "（思考★）一杯奶茶 12.5 元，买 3 杯打 9 折，用 f-string 输出总价（两位小数）", "code": "price = 12.5 * 3 * 0.9\nprint(f\"{price:.2f}\")", "expect": "33.75", "hint": "12.5*3=37.5，*0.9=33.75。"}, {"type": "choice", "q": "(2 + 3) * 4 ** 2 等于？", "options": ["80", "800", "44", "96"], "answer": 0, "explain": "先幂 4**2=16，再括号 5*16=80。"}, {"type": "code", "q": "a = 8, b = 3：输出 a 整除 b 的商和余数，格式 商X余Y", "code": "a, b = 8, 3\nprint(f\"商{a // b}余{a % b}\")", "expect": "商2余2", "hint": "8//3=2，8%3=2。"}, {"type": "choice", "q": "f\"{3 ** 2 + 1}\" 输出？", "options": ["10", "9 1", "91", "报错"], "answer": 0, "explain": "先算 3**2=9，+1=10。"}]}, {"id": 5, "no": "Ⅴ", "title": "列表基础", "weeks": "第 3 周", "diff": "★★☆", "full": true, "story": {"tutor": "范内瓦·布什（Vannevar Bush）", "era": "美国 · 信息组织先驱", "fact": "布什在 1945 年设想「记忆扩展机」Memex：把所有资料按关联组织起来，人能快速检索自己的知识。列表就是程序里最朴素的「资料柜」——按序存放、逐条处理。组织数据的方式，决定了你能多快找到它。", "quote": "「人类的经验，正在被压缩成可检索的形态。」—— Vannevar Bush"}, "map": ["列表是什么", "增删改查", "排序与长度", "遍历"], "sections": [{"t": "列表：有序的抽屉", "p": "列表用方括号，元素逗号分隔，可存任意类型混着存。索引从 0 开始：lst[0] 第一个，lst[-1] 最后一个。len() 数长度。", "code": "fruits = [\"苹果\", \"香蕉\", \"橙子\"]\nprint(fruits[0])\nprint(fruits[-1])\nprint(len(fruits))"}, {"t": "增删：append/insert/remove/pop", "p": "append 尾部加、insert(i,x) 插到 i、remove(x) 按值删第一个、pop() 尾部弹出并返回、del lst[i] 按下标删。改元素直接 lst[i]=新值。", "code": "t = [\"a\", \"b\"]\nt.append(\"c\")\nt.insert(1, \"x\")\nt.remove(\"a\")\nlast = t.pop()\nprint(t, last)"}, {"t": "排序与统计：sort/sorted/min/max/sum", "p": "lst.sort() 原地排序；sorted(lst) 返回新列表。min/max/sum 对数字列表很好用。reverse=True 倒序。字符串列表按字母排。", "code": "nums = [3, 1, 4, 1, 5]\nnums.sort()\nprint(nums)\nprint(max(nums), min(nums), sum(nums))"}, {"t": "遍历：for 的用法", "p": "for x in lst 逐个拿元素。配合 enumerate 能同时拿下标和值。遍历时别改列表长度（会漏项），要删先复制。", "code": "names = [\"Ada\", \"Grace\", \"Katherine\"]\nfor i, n in enumerate(names):\n    print(i, n)"}], "quiz": [{"type": "choice", "q": "lst = [10, 20, 30]，lst[-1] 是？", "options": ["10", "20", "30", "报错"], "answer": 2, "explain": "-1 是最后一个元素 30。"}, {"type": "choice", "q": "lst = [1,2,3]; lst.append(4) 后长度？", "options": ["3", "4", "5", "报错"], "answer": 1, "explain": "append 加一个元素，长度 3→4。"}, {"type": "code", "q": "建立列表 [5, 8, 2]，输出最大值与最小值（空格隔开）", "code": "lst = [5, 8, 2]\nprint(max(lst), min(lst))", "expect": "8 2", "hint": "max/min。"}, {"type": "choice", "q": "lst = [1,2,3]; lst.insert(0, 9) 后 lst[0]？", "options": ["1", "2", "9", "报错"], "answer": 2, "explain": "insert(0,9) 插到开头，9 成为第一个。"}, {"type": "code", "q": "lst = [3,1,2]，原地排序后打印", "code": "lst = [3, 1, 2]\nlst.sort()\nprint(lst)", "expect": "[1, 2, 3]", "hint": "sort() 原地排。"}, {"type": "choice", "q": "lst = [1,2,3,4]; lst.pop() 返回？", "options": ["4", "1", "3", "报错"], "answer": 0, "explain": "pop() 弹最后一个并返回 4。"}, {"type": "code", "q": "把 \"a\",\"b\",\"c\" 三个字符串放进列表并打印列表", "code": "lst = [\"a\", \"b\", \"c\"]\nprint(lst)", "expect": "['a', 'b', 'c']", "hint": "直接打印列表。"}, {"type": "choice", "q": "lst = [1,2,3]; print(sum(lst)) 输出？", "options": ["123", "6", "报错", "3"], "answer": 1, "explain": "sum 求和 1+2+3=6。"}, {"type": "code", "q": "（改错★）想删掉列表里第一个 \"x\"：lst = [\"x\",\"y\",\"x\"]，删除后打印", "code": "lst = [\"x\", \"y\", \"x\"]\nlst.remove(\"x\")\nprint(lst)", "expect": "['y', 'x']", "hint": "remove 只删第一个匹配。"}, {"type": "choice", "q": "lst = [2,4,6]; lst[1] = 10 后 lst 是？", "options": ["[2,10,6]", "[10,4,6]", "[2,4,10]", "报错"], "answer": 0, "explain": "下标 1 是第二个元素 4，改为 10。"}], "exam": [{"type": "choice", "q": "列表用什么符号？", "options": ["()", "[]", "{}", "<>"], "answer": 1, "explain": "列表是方括号。"}, {"type": "code", "q": "建立空列表，append 3 个数 7、8、9 后打印", "code": "lst = []\nlst.append(7)\nlst.append(8)\nlst.append(9)\nprint(lst)", "expect": "[7, 8, 9]", "hint": "逐个 append。"}, {"type": "choice", "q": "len([\"a\",\"b\",\"c\"]) 返回？", "options": ["2", "3", "4", "报错"], "answer": 1, "explain": "3 个元素长度 3。"}, {"type": "code", "q": "lst=[4,9,2]，输出 2 在不在列表（True/False）", "code": "lst = [4, 9, 2]\nprint(2 in lst)", "expect": "True", "hint": "in 判断成员。"}, {"type": "choice", "q": "lst=[1,2]; lst2=lst; lst2.append(3); lst 现在是？", "options": ["[1,2]", "[1,2,3]", "报错", "[2,1]"], "answer": 1, "explain": "lst2=lst 是同一个列表的别名，改 lst2 就是改 lst。"}, {"type": "code", "q": "lst=[10,20,30,40]，删除下标 2 的元素后打印", "code": "lst = [10, 20, 30, 40]\ndel lst[2]\nprint(lst)", "expect": "[10, 20, 40]", "hint": "del 按下标删。"}, {"type": "choice", "q": "lst=[1,3,2]; sorted(lst) 后 lst 是？", "options": ["[1,2,3]", "[1,3,2]", "报错", "[3,2,1]"], "answer": 1, "explain": "sorted 返回新列表，原列表不变。"}, {"type": "code", "q": "（思考★）有一组分数 [88,92,76,99]，输出 平均分（sum/len，保留整数）", "code": "scores = [88, 92, 76, 99]\nprint(sum(scores) // len(scores))", "expect": "88", "hint": "sum=355，//4=88。"}, {"type": "choice", "q": "lst=[]; for i in range(3): lst.append(i*i); lst 是？", "options": ["[0,1,2]", "[0,1,4]", "[1,4,9]", "[0,0,0]"], "answer": 1, "explain": "i=0,1,2 的平方 0,1,4。"}, {"type": "code", "q": "把列表 [\"b\",\"a\",\"c\"] 倒序（原地）后打印", "code": "lst = [\"b\", \"a\", \"c\"]\nlst.sort(reverse=True)\nprint(lst)", "expect": "['c', 'b', 'a']", "hint": "sort(reverse=True)。"}]}, {"id": 6, "no": "Ⅵ", "title": "列表进阶", "weeks": "第 3 周", "diff": "★★★", "full": true, "story": {"tutor": "芭芭拉·利斯科夫（Barbara Liskov）", "era": "美国 · 数据抽象", "fact": "利斯科夫是编程语言与数据抽象的奠基人之一。她教会行业一件事：数据怎么组织、操作怎么封装，决定代码能不能长大。切片、复制、推导式——这些列表进阶技巧，就是她那一代人为「处理成批数据」打磨的语法。", "quote": "「如果你想让系统可靠，就要让它的每个部分都简单。」—— Barbara Liskov"}, "map": ["切片", "复制陷阱", "列表推导式", "嵌套与拆分"], "sections": [{"t": "切片：截取一段", "p": "lst[a:b] 取下标 a 到 b-1（左闭右开）；[:3] 前三个、[2:] 从 2 到尾、[::2] 步长取、[::-1] 反转。切片返回新列表。", "code": "nums = list(range(10))\nprint(nums[2:5])\nprint(nums[:3])\nprint(nums[::2])\nprint(nums[::-1][:3])"}, {"t": "复制陷阱：浅拷贝 vs 深拷贝", "p": "b = a 只是别名；b = a[:] 或 list(a) 才是新列表。但列表里的列表（嵌套）切片只是浅拷贝，内层仍共享——改内层会传染。", "code": "a = [1, 2, 3]\nb = a[:]\nb.append(4)\nprint(a)   # [1,2,3] 不受影响\nc = [[1], [2]]\nd = c[:]\nd[0].append(9)\nprint(c)  # [[1,9],[2]] 内层被改了！"}, {"t": "列表推导式：一行造列表", "p": "[表达式 for x in 列表 if 条件] 把「循环+判断+收集」压成一行。nums 平方、只留偶数——推导式是 Python 招牌。", "code": "nums = [1, 2, 3, 4, 5]\nsq = [x * x for x in nums]\neven = [x for x in nums if x % 2 == 0]\nprint(sq, even)"}, {"t": "拆分与拼接：* 星号解包", "p": "first, *rest = lst 取首尾；* 能把列表摊开传参或合并：[*a, *b]。两列 zip 配对。", "code": "lst = [1, 2, 3, 4, 5]\nfirst, *rest = lst\nprint(first, rest)\nprint([0, *lst, 99])\npairs = list(zip([\"a\",\"b\"], [1,2]))\nprint(pairs)"}], "quiz": [{"type": "choice", "q": "nums=[0,1,2,3,4,5]; nums[1:4] 是？", "options": ["[0,1,2,3]", "[1,2,3]", "[1,2,3,4]", "[0,1,2]"], "answer": 1, "explain": "左闭右开：1,2,3。"}, {"type": "choice", "q": "b = a[:] 与 b = a 的区别？", "options": ["没区别", "前者新列表，后者别名", "前者报错", "后者报错"], "answer": 1, "explain": "切片复制出新列表，直接赋值是别名。"}, {"type": "code", "q": "nums=[1,2,3,4,5,6]，取所有偶数（步长）打印", "code": "nums = [1, 2, 3, 4, 5, 6]\nprint(nums[1::2])", "expect": "[2, 4, 6]", "hint": "从下标 1 开始步长 2。"}, {"type": "choice", "q": "[x*2 for x in range(4)] 结果是？", "options": ["[0,2,4,6]", "[2,4,6,8]", "[1,2,3,4]", "[0,1,2,3]"], "answer": 0, "explain": "0..3 各乘 2：0,2,4,6。"}, {"type": "code", "q": "用列表推导式生成 1 到 10 的平方列表并打印", "code": "print([x * x for x in range(1, 11)])", "expect": "[1, 4, 9, 16, 25, 36, 49, 64, 81, 100]", "hint": "range(1,11)。"}, {"type": "choice", "q": "lst=[1,2,3,4,5]; lst[::-1] 是？", "options": ["[1,2,3,4,5]", "[5,4,3,2,1]", "[1,3,5]", "报错"], "answer": 1, "explain": "负步长反转。"}, {"type": "code", "q": "first, *rest = [10,20,30,40]，打印 first 和 rest", "code": "first, *rest = [10, 20, 30, 40]\nprint(first)\nprint(rest)", "expect": "10\n[20, 30, 40]", "hint": "*rest 收剩余。"}, {"type": "choice", "q": "（思考★）a=[[1],[2]]; b=a[:]; b[0].append(9); a[0] 是？", "options": ["[1]", "[1,9]", "[9]", "报错"], "answer": 1, "explain": "切片浅拷贝，内层列表仍共享，a[0] 也被改成 [1,9]。"}, {"type": "code", "q": "用推导式：从 [1..10] 里挑出 3 的倍数打印", "code": "print([x for x in range(1, 11) if x % 3 == 0])", "expect": "[3, 6, 9]", "hint": "if 过滤。"}, {"type": "choice", "q": "list(zip([\"a\",\"b\"], [1,2])) 结果是？", "options": ["[(\"a\",1),(\"b\",2)]", "[[\"a\",\"b\"],[1,2]]", "[\"a1\",\"b2\"]", "报错"], "answer": 0, "explain": "zip 逐对打包成元组。"}], "exam": [{"type": "choice", "q": "nums[:5] 表示？", "options": ["前 5 个", "第 5 个起", "后 5 个", "5 到末尾"], "answer": 0, "explain": "[:5] 取前 5 个（下标 0-4）。"}, {"type": "code", "q": "s = \"python\"，用切片取后三个字母", "code": "s = \"python\"\nprint(s[-3:])", "expect": "hon", "hint": "负索引切片。"}, {"type": "choice", "q": "[x for x in range(10) if x % 2 == 1] 长度？", "options": ["4", "5", "6", "10"], "answer": 1, "explain": "1,3,5,7,9 五个奇数。"}, {"type": "code", "q": "把 [1,2] 和 [3,4] 合并成 [1,2,3,4]（用 * 解包）", "code": "a = [1, 2]\nb = [3, 4]\nprint([*a, *b])", "expect": "[1, 2, 3, 4]", "hint": "[*a, *b]。"}, {"type": "choice", "q": "lst=[1,2,3]; a,b,c=lst; b 是？", "options": ["1", "2", "3", "报错"], "answer": 1, "explain": "解包按顺序赋给 a,b,c。"}, {"type": "code", "q": "words=[\"a\",\"b\",\"c\"]，用 join 拼成 \"a-b-c\"", "code": "words = [\"a\", \"b\", \"c\"]\nprint(\"-\".join(words))", "expect": "a-b-c", "hint": "join 用分隔符连接。"}, {"type": "choice", "q": "（思考★）复制列表防止意外改原列表，最安全做法？", "options": ["b = a", "b = a.copy() 或 a[:]", "b = a.reverse()", "b = a.sort()"], "answer": 1, "explain": "copy()/切片创建独立副本；直接赋值是别名。"}, {"type": "code", "q": "用推导式生成 [10,20,...,50]（10 的倍数到 50）", "code": "print([x * 10 for x in range(1, 6)])", "expect": "[10, 20, 30, 40, 50]", "hint": "1..5 乘 10。"}, {"type": "choice", "q": "matrix=[[1,2],[3,4]]; matrix[0][1] 是？", "options": ["1", "2", "3", "4"], "answer": 1, "explain": "第 0 行第 1 列 = 2。"}, {"type": "code", "q": "把嵌套 [[1,2],[3,4]] 用双循环展平成一维并打印", "code": "m = [[1, 2], [3, 4]]\nflat = [x for row in m for x in row]\nprint(flat)", "expect": "[1, 2, 3, 4]", "hint": "嵌套推导式先 row 后 x。"}]}, {"id": 7, "no": "Ⅶ", "title": "if 与条件", "weeks": "第 4 周", "diff": "★★☆", "full": true, "story": {"tutor": "阿达·洛芙莱斯（Ada Lovelace）", "era": "英国 · 第一位程序员", "fact": "1843 年阿达给分析机写下的「程序」里，第一次描述了条件跳转：机器该在什么情况下走哪条路。她是「程序不只是算数，而是做决策」这个想法的第一人。if 就是现代程序每分钟做的决策。", "quote": "「机器的力量在于，它能按规则做出自己选择的动作。」—— Ada Lovelace"}, "map": ["if-else", "elif 链条", "比较与逻辑", "真值与陷阱"], "sections": [{"t": "if / else：程序会做选择了", "p": "if 条件为 True 执行缩进块；else 兜底。冒号和缩进是 Python 的语法，不是装饰。条件就是比较或布尔表达式。", "code": "score = 85\nif score >= 60:\n    print(\"及格\")\nelse:\n    print(\"不及格\")"}, {"t": "elif：多分支的排队", "p": "elif 从上往下查，命中一个就跳过剩下（短路）。顺序重要：先写窄条件、后写宽条件。", "code": "age = 15\nif age < 4:\n    price = 0\nelif age < 18:\n    price = 20\nelse:\n    price = 40\nprint(\"票价\", price)"}, {"t": "比较与逻辑：and/or/not", "p": "== != > < >= <=；and 全真才真、or 一真即真、not 取反。判断区间：18 <= age < 65 链式比较。", "code": "t = 25\nwarm = t > 20 and t < 30\ncold = not warm\nprint(warm, cold)"}, {"t": "真值：什么算 False", "p": "if x: 里 x 为 0、\"\"、[]、None 时都是 False，其他为 True。用 if not x: 判空很 Pythonic。别写 if x == True。", "code": "name = \"\"\nif not name:\n    print(\"名字是空的\")\nelse:\n    print(\"你好\", name)"}], "quiz": [{"type": "choice", "q": "x=5; if x>3: print(\"a\") else: print(\"b\") 输出？", "options": ["a", "b", "ab", "报错"], "answer": 0, "explain": "x>3 为真走 if。"}, {"type": "choice", "q": "elif 和多个独立 if 的区别？", "options": ["没区别", "elif 命中后跳过剩余，独立 if 都检查", "elif 更快", "elif 只能一次"], "answer": 1, "explain": "elif 链短路，独立 if 每个都判断。"}, {"type": "code", "q": "n = 7，偶数输出 偶数 否则输出 奇数", "code": "n = 7\nif n % 2 == 0:\n    print(\"偶数\")\nelse:\n    print(\"奇数\")", "expect": "奇数", "hint": "n%2==1 是奇数。"}, {"type": "choice", "q": "0 在布尔里是？", "options": ["True", "False", "报错", "None"], "answer": 1, "explain": "0 是 falsy。"}, {"type": "code", "q": "t = 25，若 20<t<30 输出 舒适，否则输出 不适", "code": "t = 25\nif 20 < t < 30:\n    print(\"舒适\")\nelse:\n    print(\"不适\")", "expect": "舒适", "hint": "链式比较。"}, {"type": "choice", "q": "not (3 > 2) 是？", "options": ["True", "False", "报错", "None"], "answer": 1, "explain": "3>2 为 True，not True=False。"}, {"type": "code", "q": "s = \"hi\"，若 s 为空输出 空，否则输出 s 内容", "code": "s = \"hi\"\nif not s:\n    print(\"空\")\nelse:\n    print(s)", "expect": "hi", "hint": "if not s 判空。"}, {"type": "choice", "q": "age=18; if age<4 先判断，再 elif age<18，再 else。age=18 走哪？", "options": ["if", "elif", "else", "都不走"], "answer": 2, "explain": "18 不小于 4 也不小于 18，落 else。"}, {"type": "code", "q": "（改错★）想判断 x 是否 5<x<10，写成 if x>5 or x<10 对吗？修正后对 x=7 输出 在区间", "code": "x = 7\nif 5 < x < 10:\n    print(\"在区间\")\nelse:\n    print(\"不在\")", "expect": "在区间", "hint": "or 会恒真，用链式比较。"}, {"type": "choice", "q": "if x: 与 if x == True: 的关系？", "options": ["等价", "if x: 看真值更通用", "后者更快", "后者报错"], "answer": 1, "explain": "if x: 接受任何真值（数字/容器），if x==True 只认 True。"}], "exam": [{"type": "choice", "q": "score=59; if score>=60 输出？", "options": ["及格", "不及格", "都不", "报错"], "answer": 1, "explain": "59<60 走 else。"}, {"type": "code", "q": "a=10,b=20 输出较大的数", "code": "a, b = 10, 20\nif a > b:\n    print(a)\nelse:\n    print(b)", "expect": "20", "hint": "比较输出。"}, {"type": "choice", "q": "x=3,y=3; x==y 是？", "options": ["True", "False", "报错", "3"], "answer": 0, "explain": "== 比较相等。"}, {"type": "code", "q": "grade = \"B\"，若是 A 输出 优秀，是 B 输出 良好，否则 加油", "code": "grade = \"B\"\nif grade == \"A\":\n    print(\"优秀\")\nelif grade == \"B\":\n    print(\"良好\")\nelse:\n    print(\"加油\")", "expect": "良好", "hint": "elif 链条。"}, {"type": "choice", "q": "[] 在 if 里的真值是？", "options": ["True", "False", "报错", "None"], "answer": 1, "explain": "空容器是 falsy。"}, {"type": "code", "q": "light = True；若为真输出 开灯，否则 关灯", "code": "light = True\nif light:\n    print(\"开灯\")\nelse:\n    print(\"关灯\")", "expect": "开灯", "hint": "布尔直接判断。"}, {"type": "choice", "q": "age=17; can = age >= 18; print(can) 输出？", "options": ["True", "False", "报错", "17"], "answer": 1, "explain": "17>=18 为 False。"}, {"type": "code", "q": "（思考★）判断闰年：能被 4 整除且不被 100 整除，或能被 400 整除。y=2024 输出", "code": "y = 2024\nif (y % 4 == 0 and y % 100 != 0) or y % 400 == 0:\n    print(\"闰年\")\nelse:\n    print(\"平年\")", "expect": "闰年", "hint": "复合条件。"}, {"type": "choice", "q": "“if not done:” 中 done=False 会？", "options": ["执行", "不执行", "报错", "None"], "answer": 0, "explain": "not False=True 执行。"}, {"type": "code", "q": "n=0；if n 输出 非零，else 输出 零", "code": "n = 0\nif n:\n    print(\"非零\")\nelse:\n    print(\"零\")", "expect": "零", "hint": "0 为假走 else。"}]}, {"id": 8, "no": "Ⅷ", "title": "字典与嵌套", "weeks": "第 4 周", "diff": "★★★", "full": true, "story": {"tutor": "林纳斯·托瓦兹（Linus Torvalds）", "era": "芬兰 · Linux 与 Git 作者", "fact": "托瓦兹说「坏程序员担心代码，好程序员担心数据结构和它们的关系」。字典就是「键→值」的映射——查名字出电话、查国家出首都。程序一半的优雅，来自选对了数据结构。", "quote": "「我真的是个优雅主义者：如果代码不够优雅，我就睡不着。」—— Linus Torvalds"}, "map": ["字典是什么", "增删改查", "遍历", "get 与嵌套"], "sections": [{"t": "字典：按键取值", "p": "dict = {键: 值}。用 d[\"key\"] 取值，d[\"new\"]=v 新增或改。键要不可变类型（字符串/数字），值随意。", "code": "user = {\"name\": \"Ada\", \"age\": 36}\nprint(user[\"name\"])\nuser[\"city\"] = \"London\"\nuser[\"age\"] = 37\nprint(user)"}, {"t": "增删：del 与 in", "p": "del d[\"k\"] 删键；\"k\" in d 判断键在不在。删不存在的键会 KeyError，先 in 判断或 pop。", "code": "d = {\"a\": 1, \"b\": 2}\ndel d[\"a\"]\nprint(d)\nprint(\"b\" in d, \"a\" in d)"}, {"t": "遍历：items/keys/values", "p": "d.items() 给 (键,值) 对、d.keys()、d.values()。for k, v in d.items() 是遍历标配。", "code": "d = {\"math\": 90, \"py\": 95}\nfor k, v in d.items():\n    print(k, v)\nprint(list(d.values()))"}, {"t": "get 与嵌套：安全取值", "p": "d.get(\"k\", 默认) 找不到给默认不报错。值可以是字典（嵌套），取深层 d[\"a\"][\"b\"] 前先确认外层在。", "code": "d = {\"math\": 90}\nprint(d.get(\"eng\", 0))\nusers = {\"ada\": {\"age\": 36, \"city\": \"London\"}}\nprint(users[\"ada\"][\"city\"])"}], "quiz": [{"type": "choice", "q": "d={\"a\":1,\"b\":2}; d[\"a\"] 是？", "options": ["1", "2", "\"a\"", "报错"], "answer": 0, "explain": "按键取 1。"}, {"type": "choice", "q": "d[\"c\"] 当键不存在会？", "options": ["返回 None", "报 KeyError", "自动创建", "返回 0"], "answer": 1, "explain": "直接访问不存在键抛 KeyError。"}, {"type": "code", "q": "建字典 score={\"math\":90}，把 math 改成 95 并打印 score", "code": "score = {\"math\": 90}\nscore[\"math\"] = 95\nprint(score)", "expect": "{'math': 95}", "hint": "赋值覆盖。"}, {"type": "choice", "q": "d.items() 遍历给什么？", "options": ["只有键", "只有值", "(键,值) 对", "索引"], "answer": 2, "explain": "items 给键值对。"}, {"type": "code", "q": "d = {\"x\": 1}，安全取 \"y\"，没有给默认 99 并打印", "code": "d = {\"x\": 1}\nprint(d.get(\"y\", 99))", "expect": "99", "hint": "get 带默认。"}, {"type": "choice", "q": "\"math\" in {\"math\":90,\"py\":95} 是？", "options": ["True", "False", "报错", "看值"], "answer": 0, "explain": "in 判断键是否存在。"}, {"type": "code", "q": "遍历 d={\"a\":10,\"b\":20} 逐行输出 键=值", "code": "d = {\"a\": 10, \"b\": 20}\nfor k, v in d.items():\n    print(f\"{k}={v}\")", "expect": "a=10\nb=20", "hint": "f-string 内嵌。"}, {"type": "choice", "q": "del d[\"k\"] 对不存在键会？", "options": ["静默", "KeyError", "创建", "返回 None"], "answer": 1, "explain": "删不存在键抛 KeyError。"}, {"type": "code", "q": "（思考★）字典嵌套取国家首都：world={\"中国\":{\"首都\":\"北京\"}}，输出 北京", "code": "world = {\"中国\": {\"首都\": \"北京\"}}\nprint(world[\"中国\"][\"首都\"])", "expect": "北京", "hint": "逐层取。"}, {"type": "choice", "q": "下面哪个不能当字典键？", "options": ["\"name\"", "123", "(1,2)", "[1,2]"], "answer": 3, "explain": "列表可变不可哈希，不能当键。"}], "exam": [{"type": "choice", "q": "d={}; d[\"a\"]=1; d 现在是？", "options": ["{\"a\":1}", "{\"a\"}", "报错", "[]"], "answer": 0, "explain": "给不存在键赋值即新增。"}, {"type": "code", "q": "建字典 person={\"name\":\"Ada\",\"age\":36}，打印 name", "code": "person = {\"name\": \"Ada\", \"age\": 36}\nprint(person[\"name\"])", "expect": "Ada", "hint": "按键取。"}, {"type": "choice", "q": "len({\"a\":1,\"b\":2,\"c\":3}) 是？", "options": ["3", "6", "报错", "1"], "answer": 0, "explain": "len 数键的个数。"}, {"type": "code", "q": "d={\"x\":1,\"y\":2}；用 pop 删 \"x\" 并打印删除的值和剩余 d", "code": "d = {\"x\": 1, \"y\": 2}\nv = d.pop(\"x\")\nprint(v)\nprint(d)", "expect": "1\n{'y': 2}", "hint": "pop 返回被删值。"}, {"type": "choice", "q": "for k in d: 遍历的是？", "options": ["键", "值", "键值对", "索引"], "answer": 0, "explain": "默认遍历键。"}, {"type": "code", "q": "把列表 [\"a\",\"b\"] 的每项计出现次数用字典：{\"a\":1,\"b\":1} 手写并打印", "code": "cnt = {}\nfor ch in [\"a\", \"b\"]:\n    cnt[ch] = cnt.get(ch, 0) + 1\nprint(cnt)", "expect": "{'a': 1, 'b': 1}", "hint": "get 计数模式。"}, {"type": "choice", "q": "d.get(\"z\") 无 \"z\" 返回？", "options": ["报错", "None", "0", "\"\""], "answer": 1, "explain": "get 无默认返回 None。"}, {"type": "code", "q": "d={\"tall\":180}；在 \"tall\" 存在且 >170 时输出 高个", "code": "d = {\"tall\": 180}\nif \"tall\" in d and d[\"tall\"] > 170:\n    print(\"高个\")", "expect": "高个", "hint": "先 in 再取。"}, {"type": "choice", "q": "dict(a=1,b=2) 创建的是？", "options": ["{\"a\":1,\"b\":2}", "{\"a,b\":1}", "报错", "[1,2]"], "answer": 0, "explain": "dict() 关键字建字典。"}, {"type": "code", "q": "（思考★）三科成绩 {\"m\":90,\"e\":85,\"p\":95} 求平均并输出整数", "code": "s = {\"m\": 90, \"e\": 85, \"p\": 95}\nprint(sum(s.values()) // len(s))", "expect": "90", "hint": "values 求和平均。"}]}, {"id": 9, "no": "Ⅸ", "title": "while 与输入", "weeks": "第 5 周", "diff": "★★★", "full": true, "story": {"tutor": "丹尼斯·里奇（Dennis Ritchie）", "era": "美国 · C 语言之父", "fact": "里奇和汤普森写 Unix 时，把「循环等待输入」变成操作系统的日常：一遍遍问用户想要什么，处理完再问。while 是这种「服务循环」的骨架——程序不是跑一次就死，而是活着等你下一个指令。", "quote": "「Unix 很朴素：每个程序做好一件事。」—— Dennis Ritchie"}, "map": ["while 循环", "input 输入", "累加器", "菜单循环"], "sections": [{"t": "while：条件为真就循环", "p": "while 条件: 循环体。每轮先查条件。必须让条件最终变 False（改循环变量），否则死循环。", "code": "n = 1\nwhile n <= 3:\n    print(n)\n    n += 1"}, {"t": "input：等用户说话", "p": "input(\"提示\") 显示提示并等回车，返回<strong>字符串</strong>。要数字先 int()。输入空白也回车会得到 \"\"。", "code": "name = input(\"你的名字？\")\nprint(\"你好\", name)"}, {"t": "累加器：边循环边攒", "p": "total 存和、count 计数：每轮 total += x、count += 1。循环结束算平均 total/count。", "code": "nums = [5, 8, 3]\ntotal = 0\nfor x in nums:\n    total += x\nprint(total)"}, {"t": "菜单循环：服务模式", "p": "while True 里给选项 → 处理 → 用户说退出就 break。这是 CLI 工具的标准骨架。", "code": "while True:\n    cmd = input(\"输入 quit 退出：\").strip()\n    if cmd == \"quit\":\n        print(\"再见\")\n        break"}], "quiz": [{"type": "choice", "q": "n=1; while n<4: print(n); n+=1 打印几次？", "options": ["3", "4", "2", "无限"], "answer": 0, "explain": "n=1,2,3 三次。"}, {"type": "choice", "q": "while 循环忘记让条件变化会？", "options": ["报错", "死循环", "跳过", "运行一次"], "answer": 1, "explain": "条件恒真则死循环。"}, {"type": "code", "q": "用 while 打印 1 到 5（每行一个）", "code": "n = 1\nwhile n <= 5:\n    print(n)\n    n += 1", "expect": "1\n2\n3\n4\n5", "hint": "n+=1 是刹车。"}, {"type": "choice", "q": "input() 返回的类型是？", "options": ["int", "str", "float", "list"], "answer": 1, "explain": "input 恒返回字符串。"}, {"type": "code", "q": "累加器：nums=[2,4,6] 求和并打印", "code": "nums = [2, 4, 6]\ntotal = 0\nfor x in nums:\n    total += x\nprint(total)", "expect": "12", "hint": "for 累加。"}, {"type": "choice", "q": "while True: 里放什么能退出？", "options": ["continue", "break", "pass", "return 无"], "answer": 1, "explain": "break 跳出循环。"}, {"type": "code", "q": "（模拟输入判题）把模拟用户输入当列表处理：inp=[\"5\",\"quit\"]，逐项读，遇到 quit 停止并输出 停止", "code": "inp = [\"5\", \"quit\"]\nfor cmd in inp:\n    if cmd == \"quit\":\n        print(\"停止\")\n        break", "expect": "停止", "hint": "模拟菜单循环（真实 input 版见讲义）。"}, {"type": "choice", "q": "int(input(\"年龄：\")) 输入 18 返回？", "options": ["\"18\"", "18", "报错", "18.0"], "answer": 1, "explain": "int() 转换后是整数。"}, {"type": "code", "q": "n=10；while n>0 时每次减 2，循环里 print(n)，输出序列", "code": "n = 10\nwhile n > 0:\n    print(n)\n    n -= 2", "expect": "10\n8\n6\n4\n2", "hint": "10,8,...,2。"}, {"type": "choice", "q": "死循环里想立即跳出的写法？", "options": ["if x: continue", "break 在某条件", "pass", "exit"], "answer": 1, "explain": "条件满足时 break 跳出。"}], "exam": [{"type": "choice", "q": "for 与 while 场景：不确定循环几次（等用户退出）用？", "options": ["for", "while", "都行但 while 更合适", "都行但 for 更合适"], "answer": 2, "explain": "次数未知用 while。"}, {"type": "code", "q": "用 while 求 1+2+...+10 并打印", "code": "n = 1\ntotal = 0\nwhile n <= 10:\n    total += n\n    n += 1\nprint(total)", "expect": "55", "hint": "累加 55。"}, {"type": "choice", "q": "x=3; while x: print(x); x-=1 打印？", "options": ["3 2 1", "3 2 1 0", "无限", "3 2 1 0 -1"], "answer": 0, "explain": "x=3,2,1 后 x=0 为假停。"}, {"type": "code", "q": "nums=[4,4,4]；用 while（下标）求和输出", "code": "nums = [4, 4, 4]\ni = 0\ntotal = 0\nwhile i < len(nums):\n    total += nums[i]\n    i += 1\nprint(total)", "expect": "12", "hint": "下标 while。"}, {"type": "choice", "q": "用户输入带空格的 \" 5 \"，int(\" 5 \") 会？", "options": ["报错", "5", "\" 5 \"", "0"], "answer": 1, "explain": "int() 容忍首尾空白。"}, {"type": "code", "q": "（模拟猜数字）target=7，把模拟输入列表 [\"3\",\"9\",\"7\"] 逐个比较，小了/大了/中了（中了就停）", "code": "target = 7\ninp = [\"3\", \"9\", \"7\"]\nfor v in inp:\n    n = int(v)\n    if n < target:\n        print(\"小了\")\n    elif n > target:\n        print(\"大了\")\n    else:\n        print(\"中了\")\n        break", "expect": "小了\n大了\n中了", "hint": "模拟 input 流的菜单循环。"}, {"type": "choice", "q": "total=0; for i in range(1,5): total+=i; 最后 total？", "options": ["10", "15", "9", "报错"], "answer": 0, "explain": "1+2+3+4=10。"}, {"type": "code", "q": "用 while 从 5 倒数打印到 1（每行一个）", "code": "n = 5\nwhile n >= 1:\n    print(n)\n    n -= 1", "expect": "5\n4\n3\n2\n1", "hint": "n>=1 递减。"}, {"type": "choice", "q": "输入 \"25\"，int(input())/5 的结果？", "options": ["5.0", "5", "25", "报错"], "answer": 0, "explain": "25/5=5.0（真除法返回浮点）。"}, {"type": "code", "q": "（模拟）命令流 [\"skip\",\"quit\"]：skip 打印 跳过，quit 打印 再见并停", "code": "inp = [\"skip\", \"quit\"]\nfor cmd in inp:\n    if cmd == \"skip\":\n        print(\"跳过\")\n        continue\n    if cmd == \"quit\":\n        print(\"再见\")\n        break", "expect": "跳过\n再见", "hint": "continue 跳本轮，break 出循环。"}]}, {"id": 10, "no": "Ⅹ", "title": "循环控制", "weeks": "第 5 周", "diff": "★★★", "full": true, "story": {"tutor": "约翰·麦卡锡（John McCarthy）", "era": "美国 · 人工智能之父", "fact": "麦卡锡 1958 年就提出「通过程序操作程序的程序」。控制流是程序的骨架：break 及时止损、continue 跳过噪音、嵌套循环处理二维数据。会控制循环的程序员，写的代码像指挥家。", "quote": "「程序会按照你写的方式运行，而不是你想的方式。」"}, "map": ["break 与 continue", "range 步长", "嵌套循环", "else 与陷阱"], "sections": [{"t": "break：及时止损", "p": "break 立刻跳出当前循环。找第一个满足的、读到退出指令——break 是「够了就停」。", "code": "nums = [3, 8, 1, 9]\nfor x in nums:\n    if x > 5:\n        print(\"找到\", x)\n        break"}, {"t": "continue：跳过这一轮", "p": "continue 结束本轮直接进下一轮。打印非 3 的倍数、跳过空行——continue 是「这个不算，下一个」。", "code": "for i in range(1, 7):\n    if i % 3 == 0:\n        continue\n    print(i)   # 1 2 4 5"}, {"t": "range 步长：精确控制", "p": "range(a, b, s) 从 a 到 b-1 每步 s。range(5) 0..4；range(2,10,2) 2,4,6,8；倒着 range(5,0,-1)。", "code": "print(list(range(1, 10, 2)))\nprint(list(range(5, 0, -1)))"}, {"t": "嵌套循环：二维处理", "p": "外循环行、内循环列。乘法表就是经典：每行内层打整行，外层换行。", "code": "for i in range(1, 4):\n    for j in range(1, 4):\n        print(i * j, end=\" \")\n    print()"}], "quiz": [{"type": "choice", "q": "for x in range(10): if x==3: break; print(x) 打印到几？", "options": ["3", "0 1 2", "0 1 2 3", "4"], "answer": 1, "explain": "x=3 时 break，只打印 0 1 2。"}, {"type": "choice", "q": "continue 的作用？", "options": ["退出循环", "跳到下一轮", "报错", "什么都不做"], "answer": 1, "explain": "跳过本轮剩余进下一轮。"}, {"type": "code", "q": "打印 1 到 10 中不是 5 的倍数的数（一行一个）", "code": "for i in range(1, 11):\n    if i % 5 == 0:\n        continue\n    print(i)", "expect": "1\n2\n3\n4\n6\n7\n8\n9", "hint": "跳过 5、10。"}, {"type": "choice", "q": "list(range(1, 8, 2)) 是？", "options": ["[1,2,3,4,5,6,7]", "[1,3,5,7]", "[2,4,6,8]", "[1,3,5]"], "answer": 1, "explain": "步长 2：1,3,5,7。"}, {"type": "code", "q": "用嵌套循环打印 2 行 3 列，每格打 #，换行分割", "code": "for r in range(2):\n    line = \"\"\n    for c in range(3):\n        line += \"#\"\n    print(line)", "expect": "###\n###", "hint": "行内拼接。"}, {"type": "choice", "q": "在 while True 菜单里退出用什么？", "options": ["continue", "break", "pass", "exit()"], "answer": 1, "explain": "break 跳出循环结束菜单。"}, {"type": "code", "q": "找第一个能被 7 整除的数（从 8 开始试）并打印", "code": "x = 8\nwhile True:\n    if x % 7 == 0:\n        print(x)\n        break\n    x += 1", "expect": "14", "hint": "8..13 不行，14 是。"}, {"type": "choice", "q": "list(range(5, 0, -1)) 是？", "options": ["[1,2,3,4,5]", "[5,4,3,2,1]", "[]", "报错"], "answer": 1, "explain": "负步长倒着来。"}, {"type": "code", "q": "（思考★）nums=[1,2,3] 找 2：找到输出 在位置1 并用 break；没找到输出 没有", "code": "nums = [1, 2, 3]\nfound = False\nfor i, v in enumerate(nums):\n    if v == 2:\n        print(f\"在位置{i}\")\n        found = True\n        break\nif not found:\n    print(\"没有\")", "expect": "在位置1", "hint": "enumerate 带下标。"}, {"type": "choice", "q": "for-else 的 else 何时执行？", "options": ["循环正常结束（无 break）", "循环任何结束", "break 后", "从不"], "answer": 0, "explain": "for/while 的 else 在没被 break 打断时执行。"}], "exam": [{"type": "choice", "q": "range(4) 生成？", "options": ["[1,2,3,4]", "[0,1,2,3]", "[4]", "报错"], "answer": 1, "explain": "range(n) 0..n-1。"}, {"type": "code", "q": "打印 10 以内奇数（1,3,5,7,9）用 range 步长", "code": "for i in range(1, 10, 2):\n    print(i)", "expect": "1\n3\n5\n7\n9", "hint": "range(1,10,2)。"}, {"type": "choice", "q": "循环里 pass 的作用？", "options": ["跳出", "占位不做", "跳到下轮", "报错"], "answer": 1, "explain": "pass 空语句占位，常配 TODO。"}, {"type": "code", "q": "打印九九乘法表第 3 行（3x1..3x3，格式 3x1=3 空格隔开）", "code": "for j in range(1, 4):\n    print(f\"3x{j}={3*j}\", end=\" \")\nprint()", "expect": "3x1=3 3x2=6 3x3=9 ", "hint": "end=\" \" 不换行。"}, {"type": "choice", "q": "for i in range(3): for j in range(2): … 内层共执行几次？", "options": ["5", "6", "9", "2"], "answer": 1, "explain": "3×2=6 次。"}, {"type": "code", "q": "从 100 向下找第一个能被 9 整除的数", "code": "x = 100\nwhile x >= 0:\n    if x % 9 == 0:\n        print(x)\n        break\n    x -= 1", "expect": "99", "hint": "99 是最大被 9 整除的。"}, {"type": "choice", "q": "输出 0..10 偶数时用 continue 跳过奇数，等价于？", "options": ["range(0,11,2)", "range(1,11,2)", "range(11)", "for 里 if 不跳"], "answer": 0, "explain": "continue 版与 range 步长版等价。"}, {"type": "code", "q": "（思考★）打印 1..6 但每个数后面接它的平方，如 1:1，每行一个", "code": "for i in range(1, 7):\n    print(f\"{i}:{i*i}\")", "expect": "1:1\n2:4\n3:9\n4:16\n5:25\n6:36", "hint": "f-string。"}, {"type": "choice", "q": "nums=[1,3,7]; for x in nums: if x==5: break else 会执行吗？", "options": ["会", "不会", "报错", "不一定"], "answer": 0, "explain": "没遇到 break（5 不存在），else 执行。"}, {"type": "code", "q": "嵌套循环输出 3 行递减：第 i 行打 (3-i) 个 * ", "code": "for i in range(3):\n    print(\"*\" * (3 - i))", "expect": "***\n**\n*", "hint": "字符串乘次数。"}]}, {"id": 11, "no": "Ⅺ", "title": "函数定义", "weeks": "第 6 周", "diff": "★★☆", "full": true, "story": {"tutor": "格蕾丝·赫柏（Grace Hopper）", "era": "美国 · 编译器之母", "fact": "赫柏说「请求原谅比请求许可更容易」，但她更著名的遗产是把「子程序」变成工程：一段逻辑写一次，处处调用。函数就是程序里的「子程序」——把重复劳动收进一个名字里。", "quote": "「人类对变化的恐惧，是进步的最大敌人。」"}, "map": ["def 与调用", "参数与实参", "return 返回", "函数是黑盒"], "sections": [{"t": "def：把逻辑装进名字", "p": "def 定义函数，调用时执行函数体。函数先定义后调用。函数是「收件箱」：你给它输入，它处理完给你结果。", "code": "def greet():\n    print(\"你好\")\ndef main():\n    greet()\nmain()"}, {"t": "参数：函数的输入口", "p": "定义时写形参，调用时传实参。位置参数按顺序对应。参数让同一个函数处理不同数据，函数从「固定剧本」变成「可点菜」。", "code": "def greet(name):\n    print(\"你好，\" + name)\ngreet(\"鼠哥\")\ngreet(\"同学\")"}, {"t": "return：把结果交出来", "p": "return 结束函数并返回值。没有 return 的函数返回 None。计算逻辑放函数里 return，主流程拿结果继续。", "code": "def square(x):\n    return x * x\ny = square(5)\nprint(y)"}, {"t": "函数是黑盒", "p": "调用者只需知道「输入什么、得到什么」，不必关心内部。好函数短小、单一职责、名字说明意图。", "code": "def area(w, h):\n    return w * h\nprint(area(3, 4))"}], "quiz": [{"type": "choice", "q": "def 定义函数后，调用它的方式是？", "options": ["greet", "greet()", "def greet()", "call greet"], "answer": 1, "explain": "函数名加圆括号调用，传参写在括号里。"}, {"type": "choice", "q": "def greet(name) 里的 name 叫？", "options": ["实参", "形参", "返回值", "局部变量"], "answer": 1, "explain": "定义时写的是形参（占位），调用时传的是实参（实际值）。"}, {"type": "code", "q": "定义函数 double(x) 返回 x 的两倍，调用 double(21) 并打印结果", "code": "def double(x):\n    return x * 2\nprint(double(21))", "expect": "42", "hint": "return x*2"}, {"type": "choice", "q": "def f(): print(\"a\") 调用 f() 后返回值是？", "options": ["\"a\"", "None", "0", "报错"], "answer": 1, "explain": "没有 return 的函数返回 None。"}, {"type": "code", "q": "定义函数 add(a, b) 返回两数之和，打印 add(3, 4) 的结果", "code": "def add(a, b):\n    return a + b\nprint(add(3, 4))", "expect": "7", "hint": "return a+b"}, {"type": "choice", "q": "return 语句的作用是？", "options": ["打印结果", "结束函数并返回一个值", "跳过函数", "循环一次"], "answer": 1, "explain": "return 结束函数并把值交还给调用处。"}, {"type": "code", "q": "定义函数 is_even(n) 返回 n 是否为偶数（布尔），打印 is_even(8)", "code": "def is_even(n):\n    return n % 2 == 0\nprint(is_even(8))", "expect": "True", "hint": "n%2==0"}, {"type": "choice", "q": "函数体缩进错了会导致？", "options": ["没影响", "IndentationError", "函数更快", "自动修复"], "answer": 1, "explain": "Python 靠缩进分块，缩进错直接语法错误。"}, {"type": "code", "q": "定义函数 max2(a, b) 返回较大者，打印 max2(5, 9)", "code": "def max2(a, b):\n    if a > b:\n        return a\n    return b\nprint(max2(5, 9))", "expect": "9", "hint": "比较后 return 大的"}, {"type": "choice", "q": "把重复代码收进函数的好处不包括？", "options": ["改一处处处生效", "代码更短", "运行更快（必然）", "逻辑命名后更好读"], "answer": 2, "explain": "函数让代码可维护，但不保证运行更快——它可能更慢一点。"}], "exam": [{"type": "choice", "q": "def f(x): return x+1，f(5) 结果是？", "options": ["5", "6", "x+1", "报错"], "answer": 1, "explain": "实参 5 代入形参 x，返回 6。"}, {"type": "code", "q": "定义函数 triple(x) 返回 x 的三倍，打印 triple(7)", "code": "def triple(x):\n    return x * 3\nprint(triple(7))", "expect": "21", "hint": "return x*3"}, {"type": "choice", "q": "函数定义和调用的顺序要求？", "options": ["先调用后定义也行（同文件）", "必须先定义后调用", "顺序无所谓", "必须在别的文件"], "answer": 1, "explain": "调用发生在定义之前会 NameError。"}, {"type": "code", "q": "定义函数 shout(s) 返回 s 加三个感叹号，打印 shout(\"好\")", "code": "def shout(s):\n    return s + \"!!!\"\nprint(shout(\"好\"))", "expect": "好!!!", "hint": "字符串拼接"}, {"type": "choice", "q": "print() 和 return 的区别是？", "options": ["没区别", "print 显示到屏幕，return 把值交给调用处", "return 显示到屏幕", "print 只能用于函数外"], "answer": 1, "explain": "print 是输出副作用，return 是函数产出值。"}, {"type": "code", "q": "定义函数 abs2(x) 返回 x 的绝对值，打印 abs2(-3)", "code": "def abs2(x):\n    if x < 0:\n        return -x\n    return x\nprint(abs2(-3))", "expect": "3", "hint": "负数取反"}, {"type": "choice", "q": "函数名用什么风格命名最好？", "options": ["MyFunc", "my_func（小写下划线）", "myfunc1", "随便起"], "answer": 1, "explain": "Python 惯例：函数名小写，单词下划线分隔。"}, {"type": "code", "q": "定义函数 hello(name) 返回 \"你好，name！\"，打印 hello(\"小美\")", "code": "def hello(name):\n    return \"你好，\" + name + \"！\"\nprint(hello(\"小美\"))", "expect": "你好，小美！", "hint": "拼接字符串"}, {"type": "choice", "q": "一个函数里可以有多个 return 吗？", "options": ["只能一个", "可以，执行到哪个算哪个", "多个会报错", "return 只能在最后"], "answer": 1, "explain": "可多个 return，执行到第一个就返回（如 if/else 分支各一个）。"}, {"type": "code", "q": "定义函数 mul(a,b,c) 返回三数之积，打印 mul(2,3,4)", "code": "def mul(a, b, c):\n    return a * b * c\nprint(mul(2, 3, 4))", "expect": "24", "hint": "连乘"}]}, {"id": 12, "no": "Ⅻ", "title": "参数进阶", "weeks": "第 6 周", "diff": "★★☆", "full": true, "story": {"tutor": "芭芭拉·利斯科夫（Barbara Liskov）", "era": "美国 · 编程抽象先驱", "fact": "利斯科夫 1974 年提出「里氏替换」思想：设计接口时想清楚每种输入，让调用方放心。默认参数、关键字参数、*args 都是「接口设计」——让函数对不同用法都从容。", "quote": "「程序不是写给自己看的，是写给维护它的人看的。」"}, "map": ["默认参数", "关键字参数", "任意参数 *args", "参数顺序"], "sections": [{"t": "默认参数：给参数兜底", "p": "定义时给形参默认值，调用可不传该参数。默认参数要放后面。默认值是「出厂的预设」，调用方能覆盖。", "code": "def greet(name, msg=\"你好\"):\n    print(msg + \"，\" + name)\ngreet(\"鼠哥\")\ngreet(\"鼠哥\", \"加油\")"}, {"t": "关键字参数：点名传参", "p": "调用时用 形参=值 传参，顺序可乱，意图更清楚。", "code": "def info(name, age, city):\n    print(name, age, city)\ninfo(city=\"西安\", name=\"鼠哥\", age=18)"}, {"t": "*args：收不定个数", "p": "*args 把多余位置参数收进元组。写「不知道会传几个」的函数时用。", "code": "def total(*nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\nprint(total(1, 2, 3, 4))"}, {"t": "参数排列规则", "p": "顺序：必选参数 → 默认参数 → *args。规则是为了让 Python 知道谁是谁。", "code": "def f(a, b=2, *rest):\n    print(a, b, rest)\nf(1, 5, 7, 8)"}], "quiz": [{"type": "choice", "q": "def f(a, b=10): 调用 f(5) 时 b 的值是？", "options": ["报错", "10", "0", "None"], "answer": 1, "explain": "b 有默认值，不传就用 10。"}, {"type": "code", "q": "定义函数 power(base, exp=2) 返回 base 的 exp 次方，分别打印 power(3) 和 power(2, 3)", "code": "def power(base, exp=2):\n    return base ** exp\nprint(power(3))\nprint(power(2, 3))", "expect": "9\n8", "hint": "默认 exp=2"}, {"type": "choice", "q": "关键字参数调用 info(age=18, name=\"鼠哥\") 的要求？", "options": ["必须按定义顺序", "参数名要对应形参", "不能用关键字", "只能有一个"], "answer": 1, "explain": "关键字参数用形参名传值，顺序无关。"}, {"type": "code", "q": "定义函数 describe(name, age, city=\"西安\") 返回一行简介，打印 describe(\"鼠哥\", 18)", "code": "def describe(name, age, city=\"西安\"):\n    return name + \"，\" + str(age) + \"岁，来自\" + city\nprint(describe(\"鼠哥\", 18))", "expect": "鼠哥，18岁，来自西安", "hint": "默认 city"}, {"type": "choice", "q": "def f(a, b=1, c=2): f(1, c=9) 中 a、b、c 分别是？", "options": ["1,1,9", "1,9,2", "1,1,2", "报错"], "answer": 0, "explain": "位置参数给 a=1，默认 b=1，关键字 c=9。"}, {"type": "code", "q": "定义函数 avg(*nums) 返回平均数，打印 avg(2, 4, 6)", "code": "def avg(*nums):\n    return sum(nums) / len(nums)\nprint(avg(2, 4, 6))", "expect": "4.0", "hint": "sum/len"}, {"type": "choice", "q": "默认参数的正确写法？", "options": ["def f(a=1, b)", "def f(b, a=1)", "def f(*a, b)", "def f(a, b=1, c=2)"], "answer": 3, "explain": "默认参数在必选参数之后。a=1 在 b 前面会语法错。"}, {"type": "code", "q": "定义函数 concat(*words) 用逗号连接所有词返回，打印 concat(\"a\",\"b\",\"c\")", "code": "def concat(*words):\n    return \",\".join(words)\nprint(concat(\"a\", \"b\", \"c\"))", "expect": "a,b,c", "hint": "\",\".join"}, {"type": "choice", "q": "调用 f(*[1,2,3]) 的含义？", "options": ["报错", "把列表解包成 3 个位置参数", "传入一个列表", "取列表长度"], "answer": 1, "explain": "星号解包：列表元素逐个作为位置参数。"}, {"type": "code", "q": "定义函数 price(price, tax=0.08) 返回含税价（保留两位小数输出），打印 price(100)", "code": "def price(p, tax=0.08):\n    return round(p * (1 + tax), 2)\nprint(price(100))", "expect": "108.0", "hint": "round 两位"}], "exam": [{"type": "choice", "q": "def f(x=1): return x*2，f() 结果是？", "options": ["报错", "2", "1", "None"], "answer": 1, "explain": "x 用默认值 1，1*2=2。"}, {"type": "code", "q": "定义函数 repeat(s, n=2) 返回 s 重复 n 次，打印 repeat(\"ha\")", "code": "def repeat(s, n=2):\n    return s * n\nprint(repeat(\"ha\"))", "expect": "haha", "hint": "s*n"}, {"type": "choice", "q": "关键字参数的好处是？", "options": ["更快", "调用处清楚每个值给谁", "必须乱序", "省内存"], "answer": 1, "explain": "f(name=\"a\", age=1) 一眼看懂意图。"}, {"type": "code", "q": "定义函数 greet(first, last, sign=\"!\") 返回 名字+sign，打印 greet(\"Li\", \"Ming\")", "code": "def greet(first, last, sign=\"!\"):\n    return first + \" \" + last + sign\nprint(greet(\"Li\", \"Ming\"))", "expect": "Li Ming!", "hint": "默认 sign"}, {"type": "choice", "q": "*args 收集到的是？", "options": ["列表", "元组", "字典", "集合"], "answer": 1, "explain": "多余位置参数收成元组。"}, {"type": "code", "q": "定义函数 area2(w, h=2) 返回 w*h，打印 area2(5)", "code": "def area2(w, h=2):\n    return w * h\nprint(area2(5))", "expect": "10", "hint": "默认高 2"}, {"type": "choice", "q": "def f(a, b=2, c=3): f(1, 2, 3) 用的是什么传参？", "options": ["关键字", "位置", "默认", "混合报错"], "answer": 1, "explain": "全按位置传，a=1,b=2,c=3。"}, {"type": "code", "q": "定义函数 first_last(*items) 返回第一个和最后一个组成的元组，打印 first_last(3,7,9)", "code": "def first_last(*items):\n    return (items[0], items[-1])\nprint(first_last(3, 7, 9))", "expect": "(3, 9)", "hint": "索引 0 和 -1"}, {"type": "choice", "q": "混合传参顺序规则？", "options": ["关键字在前也行", "位置参数在前，关键字在后", "随便", "关键字不能和位置混"], "answer": 1, "explain": "先位置后关键字，否则歧义报错。"}, {"type": "code", "q": "定义函数 tip(bill, rate=0.15) 返回小费（保留两位），打印 tip(200)", "code": "def tip(bill, rate=0.15):\n    return round(bill * rate, 2)\nprint(tip(200))", "expect": "30.0", "hint": "bill*rate"}]}, {"id": 13, "no": "ⅩⅢ", "title": "模块与导入", "weeks": "第 7 周", "diff": "★★☆", "full": true, "story": {"tutor": "林纳斯·托瓦兹（Linus Torvalds）", "era": "芬兰 · Linux 之父", "fact": "Linux 内核不是一个人写完的——几千人各写各的模块，拼成整个系统。模块化是「分工的代码化」：import 别人的轮子，export 自己的成果，谁也不看谁的完整源码也能协作。", "quote": "「软件像性一样，免费时更好。」"}, "map": ["import 用法", "from 导入", "标准库", "random/math 实战"], "sections": [{"t": "import：借轮子", "p": "import 模块后，用 模块名.函数 调用。import math 后写 math.sqrt(16)。", "code": "import math\nprint(math.sqrt(16))\nprint(math.pi)"}, {"t": "from 导入：指名道姓", "p": "from 模块 import 名字，直接用名字不用前缀。少打字，但可能命名冲突。", "code": "from math import sqrt, pi\nprint(sqrt(25))\nprint(round(pi, 2))"}, {"t": "标准库：Python 自带百宝箱", "p": "random（随机）、math（数学）、datetime（时间）、os（系统）等，安装 Python 就带，import 即用。", "code": "import random\nprint(random.randint(1, 6))"}, {"t": "用模块名.还是 from？", "p": "常用、短名用 from；防冲突、想清楚来源用 import。团队项目偏爱 import 模块名。", "code": "import random\nfor _ in range(3):\n    print(random.choice([\"石头\", \"剪刀\", \"布\"]))"}], "quiz": [{"type": "choice", "q": "import math 后调用平方根的正确写法？", "options": ["sqrt(16)", "math.sqrt(16)", "import.sqrt(16)", "sqrt.math(16)"], "answer": 1, "explain": "模块名.函数，math.sqrt(16)。"}, {"type": "code", "q": "用 math.sqrt 打印 81 的平方根", "code": "import math\nprint(math.sqrt(81))", "expect": "9.0", "hint": "math.sqrt"}, {"type": "choice", "q": "from random import randint 后如何调用 1-6 随机整数？", "options": ["random.randint(1,6)", "randint(1,6)", "random.rand(1,6)", "randint.random(1,6)"], "answer": 1, "explain": "from 导入后直接函数名调用。"}, {"type": "code", "q": "打印圆周率 pi 保留 2 位小数", "code": "import math\nprint(round(math.pi, 2))", "expect": "3.14", "hint": "round(pi,2)"}, {"type": "choice", "q": "标准库是什么？", "options": ["别人付费买的库", "Python 安装自带的一批模块", "网上下载的框架", "只有 math 一个"], "answer": 1, "explain": "标准库随 Python 安装，import 即用不联网。"}, {"type": "code", "q": "用 random.randint 打印一个 1 到 100 的随机整数（判题只看是否数字，用 if 保证格式）", "code": "import random\nprint(random.randint(1, 100))", "expect": "", "hint": "随机题 expect 空=跑通即过"}, {"type": "choice", "q": "import random 和 from random import randint 的区别？", "options": ["没区别", "前者调用要 random.xxx，后者直接 xxx", "前者更快", "后者不能用于随机"], "answer": 1, "explain": "import 保留命名空间，from 直接引入名字。"}, {"type": "choice", "q": "写自己的模块 my_mod.py，别的文件怎么用？", "options": ["import my_mod", "from my_mod import *", "都行（同目录下）", "只能复制粘贴"], "answer": 2, "explain": "同目录下 import 自己的 .py 文件即可。"}, {"type": "choice", "q": "import datetime 常用来干什么？", "options": ["画图", "取当前日期时间", "网络请求", "加密"], "answer": 1, "explain": "datetime 模块处理日期时间。"}, {"type": "code", "q": "用 math.floor 打印 3.7 向下取整", "code": "import math\nprint(math.floor(3.7))", "expect": "3", "hint": "floor 向下"}], "exam": [{"type": "choice", "q": "import 语句通常放在？", "options": ["函数中间", "文件开头", "循环里", "return 后"], "answer": 1, "explain": "惯例：import 集中放文件顶部。"}, {"type": "code", "q": "from math import ceil 打印 3.2 向上取整", "code": "from math import ceil\nprint(ceil(3.2))", "expect": "4", "hint": "ceil 向上"}, {"type": "choice", "q": "想用随机选一个元素，用 random 的哪个函数？", "options": ["random.randint", "random.choice", "random.pi", "random.max"], "answer": 1, "explain": "choice 从序列随机选一个。"}, {"type": "code", "q": "import random 打印 random.choice 从 [\"猫\",\"狗\",\"鸟\"] 选一个", "code": "import random\nprint(random.choice([\"猫\", \"狗\", \"鸟\"]))", "expect": "", "hint": "随机题跑通即过"}, {"type": "choice", "q": "from math import * 的含义？", "options": ["导入全部名字", "导入 math 模块", "报错", "导入空"], "answer": 0, "explain": "* 导入模块所有公开名字，慎用（污染命名空间）。"}, {"type": "code", "q": "用 math.pow(2, 10) 打印 2 的 10 次方", "code": "import math\nprint(int(math.pow(2, 10)))", "expect": "1024", "hint": "2**10"}, {"type": "choice", "q": "两个模块都有 f 函数，from a import f; from b import f 后 f 是？", "options": ["a 的", "b 的（后导入覆盖）", "两个都在", "报错"], "answer": 1, "explain": "同名后者覆盖前者，这是 from 导入的冲突风险。"}, {"type": "code", "q": "import random 用 seed(1) 固定随机后打印 randint(1, 10)", "code": "import random\nrandom.seed(1)\nprint(random.randint(1, 10))", "expect": "2", "hint": "seed 固定后结果确定（Pyodide 同 seed 同值）"}, {"type": "choice", "q": "模块文件与主程序分离的好处？", "options": ["更慢", "可复用、可测试", "必须分离", "文件更少"], "answer": 1, "explain": "模块化让代码可复用可测试。"}, {"type": "code", "q": "from math import sqrt, log 打印 log(100, 10)", "code": "from math import sqrt, log\nprint(log(100, 10))", "expect": "2.0", "hint": "log(x, base)"}]}, {"id": 14, "no": "ⅩⅣ", "title": "函数与作用域", "weeks": "第 7 周", "diff": "★★☆", "full": true, "story": {"tutor": "艾伦·凯（Alan Kay）", "era": "美国 · 面向对象之父", "fact": "艾伦·凯说「预测未来最好的方式是发明它」。作用域是 Python 的「势力范围」：函数里的变量外面看不见，外面改了函数里未必知道。理解作用域，就理解了一半的「变量去哪了」bug。", "quote": "「简单的事情应该简单，复杂的事情应该可能。」"}, "map": ["局部 vs 全局", "global 声明", "不可变陷阱", "闭包初探"], "sections": [{"t": "局部变量：函数里的私人空间", "p": "函数内赋值的变量是局部变量，函数结束即消失。外面访问会 NameError。", "code": "def f():\n    x = 10\n    print(x)\nf()\n# print(x)  # NameError"}, {"t": "全局变量：模块级共享", "p": "模块顶层赋值的变量全局可见。函数里读全局可以，改全局要 global。", "code": "x = 5\ndef f():\n    print(x)   # 读全局 OK\nf()"}, {"t": "global：明确声明要改全局", "p": "函数里想修改全局变量，先 global x。不声明就赋值 = 创建局部变量（遮蔽）。", "code": "x = 5\ndef add():\n    global x\n    x += 1\nadd()\nprint(x)"}, {"t": "闭包初探", "p": "内层函数引用外层函数的变量，外层返回内层——这个「记住环境」的函数叫闭包。先认识现象，细节后补。", "code": "def make(x):\n    def inner(y):\n        return x + y\n    return inner\nadd5 = make(5)\nprint(add5(3))"}], "quiz": [{"type": "choice", "q": "函数内 x=10，函数外 print(x) 会？", "options": ["打印 10", "NameError", "打印 None", "打印 0"], "answer": 1, "explain": "函数内是局部变量，外部访问不到。"}, {"type": "code", "q": "函数内定义局部变量 secret=42 并打印它，再在外面打印全局 x=1", "code": "x = 1\ndef show():\n    secret = 42\n    print(secret)\nshow()\nprint(x)", "expect": "42\n1", "hint": "局部只函数内"}, {"type": "choice", "q": "函数内要修改全局变量必须？", "options": ["直接赋值", "先声明 global", "用 return 覆盖", "无法修改"], "answer": 1, "explain": "global 声明后才允许改写全局。"}, {"type": "code", "q": "全局 count=0，定义函数 bump() 用 global 让 count 加 1，调用两次后打印 count", "code": "count = 0\ndef bump():\n    global count\n    count += 1\nbump()\nbump()\nprint(count)", "expect": "2", "hint": "global count"}, {"type": "choice", "q": "def f(): print(x)，x 是模块级全局，调用 f() 会？", "options": ["NameError", "正常打印全局 x", "打印 None", "报 SyntaxError"], "answer": 1, "explain": "函数可读全局变量。"}, {"type": "code", "q": "全局 name=\"全局\"，函数里赋 name=\"局部\" 并打印，之后打印全局 name", "code": "name = \"全局\"\ndef f():\n    name = \"局部\"\n    print(name)\nf()\nprint(name)", "expect": "局部\n全局", "hint": "函数内赋值是新局部"}, {"type": "choice", "q": "「遮蔽」指？", "options": ["变量被加密", "局部变量和全局同名，局部优先", "变量消失", "报错"], "answer": 1, "explain": "同名时函数内局部变量遮蔽全局。"}, {"type": "choice", "q": "闭包的特点？", "options": ["不能嵌套函数", "内层记住外层变量环境", "必须用 global", "只能用于类"], "answer": 1, "explain": "闭包让内层函数记住外层环境。"}, {"type": "code", "q": "定义 outer(x) 返回 inner(y) 返回 x+y 的闭包，用 add7=outer(7) 后打印 add7(5)", "code": "def outer(x):\n    def inner(y):\n        return x + y\n    return inner\nadd7 = outer(7)\nprint(add7(5))", "expect": "12", "hint": "闭包记住 x=7"}, {"type": "choice", "q": "函数里 global x 后 x+=1，外面 print(x)？", "options": ["报错", "打印加 1 后的全局值", "打印 None", "打印原值"], "answer": 1, "explain": "global 让函数内修改作用于全局。"}], "exam": [{"type": "choice", "q": "局部变量存在哪里？", "options": ["全局区", "函数自己的作用域", "文件里", "库里"], "answer": 1, "explain": "局部变量在函数作用域内有效。"}, {"type": "code", "q": "全局 g=100，函数内读 g 并打印，再打印全局 g", "code": "g = 100\ndef f():\n    print(g)\nf()", "expect": "100", "hint": "函数可读全局"}, {"type": "choice", "q": "函数内 global 声明放哪？", "options": ["函数末尾", "使用前（函数开头）", "哪都行", "函数外"], "answer": 1, "explain": "global 声明在函数内、使用该变量之前。"}, {"type": "code", "q": "全局 total=0，定义 addto(n) 用 global 累加，调用 addto(5) addto(3) 后打印 total", "code": "total = 0\ndef addto(n):\n    global total\n    total += n\naddto(5)\naddto(3)\nprint(total)", "expect": "8", "hint": "global total"}, {"type": "choice", "q": "函数参数是全局变量的值时，函数内改参数影响全局吗？", "options": ["影响", "不影响（形参是副本）", "报错", "看运气"], "answer": 1, "explain": "形参接收的是值（不可变对象），改形参不动全局。"}, {"type": "code", "q": "x=1，函数 f 内 global x 后 x=99，打印全局 x", "code": "x = 1\ndef f():\n    global x\n    x = 99\nf()\nprint(x)", "expect": "99", "hint": "global 改写"}, {"type": "choice", "q": "Python 里作用域查找顺序是？", "options": ["全局→局部", "局部→全局→内置", "内置→全局", "随机"], "answer": 1, "explain": "先局部，再全局，再 Python 内置。"}, {"type": "code", "q": "定义 make_adder(n) 返回把参数加 n 的函数，用 add10 后打印 add10(4)", "code": "def make_adder(n):\n
