_init__。"}, {"type": "code", "q": "class Person 有 __init__(self, name)，创建 p=Person(\"小明\") 打印 p.name", "code": "class Person:\n    def __init__(self, name):\n        self.name = name\np = Person(\"小明\")\nprint(p.name)", "expect": "小明", "hint": "self.name 存属性"}, {"type": "choice", "q": "方法里 self 指什么？", "options": ["类本身", "当前实例", "父类", "模块"], "answer": 1, "explain": "self 是正在操作的实例对象。"}, {"type": "code", "q": "class Bank 有 __init__(self, money=0) 存 self.money，创建 b=Bank(100) 打印 b.money", "code": "class Bank:\n    def __init__(self, money=0):\n        self.money = money\nb = Bank(100)\nprint(b.money)", "expect": "100", "hint": "默认参数 0"}, {"type": "choice", "q": "同一类造的两个实例的属性？", "options": ["共享同一份", "各自独立", "自动同步", "只读"], "answer": 1, "explain": "实例属性各自独立，互不影响。"}, {"type": "code", "q": "class Point 有 __init__(x, y) 存坐标，创建 p=Point(3, 4) 打印 p.x 和 p.y", "code": "class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\np = Point(3, 4)\nprint(p.x, p.y)", "expect": "3 4", "hint": "print 两个值空格分隔"}, {"type": "choice", "q": "类名命名的 Python 惯例？", "options": ["全小写", "大写开头驼峰", "全大写", "下划线分隔"], "answer": 1, "explain": "类名用 PascalCase（首字母大写）。"}, {"type": "code", "q": "class Student 有 __init__(name, score) 存属性，创建 s 打印 name 和 score", "code": "class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\ns = Student(\"张三\", 95)\nprint(s.name, s.score)", "expect": "张三 95", "hint": "两个属性"}], "exam": [{"type": "choice", "q": "实例化类 Dog 的写法？", "options": ["Dog", "Dog()", "new Dog()", "create Dog"], "answer": 1, "explain": "类名加括号即实例化。"}, {"type": "code", "q": "class Phone 有 __init__(brand)，创建 p=Phone(\"华为\") 打印 p.brand", "code": "class Phone:\n    def __init__(self, brand):\n        self.brand = brand\np = Phone(\"华为\")\nprint(p.brand)", "expect": "华为", "hint": "实例属性"}, {"type": "choice", "q": "不写 __init__ 的类能实例化吗？", "options": ["不能", "能，无自定义属性", "报错", "只能继承"], "answer": 1, "explain": "不写 __init__ 也可实例化，只是无初始属性逻辑。"}, {"type": "code", "q": "class Circle 存半径 r，创建 c=Circle(5) 打印 c.r", "code": "class Circle:\n    def __init__(self, r):\n        self.r = r\nc = Circle(5)\nprint(c.r)", "expect": "5", "hint": "存 r"}, {"type": "choice", "q": "self.name = name 这一步在做什么？", "options": ["定义全局变量", "把实参存成实例属性", "调用方法", "删除属性"], "answer": 1, "explain": "把传入的 name 存到实例自己的属性上。"}, {"type": "code", "q": "class User 有 __init__(self, name, level=1)，创建 u=User(\"鼠哥\") 打印 name 和 level", "code": "class User:\n    def __init__(self, name, level=1):\n        self.name = name\n        self.level = level\nu = User(\"鼠哥\")\nprint(u.name, u.level)", "expect": "鼠哥 1", "hint": "默认 level=1"}, {"type": "choice", "q": "对象的属性在类外能改吗？", "options": ["不能", "能（直接 对象.属性=值）", "只能读", "需声明"], "answer": 1, "explain": "Python 属性默认公开，外部可直接赋值修改。"}, {"type": "code", "q": "class Lamp 有 __init__(self, on=False)，创建开灯 l=Lamp(True) 打印 l.on", "code": "class Lamp:\n    def __init__(self, on=False):\n        self.on = on\nl = Lamp(True)\nprint(l.on)", "expect": "True", "hint": "布尔属性"}, {"type": "choice", "q": "一辆车的品牌/颜色/速度是它的？", "options": ["方法", "属性", "类", "模块"], "answer": 1, "explain": "描述对象状态的数据是属性。"}, {"type": "code", "q": "class Book 有 __init__(title, author, pages)，创建 b 打印三个属性", "code": "class Book:\n    def __init__(self, title, author, pages):\n        self.title = title\n        self.author = author\n        self.pages = pages\nb = Book(\"Python入门\", \"张三\", 300)\nprint(b.title, b.author, b.pages)", "expect": "Python入门 张三 300", "hint": "三个属性顺序打"}]}, {"id": 16, "no": "ⅩⅥ", "title": "方法设计", "weeks": "第 8 周", "diff": "★★★", "full": true, "story": {"tutor": "沃德·坎宁安（Ward Cunningham）", "era": "美国 · Wiki 之父", "fact": "坎宁安发明 Wiki 时坚持「简单规则、自由演化」。设计类方法也一样：每个方法做一件清楚的事，起清楚的名字，对象之间靠方法对话而非乱摸属性。", "quote": "「能跑就行」和「能改就行」是两码事，后者才是软件的价值。\""}, "map": ["实例方法", "方法封装", "方法返回值", "设计练习"], "sections": [{"t": "实例方法：让对象会做事", "p": "类里 def 的方法是实例方法，第一个参数 self，调用时 对象.方法()。", "code": "class Dog:\n    def bark(self):\n        print(\"汪汪\")\nd = Dog()\nd.bark()"}, {"t": "方法操作属性", "p": "方法里用 self.属性 读写，方法可以改对象状态。", "code": "class Counter:\n    def __init__(self):\n        self.n = 0\n    def add(self):\n        self.n += 1\nc = Counter()\nc.add()\nc.add()\nprint(c.n)"}, {"t": "方法返回值", "p": "方法可以 return 计算结果，不一定要 print。", "code": "class Rect:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\nr = Rect(3, 4)\nprint(r.area())"}, {"t": "设计：一个方法一件事", "p": "好方法名是动词（deposit 存款、withdraw 取款、balance 查余额），内部逻辑短小。", "code": "class Bank:\n    def __init__(self):\n        self.money = 0\n    def deposit(self, n):\n        self.money += n\n    def balance(self):\n        return self.money\nb = Bank()\nb.deposit(100)\nprint(b.balance())"}], "quiz": [{"type": "choice", "q": "定义实例方法时第一个参数必须是？", "options": ["cls", "self", "this", "无"], "answer": 1, "explain": "实例方法第一个参数惯例叫 self。"}, {"type": "code", "q": "class Bird 有方法 fly(self) 打印 \"飞了\"，创建 b 调用", "code": "class Bird:\n    def fly(self):\n        print(\"飞了\")\nb = Bird()\nb.fly()", "expect": "飞了", "hint": "对象.方法()"}, {"type": "choice", "q": "方法想返回计算结果用什么？", "options": ["print", "return", "yield", "pass"], "answer": 1, "explain": "return 把值交还给调用处。"}, {"type": "code", "q": "class Square 存边长 side，方法 area() 返回面积，创建 s=Square(5) 打印 s.area()", "code": "class Square:\n    def __init__(self, side):\n        self.side = side\n    def area(self):\n        return self.side * self.side\ns = Square(5)\nprint(s.area())", "expect": "25", "hint": "side*side"}, {"type": "choice", "q": "class Bank: def deposit(self, n): self.money += n 的语义？", "options": ["查余额", "存款，改状态", "取款", "删除"], "answer": 1, "explain": "deposit 方法修改余额状态。"}, {"type": "code", "q": "class Counter 初始 0，方法 add(n) 累加，创建后 add(3) add(4) 打印 get() 值", "code": "class Counter:\n    def __init__(self):\n        self.n = 0\n    def add(self, n):\n        self.n += n\n    def get(self):\n        return self.n\nc = Counter()\nc.add(3)\nc.add(4)\nprint(c.get())", "expect": "7", "hint": "累加两次"}, {"type": "choice", "q": "为什么不让外部直接改 self.money 而用方法？", "options": ["更慢", "方法可加校验逻辑", "外部改不了", "没区别"], "answer": 1, "explain": "方法封装了规则（如不允许负数），比裸属性安全。"}, {"type": "code", "q": "class Person 有 name 和方法 greet() 返回 \"你好，我是\"+name，创建并打印调用结果", "code": "class Person:\n    def __init__(self, name):\n        self.name = name\n    def greet(self):\n        return \"你好，我是\" + self.name\np = Person(\"鼠哥\")\nprint(p.greet())", "expect": "你好，我是鼠哥", "hint": "方法 return"}, {"type": "choice", "q": "方法里能调用同类的另一个方法吗？", "options": ["不能", "能，用 self.方法()", "只能类外调", "报错"], "answer": 1, "explain": "self.方法名() 在方法内调用同类方法。"}, {"type": "code", "q": "class Wallet 初始 0，方法 earn(n)、spend(n)、money() 返回余额，earn 100 spend 30 后打印余额", "code": "class Wallet:\n    def __init__(self):\n        self.b = 0\n    def earn(self, n):\n        self.b += n\n    def spend(self, n):\n        self.b -= n\n    def money(self):\n        return self.b\nw = Wallet()\nw.earn(100)\nw.spend(30)\nprint(w.money())", "expect": "70", "hint": "100-30"}], "exam": [{"type": "choice", "q": "class A: def m(self): ... 调用方式是？", "options": ["A.m()", "a.m()（a 是实例）", "m()", "A.m(self)"], "answer": 1, "explain": "实例.方法()。"}, {"type": "code", "q": "class Fish 有方法 swim() 打印 \"游了\"，创建 f 调用 swim 两次", "code": "class Fish:\n    def swim(self):\n        print(\"游了\")\nf = Fish()\nf.swim()\nf.swim()", "expect": "游了\n游了", "hint": "调两次两行"}, {"type": "choice", "q": "方法直接改 self 属性 vs return 新值，区别？", "options": ["没区别", "前者改状态后者交结果", "前者更快", "后者必错"], "answer": 1, "explain": "改状态适合「动作」，return 适合「查询」。"}, {"type": "code", "q": "class Temp 存 c 摄氏度，方法 f() 返回华氏（c*9/5+32），Temp(100).f() 打印", "code": "class Temp:\n    def __init__(self, c):\n        self.c = c\n    def f(self):\n        return self.c * 9 / 5 + 32\nt = Temp(100)\nprint(t.f())", "expect": "212.0", "hint": "c*9/5+32"}, {"type": "choice", "q": "方法命名「存款」用哪个好？", "options": ["do_money", "deposit", "money_do", "change"], "answer": 1, "explain": "动词开头明确动作：deposit。"}, {"type": "code", "q": "class Timer 初始 0，方法 tick() 加 1、read() 返回，tick 3 次打印 read", "code": "class Timer:\n    def __init__(self):\n        self.t = 0\n    def tick(self):\n        self.t += 1\n    def read(self):\n        return self.t\nt = Timer()\nt.tick()\nt.tick()\nt.tick()\nprint(t.read())", "expect": "3", "hint": "三次加一"}, {"type": "choice", "q": "「封装」指？", "options": ["把代码藏起来加密", "把数据和操作它的方法绑在一起并隐藏细节", "多写注释", "把类放文件里"], "answer": 1, "explain": "封装 = 数据 + 操作绑定，外部只通过方法交互。"}, {"type": "code", "q": "class Grade 存 score，方法 level() 返回 A(>=90)/B(>=80)/C(其他)，测试 85 分", "code": "class Grade:\n    def __init__(self, score):\n        self.score = score\n    def level(self):\n        if self.score >= 90:\n            return \"A\"\n        if self.score >= 80:\n            return \"B\"\n        return \"C\"\ng = Grade(85)\nprint(g.level())", "expect": "B", "hint": "分支返回"}, {"type": "choice", "q": "一个对象有很多小方法 vs 一个大方法？", "options": ["大方法好", "小方法更清晰可复用", "无所谓", "小方法一定慢"], "answer": 1, "explain": "方法单一职责，易读易测。"}, {"type": "code", "q": "class Account 有 name 和 balance，方法 show() 返回 \"name: balance\"，创建后打印", "code": "class Account:\n    def __init__(self, name, balance):\n        self.name = name\n        self.balance = balance\n    def show(self):\n        return self.name + \": \" + str(self.balance)\na = Account(\"鼠哥\", 500)\nprint(a.show())", "expect": "鼠哥: 500", "hint": "拼接字符串"}]}, {"id": 17, "no": "ⅩⅦ", "title": "继承与重写", "weeks": "第 9 周", "diff": "★★★", "full": true, "story": {"tutor": "克里斯托弗·斯特雷奇（Christopher Strachey）", "era": "英国 · 编程语言理论家", "fact": "斯特雷奇 1967 年提出「多态」概念：同一接口，不同实现。继承让子类「是」父类的一种（Dog is an Animal），重写让子类用自己的版本替换父类行为。", "quote": "「抽象不是省掉细节，而是把不相关的细节放到背后。」"}, "map": ["继承", "super()", "方法重写", "多态"], "sections": [{"t": "继承：子类拥有父类", "p": "class 子类(父类): 子类自动拥有父类的属性和方法，可加自己的。", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        print(\"...\")\nclass Dog(Animal):\n    pass\nd = Dog(\"旺财\")\nprint(d.name)"}, {"t": "super()：调父类的初始化", "p": "子类 __init__ 里 super().__init__(...) 先初始化父类部分。", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\nclass Dog(Animal):\n    def __init__(self, name, age):\n        super().__init__(name)\n        self.age = age\nd = Dog(\"旺财\", 3)\nprint(d.name, d.age)"}, {"t": "重写：子类换掉父类行为", "p": "子类定义同名方法即覆盖父类版本。", "code": "class Animal:\n    def speak(self):\n        return \"...\"\nclass Dog(Animal):\n    def speak(self):\n        return \"汪汪\"\nd = Dog()\nprint(d.speak())"}, {"t": "多态：同一调用不同表现", "p": "不同子类对同一方法各自实现，调用方不用关心具体类型。", "code": "class Cat(Animal):\n    def speak(self):\n        return \"喵\"\ndef say(a):\n    print(a.speak())\nsay(Dog())\nsay(Cat())"}], "quiz": [{"type": "choice", "q": "class Dog(Animal): 表示？", "options": ["Dog 包含 Animal", "Dog 继承 Animal", "并列关系", "Animal 继承 Dog"], "answer": 1, "explain": "括号里是父类，Dog 继承 Animal。"}, {"type": "code", "q": "class Animal 有 __init__ 存 name，class Dog(Animal) 空实现，创建 d=Dog(\"旺财\") 打印 d.name", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\nclass Dog(Animal):\n    pass\nd = Dog(\"旺财\")\nprint(d.name)", "expect": "旺财", "hint": "继承父类 __init__"}, {"type": "choice", "q": "子类 __init__ 里调父类初始化用？", "options": ["Animal()", "super().__init__(...)", "parent.init()", "self.parent()"], "answer": 1, "explain": "super() 拿到父类引用，调其 __init__。"}, {"type": "code", "q": "class Animal 有 __init__ 存 name；class Cat(Animal) 的 __init__ 接收 name, color，super 初始化 name 再存 color。打印结果", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\nclass Cat(Animal):\n    def __init__(self, name, color):\n        super().__init__(name)\n        self.color = color\nc = Cat(\"咪咪\", \"白\")\nprint(c.name, c.color)", "expect": "咪咪 白", "hint": "super 初始化 name"}, {"type": "choice", "q": "子类里定义和父类同名方法会发生？", "options": ["报错", "覆盖（重写）父类版本", "两个都执行", "只执行父类"], "answer": 1, "explain": "同名方法子类版本覆盖父类，称重写。"}, {"type": "code", "q": "class Animal speak() 返回 \"...\"；class Dog(Animal) 重写 speak 返回 \"汪汪\"。打印 Dog() 的 speak", "code": "class Animal:\n    def speak(self):\n        return \"...\"\nclass Dog(Animal):\n    def speak(self):\n        return \"汪汪\"\nd = Dog()\nprint(d.speak())", "expect": "汪汪", "hint": "重写生效"}, {"type": "choice", "q": "「猫是一种动物」在代码里对应？", "options": ["class Animal(Cat)", "class Cat(Animal)", "Cat = Animal", "import Animal"], "answer": 1, "explain": "子类在括号里继承父类：Cat is a Animal。"}, {"type": "code", "q": "class Shape area() 返回 0；class Rect(Shape) 存 w,h 重写 area 返回 w*h。Rect(3,4).area() 打印", "code": "class Shape:\n    def area(self):\n        return 0\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\nr = Rect(3, 4)\nprint(r.area())", "expect": "12", "hint": "子类重写"}, {"type": "choice", "q": "多态的好处？", "options": ["代码更快", "同一调用方式处理不同子类", "必须写很多类", "无法实现"], "answer": 1, "explain": "调用方统一接口，具体行为各子类自定。"}, {"type": "code", "q": "class Duck 有 fly() 返回 \"飞不高\"；class Eagle(Duck) 重写 fly 返回 \"飞得高\"。列表里各调一次", "code": "class Duck:\n    def fly(self):\n        return \"飞不高\"\nclass Eagle(Duck):\n    def fly(self):\n        return \"飞得高\"\nprint(Duck().fly())\nprint(Eagle().fly())", "expect": "飞不高\n飞得高", "hint": "多态"}], "exam": [{"type": "choice", "q": "继承的意义？", "options": ["代码变长", "复用父类代码并扩展", "类变复杂", "删除父类"], "answer": 1, "explain": "继承实现代码复用与扩展。"}, {"type": "code", "q": "class Vehicle 有 move() 返回 \"移动\"；class Car(Vehicle) 重写 move 返回 \"开走\"。打印 Car().move()", "code": "class Vehicle:\n    def move(self):\n        return \"移动\"\nclass Car(Vehicle):\n    def move(self):\n        return \"开走\"\nprint(Car().move())", "expect": "开走", "hint": "重写"}, {"type": "choice", "q": "不写 super().__init__ 直接 self.xxx = xxx？", "options": ["一定错", "父类部分不初始化，可能丢属性", "没影响", "更快"], "answer": 1, "explain": "父类定义的属性若不经 super 初始化可能缺失。"}, {"type": "code", "q": "class Animal 存 name；class Bird(Animal) __init__ 用 super 存 name 并加 can_fly=True。创建并打印", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\nclass Bird(Animal):\n    def __init__(self, name):\n        super().__init__(name)\n        self.can_fly = True\nb = Bird(\"小雀\")\nprint(b.name, b.can_fly)", "expect": "小雀 True", "hint": "继承+新属性"}, {"type": "choice", "q": "父子类同名方法，调用子类实例时执行？", "options": ["父类版", "子类版", "两个都", "报错"], "answer": 1, "explain": "动态绑定：子类版本优先。"}, {"type": "code", "q": "class Monster 有 hp；class Boss(Monster) super 初始化后加 power=100。创建 Boss 打印 hp 和 power", "code": "class Monster:\n    def __init__(self, hp):\n        self.hp = hp\nclass Boss(Monster):\n    def __init__(self, hp):\n        super().__init__(hp)\n        self.power = 100\nb = Boss(500)\nprint(b.hp, b.power)", "expect": "500 100", "hint": "super+新属性"}, {"type": "choice", "q": "「复用已有类的行为，再加自己的」用？", "options": ["继承", "循环", "import", "全局变量"], "answer": 1, "explain": "继承天然支持扩展复用。"}, {"type": "code", "q": "class Sound play() 返回 \"...\"；class Piano(Sound) 返回 \"叮咚\"；class Drum(Sound) 返回 \"咚咚\"。都打印", "code": "class Sound:\n    def play(self):\n        return \"...\"\nclass Piano(Sound):\n    def play(self):\n        return \"叮咚\"\nclass Drum(Sound):\n    def play(self):\n        return \"咚咚\"\nprint(Piano().play())\nprint(Drum().play())", "expect": "叮咚\n咚咚", "hint": "多态"}, {"type": "choice", "q": "多层继承 class C(B): class B(A): 中 C 有哪些？", "options": ["只有自己的", "A+B+C 的", "只有 A", "报错"], "answer": 1, "explain": "继承链上所有父类能力都传递。"}, {"type": "code", "q": "class Animal __init__ 存 name、speak() 返回 \"...\"；class Dog 重写 speak。列表 animals 两个对象分别调 speak", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return \"...\"\nclass Dog(Animal):\n    def speak(self):\n        return \"汪汪\"\nfor a in [Animal(\"x\"), Dog(\"旺财\")]:\n    print(a.speak())", "expect": "...\n汪汪", "hint": "for 遍历多态"}]}, {"id": 18, "no": "ⅩⅧ", "title": "类进阶", "weeks": "第 9 周", "diff": "★★★", "full": true, "story": {"tutor": "彼得·诺尔（Peter Naur）", "era": "丹麦 · 编程语言先驱", "fact": "诺尔说编程是「理论构建」——你在脑子里建一个关于数据如何流动的模型。类进阶的魔法方法（__str__/__eq__）就是让对象像内置类型一样自然：能打印、能比较、能运算。", "quote": "「程序不只是指令序列，它是你对问题形成的理解。」"}, "map": ["__str__", "__eq__ 比较", "类属性", "数据类思维"], "sections": [{"t": "__str__：让对象会说话", "p": "定义 __str__ 返回字符串，print(对象) 时自动调用，而不是打印内存地址。", "code": "class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __str__(self):\n        return \"(\" + str(self.x) + \",\" + str(self.y) + \")\"\np = Point(1, 2)\nprint(p)"}, {"t": "__eq__：让对象可比", "p": "定义 __eq__ 说明「两个对象什么时候相等」，默认比较地址。", "code": "class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __eq__(self, o):\n        return self.x == o.x and self.y == o.y\nprint(Point(1,2) == Point(1,2))"}, {"t": "类属性：所有实例共享", "p": "类体里直接赋值的是类属性，所有实例共享；实例属性 self.xxx 各自独立。", "code": "class Dog:\n    legs = 4\n    def __init__(self, name):\n        self.name = name\na = Dog(\"A\")\nprint(Dog.legs, a.legs)"}, {"t": "数据类思维", "p": "把「一组相关数据 + 操作」收进类，代码意图清晰。类是命名良好的数据容器 + 行为。", "code": "class Item:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\n    def __str__(self):\n        return self.name + \":\" + str(self.price)\nprint(Item(\"书\", 39))"}], "quiz": [{"type": "choice", "q": "__str__ 方法的作用？", "options": ["把对象转字符串给人看", "删除对象", "加密对象", "复制对象"], "answer": 0, "explain": "print(对象) 显示 __str__ 返回的内容。"}, {"type": "code", "q": "class Point 有 x,y，定义 __str__ 返回 \"(x,y)\"，打印 Point(2,3)", "code": "class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __str__(self):\n        return \"(\" + str(self.x) + \",\" + str(self.y) + \")\"\nprint(Point(2, 3))", "expect": "(2,3)", "hint": "__str__ 拼接"}, {"type": "choice", "q": "没定义 __str__ 时 print(对象) 显示？", "options": ["属性字典", "内存地址样式", "报错", "空"], "answer": 1, "explain": "默认打印对象类型和内存地址（<__main__.Point object at ...>）。"}, {"type": "code", "q": "class User 有 name，定义 __eq__ 比较 name 相同即相等，比较两个 User", "code": "class User:\n    def __init__(self, name):\n        self.name = name\n    def __eq__(self, o):\n        return self.name == o.name\nprint(User(\"a\") == User(\"a\"))\nprint(User(\"a\") == User(\"b\"))", "expect": "True\nFalse", "hint": "__eq__ 比 name"}, {"type": "choice", "q": "类属性（class 体内直接赋值）的特点？", "options": ["每实例一份", "所有实例共享", "只能读", "必须私有"], "answer": 1, "explain": "类属性被所有实例共享。"}, {"type": "code", "q": "class Dog 有类属性 legs=4；创建两个实例打印 a.legs 和 b.legs", "code": "class Dog:\n    legs = 4\na = Dog()\nb = Dog()\nprint(a.legs, b.legs)", "expect": "4 4", "hint": "共享类属性"}, {"type": "choice", "q": "self.name = name 是？", "options": ["类属性", "实例属性", "全局变量", "局部变量"], "answer": 1, "explain": "self.xxx 是实例属性，每实例一份。"}, {"type": "code", "q": "class Book 有 title/price 和 __str__ 返回 \"title:price\"，打印 Book(\"Python\", 59)", "code": "class Book:\n    def __init__(self, title, price):\n        self.title = title\n        self.price = price\n    def __str__(self):\n        return self.title + \":\" + str(self.price)\nprint(Book(\"Python\", 59))", "expect": "Python:59", "hint": "__str__ 实现"}, {"type": "choice", "q": "什么时候该把一组数据收进类？", "options": ["永远不该", "它们总一起出现且有共同行为", "数据多就行", "类只用于游戏"], "answer": 1, "explain": "相关性 + 共同操作 = 类的信号。"}, {"type": "code", "q": "class Money 存 amount，定义 __eq__ 金额相等即相等。比较 Money(5) 与 Money(5.0)", "code": "class Money:\n    def __init__(self, amount):\n        self.amount = amount\n    def __eq__(self, o):\n        return self.amount == o.amount\nprint(Money(5) == Money(5.0))", "expect": "True", "hint": "数值相等"}], "exam": [{"type": "choice", "q": "__str__ 由谁触发？", "options": ["只 print 对象时", "str(对象)/print 对象时", "类型转换时", "永不"], "answer": 1, "explain": "print 和 str() 都会触发 __str__。"}, {"type": "code", "q": "class Card 有 suit 和 rank，__str__ 返回 \"rank of suit\"，打印 Card(\"♠\",\"A\")", "code": "class Card:\n    def __init__(self, suit, rank):\n        self.suit = suit\n        self.rank = rank\n    def __str__(self):\n        return self.rank + \" of \" + self.suit\nprint(Card(\"♠\", \"A\"))", "expect": "A of ♠", "hint": "rank of suit"}, {"type": "choice", "q": "两个内容相同但没定义 __eq__ 的对象 ==？", "options": ["True", "False（默认比地址）", "报错", "None"], "answer": 1, "explain": "默认 == 比较内存地址，内容相同也 False。"}, {"type": "code", "q": "class Player 有 name/score，定义 __eq__ name 和 score 都相同才相等。比较", "code": "class Player:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n    def __eq__(self, o):\n        return self.name == o.name and self.score == o.score\nprint(Player(\"A\", 10) == Player(\"A\", 10))\nprint(Player(\"A\", 10) == Player(\"B\", 10))", "expect": "True\nFalse", "hint": "双条件"}, {"type": "choice", "q": "想统计「创建了几个实例」用？", "options": ["实例属性", "类属性计数器", "全局函数", "魔法方法"], "answer": 1, "explain": "类属性在 __init__ 累加即可全实例共享计数。"}, {"type": "code", "q": "class Count 有类属性 n=0，__init__ 里 Count.n+=1。创建三个后打印 Count.n", "code": "class Count:\n    n = 0\n    def __init__(self):\n        Count.n += 1\na = Count()\nb = Count()\nc = Count()\nprint(Count.n)", "expect": "3", "hint": "类属性计数"}, {"type": "choice", "q": "数据类思维的核心？", "options": ["类越少越好", "把相关数据+操作打包成类", "用字典代替一切", "函数式"], "answer": 1, "explain": "用类表达领域概念，代码自我说明。"}, {"type": "code", "q": "class Person 有 name/age 和 __str__ 返回 \"name(age岁)\"，打印 Person(\"鼠哥\",18)", "code": "class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n    def __str__(self):\n        return self.name + \"(\" + str(self.age) + \"岁)\"\nprint(Person(\"鼠哥\", 18))", "expect": "鼠哥(18岁)", "hint": "__str__"}, {"type": "choice", "q": "实例属性和类属性同名时，实例访问？", "options": ["类属性", "实例属性优先", "报错", "随机"], "answer": 1, "explain": "实例属性遮蔽类属性。"}, {"type": "code", "q": "class Vec 有 x,y，定义 __eq__ 比较坐标相等，还定义 __str__。比较并打印", "code": "class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __eq__(self, o):\n        return self.x == o.x and self.y == o.y\n    def __str__(self):\n        return \"<\" + str(self.x) + \",\" + str(self.y) + \">\"\nv1 = Vec(1, 2)\nv2 = Vec(1, 2)\nprint(v1 == v2)\nprint(v1)", "expect": "True\n<1,2>", "hint": "eq+str"}]}, {"id": 19, "no": "ⅩⅨ", "title": "文件读写", "weeks": "第 10 周", "diff": "★★★", "full": true, "story": {"tutor": "约翰·巴科斯（John Backus）", "era": "美国 · FORTRAN 之父", "fact": "巴科斯造 FORTRAN 的初衷是「把公式直接写下来让机器算」。文件是程序与硬盘之间的桥：程序重启后数据还在，靠的就是读写文件。掌握文件，程序才有「记忆」。", "quote": "「我把大半辈子花在了让自己和别程序员少干活的工具上。」"}, "map": ["open 读文件", "写文件", "with 语句", "逐行处理"], "sections": [{"t": "读文件：把硬盘内容请进来", "p": "open(path) 打开文件，read() 全读 / readlines() 逐行列表。用完 close()。", "code": "f = open('data.txt', encoding='utf-8')\ncontent = f.read()\nf.close()\nprint(content[:50])"}, {"t": "写文件：把内容存下去", "p": "open(path, \"w\") 覆盖写、\"a\" 追加写。写字符串或 writelines 列表。", "code": "f = open('out.txt', 'w', encoding='utf-8')\nf.write('第一行\\n')\nf.write('第二行\\n')\nf.close()"}, {"t": "with：自动关门", "p": "with open(...) as f: 代码块结束自动关闭文件，忘 close 也不会漏。", "code": "with open('out.txt', encoding='utf-8') as f:\n    for line in f:\n        print(line.strip())"}, {"t": "逐行处理大数据", "p": "for line in f 一次一行，不把整个文件读进内存——处理日志、超大文件的正道。", "code": "with open('out.txt', encoding='utf-8') as f:\n    n = 0\n    for line in f:\n        if 'error' in line.lower():\n            n += 1\n    print('error 行数:', n)"}], "quiz": [{"type": "choice", "q": "open(\"a.txt\", \"r\") 的 \"r\" 表示？", "options": ["写入", "只读", "追加", "删除"], "answer": 1, "explain": "r = read 只读，默认模式。"}, {"type": "choice", "q": "文件用完不 close() 的后果？", "options": ["没事", "资源泄漏，可能写不全", "文件变快", "报错必须关"], "answer": 1, "explain": "不关文件可能数据没写盘或占用句柄。"}, {"type": "choice", "q": "with open(f) as x 的好处？", "options": ["代码更短", "自动关闭文件", "防止读取", "替代变量"], "answer": 1, "explain": "with 块结束自动 close，最稳妥。"}, {"type": "choice", "q": "open(\"f.txt\", \"w\") 若 f.txt 已存在会？", "options": ["报错", "清空重写", "追加", "只读"], "answer": 1, "explain": "w 模式覆盖原内容。"}, {"type": "choice", "q": "要保留原内容往后加，用什么模式？", "options": ["\"r\"", "\"a\"", "\"w\"", "\"x\""], "answer": 1, "explain": "a = append 追加到末尾。"}, {"type": "choice", "q": "f.read() 返回？", "options": ["行列表", "整个文件字符串", "文件对象", "行数"], "answer": 1, "explain": "read() 一次读全部为一个大字符串。"}, {"type": "choice", "q": "f.readlines() 返回？", "options": ["字符串", "每行一个元素的列表", "行数", "None"], "answer": 1, "explain": "readlines() 按行切分返回列表。"}, {"type": "choice", "q": "for line in f 适合？", "options": ["小文件", "逐行处理大文件", "任何", "不能遍历"], "answer": 1, "explain": "迭代文件对象逐行读，省内存。"}, {"type": "choice", "q": "写文件用什么方法？", "options": ["f.read()", "f.write(内容)", "f.append()", "f.add()"], "answer": 1, "explain": "write 写入字符串内容。"}, {"type": "code", "q": "用 StringIO 模拟写文件：写 \"甲\\n乙\\n\" 后打印内容（判题环境无磁盘，用 io.StringIO）", "code": "import io\nf = io.StringIO()\nf.write('甲\\n')\nf.write('乙\\n')\nprint(f.getvalue().strip())", "expect": "甲\n乙", "hint": "StringIO 内存文件"}], "exam": [{"type": "choice", "q": "open 的默认编码问题在中文文件？", "options": ["没影响", "可能乱码，指定 encoding=\"utf-8\"", "只能 ascii", "必报错"], "answer": 1, "explain": "中文文件应显式 encoding=\"utf-8\"。"}, {"type": "choice", "q": "读文件三种方式 read/readline/readlines 区别？", "options": ["没区别", "全读/读一行/读所有行成列表", "read 最快", "只读一次"], "answer": 1, "explain": "粒度不同：整串/单行/行列表。"}, {"type": "code", "q": "用 io.StringIO 模拟：写入三行数字 1 2 3，读回并打印每行平方", "code": "import io\nf = io.StringIO()\nf.write('1\\n2\\n3\\n')\nf.seek(0)\nfor line in f:\n    n = int(line.strip())\n    print(n * n)", "expect": "1\n4\n9", "hint": "逐行转 int"}, {"type": "choice", "q": "\"w\" 与 \"a\" 的核心差别？", "options": ["w 更快", "w 覆盖 a 追加", "a 更快", "没差别"], "answer": 1, "explain": "w 重建文件，a 续写。"}, {"type": "choice", "q": "写日志文件用追加还是覆盖？", "options": ["覆盖", "追加（保留历史）", "都行", "随机"], "answer": 1, "explain": "日志要留历史，用 a 追加。"}, {"type": "code", "q": "用 io.StringIO 存三行名单，读回统计行数", "code": "import io\nf = io.StringIO('甲\\n乙\\n丙\\n')\nf.seek(0)\nn = 0\nfor _ in f:\n    n += 1\nprint(n)", "expect": "3", "hint": "数行"}, {"type": "choice", "q": "with open 中发生异常文件会？", "options": ["不关", "正常关闭（with 保证）", "损坏", "变空"], "answer": 1, "explain": "with 保证无论异常与否都关闭。"}, {"type": "code", "q": "读 StringIO 内容 \"a,b,c\"（一行），split(\",\") 后打印每项", "code": "import io\nf = io.StringIO('a,b,c')\nf.seek(0)\nfor item in f.read().split(','):\n    print(item)", "expect": "a\nb\nc", "hint": "split 逗号"}, {"type": "choice", "q": "处理文件时最该养成的习惯？", "options": ["永远用绝对路径", "用 with 管理文件", "复制再改", "不读文件"], "answer": 1, "explain": "with 自动管理资源是 Python 惯例。"}, {"type": "code", "q": "统计 StringIO 文本 \"hello\\nworld\\nhello\" 里 hello 出现次数（整个文本 count）", "code": "import io\nf = io.StringIO('hello\\nworld\\nhello')\nf.seek(0)\nprint(f.read().count('hello'))", "expect": "2", "hint": "str.count"}]}, {"id": 20, "no": "ⅩⅩ", "title": "JSON 持久化", "weeks": "第 10 周", "diff": "★★★", "full": true, "story": {"tutor": "道格拉斯·克罗克福德（Douglas Crockford）", "era": "美国 · JSON 之父", "fact": "克罗克福德 2001 年从 JavaScript 里抽出 JSON——一个「连人带机器都读得懂」的数据格式。现在它是互联网数据交换的普通话。程序存 JSON = 让数据活过程序的一生。", "quote": "「好设计是你能对新手解释清楚、又能让老手挑不出毛病。」"}, "map": ["json.dumps", "json.loads", "存到文件", "读回字典"], "sections": [{"t": "dumps：对象 → 字符串", "p": "json.dumps(字典) 把 Python 对象转成 JSON 字符串，中文要 ensure_ascii=False。", "code": "import json\ndata = {\"name\": \"鼠哥\", \"age\": 18}\ns = json.dumps(data, ensure_ascii=False)\nprint(s)"}, {"t": "loads：字符串 → 对象", "p": "json.loads(字符串) 把 JSON 字符串解析回 Python 字典/列表。", "code": "import json\ns = '{\"name\": \"鼠哥\", \"age\": 18}'\nd = json.loads(s)\nprint(d[\"name\"])"}, {"t": "写文件持久化", "p": "json.dump(data, f) 直接写文件；load 时 json.load(f)。", "code": "import json\nwith open('save.json', 'w', encoding='utf-8') as f:\n    json.dump({\"score\": 99}, f, ensure_ascii=False)"}, {"t": "程序重启不丢数据", "p": "启动时 load（文件不在就默认值），结束时 dump。这就是最简单的存档系统。", "code": "import json, os\nif os.path.exists('save.json'):\n    with open('save.json', encoding='utf-8') as f:\n        data = json.load(f)\nelse:\n    data = {'score': 0}\nprint(data['score'])"}], "quiz": [{"type": "choice", "q": "json.dumps 的作用？", "options": ["解析 JSON", "Python 对象转 JSON 字符串", "读文件", "删数据"], "answer": 1, "explain": "dumps = dump string，序列化。"}, {"type": "code", "q": "把 {\"a\": 1} 用 json.dumps 转字符串并打印", "code": "import json\nprint(json.dumps({\"a\": 1}))", "expect": "{\"a\": 1}", "hint": "dumps 序列化"}, {"type": "choice", "q": "json.loads 的作用？", "options": ["转 JSON", "JSON 字符串解析回 Python 对象", "写文件", "压缩"], "answer": 1, "explain": "loads 反序列化。"}, {"type": "code", "q": "解析 JSON 字符串 [1,2,3] 成列表并打印第 2 个元素", "code": "import json\nlst = json.loads(\"[1, 2, 3]\")\nprint(lst[1])", "expect": "2", "hint": "loads 后是列表"}, {"type": "choice", "q": "dumps 中文出现 \\uXXXX 怎么办？", "options": ["无解", "ensure_ascii=False", "换编码", "删中文"], "answer": 1, "explain": "ensure_ascii=False 让中文原样显示。"}, {"type": "code", "q": "{\"name\":\"小明\",\"age\":9} dumps 且 ensure_ascii=False 后打印", "code": "import json\nprint(json.dumps({\"name\": \"小明\", \"age\": 9}, ensure_ascii=False))", "expect": "{\"name\": \"小明\", \"age\": 9}", "hint": "ensure_ascii=False"}, {"type": "choice", "q": "把对象存文件用 json.dump 还是 dumps？", "options": ["dumps", "dump（写文件流）", "都可", "load"], "answer": 1, "explain": "dump(obj, file) 直接写文件；dumps 返回字符串。"}, {"type": "code", "q": "json.loads 解析 {\"ok\": true} 后打印 ok 的值", "code": "import json\nd = json.loads('{\"ok\": true}')\nprint(d[\"ok\"])", "expect": "True", "hint": "布尔原样"}, {"type": "choice", "q": "JSON 适合存什么？", "options": ["任意二进制", "嵌套的字典/列表数据", "程序代码", "图片"], "answer": 1, "explain": "JSON 表达结构化数据；图片等二进制不适合。"}, {"type": "code", "q": "dumps 一个列表 [\"猫\",\"狗\"] ensure_ascii=False 打印", "code": "import json\nprint(json.dumps([\"猫\", \"狗\"], ensure_ascii=False))", "expect": "[\"猫\", \"狗\"]", "hint": "列表序列化"}], "exam": [{"type": "choice", "q": "「序列化」意思是？", "options": ["加密", "对象变可存可传的字符串/字节", "删除对象", "复制对象"], "answer": 1, "explain": "序列化让对象能存盘或传输。"}, {"type": "code", "q": "json.dumps 数字列表 [1,2] 打印", "code": "import json\nprint(json.dumps([1, 2]))", "expect": "[1, 2]", "hint": "列表"}, {"type": "choice", "q": "loads 失败（格式错）会？", "options": ["返回 None", "抛 JSONDecodeError", "静默跳过", "返回空"], "answer": 1, "explain": "非法 JSON 会抛异常，应 try 包裹。"}, {"type": "code", "q": "解析 '{\"x\": {\"y\": 5}}' 打印嵌套 y", "code": "import json\nd = json.loads('{\"x\": {\"y\": 5}}')\nprint(d[\"x\"][\"y\"])", "expect": "5", "hint": "嵌套取"}, {"type": "choice", "q": "游戏存档用 JSON 的好处？", "options": ["读不懂", "人可读可改可调试", "体积最大", "运行更快"], "answer": 1, "explain": "JSON 文本可读，方便排障。"}, {"type": "code", "q": "把 {\"n\": 1, \"s\": \"甲\"} dumps ensure_ascii=False 打印", "code": "import json\nprint(json.dumps({\"n\": 1, \"s\": \"甲\"}, ensure_ascii=False))", "expect": "{\"n\": 1, \"s\": \"甲\"}", "hint": "混合类型"}, {"type": "choice", "q": "读取不存在的 JSON 文件（未捕获）会？", "options": ["返回空字典", "FileNotFoundError", "静默", "自动创建"], "answer": 1, "explain": "需先判断文件存在或 try 捕获。"}, {"type": "code", "q": "json.dumps 元组会变什么？", "code": "import json\nprint(json.dumps((1, 2)))", "expect": "[1, 2]", "hint": "元组序列化为数组"}, {"type": "choice", "q": "JSON 键值里的键必须是？", "options": ["数字", "字符串", "任意", "None"], "answer": 1, "explain": "JSON 键是双引号字符串。"}, {"type": "code", "q": "dumps {\"ok\": false} 打印", "code": "import json\nprint(json.dumps({\"ok\": False}))", "expect": "{\"ok\": false}", "hint": "False→false"}]}, {"id": 21, "no": "ⅩⅪ", "title": "异常处理", "weeks": "第 11 周", "diff": "★★★", "full": true, "story": {"tutor": "詹姆斯·高斯林（James Gosling）", "era": "加拿大 · Java 之父", "fact": "高斯林说异常处理是「把错误当一等公民」。程序不是不犯错，而是犯了错知道怎么爬起来。try-except 就是给程序配的安全网：用户乱输入、文件找不到，都不该让程序崩掉。", "quote": "「出错不是程序的尽头，是你对它的考验。」"}, "map": ["try-except", "else 与 finally", "捕获特定异常", "异常是流程"], "sections": [{"t": "try-except：兜住错误", "p": "可能出错的代码放 try，出错时执行 except 分支，程序不崩。", "code": "try:\n    n = int('abc')\nexcept ValueError:\n    print('不是数字')"}, {"t": "捕获特定异常", "p": "精确捕获 ValueError/ZeroDivisionError/FileNotFoundError 等，别一把抓。", "code": "try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    print('不能除零')"}, {"t": "else 与 finally", "p": "else：没出错才执行。finally：无论对错都执行（如关文件）。", "code": "try:\n    n = int('42')\nexcept ValueError:\n    print('错')\nelse:\n    print('成功', n)\nfinally:\n    print('结束')"}, {"t": "异常是流程的一部分", "p": "用异常处理「预期外的输入」，比到处 if 判断更干净。", "code": "while True:\n    try:\n        n = int(input('输入数字: '))\n        break\n    except ValueError:\n        print('重来')"}], "quiz": [{"type": "choice", "q": "try 块里的代码出错后？", "options": ["程序崩溃", "跳到 except 分支", "继续执行", "重试"], "answer": 1, "explain": "异常被 except 捕获，流程跳转。"}, {"type": "code", "q": "try 里 int(\"x\")，except ValueError 打印 \"不是数字\"", "code": "try:\n    n = int('x')\nexcept ValueError:\n    print('不是数字')", "expect": "不是数字", "hint": "捕获 ValueError"}, {"type": "choice", "q": "1/0 抛什么异常？", "options": ["ValueError", "ZeroDivisionError", "TypeError", "IndexError"], "answer": 1, "explain": "除零是 ZeroDivisionError。"}, {"type": "code", "q": "try 1/0 except ZeroDivisionError 打印 \"不能除零\"", "code": "try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    print('不能除零')", "expect": "不能除零", "hint": "捕获除零"}, {"type": "choice", "q": "else 块什么时候执行？", "options": ["出错时", "try 没出错时", "finally 后", "永远"], "answer": 1, "explain": "else 仅在 try 无异常时执行。"}, {"type": "code", "q": "try int(\"5\") except 打印 \"错\" else 打印 \"成功\"", "code": "try:\n    n = int('5')\nexcept ValueError:\n    print('错')\nelse:\n    print('成功')", "expect": "成功", "hint": "没出错走 else"}, {"type": "choice", "q": "finally 块保证？", "options": ["只在出错时", "无论对错都执行", "从不执行", "跳过 except"], "answer": 1, "explain": "finally 收尾必执行。"}, {"type": "code", "q": "try 1/0 except 打印后 finally 打印 \"收尾\"", "code": "try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    print('出错啦')\nfinally:\n    print('收尾')", "expect": "出错啦\n收尾", "hint": "except+finally"}, {"type": "choice", "q": "list[99] 越界抛？", "options": ["ValueError", "IndexError", "KeyError", "TypeError"], "answer": 1, "explain": "下标越界 IndexError。"}, {"type": "code", "q": "捕获 IndexError：访问空列表 [0] 打印 \"越界\"", "code": "try:\n    x = [][0]\nexcept IndexError:\n    print('越界')", "expect": "越界", "hint": "空列表下标"}], "exam": [{"type": "choice", "q": "dict[\"no\"] 键不存在抛？", "options": ["IndexError", "KeyError", "ValueError", "SyntaxError"], "answer": 1, "explain": "字典缺键 KeyError。"}, {"type": "code", "q": "捕获 KeyError：d={} 取 d[\"a\"] 打印 \"无键\"", "code": "d = {}\ntry:\n    x = d['a']\nexcept KeyError:\n    print('无键')", "expect": "无键", "hint": "KeyError"}, {"type": "choice", "q": "用户可能乱输入，最稳的读数字代码？", "options": ["int(input())", "try+int 捕 ValueError", "float(input())", "input() 自动转"], "answer": 1, "explain": "用 try 包住转换，捕获 ValueError 提示重输。"}, {"type": "code", "q": "int(\"12.3\") 抛 ValueError，捕获打印 \"不是整数\"", "code": "try:\n    n = int('12.3')\nexcept ValueError:\n    print('不是整数')", "expect": "不是整数", "hint": "小数转 int 报错"}, {"type": "choice", "q": "except Exception: 与 except ValueError: 区别？", "options": ["没区别", "前者捕获所有异常，后者只捕获 ValueError", "前者更精确", "都非法"], "answer": 1, "explain": "Exception 是万能兜底，ValueError 是精确靶向。"}, {"type": "code", "q": "同时处理除零：用户给 0 当除数，捕获并提示", "code": "try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print('除数不能为 0')", "expect": "除数不能为 0", "hint": "除零提示"}, {"type": "choice", "q": "finally 常用于？", "options": ["打印日志", "资源清理（关文件等）", "返回结果", "递归"], "answer": 1, "explain": "finally 放清理逻辑最稳。"}, {"type": "code", "q": "try-else：int(\"7\") 成功则 else 打印 \"好\"", "code": "try:\n    n = int('7')\nexcept ValueError:\n    print('坏')\nelse:\n    print('好')", "expect": "好", "hint": "else 成功分支"}, {"type": "choice", "q": "一段代码可能抛多种异常，处理方式？", "options": ["一个 except 全收", "多个 except 分别捕获", "只能 try 一次", "不处理"], "answer": 1, "explain": "可写多个 except 分支分别处理。"}, {"type": "code", "q": "多层 except：分别处理 ValueError 和其他（打印 \"其它错误\"）", "code": "try:\n    x = int('a') + 1 / 0\nexcept ValueError:\n    print('值错误')\nexcept ZeroDivisionError:\n    print('除零错误')\nexcept Exception:\n    print('其它错误')", "expect": "值错误", "hint": "int 先抛 ValueError"}]}, {"id": 22, "no": "ⅩⅫ", "title": "测试入门", "weeks": "第 11 周", "diff": "★★★", "full": true, "story": {"tutor": "肯特·贝克（Kent Beck）", "era": "美国 · 极限编程之父", "fact": "贝克把「先写测试再写代码」变成流派。测试不是写完代码后的安慰，而是代码的「安全带」：你改了一行，测试立刻告诉你有没有撞坏别处。", "quote": "「代码没有测试，就像没系安全带的驾驶。」"}, "map": ["assert", "写小测试", "边界用例", "测试驱动思维"], "sections": [{"t": "assert：一句话断言", "p": "assert 条件，条件为 False 就抛 AssertionError。测试的基本砖块。", "code": "def add(a, b):\n    return a + b\nassert add(1, 2) == 3\nprint('通过')"}, {"t": "为函数写测试", "p": "把输入输出的预期写进 assert，一组 assert 就是一个小测试套件。", "code": "def mul(a, b):\n    return a * b\nassert mul(3, 4) == 12\nassert mul(0, 5) == 0\nprint('全过')"}, {"t": "边界用例", "p": "测边界：空、零、负数、最大值、恰好相等。bug 常在边界。", "code": "def sign(x):\n    if x > 0: return '正'\n    if x < 0: return '负'\n    return '零'\nassert sign(0) == '零'\nassert sign(-1) == '负'\nprint('边界 OK')"}, {"t": "改代码有底气", "p": "有了测试，重构不怕：跑一遍测试就知道有没有破坏行为。", "code": "def double(x):\n    return x * 2\ndef test():\n    assert double(0) == 0\n    assert double(-3) == -6\ntest()\nprint('重构安全')"}], "quiz": [{"type": "choice", "q": "assert 条件为假时？", "options": ["继续运行", "抛 AssertionError", "返回 False", "打印警告"], "answer": 1, "explain": "assert 假即抛错，测试失败。"}, {"type": "code", "q": "断言 add(2,3)==5（先定义 add 返回 a+b）后打印 \"通过\"", "code": "def add(a, b):\n    return a + b\nassert add(2, 3) == 5\nprint('通过')", "expect": "通过", "hint": "assert 真则继续"}, {"type": "choice", "q": "为什么要测边界？", "options": ["边界经常出 bug", "好看", "跑得快", "必须"], "answer": 0, "explain": "0、空、负数等边界是 bug 高发区。"}, {"type": "code", "q": "写函数 is_odd(n) 返回奇数与否，assert 验证 3 是奇数后打印", "code": "def is_odd(n):\n    return n % 2 != 0\nassert is_odd(3) is True\nprint('odd ok')", "expect": "odd ok", "hint": "n%2!=0"}, {"type": "choice", "q": "测试的价值主要在？", "options": ["让代码更长", "改代码时能发现破坏", "替代注释", "运行更快"], "answer": 1, "explain": "回归保护：改动不破旧功能。"}, {"type": "code", "q": "定义 absv(x) 返回绝对值，assert 测 0 和 -5", "code": "def absv(x):\n    return x if x >= 0 else -x\nassert absv(0) == 0\nassert absv(-5) == 5\nprint('abs ok')", "expect": "abs ok", "hint": "双断言"}, {"type": "choice", "q": "测试「恰好相等」属于？", "options": ["边界", "随机", "主路径", "装饰"], "answer": 1, "explain": "等值边界（>=、恰好 n）要单测。"}, {"type": "code", "q": "字符串函数 shout(s) 返回 s+\"!\"，assert 测空串", "code": "def shout(s):\n    return s + '!'\nassert shout('') == '!'\nassert shout('哈') == '哈!'\nprint('shout ok')", "expect": "shout ok", "hint": "边界空串"}, {"type": "choice", "q": "改了函数签名（参数变了）最该？", "options": ["直接部署", "先跑测试看哪里破", "删代码", "加注释"], "answer": 1, "explain": "测试暴露所有调用点是否仍兼容。"}, {"type": "code", "q": "max3(a,b,c) 返回最大，assert 测三个样例", "code": "def max3(a, b, c):\n    return max(a, b, c)\nassert max3(1, 2, 3) == 3\nassert max3(5, 1, 2) == 5\nassert max3(0, 0, -1) == 0\nprint('max3 ok')", "expect": "max3 ok", "hint": "三样例"}], "exam": [{"type": "choice", "q": "测试失败时 assert 抛的异常？", "options": ["ValueError", "AssertionError", "TypeError", "KeyError"], "answer": 1, "explain": "断言失败抛 AssertionError。"}, {"type": "code", "q": "验证 mul(2,5)==10（函数返回 a*b）后打印", "code": "def mul(a, b):\n    return a * b\nassert mul(2, 5) == 10\nprint('ok')", "expect": "ok", "hint": "基本断言"}, {"type": "choice", "q": "除以相关函数测 0 属于？", "options": ["主路径", "边界", "无关", "装饰"], "answer": 1, "explain": "0 是除法核心边界。"}, {"type": "code", "q": "is_even(n) 断言 0 是偶数、7 不是", "code": "def is_even(n):\n    return n % 2 == 0\nassert is_even(0) is True\nassert is_even(7) is False\nprint('even ok')", "expect": "even ok", "hint": "0 边界"}, {"type": "choice", "q": "「回归测试」指？", "options": ["第一次测", "确保新改动没破坏旧功能", "删旧测试", "性能测试"], "answer": 1, "explain": "回归 = 旧功能不被新代码破坏。"}, {"type": "code", "q": "clamp(x, lo, hi) 限制范围，断言边界值", "code": "def clamp(x, lo, hi):\n    if x < lo: return lo\n    if x > hi: return hi\n    return x\nassert clamp(0, 1, 5) == 1\nassert clamp(9, 1, 5) == 5\nassert clamp(3, 1, 5) == 3\nprint('clamp ok')", "expect": "clamp ok", "hint": "上下界"}, {"type": "choice", "q": "测试里的「期望值」来自？", "options": ["猜测", "手算/规格确定的结果", "运行一次", "用户"], "answer": 1, "explain": "期望值由规格或已知正确逻辑确定。"}, {"type": "code", "q": "字符串 upper 断言 \"py\".upper()==\"PY\"", "code": "assert 'py'.upper() == 'PY'\nprint('up ok')", "expect": "up ok", "hint": "内置方法测试"}, {"type": "choice", "q": "发现 bug 后正确的做法？", "options": ["改完就走", "先写复现该 bug 的测试再改", "删掉功能", "忽略"], "answer": 1, "explain": "先写失败测试复现，再修复让测试通过，防复发。"}, {"type": "code", "q": "sum2 场景：函数 add_all(*ns) 返回和，断言空调用为 0", "code": "def add_all(*ns):\n    return sum(ns)\nassert add_all() == 0\nassert add_all(1, 2, 3) == 6\nprint('sum ok')", "expect": "sum ok", "hint": "空参数边界"}]}, {"id": 23, "no": "ⅩⅩⅢ", "title": "代码整洁", "weeks": "第 12 周", "diff": "★★☆", "full": true, "story": {"tutor": "罗伯特·马丁（Robert Martin）", "era": "美国 · 清洁代码作者", "fact": "马丁写了《Clean Code》：好代码不靠注释解释「怎么」，而靠命名说明「为什么」。变量名是程序里出现最多的文字——起好名是最划算的投资。", "quote": "「你写的代码首先是给人读的，只是顺便给机器执行。」"}, "map": ["命名之道", "函数短小", "注释写为什么", "可读性重构"], "sections": [{"t": "命名：读起来像话", "p": "变量名说清楚「是什么」：total_price 好过 tp、x。布尔用 is/has 开头。", "code": "# 好命名\ntotal_price = 3 * 5\nis_paid = True\nprint(total_price, is_paid)"}, {"t": "函数短小：一函数一事", "p": "函数超过十几行就该拆。每个函数名是它的承诺：def calc_total(order)。", "code": "def line_total(qty, price):\n    return qty * price\ndef order_total(items):\n    return sum(line_total(q, p) for q, p in items)\nprint(order_total([(2, 3), (1, 5)]))"}, {"t": "注释写「为什么」", "p": "代码写「怎么」，注释补「为什么这样」。别注释废话（x = 1  # 设 x 为 1）。", "code": "TAX = 0.08  # 本地税率，政策调整时只需改这里\ndef after_tax(p):\n    return round(p * (1 + TAX), 2)\nprint(after_tax(100))"}, {"t": "丑代码重构", "p": "魔法数字、长函数、重复代码是三大臭味。闻到就拆。", "code": "def tax_price(p):\n    return round(p * 1.08, 2)  # 1.08 = 含税 8%\nprint(tax_price(50))"}], "quiz": [{"type": "choice", "q": "变量名哪个最好？", "options": ["x", "total_price", "tp", "t1"], "answer": 1, "explain": "total_price 自解释；x/tp 是猜谜。"}, {"type": "code", "q": "把重复计算收进函数：定义 area(w,h) 两次调用打印两个面积", "code": "def area(w, h):\n    return w * h\nprint(area(3, 4))\nprint(area(5, 6))", "expect": "12\n30", "hint": "函数复用"}, {"type": "choice", "q": "布尔变量命名习惯？", "options": ["flag1", "is_ok / has_key", "do", "num"], "answer": 1, "explain": "is/has 开头让 if 读起来自然。"}, {"type": "code", "q": "注释「为什么」场景：定义 RATE=0.1 表示折扣并注释用途，计算 200 折后", "code": "RATE = 0.1  # 学生折扣 10%\nprint(round(200 * (1 - RATE)))", "expect": "180", "hint": "200*0.9"}, {"type": "choice", "q": "魔法数字（代码里直接写 0.08）的问题？", "options": ["运行慢", "含义不明、改一处漏一处", "一定报错", "省内存"], "answer": 1, "explain": "应为命名常量集中管理。"}, {"type": "code", "q": "函数 greet(name, city) 返回问候，调用时用关键字参数让意图清楚", "code": "def greet(name, city):\n    return name + ' 在 ' + city\nprint(greet(name='鼠哥', city='西安'))", "expect": "鼠哥 在 西安", "hint": "关键字参数"}, {"type": "choice", "q": "好的函数长度？", "options": ["越长越完整", "短小单一职责", "随便", "必须 100 行"], "answer": 1, "explain": "短函数易读易测。"}, {"type": "code", "q": "把三个数平均的逻辑收进 avg3 并调用", "code": "def avg3(a, b, c):\n    return (a + b + c) / 3\nprint(avg3(3, 6, 9))", "expect": "6.0", "hint": "收进函数"}, {"type": "choice", "q": "哪条注释有价值？", "options": ["x=1 # x 等于 1", "# 改用索引加速：数据量大时全扫太慢", "# 开始", "# 结束"], "answer": 1, "explain": "解释为什么的注释有价值，复述代码的是噪音。"}, {"type": "code", "q": "重构：阶乘函数用递归/循环实现清晰版，打印 5!", "code": "def fact(n):\n    r = 1\n    for i in range(1, n + 1):\n        r *= i\n    return r\nprint(fact(5))", "expect": "120", "hint": "循环阶乘"}], "exam": [{"type": "choice", "q": "阅读代码时间 vs 编写时间？", "options": ["写得多", "读得多（好几倍）", "一样", "没统计"], "answer": 1, "explain": "代码读的频次远高于写，可读性最优先。"}, {"type": "code", "q": "定义常量 PI=3.14 并计算圆面积函数 area_c(r)", "code": "PI = 3.14\ndef area_c(r):\n    return PI * r * r\nprint(area_c(1))", "expect": "3.14", "hint": "常量+函数"}, {"type": "choice", "q": "代码三臭味不包括？", "options": ["重复", "魔法数字", "短函数", "长函数"], "answer": 2, "explain": "短函数是解药不是臭味。"}, {"type": "code", "q": "把 if 判断抽成函数 is_adult(age) 返回 age>=18，测试", "code": "def is_adult(age):\n    return age >= 18\nassert is_adult(18) is True\nassert is_adult(17) is False\nprint('ok')", "expect": "ok", "hint": "抽函数"}, {"type": "choice", "q": "两个函数做同样的事，应该？", "options": ["留着", "合一个", "看心情", "加注释"], "answer": 1, "explain": "重复代码合而为一，改一处全生效。"}, {"type": "code", "q": "把折扣逻辑参数化：discount(p, d) 返回打折价", "code": "def discount(p, d):\n    return round(p * (1 - d), 2)\nprint(discount(100, 0.2))", "expect": "80.0", "hint": "参数化"}, {"type": "choice", "q": "命名空格 total_price 与 totalPrice？", "options": ["没区别", "Python 惯例下划线", "驼峰更好", "都禁用"], "answer": 1, "explain": "Python 变量惯例 snake_case。"}, {"type": "code", "q": "把「判断闰年」抽函数 is_leap(y)：4 整除且(非100整除或400整除)", "code": "def is_leap(y):\n    return y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)\nassert is_leap(2024) is True\nassert is_leap(1900) is False\nassert is_leap(2000) is True\nprint('leap ok')", "expect": "leap ok", "hint": "闰年规则"}, {"type": "choice", "q": "给函数起名 best 还是 find_best？", "options": ["best 够", "find_best 表动作+对象", "都行", "find 就够"], "answer": 1, "explain": "动词开头命名函数（find/calc/build）更清楚。"}, {"type": "code", "q": "把连续 if 改清晰函数 grade(score)：>=90 A >=75 B >=60 C 否则 D", "code": "def grade(s):\n    if s >= 90: return 'A'\n    if s >= 75: return 'B'\n    if s >= 60: return 'C'\n    return 'D'\nassert grade(95) == 'A'\nassert grade(76) == 'B'\nassert grade(59) == 'D'\nprint('grade ok')", "expect": "grade ok", "hint": "阶梯条件"}]}, {"id": 24, "no": "ⅩⅩⅣ", "title": "项目：猜数字·强化版", "weeks": "第 13 周", "diff": "★★★", "full": true, "story": {"tutor": "威廉·肖克利（William Shockley）", "era": "美国 · 晶体管共同发明人", "fact": "肖克利带队发明晶体管，一辈子痴迷「预测与验证」。猜数字就是最纯粹的预测游戏：你的判断依据是每次反馈，好的玩家会二分，差的玩家瞎蒙。程序也一样，根据反馈修正。", "quote": "「测量是科学的第一步，也是写程序的第一步。」"}, "map": ["游戏流程", "random 目标", "循环+提示", "计分与重玩"], "sections": [{"t": "定规则", "p": "程序随机想一个 1-100 的数，玩家猜，程序回「大了/小了/对了」，限定 7 次（二分上界）。", "code": "import random\nn = random.randint(1, 100)\nprint('我想到一个 1-100 的数')\nfor i in range(7):\n    g = int(input('猜: '))\n    if g == n:\n        print('对了!')\n        break\n    print('大了' if g > n else '小了')"}, {"t": "防乱输入", "p": "玩家输入非数字会崩，用 try 包裹输入。", "code": "try:\n    g = int(input('猜: '))\nexcept ValueError:\n    print('要输数字')\n    continue"}, {"t": "计分", "p": "按剩余次数计分：剩几次得几分，7 次没用完猜中得高分。", "code": "score = 7 - i\nprint('得分', score)"}, {"t": "重玩", "p": "外层 while True 包整局，输入 y/n 决定是否再来。"}], "quiz": [{"type": "choice", "q": "猜 1-100 的数，最优策略是？", "options": ["从 1 递增", "二分（每次猜中间）", "随机", "从 100 递减"], "answer": 1, "explain": "二分每次排除一半，最多 7 次。"}, {"type": "code", "q": "用 random.randint 生成 1-100 目标数并打印（随机题跑通即过）", "code": "import random\nprint(random.randint(1, 100))", "expect": "", "hint": "随机题"}, {"type": "choice", "q": "玩家输入非数字会抛？", "options": ["IndexError", "ValueError", "KeyError", "Zero"], "answer": 1, "explain": "int(\"abc\") 抛 ValueError。"}, {"type": "code", "q": "模拟判大小：n=50, g=80 打印 \"大了\"", "code": "n = 50\ng = 80\nprint(\"大了\" if g > n else \"小了\")", "expect": "大了", "hint": "三元比较"}, {"type": "choice", "q": "7 次够猜 1-100 是因为？", "options": ["运气好", "2^7=128>100", "7 很大", "蒙得快"], "answer": 1, "explain": "二分 7 次覆盖 128 个值，足够 100。"}, {"type": "code", "q": "for i in range(7) 循环打印 i（0 到 6）", "code": "for i in range(7):\n    print(i)", "expect": "0\n1\n2\n3\n4\n5\n6", "hint": "range(7)"}, {"type": "choice", "q": "猜中后要立刻结束循环用？", "options": ["pass", "break", "continue", "return"], "answer": 1, "explain": "break 跳出当前循环。"}, {"type": "code", "q": "模拟计分：7 次内第 3 次猜中，得分 = 7-3 打印", "code": "i = 2  # 第 3 次，下标 2\nscore = 7 - i\nprint(score)", "expect": "5", "hint": "7-2"}, {"type": "choice", "q": "重玩用哪种结构包整局？", "options": ["if", "while True + 退出条件", "for 固定", "try"], "answer": 1, "explain": "外层循环 + 内部 break 实现可重玩。"}, {"type": "code", "q": "读输入并比较：模拟 g=50,n=50 输出 \"对了!\"（不真调 input）", "code": "g = 50\nn = 50\nif g == n:\n    print(\"对了!\")", "expect": "对了!", "hint": "相等判断"}], "exam": [{"type": "choice", "q": "猜数字里「大了/小了」反馈属于？", "options": ["装饰", "给玩家的信息，指导下一猜", "错误", "随机"], "answer": 1, "explain": "反馈驱动策略调整。"}, {"type": "code", "q": "range(1, 4) 打印", "code": "for i in range(1, 4):\n    print(i)", "expect": "1\n2\n3", "hint": "1..3"}, {"type": "choice", "q": "把猜数整局包进 while True 的问题是？", "options": ["没退出会死循环", "更快", "更省代码", "没法 break"], "answer": 0, "explain": "必须提供退出路径否则无限循环。"}, {"type": "code", "q": "判断 64 与目标 50：打印 \"大了\"（64>50）", "code": "print(\"大了\" if 64 > 50 else \"小了\")", "expect": "大了", "hint": "64 大"}, {"type": "choice", "q": "score 想从 100 起步每错一次扣 10，猜错时？", "options": ["score += 10", "score -= 10", "score = 0", "score = 10"], "answer": 1, "explain": "扣分用减法。"}, {"type": "code", "q": "for 循环里 break：找到 5 的倍数就停，打印 1..9 中第一个 5 倍数", "code": "for i in range(1, 10):\n    if i % 5 == 0:\n        print(i)\n        break", "expect": "5", "hint": "break 后停"}, {"type": "choice", "q": "真实 input() 返回类型？", "options": ["int", "字符串", "float", "列表"], "answer": 1, "explain": "input 永远返回字符串，要转 int。"}, {"type": "code", "q": "把字符串 \"42\" 转 int 并打印类型名", "code": "n = int(\"42\")\nprint(type(n).__name__)", "expect": "int", "hint": "int() 转换"}, {"type": "choice", "q": "限 7 次没猜中应？", "options": ["继续无限", "提示失败并公布答案", "报错", "忽略"], "answer": 1, "explain": "次数用尽公布答案，结束本局。"}, {"type": "code", "q": "公布答案场景：n=66 打印 \"答案是 66\"", "code": "n = 66\nprint(\"答案是\", n)", "expect": "答案是 66", "hint": "拼接打印"}]}, {"id": 25, "no": "ⅩⅩⅤ", "title": "项目：词频统计器", "weeks": "第 13 周", "diff": "★★★", "full": true, "story": {"tutor": "汉斯·彼得·卢恩（Hans Peter Luhn）", "era": "德国 · 信息检索先驱", "fact": "卢恩 1958 年发明了「自动摘要」：统计词频，高频词构成文章主题。词频统计器是自然语言处理的入门钥匙——也是字典、字符串、排序三件套的综合练习。", "quote": "「信息不值钱，值得关注的信息才值钱。」"}, "map": ["清洗文本", "切词", "计数字典", "按频排序"], "sections": [{"t": "清洗文本", "p": "去掉标点、统一小写，才能准确统计。", "code": "text = 'Hello, hello! World.'\ntext = text.lower().replace(',', ' ').replace('!', ' ').replace('.', ' ')\nprint(text)"}, {"t": "切词", "p": "按空格 split 成单词列表。", "code": "words = text.split()\nprint(words)"}, {"t": "计数字典", "p": "遍历词，字典累加：词是键，次数是值。", "code": "count = {}\nfor w in words:\n    count[w] = count.get(w, 0) + 1\nprint(count)"}, {"t": "按频排序", "p": "items() 取键值对，按值排序取 Top。", "code": "top = sorted(count.items(), key=lambda x: x[1], reverse=True)\nprint(top[:3])"}], "quiz": [{"type": "choice", "q": "统计词频前为何要转小写？", "options": ["省空间", "Hello 与 hello 应算同一个词", "美观", "必须"], "answer": 1, "explain": "归一化大小写避免重复计。"}, {"type": "code", "q": "清洗 \"Hi, Bob!\"：lower 并替换逗号感叹号为空格后打印", "code": "text = 'Hi, Bob!'\ntext = text.lower().replace(',', ' ').replace('!', ' ')\nprint(text)", "expect": "hi  bob ", "hint": "替换标点"}, {"type": "choice", "q": "dict.get(w, 0) + 1 的含义？", "options": ["报错", "取当前次数，没有则 0，加 1 累计", "固定 1", "删除键"], "answer": 1, "explain": "get 带默认值防 KeyError，经典计数法。"}, {"type": "code", "q": "用 get 计数：统计列表 a b a 各出现次数打印", "code": "cnt = {}\nfor w in ['a', 'b', 'a']:\n    cnt[w] = cnt.get(w, 0) + 1\nprint(cnt)", "expect": "{'a': 2, 'b': 1}", "hint": "get 计数"}, {"type": "choice", "q": "按出现次数从高到低排序？", "options": ["sorted 按值 reverse=True", "按 key 排序", "随机", "不排"], "answer": 0, "explain": "lambda 取值，reverse 降序。"}, {"type": "code", "q": "items() 用法：d={\"a\":2} 打印键值对", "code": "d = {\"a\": 2}\nprint(list(d.items()))", "expect": "[('a', 2)]", "hint": "items 键值"}, {"type": "choice", "q": "文本清洗还要去掉什么？", "options": ["空格", "标点和数字等噪声", "换行", "所有"], "answer": 1, "explain": "按需去掉标点/数字/停用词提升统计质量。"}, {"type": "code", "q": "统计一句话中 \"的\" 出现次数（用 count 方法）", "code": "s = \"我们的你们的\"\nprint(s.count(\"的\"))", "expect": "2", "hint": "str.count"}, {"type": "choice", "q": "词频 Top N 用什么排序结果？", "options": ["降序取前 N", "升序", "全部", "随机"], "answer": 0, "explain": "高频在前取前 N 即 TopN。"}, {"type": "code", "q": "sorted 按值降序：{\"b\":1,\"a\":3} 打印第一个词的键", "code": "d = {\"b\": 1, \"a\": 3}\ntop = sorted(d.items(), key=lambda x: x[1], reverse=True)\nprint(top[0][0])", "expect": "a", "hint": "最高频词"}], "exam": [{"type": "choice", "q": "词频统计的三件套是？", "options": ["循环+字典+排序", "类+继承", "异常+文件", "绘图"], "answer": 0, "explain": "清洗、计数（字典）、排序构成统计器。"}, {"type": "code", "q": "str.lower() 对 \"PyThon\" 的结果", "code": "print(\"PyThon\".lower())", "expect": "python", "hint": "统一小写"}, {"type": "choice", "q": "text.split() 默认按什么切？", "options": ["逗号", "空白", "句号", "每字符"], "answer": 1, "explain": "split() 默认按任意空白切。"}, {"type": "code", "q": "\"one two two\".split() 后打印列表", "code": "print(\"one two two\".split())", "expect": "['one', 'two', 'two']", "hint": "按空白切词"}, {"type": "choice", "q": "Counter 计数器在哪个模块？", "options": ["math", "collections", "random", "json"], "answer": 1, "explain": "collections.Counter 专门计数。"}, {"type": "code", "q": "用 Counter 统计 [\"a\",\"b\",\"a\"] 打印 most_common(1)", "code": "from collections import Counter\nc = Counter([\"a\", \"b\", \"a\"])\nprint(c.most_common(1))", "expect": "[('a', 2)]", "hint": "Counter 一行 oice", "q": "管理 N 个学生用什么容器？", "options": ["单个变量", "列表装对象", "字符串", "字典一个"], "answer": 1, "explain": "对象列表是核心数据模型。"}, {"type": "code", "q": "class Student 存 name，创建 s=Student(\"甲\") 打印 s.name", "code": "class Student:\n    def __init__(self, name):\n        self.name = name\ns = Student(\"甲\")\nprint(s.name)", "expect": "甲", "hint": "实例属性"}, {"type": "choice", "q": "CRUD 四个操作是？", "options": ["增删查改", "读写算打", "复制移动", "开存关"], "answer": 0, "explain": "Create/Read/Update/Delete。"}, {"type": "code", "q": "students 两个对象（score 90/80），打印平均分", "code": "students = [type(\"S\", (), {\"score\": 90})(), type(\"S\", (), {\"score\": 80})()]\nprint(sum(s.score for s in students) / 2)", "expect": "85.0", "hint": "求和平均"}, {"type": "choice", "q": "按名字查找要遍历比对什么？", "options": ["对象本身", "s.name == 目标", "索引", "分数"], "answer": 1, "explain": "遍历比较 name 属性。"}, {"type": "code", "q": "找名为 \"乙\" 的学生并打印其 score", "code": "class St:\n    def __init__(self, n, sc):\n        self.name = n; self.score = sc\nsts = [St(\"甲\", 90), St(\"乙\", 85)]\nfor s in sts:\n    if s.name == \"乙\":\n        print(s.score)", "expect": "85", "hint": "遍历查名"}, {"type": "choice", "q": "删除指定学生（知道下标）用？", "options": ["del students[i]", "remove 名", "pop by 名", "clear"], "answer": 0, "explain": "del 按下标删除。"}, {"type": "code", "q": "列表删除：students=[\"甲\",\"乙\"] 删下标 0 打印", "code": "students = [\"甲\", \"乙\"]\ndel students[0]\nprint(students)", "expect": "['乙']", "hint": "del 下标"}, {"type": "choice", "q": "显示整齐表格用什么？", "options": ["print 拼", "f-string 对齐/格式化", "类", "循环"], "answer": 1, "explain": "格式化字符串排成表格观感。"}, {"type": "code", "q": "f-string 打印 \"甲 90\"（name=甲 score=90）", "code": "name = \"甲\"\nscore = 90\nprint(f\"{name} {score}\")", "expect": "甲 90", "hint": "f-string 变量"}], "exam": [{"type": "choice", "q": "「封装学生数据+方法」用？", "options": ["字典就行", "类", "两个变量", "列表"], "answer": 1, "explain": "类把字段与方法绑定，系统好扩展。"}, {"type": "code", "q": "class Student __str__ 返回 name，print 对象打印名字", "code": "class Student:\n    def __init__(self, name):\n )\nprint(nums)"}, {"t": "内置 sort 与 sorted", "p": "list.sort() 就地排；sorted(seq) 返回新列表。可 key= 定制规则。", "code": "words = ['banana', 'apple', 'cherry']\nprint(sorted(words))\nprint(sorted(words, key=len))"}, {"t": "二分搜索", "p": "有序列表里找目标：每次取中间比较，砍半。bisect 模块现成。", "code": "import bisect\nnums = [1, 3, 5, 7, 9]\nprint(bisect.bisect_left(nums, 5))"}, {"t": "复杂度直觉", "p": "线性 O(n) 随数据线性涨；二分 O(log n) 几乎不涨。数据大时算法差别天壤。", "code": "import math\nfor n in [10, 1000, 10**6]:\n    print(n, '线性', n, '二分步数', int(math.log2(n))+1)"}], "quiz": [{"type": "choice", "q": "list.sort() 与 sorted() 区别？", "options": ["没区别", "sort 就地改，sorted 返回新列表", "sorted 更快", "sort 只能数字"], "answer": 1, "explain": "一个改原列表，一个生成新列表。"}, {"type": "code", "q": "sorted([3,1,2]) 打印", "code": "print(sorted([3, 1, 2]))", "expect": "[1, 2, 3]", "hint": "升序新列表"}, {"type": "choice", "q": "降序排序加什么参数？", "options": ["desc=True", "reverse=True", "down=True", "order=1"], "answer": 1, "explain": "reverse=True 降序。"}, {"type": "code", "q": "按长度排序 [\"aa\",\"b\",\"ccc\"] 打印", "code": "print(sorted([\"aa\", \"b\", \"ccc\"], key=len))", "expect": "['b', 'aa', 'ccc']", "hint": "key=len"}, {"type": "choice", "q": "二分查找的前提？", "options": ["随机顺序", "数据已排序", "数据少", "数据多"], "answer": 1, "explain": "二分必须基于有序序列。"}, {"type": "code", "q": "bisect_left 在 [1,3,5] 找 3 的位置", "code": "import bisect\nprint(bisect.bisect_left([1, 3, 5], 3))", "expect": "1", "hint": "索引 1"}, {"type": "choice", "q": "1000 个元素线性 vs 二分？", "options": ["一样", "线性 1000 步，二分约 10 步", "二分 1000", "线性更快"], "answer": 1, "explain": "log2(1000)≈10，天壤之别。"}, {"type": "code", "q": "打印 log2(1024) 的整数（math.log2 后 int）", "code": "import math\nprint(int(math.log2(1024)))", "expect": "10", "hint": "2^10"}, {"type": "choice", "q": "Python 里找最大值内置函数？", "options": ["max()", "maximum()", "largest()", "big()"], "answer": 0, "explain": "max/min/sum 都是内置。"}, {"type": "code", "q": "max([4, 9, 2]) 打印", "code": "print(max([4, 9, 2]))", "expect": "9", "hint": "内置 max"}], "exam": [{"type": "choice", "q": "「有序 function doBack(){
  var errMsg='';

  var top=null;

  try{ history.replaceState({view:top},''); }catch(e){}
  try{ doRenderView(top,true); ok=(window._cur===top); }catch(err){ errMsg=String(err&&err.message||err); }

  if(!ok && top!==root){ try{ doRenderView(root,true); ok=(window._cur===root); }catch(e3){ errMsg=String(e3&&e3.message||e3); } }
  try{
    if(!ok){
      try{ console.error('[doBack] fail top='+top+' cur='+window._cur+' :: '+errMsg); }catch(ce){}
      toast('返回失败，正在回到首页…');
      setTimeout(function(){ try{ window.location.reload(); }catch(e){} }, 500);

}

        +'</div>'
        +'<pre class="pyout" id="pyout'+qi+'"'+(done&&pv!==undefined?' style="display:block"':'')+'>'+(done&&pv!==undefined?esc(pv):'')+'</pre>'

        +'</div>';

        }
        h+='<div class="'+cls+'" data-q="'+qi+'" data-i="'+i+'" data-o="'+i+'"'+(done?' data-lock="1"':'')+'>'+k2+'. '+parseMath(q.options[i])+'<span class="mark" style="display:none"></span></div>';
      });

function poolKeyInfo(k){
  var p=String(k).split('_');
  if(p[0][0]==='e'){ var c2=chById(+p[0].slice(1)); return c2?('第 '+c2.id+' 章小卷 · '+(c2.exam&&c2.exam[+p[1]]?c2.exam[+p[1]].q:'')):k; }

renderers.stats=function(){
  var s=calcStats(), streak=calcStreak(), rk=curRank(s.pct);
  var tq=(stat&&stat.totalQ)?stat.totalQ:0, tc=(stat&&stat.totalCorrect)?stat.totalCorrect:0;
  var bd=badgeState(s), gotN=bd.filter(function(b){return b.got;}).length;
  var acc = tq ? Math.round(tc/tq*100) : 0;
  var pct=s.pct;
  /* 当前档与下一档（进度条刻度） */
  var curAt=0, nextAt=rk.nextAt, curName=rk.name, nextName=rk.next;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ curAt=RANKS[i][0]; curName=RANKS[i][1]; } }
  var span=(nextAt!==null&&nextAt!==undefined)?(nextAt-curAt):1;
  var innerPct=Math.max(0,Math.min(1,(pct-curAt)/span));
  /* 荣誉调色板（随档位轮换） */
  var PALS=[
    ['linear-gradient(135deg,#0A84FF,#5E5CE6)','#0A84FF'],
    ['linear-gradient(135deg,#FF9F0A,#FF7A00)','#FF9F0A'],
    ['linear-gradient(135deg,#FF453A,#D70015)','#FF453A'],
    ['linear-gradient(135deg,#34C759,#28A745)','#34C759'],
    ['linear-gradient(135deg,#AF52DE,#7D2AE0)','#AF52DE'],
    ['linear-gradient(135deg,#FFD60A,#FF9500)','#FF9500']
  ];
  var idx=0; for(var pi=0;pi<RANKS.length;pi++){ if(pct>=RANKS[pi][0]) idx=pi; }
  var pal=PALS[(idx+1)%PALS.length];
  var C=pal[1], Cg=pal[0];
  /* 进度环（SVG） */
  var R=54, CIRC=2*Math.PI*R;
  var ring='<div style="position:relative;width:132px;height:132px;flex:none">'
    +'<svg width="132" height="132" viewBox="0 0 132 132" style="transform:rotate(-90deg)">'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="var(--fill)" stroke-width="10"/>'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+C+'" stroke-width="10" stroke-linecap="round" '
    +'stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC*(1-pct/100)+'" style="transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)"/>'
    +'</svg>'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<b style="font-size:26px;color:var(--ink);line-height:1">'+pct+'<span style="font-size:14px">%</span></b>'
    +'<span class="cap" style="margin-top:2px">总进度</span></div></div>';
  var h='<div class="kick">OVERVIEW</div><div class="h1">进度总览</div>'
    +'<div class="sub">'+rk.name+' · 距「'+(rk.next||'满级')+'」还差 '+(rk.nextAt!==null&&rk.nextAt!==undefined?rk.nextAt-pct:'0')+'%</div>';
  /* 称号横幅 */
  h+='<div style="border-radius:24px;padding:20px;color:#fff;background:'+Cg+';box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden">'
    +'<div style="position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)"></div>'
    +'<div style="position:absolute;right:30px;bottom:-50px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)"></div>'
    +'<div style="width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;backdrop-filter:blur(4px)">'
    +(idx===0?'🌱':idx>=RANKS.length-2?'👑':'🏆')+'</div>'
    +'<div style="flex:1;min-width:0;position:relative;z-index:1">'
    +'<div style="font-size:11px;font-weight:800;letter-spacing:1.6px;opacity:.85">CURRENT RANK</div>'
    +'<b style="font-size:21px;display:block;margin-top:2px">'+curName+'</b>'
    +'<div style="height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:9px;overflow:hidden">'
    +'<i style="display:block;height:100%;width:'+Math.round(innerPct*100)+'%;background:#fff;border-radius:3px;transition:width .8s"></i></div>'
    +'<div style="font-size:11.5px;opacity:.9;margin-top:5px;display:flex;justify-content:space-between"><span>'+curAt+'%</span><span>'+(rk.next||'满级')+' · '+(nextAt!==null&&nextAt!==undefined?nextAt+'%':'MAX')+'</span></div>'
    +'</div></div>';
  /* 中央行：进度环 + 今日/连签 */
  h+='<div style="display:flex;align-items:center;gap:18px;margin-top:14px">'
    +ring
    +'<div style="flex:1;display:grid;grid-template-columns:1fr;gap:8px">'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🔥</span><div><b style="font-size:15px;display:block">'+streak+' 天</b><span class="cap">连续打卡</span></div></div>'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🎯</span><div><b style="font-size:15px;display:block">'+acc+'%</b><span class="cap">答题正确率</span></div></div>'
    +'</div></div>';
  /* 数据六宫格 */
  var D=[
    {ico:'📖',v:s.doneC+'/'+s.totalC,l:'已学章节'},
    {ico:'📝',v:s.examFull+'/'+s.examTotal,l:'小卷已做'},
    {ico:'🧮',v:tq,l:'累计答题'+(tc?'':'')},
    {ico:'✍️',v:tc,l:'累计答对'},
    {ico:'🎖️',v:gotN+'/'+bd.length,l:'徽章解锁'},
    {ico:'🧹',v:s.wrongPool,l:'待订正错题'}
  ];
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">';
  D.forEach(function(d){
    h+='<div style="background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh-card);border:1px solid var(--sep)">'
      +'<div style="font-size:20px;line-height:1">'+d.ico+'</div>'
      +'<b style="font-size:17px;display:block;margin-top:5px">'+d.v+'</b>'
      +'<span class="cap" style="display:block;margin-top:2px">'+d.l+'</span></div>';
  });
  h+='</div>';
  return h;
};

/* toast 单例化：同一时刻只保留一条提示，新提示立即顶掉旧条（鼠哥 2026-09-04） */
function toast(msg, type){
  var box=document.getElementById('toastBox');
  if(!box) return;
  while(box.firstChild) box.removeChild(box.firstChild);
  var isOk = type==='ok' || (msg && msg.indexOf('✓')===0 && typeof type==='undefined');
  var el=document.createElement('div');
  if(isOk){
    el.className='toast ok';
    el.innerHTML='<span class="tk">✓</span><span class="tt">'+msg.replace(/^✓\s*/,'')+'</span>';
    /* 星星粒子（多邻国式欢庆） */
    var P=['★','✦','✓','+1','⭐'];
    var colors=['#FFD900','#FF9600','#FF4D4D','#58CC02','#2B8AFF'];
    for(var i=0;i<8;i++){
      var sp=document.createElement('span');
      sp.className='spark';
      sp.textContent=P[Math.floor(Math.random()*P.length)];
      var a=Math.random()*Math.PI*2, dist=44+Math.random()*52;
      var dx=Math.cos(a)*dist, dy=Math.sin(a)*dist-18;
      sp.style.setProperty('--dx',dx.toFixed(0)+'px');
      sp.style.setProperty('--dy',dy.toFixed(0)+'px');
      sp.style.background='none';
      sp.style.color=colors[Math.floor(Math.random()*colors.length)];
      sp.style.animationDelay=(Math.random()*0.12)+'s';
      el.appendChild(sp);
    }
  } else {
    el.className = type==='no' ? 'toast no' : 'toast';
    el.innerHTML='<span class="ic t-ic">'+(type==='no'?'✕':'✓')+'</span><span>'+msg+'</span>';
  }
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },320); }, isOk?1900:2200);
}

function showStart(kind,id){
  var c=chById(id); if(!c) return;
  startCtx={kind:kind,id:id};
  var kick,title,sub,rows='';
  if(kind==='exam'){
    var st=examStatus(c);
    kick='MINI EXAM '+('0'+id).slice(-2);
    title=esc(c.title)+' · 小卷';
    sub=st.full?'这份卷已结算 · 重做不改变记录':(st.answered>0?'继续上次作答':'答完自动结算点亮打卡');
    rows=ssRow('doc',(c.exam||[]).length+' 题','单选 · 即时批改 · 错题自动归档')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(st.answered>0?ssRow('check','已答 '+st.answered+'/'+st.total,'进度已保留'):'');
  } else {
    var sm=chSummary(c), isD=kind==='drill';
    kick='LESSON '+('0'+id).slice(-2);
    title=esc(c.title);
    sub=chIsDone(c)?'本章已点亮 · 可回来重读重做':(c.full?(isD?'按章刷题 · 答对自动移出错题':'讲义 + 随堂题 · 答完自动结算点亮章节'):'待莱布尼茨开讲');
    rows=ssRow('book',sm.total+' 道随堂题','答完即结算 · 不要求满分')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(sm.answered>0?ssRow(isD?'pen':'check','已答 '+sm.answered+'/'+sm.total,isD?'可反复重做':'继续上次进度'):'');
  }
  $('#ssKicker').textContent=kick;
  $('#ssTitle').textContent=title;
  $('#ssSub').textContent=sub;
  $('#ssRows').innerHTML=rows;
  /* 两拍式弹出：先显示落起始帧，再加 .show 触发弹簧过渡（rAF + setTimeout 双保险，防个别环境 rAF 节流导致无动画） */
  var sh=document.getElementById('startSheet');
  clearTimeout(sh._hideT);
  sh.classList.remove('show');
  sh.style.display='block';
  void sh.offsetWidth;
  var tryShow=function(){ sh.classList.add('show'); };
  if(window.requestAnimationFrame){ requestAnimationFrame(tryShow); setTimeout(tryShow, 40); }
  else tryShow();
  tap();
}
function closeStart(){
  startCtx=null;
  var el=document.getElementById('startSheet');
  if(el){
    el.classList.remove('show');
    clearTimeout(el._hideT);
    el._hideT=setTimeout(function(){ if(el && !el.classList.contains('show')) el.style.display='none'; },520);
  }
}

var _sessSnapData = null;
function sessSnap(){
  try{
    _sessSnapData = {
      qs: JSON.parse(JSON.stringify(quizStat || {})),
      qp: JSON.parse(JSON.stringify(quizPick || {})),
      wr: (wrongPool || []).slice(),
      fx: (fixedPool || []).slice(),
      hd: (hallDone || []).slice(),
      st: stat ? JSON.parse(JSON.stringify(stat)) : null,
      ts: todayStat ? JSON.parse(JSON.stringify(todayStat)) : null
    };
  }catch(e){ _sessSnapData = null; }
}
function sessRoll(){
  if(!_sessSnapData) return;
  try{
    quizStat = _sessSnapData.qs;  store('quizStat', quizStat);
    quizPick = _sessSnapData.qp;  store('quizPick', quizPick);
    wrongPool = _sessSnapData.wr; store('wrong', wrongPool);
    fixedPool = _sessSnapData.fx; store('fixed', fixedPool);
    hallDone = _sessSnapData.hd;  store('hall', hallDone);
    if(_sessSnapData.st){ stat = _sessSnapData.st; store('stat', stat); }
    if(_sessSnapData.ts){ todayStat = _sessSnapData.ts; store('tstat', todayStat); }
  }catch(e){}
  _sessSnapData = null;
}

var PYODIDE_SRC='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
var PYODIDE_INDEX='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
var _pyodide=null,_pyReady=false,_pyLoading=false;
function ensurePy(cb){
  if(_pyReady){ cb(); return; }
  if(_pyLoading){ setTimeout(function(){ ensurePy(cb); },200); return; }
  _pyLoading=true;
  var tag='pyodideScript';
  if(!document.getElementById(tag)){
    var s=document.createElement('script');
    s.id=tag; s.src=PYODIDE_SRC;
    s.onload=function(){ _bootPy(cb); };
    s.onerror=function(){ _pyLoading=false; toast('Python 运行时加载失败，请检查网络后重试'); };
    document.head.appendChild(s);
  } else {
    _bootPy(cb);
  }
}
function _bootPy(cb){
  try{
    if(typeof loadPyodide==='undefined'){ setTimeout(function(){ _bootPy(cb); },300); return; }
    loadPyodide({indexURL:PYODIDE_INDEX}).then(function(p){
      _pyodide=p; _pyReady=true; _pyLoading=false;
      try{
        _pyodide.setStdout({batched:function(t){ _pyBuf += t+'\n'; }});
        _pyodide.setStderr({batched:function(t){ _pyBuf += t+'\n'; }});
      }catch(e){}
      cb();
    }).catch(function(e){ _pyLoading=false; toast('Python 运行时初始化失败'); });
  }catch(e){ setTimeout(function(){ _bootPy(cb); },300); }
}
var _pyBuf='';
function pyRun(src){
  return new Promise(function(res,rej){
    ensurePy(function(){
      _pyBuf='';
      try{
        var r = _pyodide.runPython(src);
        var got = _pyBuf + (r!==undefined && r!==null ? String(r)+'\n' : '');
        res({out: got.replace(/\n+$/,''), err:''});
      }catch(e){
        var msg = String((e && e.message) || e);
        var trace = _pyBuf || '';
        res({out: trace, err: msg});
      }
    });
  });
}
function normOut(str){
  var lines=String(str||'').split('\n').map(function(l){return l.trim();});
  while(lines.length && lines[0]==='') lines.shift();
  while(lines.length && lines[lines.length-1]==='') lines.pop();
  return lines.join('\n');
}
function pyJudge(src,expect){
  return pyRun(src).then(function(r){
    var gotT=r.out.trim();
    if(r.err){ return {ok:false, msg:'运行出错：'+r.err, out:r.out, err:r.err}; }
    var exps=String(expect||'').split('|').map(function(x){return x.trim();});
    if(!String(expect||'').trim()){ return {ok:true, msg:'运行无异常，通过', out:r.out}; } /* expect 空=跑通即过 */
    for(var i=0;i<exps.length;i++){
      var e=exps[i];
      if(e===gotT || normOut(e)===normOut(r.out)){ return {ok:true, msg:'✓ 输出正确，通过！', out:r.out}; }
      if(e.indexOf('\n')<0 && gotT.indexOf('\n')<0 && /^-?\d+(\.\d+)?$/.test(e) && /^-?\d+(\.\d+)?$/.test(gotT)){
        if(parseFloat(e)===parseFloat(gotT)){ return {ok:true, msg:'✓ 输出正确，通过！', out:r.out}; }
      }
    }
    return {ok:false, msg:'✗ 输出不对，期望：「'+exps.join(' 或 ')+'」', out:r.out, want:exps.join(' 或 ')};
  });
}

function sbPack(){

var SB_MERGE_OBJ = ['quizStat','tstat','quizPick','settle'];
function sbSanitize(d){ return d && typeof d === 'object' ? d : {}; }
function sbMerge(local, cloud){
  var out = {}; local = sbSanitize(local); cloud = sbSanitize(cloud);
  SB_MERGE_ARR.forEach(function(k){
    var a = local[k] || [], b = cloud[k] || [];
    if(!Array.isArray(a)) a = []; if(!Array.isArray(b)) b = [];
    var seen = {}, m = [];
    a.concat(b).forEach(function(x){ var kk = (typeof x === 'object' && x !== null) ? JSON.stringify(x) : String(x); if(!seen[kk]){ seen[kk] = 1; m.push(x); } });
    out[k] = m;
  });
  SB_MERGE_OBJ.forEach(function(k){
    var o = {}, a = local[k] || {}, b = cloud[k] || {};
    if(typeof a !== 'object') a = {}; if(typeof b !== 'object') b = {};
    Object.keys(a).forEach(function(x){ o[x] = a[x]; }); Object.keys(b).forEach(function(x){ o[x] = b[x]; });
    out[k] = o;
  });
  return out;
}

function sbSaveProfile(upd, cb){
  var s=sbSession(); if(!s||!s.user){ toast('未登录'); if(cb) cb(false); return; }
  sbEnsureToken().then(function(ok){
    if(!ok){ toast('登录已失效，请重新登录'); if(cb) cb(false); return; }
    var h=sbAuthHeaders(); if(!h) return;
    var body={};
    if(upd.username!==undefined) body.username=upd.username;
    if(upd.avatar!==undefined) body.avatar=upd.avatar;
    /* 先确保云端有 profile 行（老账号可能没有，直接 PATCH 打空枪） */
    fetch(SB_URL+'/rest/v1/profiles?select=user_id&user_id=eq.'+s.user.id, { headers:h })
      .then(function(r){ return r.json(); })
      .then(function(rows){
        var has = rows && rows.length;
        var hh = Object.assign({}, h, { 'Prefer':'return=minimal' });
        if(has) return fetch(SB_URL+'/rest/v1/profiles?user_id=eq.'+s.user.id, { method:'PATCH', headers:h, body: JSON.stringify(body) });
        var p2 = JSON.parse(JSON.stringify(body)); p2.user_id=s.user.id;
        return fetch(SB_URL+'/rest/v1/profiles', { method:'POST', headers:hh, body: JSON.stringify(p2) });
      })
      .then(function(rr){
        if(rr && !rr.ok && rr.status!==204) throw new Error('HTTP'+rr.status);
        var p=sbProfile()||{};
        if(upd.username!==undefined) p.username=upd.username;
        if(upd.avatar!==undefined) p.avatar=upd.avatar;
        p.user_id=s.user.id;
        try{ localStorage.setItem('acad_profile', JSON.stringify(p)); }catch(e){}
        toast('✅ 已保存');
        sbPushRank();
        sbRefreshMine();
        if(cb) cb(true);
      })
      .catch(function(){ toast('保存失败（昵称可能已被占用）'); if(cb) cb(false); });
  });
}

    var u = location.href.split('#')[0].split('?')[0];
    location.href = u + '?v=' + Date.now();
  }catch(e){ try{ location.reload(); }catch(e2){} }
}
function cloudInit(){
  if(!sbSession()) return;
  /* 首次静默同步由 boot 段负责（keepView + 就绪后一次渲染）；这里只补回前台监听 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && sbSession()){ try{ sbSyncFromCloud(true); }catch(e){} }
  });
}

/* 启动即同步（登录态来自总院共享会话） */
try{ cloudInit(); }catch(_e){}

/* ============ CodeMirror 代码编辑器（共享模块：python3/c3 · 稳定版） ============ */
var CM_SRCS = [
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/selection/active-line.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldcode.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/brace-fold.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.min.js'
];
var _cmBusy = false;
var _cmReady = false;
function cmModeOf(ta){ return ta.getAttribute('data-cm')==='c' ? 'text/x-csrc' : 'python'; }
/* 顺序加载全部 CM 脚本（逐个 onload 推进，异常也继续） */
function cmLoadAll(idx, done){
  if(typeof CodeMirror!=='undefined' && _cmReady){ done(); return; }
  if(idx>=CM_SRCS.length){ _cmReady=true; _cmBusy=false; done(); return; }
  var s=document.createElement('script');
  s.src=CM_SRCS[idx];
  s.onload=function(){ cmLoadAll(idx+1, done); };
  s.onerror=function(){ cmLoadAll(idx+1, done); };
  document.head.appendChild(s);
}
function ensureCM(cb){
  if(_cmReady && typeof CodeMirror!=='undefined'){ cb(); return; }
  if(_cmBusy){ setTimeout(function(){ ensureCM(cb); }, 150); return; }
  _cmBusy=true;
  cmLoadAll(0, function(){ _cmBusy=false; try{ cb(); }catch(e){} });
}
/* 渲染完成后把 .py-ta 变成 CodeMirror */
function initCodeMirrors(){
  var tas=document.querySelectorAll('textarea.py-ta:not(.cm-ready)');
  if(!tas.length) return;
  if(typeof CodeMirror==='undefined'){
    if(!_cmBusy){ ensureCM(function(){ initCodeMirrors(); }); }
    else { setTimeout(function(){ initCodeMirrors(); }, 200); }
    return;
  }
  tas.forEach(function(ta){
    ta.classList.add('cm-ready');
    try{
      var readOnly = ta.hasAttribute('readonly') || ta.disabled;
      var cm = CodeMirror.fromTextArea(ta, {
        mode: cmModeOf(ta),
        placeholder: ta.getAttribute('placeholder') || '',
        lineNumbers: true,
        indentUnit: 4, tabSize: 4, indentWithTabs: false,
        matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true,
        foldGutter: true,
        gutters: ['CodeMirror-foldgutter','CodeMirror-linenumbers'],
        theme: 'darcula',
        readOnly: readOnly,
        extraKeys: {
          'Tab': 'indentMore','Shift-Tab': 'indentLess',
          'Ctrl-Enter': function(m){ cmRunCurrent(m); },
          'Ctrl-/': 'toggleComment'
        }
      });
      ta.cm = cm;
      /* 初始值同步：CM 已从 textarea 读取；后续代码通过 cmSet 更新 */
    }catch(e){
      ta.classList.remove('cm-ready');
    }
  });
}
function cmVal(ta){ if(ta&&ta.cm) return ta.cm.getValue(); return ta?ta.value:''; }
function cmSet(ta,val){ if(ta&&ta.cm){ ta.cm.setValue(String(val==null?'':val)); ta.cm.focus(); } else if(ta){ ta.value=val==null?'':val; ta.focus(); } }
function cmRunCurrent(cm){
  var wrap=cm.getWrapperElement();
  var box=wrap?wrap.closest('.codebox'):null;
  if(!box) return;
  var runBtn=box.querySelector('[data-pyrun],[data-crun],[data-epyrun],[data-ecrun]');
  if(runBtn){ runBtn.click(); }
}
var _cmScanTimer=null;
function cmScanLater(){
  if(_cmScanTimer) clearTimeout(_cmScanTimer);
  _cmScanTimer=setTimeout(function(){ initCodeMirrors(); }, 120);
}
