{
  id:5, no:'Ⅴ', title:'if 语句', weeks:'第 5 周', diff:'★★☆', full:true,
  story:{tutor:'乔治·布尔（George Boole, 1815–1864）', era:'英国 · 逻辑学家 · 布尔代数之父',
    fact:'1854 年，布尔出版《思维定律》，把「真/假」变成数学：AND、OR、NOT 从此可以运算。150 年后，这段逻辑成了你手里 if 语句的心脏。佩奇说过，搜索引擎一半的工作是判断「这条结果相不相关」，也就是无数个 if。你学的不是语法，是人类思维最古老的分支：如果……那么……',
    quote:'「一切逻辑，最后都归结为是与否。」 乔治·布尔',
    interact:{type:'flow', title:'if 的执行流程', desc:'条件为真走 if 分支，为假走 else。', lines:[{t:'age = 19', hl:false},{t:'if age >= 18:', hl:true},{t:'    print("已成年") ← 条件为真，执行', hl:true},{t:'else:', hl:false},{t:'    print("未成年") ← 跳过', hl:false}], note:'缩进的代码块只有条件为真时执行。'}},
  motto:'「判断力是搜索引擎的核心，也是程序员的灵魂。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['条件测试','比较运算','and/or','in/not in','布尔表达式','if-else','if-elif-else','省略 else','测试多个条件','检查列表非空','多列表处理'],
  sections:[
    {t:'条件测试：是与否的裁决', p:'条件测试的表达式结果只能是 True 或 False。比较：== 相等（注意不是 = 赋值！）、!= 不等、>、<、>=、<=。字符串比较区分大小写，可用 lower() 统一。数字比较直接。and 两边都真才真，or 一边真就真。in 判断是否在列表里，not in 判断不在。', code:'age = 19\nprint(age >= 18)        # True\nprint(age == 21)        # False\nname = "Ada"\nprint(name.lower() == "ada")  # True\nprint(age >= 18 and name == "Ada")  # True\nprint("apple" in ["apple", "banana"])  # True'},
    {t:'if 语句家族：三兄弟', p:'<b>if</b> 单独用：条件为真执行。<b>if-else</b>：两个分支二选一。<b>if-elif-else</b>：多个条件按顺序检查，命中一个就跳过后面全部。注意：elif 链只要有一个为真，后面的就不再检查，这是「或」的逻辑；如果你想要「多个都执行」，用多个独立 if。', code:'age = 12\nif age < 4:\n    price = 0\nelif age < 18:\n    price = 25\nelse:\n    price = 40\nprint(price)  # 25，elif 命中后 else 不再执行'},
    {t:'用 if 处理列表', p:'检查列表非空：if lst: 空列表是 False，非空是 True。多列表处理：检查某个值是否在可用列表中，比如用户点的配料是否在存货里。条件表达式可以直接用 in，避免遍历。', code:'requested_toppings = []\nif requested_toppings:\n    print("有配料")\nelse:\n    print("不加配料吗？")\navailable = ["mushrooms", "olives", "green peppers"]\nrequested = ["mushrooms", "french fries"]\nfor topping in requested:\n    if topping in available:\n        print(f"加 {topping}")\n    else:\n        print(f"抱歉，没有 {topping}")'},
    {t:'省略 else：明确优于兜底', p:'Python 之禅说 Explicit is better than implicit。如果其他情况没有意义，就只写 if 和 elif，不写 else。else 是「兜底」，会吞掉你没想到的情况；显式列出每一种分支，代码意图更清楚。', code:'score = 85\nif score >= 90:\n    grade = "A"\nelif score >= 80:\n    grade = "B"\nelif score >= 70:\n    grade = "C"\n# 没写 else：低于 70 时 grade 不赋值，逼你显式处理'}
  ],
  example:{q:'写一个程序：给年龄打分（age < 4 免费，< 18 收 25，否则 40），age = 30 时输出价格', code:'age = 30\nif age < 4:\n    price = 0\nelif age < 18:\n    price = 25\nelse:\n    price = 40\nprint(f"票价是 ${price}")', s:'条件链从上往下：30 不小于 4，不小于 18，落到 else，price = 40。输出 票价是 $40。判断顺序很重要：从最窄的条件开始写，否则会被前面的分支抢走。'},
  traps:[
    '= 和 == 混用：= 是赋值，== 才是比较。if age = 18 直接 SyntaxError。',
    'if 后面忘了冒号：最经典的语法错误。',
    'elif 写成 else if（那是别的语言的写法）。',
    '多个条件想「都执行」却用了 if-elif：elif 命中就短路，后面的条件不会再查。',
    '条件测试区分大小写："Python" == "python" 是 False，先用 lower() 统一。',
    '非空判断忘了：直接访问空列表元素会 IndexError，先 if lst: 查空。'
  ],
  quiz:[{type:'choice', q:'x = 5；x == 5 的结果是？', options:['False','5','报错','True'], answer:3, explain:'== 是比较运算符，x == 5 判断相等，结果是布尔值 True。'},{type:'code', q:'age = 20，如果 age >= 18 输出 "已成年"，否则输出 "未成年"', code:'age = 20\nif age >= 18:\n    print("已成年")\nelse:\n    print("未成年")', expect:'已成年', hint:'if 条件为真走第一个分支。'},{type:'choice', q:'x = 10；x > 5 and x < 20 的结果是？', options:['False','10','None','True'], answer:3, explain:'and 要求两边都真：10>5 真，10<20 真，所以整体 True。'},{type:'code', q:'score = 85，用 if-elif-else 判断等级：>=90 输出 A，>=80 输出 B，否则输出 C', code:'score = 85\nif score >= 90:\n    print("A")\nelif score >= 80:\n    print("B")\nelse:\n    print("C")', expect:'B', hint:'elif 链按顺序检查，命中即停。'},{type:'choice', q:'"apple" in ["banana", "apple"] 的结果是？', options:['True','False','apple','None'], answer:0, explain:'in 检查元素是否在列表中，apple 在，True。'},{type:'code', q:'检查列表是否为空：lst = []，空则输出 "空列表"，否则输出 "有元素"', code:'lst = []\nif lst:\n    print("有元素")\nelse:\n    print("空列表")', expect:'空列表', hint:'空列表在布尔上下文中是 False。'},{type:'choice', q:'if age < 4: ... elif age < 18: ... else: ...，age = 3 时执行哪个分支？', options:['elif','else','第一个 if','全部执行'], answer:2, explain:'条件链从上到下，age < 4 为真，执行第一个分支，后面跳过。'},{type:'code', q:'检查 7 是否不在列表 nums = [1, 3, 5] 中，不在则输出 "7 不在"', code:'nums = [1, 3, 5]\nif 7 not in nums:\n    print("7 不在")', expect:'7 不在', hint:'not in 判断不在列表中。'},{type:'choice', q:'x = 15；if x > 10: print("大") else: print("小") 输出？', options:['小','大','15','错误'], answer:1, explain:'15 > 10 为真走 if 分支。'},{type:'code', q:'n = 8，偶数输出 "偶数"，奇数输出 "奇数"', code:'n = 8\nif n % 2 == 0:\n    print("偶数")\nelse:\n    print("奇数")', expect:'偶数', hint:'8 能被 2 整除。'}],
  dialogue:{q:'为什么推荐用 if-elif 而不是一堆 else？「显式优于隐式」到底是什么意思？',
    keys:['明确','显式','分支','情况','兜底','意图','清楚','列出'],
    model:'else 是「其他所有情况」的黑洞：它把你想不到、没处理的情况全部悄悄吞掉，程序可能在你没预料的地方跑出错误行为，而你还找不到原因。if-elif 把每一种情况白纸黑字列出来：要么是 A，要么是 B，要么是 C。代码的意图一望便知，别人改你的代码时也不会踩进黑箱。显式优于隐式，就是让代码把话说清楚。'}
  ,
  exam:[{type:'choice', q:'x = 0；if x: 的结果是？', options:['执行','报错','输出 0','不执行'], answer:3, explain:'0 在布尔上下文中是 False，if x 不执行。'},{type:'code', q:'判断数字奇偶：n = 7，偶数输出 "偶数"，奇数输出 "奇数"（用取模）', code:'n = 7\nif n % 2 == 0:\n    print("偶数")\nelse:\n    print("奇数")', expect:'奇数', hint:'n % 2 为 0 是偶数，否则奇数。'},{type:'choice', q:'elif 和多个独立 if 的区别是？', options:['没有区别','多个 if 更快','elif 命中后短路，多个 if 会都执行','elif 只能有一个'], answer:2, explain:'elif 链命中一个就跳过剩余；多个独立 if 每个都会检查执行。'},{type:'code', q:'检查用户名是否在已注册列表中：users = ["admin", "alice"]，检查 "bob" 是否在，输出相应提示', code:'users = ["admin", "alice"]\nif "bob" in users:\n    print("bob 已注册")\nelse:\n    print("bob 可注册")', expect:'bob 可注册', hint:'in 判断成员，不在则走 else。'},{type:'choice', q:'空字符串 "" 在 if 条件里的值是？', options:['True','None','False','报错'], answer:2, explain:'空字符串是假值。'},{type:'code', q:'5 大于 3 则输出 Yes', code:'if 5 > 3:\n    print("Yes")', expect:'Yes', hint:'条件为真执行。'}]
},
{
  id:6, no:'Ⅵ', title:'字典', weeks:'第 6 周', diff:'★★★', full:true,
  story:{tutor:'拉里·佩奇（Larry Page, 1973–）', era:'美国 · Google 联合创始人 · 计算机科学家',
    fact:'字典这种「键值对」结构，几乎是 Google 的隐喻：网页是键，权重是值；词条是键，搜索结果列表是值。佩奇做 PageRank 时，每个网页在内存里都是一条「键值对」。现实世界的数据天然是键值对：身份证号对应人，学号对应成绩。字典，就是你把现实装进程序的第一种容器。',
    quote:'「组织世界的信息，先学会组织键值对。」 拉里·佩奇',
    interact:{type:'var', title:'字典：键值对的衣橱', desc:'字典用花括号，键和值用冒号配对。', pairs:[['alien_0[color]','green'],['alien_0[points]','5'],['person[first_name]','ada'],['person[age]','21']], note:'通过键取值：字典[键]。键是唯一的，值可以重复。'}},
  motto:'「字典是数据的户口本：键是姓名，值是档案。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['字典是什么','访问值','添加键值对','空字典','修改值','删除键值对','get()','遍历 items','遍历 keys','遍历 values','排序遍历','嵌套：字典列表','列表字典','字典字典'],
  sections:[
    {t:'字典是什么：花括号里的键值对', p:'字典用花括号，由键值对组成：键: 值，逗号分隔。通过键访问值：字典[键]。键通常是字符串，值可以是任何类型：数字、字符串、列表甚至另一个字典。添加新键值对直接赋值：字典[新键] = 新值。修改同理。删除用 del 字典[键]。', code:'alien_0 = {"color": "green", "points": 5}\nprint(alien_0["color"])     # green\nalien_0["x_position"] = 0   # 添加\nalien_0["color"] = "yellow" # 修改\ndel alien_0["points"]      # 删除\nprint(alien_0)'},
    {t:'get()：安全取值', p:'直接访问不存在的键会 KeyError。get(键, 默认值) 在键不存在时返回默认值，不报错。习惯用 get() 访问字典，就像过马路先看车。', code:'alien_0 = {"color": "green"}\nprint(alien_0.get("points", "无分数"))  # 无分数\nprint(alien_0.get("points"))           # None，不报错'},
    {t:'遍历字典：三件套', p:'<b>items()</b> 同时拿键和值（for key, value in d.items()）；<b>keys()</b> 只遍历键（默认就是遍历键，可省略）；<b>values()</b> 只遍历值。值可能重复，想去重用 set()。按顺序遍历键：sorted(d.keys())。', code:'user = {"username": "efermi", "first": "enrico"}\nfor k, v in user.items():\n    print(f"{k}: {v}")\nfor name in sorted(user.keys()):\n    print(name)'},
    {t:'嵌套：字典和列表的组合拳', p:'三种嵌套：<b>列表里装字典</b>（一个列表，每个元素是一个对象，如外星人舰队）；<b>字典里装列表</b>（一个键对应多个值，如披萨的多种配料）；<b>字典里装字典</b>（如用户表，每个用户名对应一个信息字典）。嵌套就是数据结构的分层，像文件夹套文件夹。', code:'# 字典里装列表\npizza = {"crust": "thick", "toppings": ["mushrooms", "extra cheese"]}\nprint(pizza["toppings"][0])  # mushrooms\n# 列表里装字典\naliens = [{"color": "green"}, {"color": "yellow"}]\nprint(aliens[0]["color"])   # green\n# 字典里装字典\nusers = {"aeinstein": {"first": "albert", "location": "princeton"}}\nprint(users["aeinstein"]["first"])  # albert'}
  ],
  example:{q:'统计一句话里每个字符出现的次数：s = "hello"，输出每个字符和次数', code:'s = "hello"\ncount = {}\nfor ch in s:\n    count[ch] = count.get(ch, 0) + 1\nprint(count)', s:'这是「计数器」经典模式：遍历每个字符，get(ch, 0) 取出当前计数（没有就 0），加 1 写回。输出 {"h": 1, "e": 1, "l": 2, "o": 1}。这个模式后面做数据分析会反复出现，值得背下来。'},
  traps:[
    '访问不存在的键直接报 KeyError，用 get() 带上默认值。',
    '遍历 items() 忘了写两个变量：for k in d.items() 拿到的是元组。',
    '键唯一性：重复赋值会覆盖旧值，不会报错，容易悄悄丢数据。',
    '嵌套太深把自己绕晕：先确认每一层是什么结构（列表还是字典），再写访问路径。',
    '把列表当字典用：按索引访问字典会 TypeError，字典只能按键访问。'
  ],
  quiz:[{type:'choice', q:'d = {"name": "ada", "age": 21}；d["name"] 是？', options:['ada','21','name','报错'], answer:0, explain:'通过键访问值，d["name"] 返回 "ada"。'},{type:'code', q:'创建字典 person = {"name": "鼠哥", "age": 18}，输出 name 对应的值', code:'person = {"name": "鼠哥", "age": 18}\nprint(person["name"])', expect:'鼠哥', hint:'字典[键] 取值。'},{type:'choice', q:'d = {}；d["a"] = 1 之后 d 是？', options:['{}','["a", 1]','{"a": 1}','报错'], answer:2, explain:'空字典直接赋值键值对即可添加。'},{type:'code', q:'d = {"x": 10, "y": 20}，用 get 安全访问不存在的键 "z"，输出默认值 0', code:'d = {"x": 10, "y": 20}\nprint(d.get("z", 0))', expect:'0', hint:'get(键, 默认值) 键不存在返回默认值。'},{type:'choice', q:'遍历 d.items() 时，for k, v in d.items() 的 k 和 v 分别是？', options:['键和值','值和键','两个键','两个值'], answer:0, explain:'items() 返回键值对，k 是键，v 是值。'},{type:'code', q:'遍历 d = {"a": 1, "b": 2}，输出所有值（每行一个）', code:'d = {"a": 1, "b": 2}\nfor v in d.values():\n    print(v)', expect:'1\n2', hint:'values() 遍历所有值。'},{type:'choice', q:'del d["a"] 的作用是？', options:['删除整个字典','删除键 a 及其值','清空字典','报错'], answer:1, explain:'del 删除指定键值对。'},{type:'code', q:'统计 nums = [1, 2, 2, 3, 3, 3] 里每个数字出现的次数并输出字典', code:'nums = [1, 2, 2, 3, 3, 3]\ncount = {}\nfor n in nums:\n    count[n] = count.get(n, 0) + 1\nprint(count)', expect:'{1: 1, 2: 2, 3: 3}', hint:'计数器模式：get 取旧值加 1 写回。'},{type:'choice', q:'d = {"a": 1}；d["b"] = 2；print(len(d)) 输出？', options:['1','3','2','错误'], answer:2, explain:'添加一个键值对后长度 2。'},{type:'code', q:'遍历 d = {"x": 1, "y": 2}，输出 x=1 和 y=2（两行）', code:'d = {"x": 1, "y": 2}\nfor k, v in d.items():\n    print(f"{k}={v}")', expect:'x=1\ny=2', hint:'items() 同时拿键值。'}],
  dialogue:{q:'字典和列表怎么选？什么时候该用哪个？',
    keys:['键','查找','关联','对应','映射','按名','属性','索引'],
    model:'一句话：<b>按位置取用列表，按名字取用字典</b>。列表的元素靠顺序（索引）组织，适合「一串同类的东西」：排行榜、待办、一队外星人。字典靠键组织，适合「描述一个对象的不同属性」或「两套数据的对应关系」：一个人的姓名年龄住址、一个词的词频。判断标准很简单：你想怎么找它？从 0 数过去，还是喊它的名字？'}
  ,
  exam:[{type:'choice', q:'d = {"a": 1, "b": 2}；d["c"] 会？', options:['返回 None','报 KeyError','返回 0','自动添加'], answer:1, explain:'直接访问不存在的键报 KeyError，用 get() 安全取值。'},{type:'code', q:'d = {"apple": 3, "banana": 5}，把 apple 的值改成 10，输出整个字典', code:'d = {"apple": 3, "banana": 5}\nd["apple"] = 10\nprint(d)', expect:'{"apple": 10, "banana": 5}', hint:'直接赋值覆盖旧值。'},{type:'choice', q:'嵌套访问 users["aeinstein"]["first"] 返回的是？', options:['aeinstein','first','字典','albert'], answer:3, explain:'先取外层字典的 aeinstein 键得到内层字典，再取 first 键得 albert。'},{type:'code', q:'用 items() 遍历 d = {"a": 1, "b": 2}，输出格式 键=值（两行）', code:'d = {"a": 1, "b": 2}\nfor k, v in d.items():\n    print(f"{k}={v}")', expect:'a=1\nb=2', hint:'items() 同时拿键和值。'},{type:'choice', q:'d = {}；d.get("z", 0) 返回？', options:['0','报错','None','{}'], answer:0, explain:'get 键不存在返回默认值 0。'},{type:'code', q:'创建空字典，添加 name 键值为 "鼠哥"，输出字典', code:'d = {}\nd["name"] = "鼠哥"\nprint(d)', expect:'{"name": "鼠哥"}', hint:'空字典直接赋值添加。'}]
},
{
  id:7, no:'Ⅶ', title:'用户输入和 while 循环', weeks:'第 7 周', diff:'★★★', full:true,
  story:{tutor:'艾伦·图灵（Alan Turing, 1912–1954）', era:'英国 · 计算机科学之父 · 人工智能先驱',
    fact:'图灵在 1936 年提出「图灵机」：一台能读取输入、按规则改变状态、永远循环直到停机标志出现的机器。你学的 input() 就是让程序「听人说话」，while 循环就是让程序「一直工作直到该停」。佩奇说 Google 的爬虫是「永远在跑的 while 循环」：抓取、分析、入库，循环往复。今天你写的每一段 while，都是图灵机的小小回声。',
    quote:'「我们只能看清前面很短的距离，但那里有值得做的事。」 艾伦·图灵',
    interact:{type:'flow', title:'while：先检查，再决定跑不跑', desc:'while 条件为真就执行循环体，每轮结束重新检查条件。', lines:[{t:'count = 1', hl:false},{t:'while count <= 3:', hl:true},{t:'    print(count) → 1, 2, 3', hl:true},{t:'    count += 1 ← 必须更新，否则死循环', hl:true},{t:'循环结束，继续往下', hl:false}], note:'条件最终必须变为 False，否则无限循环（Ctrl+C 可终止）。'}},
  motto:'「程序要学会两件事：听人说话，和自己停下来。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['input()','int() 转换','取模 %','while 循环','退出循环','标志 flag','break','continue','避免无限循环','while 处理列表','while 处理字典'],
  sections:[
    {t:'input()：让程序听人说话', p:'input(提示语) 暂停程序，等用户在终端输入，回车后把输入作为字符串返回。<b>返回的永远是字符串</b>，要当数字用必须 int() 转换。提示语要写清楚，让用户知道该输什么。注意：学院浏览器环境里 input 需要交互，考试题里用固定变量代替。', code:'name = input("请输入你的名字: ")\nprint(f"你好，{name}！")\nage = int(input("请输入年龄: "))  # 字符串转数字\nprint(f"明年你 {age + 1} 岁")'},
    {t:'while 循环：重复直到条件不成立', p:'while 条件: 在条件为 True 时反复执行循环体。典型用法：<b>让用户选择何时退出</b>（输入 quit 结束）；<b>标志法</b>（用 active 变量控制）；<b>break</b> 立即跳出；<b>continue</b> 跳过本轮继续下一轮。循环体里必须改变条件相关变量，否则死循环。', code:'prompt = "输入你喜欢的食物，输入 quit 结束: "\nactive = True\nwhile active:\n    message = input(prompt)\n    if message == "quit":\n        active = False\n    else:\n        print(f"收到：{message}")'},
    {t:'用 while 处理列表和字典', p:'for 循环遍历时不能同时删除元素，会跳过或索引错乱。<b>修改列表用 while</b>：先确认要移除的值在列表里（while value in list），再 remove。把元素从一个列表搬到另一个列表：while 源列表: 取出、处理、放进目标列表。收集用户输入进字典：每次循环收集一对键值。', code:'unconfirmed = ["alice", "brian", "candace"]\nconfirmed = []\nwhile unconfirmed:\n    user = unconfirmed.pop()\n    print(f"确认用户：{user}")\n    confirmed.append(user)\n# 清除所有指定值\npets = ["dog", "cat", "dog", "fish"]\nwhile "dog" in pets:\n    pets.remove("dog")'},
    {t:'取模运算符：% 的妙用', p:'a % b 返回 a 除以 b 的余数。判断奇偶：n % 2 == 0 是偶数。判断倍数：n % 5 == 0 是 5 的倍数。循环里做「每 N 次做某事」：i % N == 0。取模是循环和数字题里最常用的机关。', code:'for i in range(1, 11):\n    if i % 2 == 0:\n        print(f"{i} 是偶数")\n    else:\n        print(f"{i} 是奇数")'}
  ],
  example:{q:'用 while 循环从 1 加到 100，输出总和', code:'total = 0\nn = 1\nwhile n <= 100:\n    total += n\n    n += 1\nprint(total)', s:'累加器模式：total 存和，n 从 1 涨到 100。每轮把 n 加进 total，再把 n 加 1。n += 1 是循环的「刹车」，忘了它 n 永远等于 1，条件永远为真，死循环。输出 5050。'},
  traps:[
    '忘记更新循环变量导致无限循环：Ctrl+C 终止，想清楚退出条件再跑。',
    'input() 返回字符串：number + 1 报 TypeError，先 int() 转换。',
    'for 循环里删除元素导致跳过：改用 while。',
    'break 和 continue 混用：break 跳出整个循环，continue 只跳过本轮。',
    '== 写成 =：while active = True 是赋值不是比较，永远为真。',
    '在循环里用 input 但提示语不带空格，输入粘在提示语上。'
  ],
  quiz:[{type:'choice', q:'while 循环什么时候结束？', options:['循环体执行一次后','遇到 print','条件变为 False','永远不结束'], answer:2, explain:'while 每轮先检查条件，条件为 False 就结束。'},{type:'code', q:'用 while 输出 1 到 5（每行一个）', code:'n = 1\nwhile n <= 5:\n    print(n)\n    n += 1', expect:'1\n2\n3\n4\n5', hint:'记得 n += 1，否则死循环。'},{type:'choice', q:'n % 2 == 1 说明 n 是？', options:['偶数','奇数','负数','零'], answer:1, explain:'除以 2 余 1 是奇数。'},{type:'code', q:'从 1 加到 10 用 while 循环，输出总和', code:'total = 0\nn = 1\nwhile n <= 10:\n    total += n\n    n += 1\nprint(total)', expect:'55', hint:'累加器 + 循环变量更新。'},{type:'choice', q:'break 的作用是？', options:['跳过本轮','继续循环','立即结束整个循环','报错'], answer:2, explain:'break 直接跳出循环；continue 才跳过本轮。'},{type:'code', q:'数字 1 到 10，用 for 循环只输出偶数（每行一个）', code:'for n in range(1, 11):\n    if n % 2 == 0:\n        print(n)', expect:'2\n4\n6\n8\n10', hint:'n % 2 == 0 判断偶数。'},{type:'choice', q:'while "dog" in pets: pets.remove("dog") 的作用是？', options:['删除第一个 dog','死循环','报错','删除列表中所有 dog'], answer:3, explain:'while 条件成立就继续删，直到没有 dog。'},{type:'code', q:'用 while 把 nums = [1, 2, 3] 的元素全部 pop 出来并打印（每行一个）', code:'nums = [1, 2, 3]\nwhile nums:\n    print(nums.pop())', expect:'3\n2\n1', hint:'pop() 从末尾取，while nums 直到列表空。'},{type:'choice', q:'n = 3；while n > 0: print(n); n -= 1 输出的第一行是？', options:['2','1','3','0'], answer:2, explain:'第一轮 n=3 直接打印。'},{type:'code', q:'用 while 计算 1 到 5 的和', code:'total = 0\nn = 1\nwhile n <= 5:\n    total += n\n    n += 1\nprint(total)', expect:'15', hint:'累加器模式。'}],
  dialogue:{q:'为什么「遍历时修改列表」要用 while 而不是 for？',
    keys:['索引','删除','长度','跳过','移位','动态','变化','安全'],
    model:'for 循环内部维护一个计数器，按索引一个个取。你删掉一个元素后，后面的元素全部前移一位，计数器却继续往后走，于是被跳过的元素就再也访问不到，还可能越界。while 每次重新检查条件（比如 值 in 列表），列表变了它立刻感知，删干净为止。一句话：for 按「快照编号」走，while 按「实时状态」走。'}
  ,
  exam:[{type:'choice', q:'n = 5；while n > 0 循环体内没有修改 n，会发生什么？', options:['正常结束','无限循环','报错','只执行一次'], answer:1, explain:'条件永远为真，无限循环。'},{type:'code', q:'用 while 输出 10 以内的奇数（1, 3, 5, 7, 9，每行一个）', code:'n = 1\nwhile n < 10:\n    print(n)\n    n += 2', expect:'1\n3\n5\n7\n9', hint:'步长为 2 的累加。'},{type:'choice', q:'input() 返回的数据类型是？', options:['整数','字符串','浮点数','列表'], answer:1, explain:'input 总是返回字符串，需要数字时用 int() 或 float() 转换。'},{type:'code', q:'count 从 5 开始，用 while 循环递减打印到 1（每行一个）', code:'count = 5\nwhile count >= 1:\n    print(count)\n    count -= 1', expect:'5\n4\n3\n2\n1', hint:'count -= 1 递减。'},{type:'choice', q:'break 语句的作用是？', options:['跳过本轮','立即结束整个循环','继续循环','报错'], answer:1, explain:'break 跳出循环。'},{type:'code', q:'用 while 从 5 递减打印到 1（每行一个）', code:'n = 5\nwhile n >= 1:\n    print(n)\n    n -= 1', expect:'5\n4\n3\n2\n1', hint:'n -= 1 递减。'}]
},
{
  id:8, no:'Ⅷ', title:'函数', weeks:'第 8 周', diff:'★★★', full:true,
  story:{tutor:'拉里·佩奇（Larry Page, 1973–）', era:'美国 · Google 联合创始人 · 计算机科学家',
    fact:'Google 的代码库有几十亿行。如果每段逻辑都复制粘贴，维护就是灾难。函数是「写一次，用无数次」的封装：PageRank 的核心算法是个函数，搜索结果排序是另一个函数，它们互相调用、各自独立、随改随用。佩奇的团队铁律：重复代码超过三处，必须提炼成函数。今天你学的是 Google 工程文化的第一课。',
    quote:'「把一件事做好，然后让它可以被调用一万次。」 拉里·佩奇',
    interact:{type:'flow', title:'函数：一次定义，到处调用', desc:'def 定义函数，调用时传参，函数体执行完返回。', lines:[{t:'def greet(name):', hl:true},{t:'    print(f"你好, {name}!")', hl:true},{t:'调用：greet("鼠哥")', hl:false},{t:'输出：你好, 鼠哥!', hl:true}], note:'函数先定义后调用；参数名在 def 里，实参在调用时给。'}},
  motto:'「函数是把重复变成一次的魔法，也是把混乱变成秩序的手术刀。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['定义函数','实参形参','位置实参','关键字实参','默认值','返回值','可选实参','返回字典','传递列表','禁止修改列表','任意数量实参','任意关键字实参','模块导入','函数编写指南'],
  sections:[
    {t:'定义函数：写一次，用无数次', p:'def 函数名(参数): 冒号结尾，函数体缩进。调用：函数名(实参)。形参是函数定义时的占位名，实参是调用时给的值。函数先定义后调用，把定义放文件前面。', code:'def greet_user(username):\n    print(f"Hello, {username.title()}!")\ngreet_user("jesse")   # Hello, Jesse!'},
    {t:'传递实参：位置、关键字、默认值', p:'<b>位置实参</b>按顺序匹配形参，顺序错了结果就错；<b>关键字实参</b>指名道姓：greet(first="ada")，顺序无所谓；<b>默认值</b>在定义时给形参赋值，调用时不传就用默认。混合使用时：无默认值的形参放前面。', code:'def describe_pet(pet_name, animal_type="dog"):\n    print(f"我有一只{animal_type}，叫{pet_name}")\ndescribe_pet("willie")               # 用默认值 dog\ndescribe_pet(pet_name="harry", animal_type="hamster")  # 关键字实参'},
    {t:'返回值：函数的生产线', p:'return 把结果交回调用处。函数可以返回简单值、字典、列表。可选实参：给形参设默认值空字符串，让实参「可传可不传」。注意：return 之后的代码不执行；函数没有 return 时返回 None。', code:'def get_formatted_name(first, last, middle=""):\n    if middle:\n        return f"{first} {middle} {last}".title()\n    return f"{first} {last}".title()\nprint(get_formatted_name("john", "hooker", "lee"))  # John Lee Hooker'},
    {t:'传递列表与任意数量实参', p:'函数可以直接操作传入的列表（会改原列表）；不想改就传副本 列表[:]。<b>*args</b> 收集任意数量的位置实参成元组；<b>**kwargs</b> 收集任意数量的关键字实参成字典。参数顺序：普通形参、*args、**kwargs。', code:'def make_pizza(size, *toppings):\n    print(f"{size}寸披萨，配料：{toppings}")\nmake_pizza(12, "mushrooms", "cheese")\n\ndef build_profile(first, last, **user_info):\n    user_info["first"] = first\n    user_info["last"] = last\n    return user_info\nprint(build_profile("albert", "einstein", location="princeton"))'},
    {t:'模块：函数的集装箱', p:'把函数放进模块（另一个 .py 文件），就能到处复用。导入方式：<b>import 模块名</b>（用 模块.函数 调用）；<b>from 模块 import 函数</b>；<b>as 别名</b>；<b>from 模块 import *</b>（不推荐，污染命名空间）。', code:'# pizza.py 模块\ndef make_pizza(size, *toppings):\n    print(f"{size}寸披萨：{toppings}")\n\n# 主程序\nfrom pizza import make_pizza as mp\nmp(16, "pepperoni")'},
    {t:'函数编写指南', p:'函数名小写下划线；注释用 docstring（三引号）说明功能；形参指定默认值；函数应该小而专一，一个函数只做一件事；每个函数之间空两行（PEP8）。', code:'def add(a, b):\n    """返回 a 加 b 的和"""\n    return a + b'}
  ],
  example:{q:'写函数 add(a, b) 返回两数之和，调用 add(3, 5) 并打印结果', code:'def add(a, b):\n    return a + b\nresult = add(3, 5)\nprint(result)', s:'定义时 a、b 是形参，调用时 3、5 是实参。return 把 8 交回，存进 result，打印 8。函数的价值在复用：同样的加法逻辑，任何地方调 add(x, y) 就行，不用重写。'},

  quiz:[{type:'choice', q:'def greet(name): print(f"Hi {name}")，greet("Tom") 输出？', options:['Hi Tom','Hi name','Tom','报错'], answer:0, explain:'形参 name 接收实参 Tom，输出 Hi Tom。'},{type:'code', q:'定义函数 square(x) 返回 x 的平方，调用 square(7) 并打印', code:'def square(x):\n    return x ** 2\nprint(square(7))', expect:'49', hint:'return 返回结果，调用处直接打印。'},{type:'choice', q:'函数没有 return 语句时，返回值是？', options:['0','空字符串','报错','None'], answer:3, explain:'没有 return 的函数返回 None。'},{type:'code', q:'定义函数 greet(name, greeting="你好")，调用 greet("鼠哥") 输出默认问候', code:'def greet(name, greeting="你好"):\n    print(f"{greeting}，{name}")\ngreet("鼠哥")', expect:'你好，鼠哥', hint:'不传第二个实参时用默认值。'},{type:'choice', q:'def f(a, b, c=3)：调用 f(1, 2) 时 c 的值是？', options:['3','1','2','报错'], answer:0, explain:'c 有默认值 3，不传就用默认。'},{type:'code', q:'定义函数 describe_pet(animal, name) 用关键字实参调用：animal="cat", name="咪咪"，输出 这是一只cat，名字叫咪咪', code:'def describe_pet(animal, name):\n    print(f"这是一只{animal}，名字叫{name}")\ndescribe_pet(animal="cat", name="咪咪")', expect:'这是一只cat，名字叫咪咪', hint:'关键字实参指名道姓，顺序随意。'},{type:'choice', q:'def make_pizza(size, *toppings)：make_pizza(12, "a", "b") 中 toppings 是？', options:['列表 ["a", "b"]','元组 ("a", "b")','字符串','报错'], answer:1, explain:'*args 收集多余位置实参成元组。'},{type:'code', q:'写函数 max_of_two(a, b) 返回较大的数，调用输出', code:'def max_of_two(a, b):\n    if a > b:\n        return a\n    return b\nprint(max_of_two(8, 3))', expect:'8', hint:'if 判断后 return。'},{type:'choice', q:'def f(a, b=10): return a + b；print(f(5)) 输出？', options:['15','5','10','错误'], answer:0, explain:'b 用默认值 10，5+10=15。'},{type:'code', q:'定义 greet(name) 输出 你好, {name}!，调用 greet("Python")', code:'def greet(name):\n    print(f"你好, {name}!")\ngreet("Python")', expect:'你好, Python!', hint:'形参接收实参。'}],
  dialogue:{q:'「位置实参、关键字实参、默认值」什么时候用哪个？',
    keys:['顺序','明确','默认','可读','清晰','固定','少','复杂'],
    model:'原则是：<b>调用处要能一眼看懂</b>。参数少（两三个）且顺序自然，用位置实参；参数多或含义容易混，用关键字实参（describe_pet(animal="cat", name="咪咪") 一看就懂）；经常省掉的参数给默认值。Google 的代码评审有一条不成文规矩：调用超过三个参数的函数，必须让调用处读起来像句子。'}
  ,
  exam:[{type:'choice', q:'def f(x): return x * 2；f(5) 的结果是？', options:['25','10','5','2'], answer:1, explain:'5*2=10。'},{type:'code', q:'定义函数 is_even(n) 判断偶数，返回 True 或 False，调用 is_even(4) 并打印', code:'def is_even(n):\n    return n % 2 == 0\nprint(is_even(4))', expect:'True', hint:'n % 2 == 0 本身是布尔表达式，直接 return。'},{type:'choice', q:'from module import func 的调用方式是？', options:['module.func()','直接 func()','module: func()','import.func()'], answer:1, explain:'from...import 把函数直接导入当前命名空间，直接调用。'},{type:'code', q:'定义函数 sum_list(nums) 返回列表元素之和，调用 sum_list([1, 2, 3, 4]) 并打印', code:'def sum_list(nums):\n    return sum(nums)\nprint(sum_list([1, 2, 3, 4]))', expect:'10', hint:'内置 sum() 求和后 return。'},{type:'choice', q:'def f(*args)：*args 收集到的是什么类型？', options:['列表','元组','字典','集合'], answer:1, explain:'*args 收集成元组。'},{type:'code', q:'定义 double(x) 返回 x 的两倍，调用 double(9) 并输出', code:'def double(x):\n    return x * 2\nprint(double(9))', expect:'18', hint:'return 返回结果。'}]

{
  id:9, no:'Ⅸ', title:'类', weeks:'第 9 周', diff:'★★★★', full:true,
  story:{tutor:'阿黛尔·戈德堡（Adele Goldberg, 1945–）', era:'美国 · Smalltalk 开发者 · 面向对象编程先驱',
    fact:'1970 年代，戈德堡参与发明 Smalltalk，把「对象」这个概念正式带给编程界：一个对象既装数据又装行为，像乐高积木一样可以互相拼装。Python 的一切都是对象，你之前用的列表、字符串、字典全是「类造出来的实例」。佩奇说 Google 的每个系统都是对象组成的城市：类是图纸，实例是房子。',
    quote:'「对象是数据的房子，方法是房子的门。」',
    interact:{type:'var', title:'类与实例：图纸和房子', desc:'类定义属性和方法，实例是具体的一个对象。', pairs:[['class Dog','属性：name, age'],['方法：sit() bark()',''],['my_dog = Dog("Willie", 6)','实例'],['my_dog.name','Willie'],['my_dog.sit()','执行方法']], note:'类名大写开头（PascalCase），实例名小写。'}},
  motto:'「类是世界的建模语言：万物皆对象，对象皆可编程。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['创建类','__init__ 方法','实例化','访问属性','调用方法','默认属性','修改属性','继承','super()','重写方法','实例作属性','导入类','标准库','类的风格'],
  sections:[
    {t:'创建和使用类', p:'class 类名: 定义类。__init__() 是特殊方法：创建实例时自动调用，self 指实例本身（必须第一个参数）。类里的函数叫方法，属性是挂在 self 上的变量。实例化：my_dog = Dog("Willie", 6)，访问属性 my_dog.name，调用方法 my_dog.sit()。', code:'class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n    def sit(self):\n        print(f"{self.name} 坐下了")\nmy_dog = Dog("Willie", 6)\nprint(my_dog.name)   # Willie\nmy_dog.sit()         # Willie 坐下了'},
    {t:'使用类和实例：属性默认值', p:'属性可以在 __init__ 里直接给默认值，不依赖参数。修改属性三种方式：直接赋值 my_car.odometer = 23；通过方法修改（方法里校验）；通过方法递增。', code:'class Car:\n    def __init__(self, make, model, year):\n        self.make = make\n        self.model = model\n        self.year = year\n        self.odometer = 0   # 默认值\n    def read_odometer(self):\n        print(f"里程：{self.odometer} 公里")\nmy_car = Car("audi", "a4", 2024)\nmy_car.odometer = 23   # 直接修改\nmy_car.read_odometer()'},
    {t:'继承：站在父类的肩膀上', p:'子类自动获得父类的所有属性和方法。子类的 __init__ 用 super().__init__(...) 调用父类构造器。子类可以加自己的属性和方法，也可以重写父类方法（同名覆盖）。继承是「是一种」关系：ElectricCar 是一种 Car。', code:'class ElectricCar(Car):\n    def __init__(self, make, model, year):\n        super().__init__(make, model, year)\n        self.battery_size = 40\n    def describe_battery(self):\n        print(f"电池容量：{self.battery_size} kWh")\nmy_tesla = ElectricCar("tesla", "model s", 2024)\nmy_tesla.describe_battery()'},
    {t:'实例作属性：组合大于继承', p:'当属性本身很复杂时，把另一个类的实例作为属性（组合）。比如 Battery 单独成类，Car 拥有一个 Battery 实例。这样每个类职责单一，代码更清晰。Python 标准库也是类的大仓库：random、datetime、json 全是类。', code:'class Battery:\n    def __init__(self, size=40):\n        self.size = size\n    def describe(self):\n        print(f"电池：{self.size} kWh")\nclass ElectricCar(Car):\n    def __init__(self, make, model, year):\n        super().__init__(make, model, year)\n        self.battery = Battery(75)   # 组合\nmy_car = ElectricCar("tesla", "model 3", 2024)\nmy_car.battery.describe()   # 电池：75 kWh'},
    {t:'导入类与编程风格', p:'类可以存进模块：class 一个文件一个模块，import 导入。导入方式同函数。类命名用驼峰（CamelCase），实例和模块名小写下划线。类定义后空两行再写其他代码。先写 import，再写类，再写代码，这是 PEP8 的段落结构。', code:'# car.py\nclass Car:\n    """汽车类"""\n    pass\n\n# main.py\nfrom car import Car\nmy_car = Car("bmw", "x5", 2024)'}
  ],
  example:{q:'创建类 Student：__init__ 接收 name 和 score，方法 get_grade() 返回 及格（score>=60）或 不及格。实例化并输出成绩', code:'class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n    def get_grade(self):\n        if self.score >= 60:\n            return "及格"\n        return "不及格"\ns = Student("鼠哥", 85)\nprint(s.get_grade())', s:'类三步：__init__ 存属性、方法用属性、实例化后用点访问。输出 及格。注意 get_grade 里用 return 而不是 print，这样结果可以继续参与运算，是更好的习惯。'},
  traps:[
    '忘了 self：方法定义必须有 self 作为第一个参数，否则调用报错。',
    '类名小写开头：惯例是 PascalCase，虽然能跑但不符合 PEP8。',
    '子类 __init__ 忘了调 super().__init__：父类属性不存在。',

  quiz:[{type:'choice', q:'class Dog: 的 __init__ 方法什么时候自动执行？', options:['调用方法时','创建实例时','访问属性时','程序结束时'], answer:1, explain:'__init__ 在实例化时自动调用，初始化属性。'},{type:'code', q:'创建类 Cat：__init__ 接收 name，方法 meow() 输出 {name} 喵了一声，实例化后调用', code:'class Cat:\n    def __init__(self, name):\n        self.name = name\n    def meow(self):\n        print(f"{self.name} 喵了一声")\nc = Cat("咪咪")\nc.meow()', expect:'咪咪 喵了一声', hint:'实例化传参，点调用方法。'},{type:'choice', q:'self 在类方法里代表？', options:['实例本身','类本身','第一个参数','关键字'], answer:0, explain:'self 指向当前实例，通过它访问属性和其他方法。'},{type:'code', q:'创建类 Rectangle：__init__ 接收宽和高，方法 area() 返回面积，实例化并输出', code:'class Rectangle:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\nr = Rectangle(4, 5)\nprint(r.area())', expect:'20', hint:'面积 = 宽 × 高。'},{type:'choice', q:'子类继承父类后，自动获得？', options:['父类所有属性和方法','只有父类属性','只有父类方法','什么都没有'], answer:0, explain:'继承让子类自动拥有父类的属性和方法。'},{type:'code', q:'创建类 Animal（父类）和 Dog（子类）：Animal 有 speak() 输出 "动物叫"，Dog 继承并重写 speak() 输出 "汪汪"', code:'class Animal:\n    def speak(self):\n        print("动物叫")\nclass Dog(Animal):\n    def speak(self):\n        print("汪汪")\nd = Dog()\nd.speak()', expect:'汪汪', hint:'子类同名方法覆盖父类，调用子类版本。'},{type:'choice', q:'super().__init__(...) 在子类中的作用是？', options:['创建父类实例','删除父类','调用父类的构造方法','返回父类'], answer:2, explain:'super() 拿到父类引用，调用父类 __init__ 初始化继承来的属性。'},{type:'code', q:'类 Counter：__init__ 里 self.count = 0，方法 increment() 让 count 加 1，方法 get() 返回 count。调用 increment 两次后输出', code:'class Counter:\n    def __init__(self):\n        self.count = 0\n    def increment(self):\n        self.count += 1\n    def get(self):\n        return self.count\nc = Counter()\nc.increment()\nc.increment()\nprint(c.get())', expect:'2', hint:'属性默认值 + 方法修改 + 方法读取。'},{type:'choice', q:'class A: 的 __init__ 里 self.x = 1；a = A() 后 a.x 是？', options:['A','self','1','错误'], answer:2, explain:'实例属性 a.x 是 1。'},{type:'code', q:'创建类 Person 有 name 属性，实例化并输出 name', code:'class Person:\n    def __init__(self, name):\n        self.name = name\np = Person("Ada")\nprint(p.name)', expect:'Ada', hint:'self.name 存实例属性。'}],
  dialogue:{q:'什么时候该用继承，什么时候该用组合（实例作属性）？',
    keys:['是','继承','关系','组合','拥有','有','一个','层次'],
    model:'判断标准一句话：<b>「是一种」用继承，「有一个」用组合</b>。ElectricCar 是一种 Car，用继承；Car 有一个 Battery，用组合。继承是纵向的层次：父类管共性，子类管个性。组合是横向的拼装：把独立部件装进来。滥用继承会造出又深又脆的类金字塔；多数时候，组合更灵活，改起来不动根基。'}
  ,
  exam:[{type:'choice', q:'class Person: 里 def __init__(self, name)：创建 p = Person("Ada") 后，p.name 是？', options:['name','self','Ada','None'], answer:2, explain:'__init__ 把实参 Ada 存入 self.name，实例属性可访问。'},{type:'code', q:'创建类 BankAccount：__init__ 接收 balance=0，方法 deposit(n) 加钱，方法 get_balance() 返回余额。存 100 后输出', code:'class BankAccount:\n    def __init__(self, balance=0):\n        self.balance = balance\n    def deposit(self, n):\n        self.balance += n\n    def get_balance(self):\n        return self.balance\nacc = BankAccount()\nacc.deposit(100)\nprint(acc.get_balance())', expect:'100', hint:'默认参数 + 方法修改 + 读取。'},{type:'choice', q:'「ElectricCar 是一种 Car」在代码里对应？', options:['class ElectricCar(Car)','class Car(ElectricCar)','ElectricCar = Car','import ElectricCar'], answer:0, explain:'子类名放括号里继承父类。'},{type:'code', q:'子类 Student 继承 Person（父类有 name 属性），Student 的 __init__ 用 super 初始化 name，并加属性 school。输出 school', code:'class Person:\n    def __init__(self, name):\n        self.name = name\nclass Student(Person):\n    def __init__(self, name, school):\n        super().__init__(name)\n        self.school = school\ns = Student("鼠哥", "西安交通大学")\nprint(s.school)', expect:'西安交通大学', hint:'super().__init__(name) 先初始化父类属性。'},{type:'choice', q:'子类 __init__ 里调用父类构造器用什么？', options:['super().__init__(...)','parent()','self.__init__()','father()'], answer:0, explain:'super() 拿父类引用。'},{type:'code', q:'类 Dog 有方法 bark() 输出 汪，实例化并调用', code:'class Dog:\n    def bark(self):\n        print("汪")\nd = Dog()\nd.bark()', expect:'汪', hint:'实例化后点方法。'}]

    fact:'1947 年，赫柏的团队在一台马克二型计算机里发现了一只卡在继电器里的飞蛾，她在日志上写下「First actual case of bug being found」，从此 bug 成了程序错误的代名词。她也是最早提出「程序不应该崩溃，应该处理异常」的人。今天你学的 try-except，源头可以追溯到这只飞蛾。文件读写则是程序记忆的延伸：数据不写进文件，关掉程序就蒸发。',

  map:['读取整个文件','文件路径','逐行读取','百万位大文件','包含生日检查','写入文件','写入多行','追加','异常','try-except-else','FileNotFoundError','分析文本','静默失败','json.dumps','json.loads','重构'],
  sections:[
    {t:'读取文件', p:'open(路径) 打开文件，read() 读全部，readlines() 读成行列表。用 with 语句自动关闭文件，不用管 close()。路径：相对路径相对当前工作目录，绝对路径从盘符写起。文件内容读出来是字符串，逐行处理用 for line in 文件对象。', code:'with open("pi_digits.txt") as file:\n    contents = file.read()\nprint(contents)\n# 逐行\nwith open("pi_digits.txt") as file:\n    for line in file:\n        print(line.rstrip())'},
    {t:'写入文件', p:'open(路径, "w") 写入模式：不存在会创建，存在会清空重写。<b>"a"</b> 追加模式不清空。<b>"r"</b> 读取（默认）。写入用 write()，记得加 \n 换行，多次 write 连续写入。编码中文建议 open(path, "w", encoding="utf-8")。', code:'with open("notes.txt", "w") as f:\n    f.write("第一行\n")\n    f.write("第二行\n")\n# 追加\nwith open("notes.txt", "a") as f:\n    f.write("第三行\n")'},
    {t:'异常：程序的安全带', p:'异常是程序运行时的错误。try-except 捕获：try 里放可能出错的操作，except 里放错误处理，else 里放成功时才执行的代码。ZeroDivisionError（除零）、FileNotFoundError（文件不存在）、ValueError（值不合法）是三大常见异常。异常处理让程序「优雅失败」而不是「当场猝死」。', code:'try:\n    answer = 10 / 0\nexcept ZeroDivisionError:\n    print("不能除以零！")\nelse:\n    print(answer)\ntry:\n    with open("missing.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("文件不存在，已优雅处理")'},
    {t:'用 json 存储数据', p:'json 是通用数据格式，Python 的 json 模块负责「对象到文本、文本到对象」。json.dumps(数据) 把字典/列表序列化成字符串，存进文件；json.loads(文本) 反序列化回 Python 对象。程序重启后数据不丢，这就是「持久化」。', code:'import json\nnumbers = [1, 2, 3, 4, 5]\nwith open("numbers.json", "w") as f:\n    json.dump(numbers, f)\nwith open("numbers.json") as f:\n    data = json.load(f)\nprint(data)  # [1, 2, 3, 4, 5]'},
    {t:'静默失败与重构', p:'有时错误不需要提示用户：except 里放 pass 静默忽略。但静默要克制，全静默 = 全盲。重构：把代码拆成函数，让主程序读起来像提纲。先写出能跑的代码，再重构得更清晰，这是程序员的日常节奏。', code:'try:\n    print(1 / 0)\nexcept ZeroDivisionError:\n    pass  # 静默失败：什么都不做\n# 重构示例：把读文件变成函数\ndef load_data(path):\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return []'}
  ],
  example:{q:'写代码处理除法：try 计算 10 / 0，except 输出 "不能除以零"', code:'try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print("不能除以零")', s:'try 里的 10/0 触发 ZeroDivisionError，程序跳到 except 分支，输出 不能除以零，程序不崩溃。这就是异常处理的意义：错误发生了，但程序活下来了，用户看到了友好的提示而不是一堆红字。'},
  traps:[
    '用 open() 忘了 with：文件不关闭，Windows 上可能锁文件。',
    '写入模式 "w" 会清空原文件：想保留旧内容用 "a"。',
    'except 后面不写异常类型：except: 会吞掉包括 KeyboardInterrupt 在内的一切错误，永远别这么写。',
    'json.dump 和 json.dumps 混用：dump 是写文件，dumps 是转字符串。',
    '文件路径不对：相对路径基准是工作目录，不是脚本所在目录。',
    '文件不存在时直接读：FileNotFoundError，先用 try 或 os.path.exists 检查。'
  ],
  quiz:[{type:'choice', q:'with open("a.txt") as f: 的好处是？', options:['自动创建文件','文件不加密','自动关闭文件','读取更快'], answer:2, explain:'with 语句块结束自动关闭文件，不用手动 close()。'},{type:'code', q:'用 try-except 处理：int("abc") 会抛 ValueError，捕获并输出 "无法转换"', code:'try:\n    n = int("abc")\nexcept ValueError:\n    print("无法转换")', expect:'无法转换', hint:'int() 收到非数字字符串抛 ValueError。'},{type:'choice', q:'open(path, "w") 的 "w" 模式表示？', options:['追加','写入（清空重写）','只读','二进制'], answer:1, explain:'w 是 write 模式，会清空已有内容；a 是追加。'},{type:'code', q:'使用 json：把列表 [1, 2, 3] 序列化为字符串并打印（用 dumps）', code:'import json\ndata = json.dumps([1, 2, 3])\nprint(data)', expect:'[1, 2, 3]', hint:'json.dumps 转字符串，打印出来是 [1, 2, 3]。'},{type:'choice', q:'try-except-else 中，else 里的代码什么时候执行？', options:['except 执行后','任何时候','try 没出错时','程序开始时'], answer:2, explain:'else 只在 try 块成功无异常时执行。'},{type:'code', q:'捕获 FileNotFoundError：open 一个不存在的文件，捕获后输出 "找不到文件"', code:'try:\n    with open("no_such_file.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("找不到文件")', expect:'找不到文件', hint:'文件不存在抛 FileNotFoundError。'},{type:'choice', q:'json.load() 的作用是？', options:['把对象写入文件','从文件读入并解析成 Python 对象','转成字符串','压缩数据'], answer:1, explain:'json.load(文件对象) 读取并反序列化；json.loads(字符串) 从字符串解析。'},{type:'code', q:'读取文件内容的字符串后，统计其中的单词数：text = "hello world hello"，用 split 输出单词个数', code:'text = "hello world hello"\nwords = text.split()\nprint(len(words))', expect:'3', hint:'split() 按空白拆分成单词列表，len 数个数。'},{type:'choice', q:'try-except 中 except 块的作用是？', options:['跳过代码','加速运行','定义函数','捕获并处理异常'], answer:3, explain:'except 处理 try 里抛出的异常。'},{type:'code', q:'捕获 ZeroDivisionError，输出 不能除零', code:'try:\n    x = 10 / 0\nexcept ZeroDivisionError:\n    print("不能除零")', expect:'不能除零', hint:'除零抛 ZeroDivisionError。'}],
  dialogue:{q:'程序报错（抛异常）到底好不好？为什么要捕获异常而不是让程序崩溃？',
    keys:['崩溃','用户','体验','处理','恢复','信息','可控','继续'],
    model:'异常是程序的「呼救信号」，报错本身是好事：它精确告诉你哪里出了问题。坏的是程序直接崩溃，用户看到一片红字，数据丢失，什么都做不了。捕获异常的意义是：错误已经发生，但程序还活着，还能给用户一个交代（提示、重试、保存现场）。工程上叫「优雅降级」：最坏情况下也要可预测。所以规则是：预料之中的错误，主动捕获；预料之外的，让它响，然后修。'}
  ,
  exam:[{type:'choice', q:'try: 1 / 0 except ZeroDivisionError 属于哪种处理？', options:['捕获除零异常','捕获语法错误','读取文件','网络请求'], answer:0, explain:'ZeroDivisionError 是除零错误，try-except 捕获后程序继续运行。'},{type:'code', q:'写文件：以追加模式写一行 "Hello again" 到 notes.txt（不需要读出来）', code:'with open("notes.txt", "a") as f:\n    f.write("Hello again\n")\nprint("写入完成")', expect:'写入完成', hint:'a 追加模式，写入后打印确认（浏览器环境文件操作可能受限，先跑通逻辑）。'},{type:'choice', q:'except:（不带异常类型）为什么不推荐？', options:['运行更快','会吞掉所有错误包括不该吞的','更简洁','没有异常可捕'], answer:1, explain:'裸 except 连 KeyboardInterrupt 都吞，问题被掩埋，后期难排查。'},{type:'code', q:'用 json.dumps 把字典 {"name": "鼠哥"} 转字符串并打印', code:'import json\nprint(json.dumps({"name": "鼠哥"}))', expect:'{"name": "鼠哥"}', hint:'dumps 序列化字典为 JSON 字符串。'},{type:'choice', q:'"a,b,c".split(",") 的结果是？', options:['"a b c"','["a,b,c"]','["a", "b", "c"]','错误'], answer:2, explain:'split 按逗号拆成列表。'},{type:'code', q:'"hello world".split() 后统计单词个数', code:'words = "hello world".split()\nprint(len(words))', expect:'2', hint:'split 无参按空白拆分。'}]
},
{
  id:11, no:'Ⅺ', title:'测试代码', weeks:'第 11 周', diff:'★★★★', full:true,
  story:{tutor:'肯·汤普森（Ken Thompson, 1943–）', era:'美国 · Unix 与 Go 语言之父 · 图灵奖得主',
    fact:'1971 年，汤普森和里奇用两周时间写出了 Unix 的第一个版本，随后几十年里，Unix 家族统治了服务器世界，靠的不是一次写对，而是无数次测试和修补。佩奇的 Google 有一条铁律：<b>没有测试的代码不许合入主分支</b>。测试不是写完代码后的负担，是让你敢改代码的底气：有测试兜底，改坏了一跑就知道。',
    quote:'「写测试是给未来的自己留一张安全网。」',
    interact:{type:'flow', title:'测试：断言即契约', desc:'assert 期望值 == 实际值，对了静悄悄，错了响警报。', lines:[{t:'def get_name(first, last):', hl:true},{t:'    return f"{first} {last}"', hl:true},{t:'assert get_name("ada", "lovelace") == "ada lovelace"', hl:true},{t:'通过：无输出，全绿', hl:false},{t:'不通过：AssertionError 响起', hl:false}], note:'pytest 收集 test_ 开头的函数，自动运行并汇报。'}},
  motto:'「测试是代码的体检报告。没测过，等于没写。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 pytest','测试函数','可通过的测试','运行测试','未通过的测试','修复测试','添加新测试','测试类','各种断言','fixture 夹具'],
  sections:[
    {t:'pytest：让测试自动化', p:'pytest 是 Python 最流行的测试框架。安装：pip install pytest。规则：测试函数以 test_ 开头，测试文件以 test_ 开头命名。写断言：assert 条件，条件为 True 测试通过，False 测试失败。运行：终端输入 pytest，自动发现并运行所有测试。', code:'# test_name.py\ndef test_full_name():\n    assert get_full_name("ada", "lovelace") == "Ada Lovelace"\n# 终端运行\n# pytest  → 全部通过：绿\n# pytest -v  → 详细报告'},
    {t:'测试函数：从输出到断言', p:'把「看输出对不对」升级成「断言输出对不对」。测试要覆盖：正常情况、边界情况、特殊情况（空输入）。未通过的测试显示 AssertionError 和期望/实际的差异。修改测试让失败变通过：要么修代码，要么确认测试本身写错了。', code:'def get_full_name(first, last):\n    return f"{first} {last}".title()\n\ndef test_first_last_name():\n    full = get_full_name("janis", "joplin")\n    assert full == "Janis Joplin"'},
    {t:'测试类：一组相关的测试', p:'把同一单元的测试组织成类，用各种断言方法：assertEqual(a, b)、assertNotEqual、assertIn(item, list)、assertTrue/assertFalse、assertRaises。测试类名 TestXxx，方法名 test_xxx。pytest 会自动收集 Test 开头的类。', code:'class TestAnonymousSurvey:\n    def test_store_single_response(self):\n        survey = AnonymousSurvey("什么语言最好？")\n        survey.store_response("Python")\n        assert "Python" in survey.responses\n    def test_store_three_responses(self):\n        survey = AnonymousSurvey("什么语言最好？")\n        responses = ["Python", "C", "Go"]\n        for r in responses:\n            survey.store_response(r)\n        for r in responses:\n            assert r in survey.responses'},
    {t:'fixture：测试的公共底座', p:'多个测试需要同样的准备（比如创建同一个实例），用 fixture 消除重复。pytest 里 @pytest.fixture 装饰的函数，测试参数里声明同名参数就自动注入。fixture 让每个测试独立、干净、互不干扰。', code:'import pytest\n@pytest.fixture\ndef survey():\n    return AnonymousSurvey("什么语言最好？")\n\ndef test_one(survey):\n    survey.store_response("Python")\n    assert "Python" in survey.responses'},
    {t:'测试的工程意义', p:'测试的价值不在当下，在以后：<b>你敢重构</b>（改坏了测试立刻红）；<b>你懂契约</b>（测试就是函数的使用说明书）；<b>你有底气</b>（合入新代码前全绿）。佩奇的团队规矩：先写测试再写实现（TDD）或至少同步写。你现在觉得测试麻烦，等你改一个月前的代码时就懂了。', code:'# 测试驱动开发节奏：红 → 绿 → 重构\n# 1. 写一个会失败的测试（红）\n# 2. 写最少代码让它通过（绿）\n# 3. 重构，保持全绿'}
  ],
  example:{q:'为函数 add(a, b) 写 pytest 测试并手动模拟断言', code:'def add(a, b):\n    return a + b\n\ndef test_add():\n    assert add(2, 3) == 5\n    assert add(-1, 1) == 0\n    assert add(0, 0) == 0\n\n# 手动跑一遍同样的逻辑：\nassert add(2, 3) == 5\nprint("测试通过：add(2, 3) = 5")', s:'测试的价值在于把「我猜它对了」变成「我证明它对」。三个断言覆盖常规、正负抵消、零值三种情况。pytest 里每个 assert 失败都会精确报告哪个用例、哪一步错了，比肉眼盯着输出靠谱一百倍。'},
  traps:[
    '测试函数名不以 test_ 开头：pytest 找不到它，等于没写。',
    '断言写反：assert 5 == add(2, 3) 能跑但报错信息难读，把期望写左边。',
    '测试依赖运行顺序：测试之间应完全独立，fixture 每次重建。',
    '只测正常路径不测边界：空字符串、0、负数、超大值，边界才容易翻车。',
    '测试里复制了业务逻辑：测试和实现犯同样的错，断言要写「期望值」而不是再算一遍。',
    '忘了装 pytest：import pytest 直接 ModuleNotFoundError。'
  ],
  quiz:[{type:'choice', q:'pytest 默认会收集哪些函数作为测试？', options:['test_ 开头的函数','任意函数','main 函数','print 函数'], answer:0, explain:'pytest 自动发现 test_ 前缀的函数并运行。'},{type:'code', q:'写一个函数 is_positive(n) 返回 n > 0 的布尔值，并用 assert 测试 is_positive(5) 为 True', code:'def is_positive(n):\n    return n > 0\nassert is_positive(5) == True\nprint("测试通过")', expect:'测试通过', hint:'assert 条件为真则无事发生，通过。'},{type:'choice', q:'断言失败时 pytest 会？', options:['静默跳过','报告哪个用例失败','自动修复代码','删除测试'], answer:1, explain:'pytest 精确报告失败的测试和断言，方便定位。'},{type:'code', q:'写函数 double(x) 返回 2 倍值，写 test_double 断言 double(21) == 42，手动运行断言并打印 "OK"', code:'def double(x):\n    return x * 2\nassert double(21) == 42\nprint("OK")', expect:'OK', hint:'断言通过后打印 OK。'},{type:'choice', q:'fixture 的作用是？', options:['让测试更快','提供测试共用的准备数据','替代断言','自动生成测试'], answer:1, explain:'fixture 提供公共的初始化（如实例、数据），避免重复代码。'},{type:'code', q:'测试字符串方法：断言 "hello".upper() 等于 "HELLO"，断言通过后打印 "字符串测试通过"', code:'assert "hello".upper() == "HELLO"\nprint("字符串测试通过")', expect:'字符串测试通过', hint:'upper() 全大写，断言为真。'},{type:'choice', q:'assert 1 == 2 会发生什么？', options:['AssertionError','通过','返回 False','打印 False'], answer:0, explain:'断言条件为假抛 AssertionError，测试失败。'},{type:'code', q:'测试列表：断言 3 在列表 [1, 2, 3] 中，通过后打印 "3 在列表中"', code:'assert 3 in [1, 2, 3]\nprint("3 在列表中")', expect:'3 在列表中', hint:'in 判断成员，为真则断言通过。'},{type:'choice', q:'pytest 会收集哪些函数作为测试？', options:['任意函数','main 函数','print 函数','test_ 开头的'], answer:3, explain:'pytest 自动发现 test_ 前缀函数。'},{type:'code', q:'断言 max(3, 1, 2) == 3，通过后输出 OK', code:'assert max(3, 1, 2) == 3\nprint("OK")', expect:'OK', hint:'max 返回最大值。'}],
  dialogue:{q:'「先写测试还是先写功能」？TDD 到底好在哪？',
    keys:['失败','红','先','需求','预期','边界','实现','安全网'],
    model:'TDD（测试驱动开发）的节奏：先写一个会失败的测试（红），再写最少代码让它通过（绿），然后重构保持全绿。好处有三个：一，<b>先想清楚再动手</b>，写测试逼你先定义「什么是正确」；二，<b>测试必然被写过</b>，不会沦为事后补的摆设；三，<b>每一步都可回退</b>，全绿是安全的锚点。新手不用死守 TDD，但至少做到：功能写完立刻写测试，不留裸奔代码。'}
  ,
  exam:[{type:'choice', q:'pytest 运行测试的命令是？', options:['run test','python test','test all','pytest'], answer:3, explain:'终端输入 pytest 自动发现运行所有测试。'},{type:'code', q:'写函数 max3(a, b, c) 返回三个数中最大的，用 assert 测 max3(3, 7, 5) == 7', code:'def max3(a, b, c):\n    return max(a, b, c)\nassert max3(3, 7, 5) == 7\nprint("OK")', expect:'OK', hint:'max() 内置函数，断言通过。'},{type:'choice', q:'测试覆盖边界情况的意义是？', options:['边界测试更快','必须覆盖所有情况','边界测试更简单','边界最容易出错'], answer:3, explain:'边界（0、空、极值）最容易暴露逻辑漏洞。'},{type:'code', q:'测试类：class Calculator 有方法 add，实例化后断言 add(1, 1) == 2', code:'class Calculator:\n    def add(self, a, b):\n        return a + b\ncalc = Calculator()\nassert calc.add(1, 1) == 2\nprint("OK")', expect:'OK', hint:'实例化后调用方法再断言。'},{type:'choice', q:'assert 条件为假时抛出？', options:['ValueError','TypeError','KeyError','AssertionError'], answer:3, explain:'断言失败抛 AssertionError。'},{type:'code', q:'定义 add(a, b)，断言 add(2, 2) == 4，通过后输出 通过', code:'def add(a, b):\n    return a + b\nassert add(2, 2) == 4\nprint("通过")', expect:'通过', hint:'断言通过继续执行。'}]
},

{
  id:12, no:'Ⅻ', title:'项目一：外星人入侵', weeks:'第 12-14 周', diff:'★★★★★', full:true,
  story:{tutor:'诺兰·布什内尔（Nolan Bushnell, 1943–）', era:'美国 · 雅达利创始人 · 电子游戏之父',
    fact:'1972 年，布什内尔用 500 美元造出了雅达利的第一台街机 Pong，把电子游戏带进大众生活。他说过：所有好游戏都是「简单规则 + 即时反馈 + 越玩越难」。外星人入侵项目就是把这句话翻译成代码：Pygame 窗口、飞船移动、外星人舰队、子弹碰撞、记分牌。等你做完，你就是写过完整游戏的人了。',
    quote:'「游戏是让人心甘情愿去解决难题的东西。」 诺兰·布什内尔'},
  motto:'「完成一个作品，胜过读完十本书。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 Pygame','创建窗口','飞船类','事件循环','移动飞船','子弹','外星人舰队','碰撞检测','结束游戏','Play 按钮','提高难度','记分'],
  sections:[
    {t:'项目规划：先画地图再出发', p:'写游戏之前，先想清楚三件事：<b>玩家做什么</b>（控制飞船左右移动、开炮）、<b>敌人怎么做</b>（外星人舰队逐渐逼近）、<b>怎么算赢</b>（消灭全部外星人、记分、闯关）。对应三个类：Ship（飞船）、Alien（外星人）、Bullet（子弹），再加一个控制状态的 Game 主类。先设计再写码，是佩奇的团队铁律：代码是地图，设计是航线。', code:'# 先列出类的骨架，再逐行填充\nclass Ship:\n    def __init__(self):\n        self.x = 0          # 位置\n    def update(self):\n        pass                # 待实现：左右移动\n\nclass Alien:\n    def __init__(self):\n        self.x = 0\n    def update(self):\n        pass                # 待实现：逼近飞船'},
    {t:'安装 Pygame 与创建窗口', p:'pip install pygame 安装。创建游戏三件套：<b>屏幕</b>（pygame.display.set_mode）、<b>时钟</b>（控制帧率，避免游戏跑太快）、<b>主循环</b>（while 循环一直运行直到退出）。pygame.init() 初始化所有模块，pygame.quit() 退出时清理。窗口就是你的画布，游戏的一切都发生在这块画布上。', code:'import pygame\npygame.init()\nscreen = pygame.display.set_mode((1200, 800))\npygame.display.set_caption("外星人入侵")\nclock = pygame.time.Clock()\n\nwhile True:          # 游戏主循环\n    pygame.display.flip()   # 刷新画面\n    clock.tick(60)          # 每秒 60 帧'},
    {t:'事件循环：游戏的心跳', p:'事件是玩家和系统发给游戏的信号：按了哪个键、点了关闭、鼠标动了。pygame.event.get() 一次取走所有待处理事件。主循环每圈做的三件事：<b>处理事件</b>（按需响应）→ <b>更新状态</b>（飞船位置、子弹飞行）→ <b>绘制画面</b>（把新状态画上去）。三步分离，游戏才不乱。', code:'while True:\n    # 第一步：处理事件\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            pygame.quit()\n            exit()\n        elif event.type == pygame.KEYDOWN:\n            if event.key == pygame.K_RIGHT:\n                ship.moving_right = True\n        elif event.type == pygame.KEYUP:\n            if event.key == pygame.K_RIGHT:\n                ship.moving_right = False\n    # 第二步：更新\n    ship.update()\n    # 第三步：绘制\n    screen.blit(ship.image, ship.rect)\n    pygame.display.flip()'},
    {t:'飞船与移动：类的用武之地', p:'飞船是游戏里的第一个对象。Ship 类存它的图像、位置、速度，update 方法根据按键状态移动。按住右键移动：用一个布尔标志 moving_right，按下为 True 松开为 False，update 里判断。这样移动是连续的而不是点一下动一下。你学的类，在这里第一次变成了活物。', code:'class Ship:\n    def __init__(self, screen):\n        self.screen = screen\n        self.image = pygame.image.load("ship.png")\n        self.rect = self.image.get_rect()\n        self.moving_right = False\n        self.x = float(self.rect.x)   # 用浮点数防抖动\n    def update(self):\n        if self.moving_right:\n            self.x += 1.5             # 每帧向右移动\n        self.rect.x = int(self.x)'},
    {t:'子弹与外星人：精灵与碰撞', p:'子弹、外星人都用 pygame.sprite.Sprite 组织成 group（编队）。group 的好处：一次 update 全部、一次 draw 全部、碰撞检测一条命令。检测碰撞：pygame.sprite.groupcollide(子弹组, 外星人组, True, True) 同时删除撞上的子弹和外星人。这就是「即时反馈」的实现：打中了，画面立刻有反应。', code:'from pygame.sprite import Sprite\n\nclass Bullet(Sprite):\n    def __init__(self, screen, ship):\n        super().__init__()\n        self.rect = pygame.Rect(0, 0, 3, 15)\n        self.rect.midtop = ship.rect.midtop\n        self.y = float(self.rect.y)\n    def update(self):\n        self.y -= 2                  # 子弹向上飞\n        self.rect.y = int(self.y)\n\n# 碰撞：删子弹也删外星人\nhits = pygame.sprite.groupcollide(bullets, aliens, True, True)'},
    {t:'记分与难度：越玩越难', p:'游戏要有「越玩越难」的曲线：每消灭整队外星人，等级 +1，外星人移动速度加快。得分显示在屏幕角落（用 font 渲染文字）。Play 按钮控制游戏开始/暂停，游戏结束时显示结算。这三样合起来，游戏就从「能跑」变成「好玩」。', code:'score = 0\nalien_speed = 1.0\n\nif not aliens:            # 全队消灭\n    level += 1            # 提高难度\n    alien_speed += 0.5\n    create_fleet()        # 生成新的一队\n\n# 显示得分\nfont = pygame.font.SysFont(None, 48)\ntext = font.render(f"Score: {score}", True, (255, 255, 255))\nscreen.blit(text, (10, 10))'}
  ],
  example:{q:'写一个最简游戏循环的骨架：处理退出事件、刷新画面、控制帧率', code:'import pygame\npygame.init()\nscreen = pygame.display.set_mode((800, 600))\nclock = pygame.time.Clock()\n\nrunning = True\nwhile running:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n            running = False\n    pygame.display.flip()\n    clock.tick(60)\npygame.quit()', s:'这是 Pygame 的「最小可用循环」：running 标志控制主循环，事件循环捕获 QUIT 退出，flip 刷新画面，tick(60) 锁帧率。所有游戏都是从这个骨架长出来的——加飞船、加子弹、加外星人，都是在这个 while 里添砖加瓦。先在本地环境跑通这个骨架，再逐层加内容。'},
  traps:[
    '忘了 pygame.display.flip()：画面永远不会更新，全黑屏。',
    '事件循环里写死循环或 sleep：游戏卡死，事件堆积。',
    '没做 pygame.quit()：关闭窗口后程序还在后台跑。',
    '直接改 rect.x 整数：移动会一抖一抖，用浮点存再转 int。',
    '碰撞检测方向写反：groupcollide 的第一个参数是子弹组。',
    '帧率不锁：游戏在快电脑上快得没法玩，一定用 clock.tick()。'

  quiz:[
    {type:'choice', q:'Pygame 游戏主循环每圈的核心三步是？', options:['读取-写入-关闭','处理事件-更新状态-绘制画面','初始化-加载-退出','移动-跳跃-射击'], answer:1, explain:'事件处理响应用户输入，更新让状态前进，绘制把新状态画出来，三步缺一不可。'},
    {type:'choice', q:'把图像画到屏幕上用的是？', options:['screen.draw(图像)','screen.paint(图像)','screen.show(图像)','screen.blit(图像, 位置)'], answer:3, explain:'blit 是「块传输」，把图像贴到屏幕指定位置。'},
    {type:'code', q:'写一个 Alien 类：有 x 属性，update 方法让 x 每帧加 1（面向对象模拟，纯 Python 可运行）', code:'class Alien:\n    def __init__(self):\n        self.x = 0\n    def update(self):\n        self.x += 1\n\nalien = Alien()\nalien.update()\nprint(alien.x)', expect:'1', hint:'__init__ 初始化 x，update 里 self.x += 1。'},
    {type:'choice', q:'检测子弹和外星人碰撞常用？', options:['pygame.sprite.groupcollide','pygame.collision.check','pygame.overlap.detect','pygame.hit.test'], answer:0, explain:'groupcollide 对两个精灵组做碰撞检测，还可以自动删除撞上的对象。'},
    {type:'code', q:'用 random 模块生成一个 1 到 1200 的随机整数（外星人的 x 坐标）', code:'import random\nx = random.randint(1, 1200)\nprint(x)', expect:'', hint:'random.randint(1, 1200)，输出是随机的，判题只检查无报错。'},
    {type:'choice', q:'控制帧率的代码是？', options:['screen.fps(60)','time.limit(60)','pygame.fps(60)','clock.tick(60)'], answer:3, explain:'clock.tick(60) 让循环每秒最多跑 60 次，游戏速度稳定。'}
  ,{type:'choice', q:'pygame.Surface 的 get_rect() 方法返回？', options:['矩形区域 Rect','坐标元组','图像列表','颜色值'], answer:0, explain:'get_rect() 返回一个 Rect 对象，包含位置和大小，用于定位和碰撞。'},{type:'code', q:'模拟飞船移动：x = 0，每帧 +1.5，跑 10 帧后打印 x', code:'x = 0\nfor i in range(10):\n    x += 1.5\nprint(x)', expect:'15.0', hint:'循环 10 次累加 1.5。'},{type:'choice', q:'精灵组 group 的 draw(screen) 方法作用是？', options:['删除所有精灵','移动所有精灵','检测碰撞','把所有精灵画到屏幕'], answer:3, explain:'draw 遍历组里所有精灵，把它们的图像画到指定屏幕。'},{type:'code', q:'模拟外星人舰队：生成 5 个外星人的 x 坐标（0, 60, 120, 180, 240）存列表并打印', code:'xs = [i * 60 for i in range(5)]\nprint(xs)', expect:'[0, 60, 120, 180, 240]', hint:'推导式 i*60。'}],
  dialogue:{q:'为什么游戏主循环要把「处理事件、更新状态、绘制画面」严格分开成三步？',
    keys:['顺序','稳定','事件','更新','绘制','分离','节奏','不卡'],
    model:'因为游戏是「每帧都要完整走一遍」的：不管玩家按没按键，画面都要刷新。如果把事件处理、状态更新、绘制混在一起，就会出现在一个循环里既要读输入又要画图，逻辑乱、帧率也不稳定。分开三步，每帧的节奏恒定：先听指令、再算变化、最后呈现。这也是程序设计的通用原则：职责分离，每段代码只做一件事。'}
  ,

{
  id:13, no:'ⅩⅢ', title:'项目二：数据可视化', weeks:'第 15-17 周', diff:'★★★★★', full:true,
  story:{tutor:'汉斯·罗斯林（Hans Rosling, 1948–2017）', era:'瑞典 · 数据可视化大师 · TED 演讲者',
    fact:'罗斯林用动态气泡图让全世界看懂了几十年的全球健康数据，他的 TED 演讲被观看超过 5000 万次。他说：数据本身不会说话，是可视化让数据开口。这个项目教你用 Matplotlib 画折线图和随机游走，用 Plotly 模拟掷骰子，用 CSV/JSON 分析真实数据，用 API 抓取 GitHub 热门仓库。',
    quote:'「数据是新时代的石油，可视化是炼油厂。」'},
  motto:'「会看图的人，能看见数据里的故事。」',
  mottoWho:'拉里·佩奇 · 开讲词',
  map:['安装 Matplotlib','折线图','随机游走','Plotly 掷骰子','CSV 格式','JSON 数据','API 请求','Hacker News'],
  sections:[
    {t:'Matplotlib 入门：第一张图', p:'Matplotlib 是 Python 最经典的可视化库。三行出图：plt.plot(数据) 画折线、plt.scatter(数据) 画散点、plt.show() 显示。安装 pip install matplotlib。图形是「数据的翻译」：同样的数字，画成图一眼看懂趋势，这就是罗斯林说的「数据开口说话」。', code:'import matplotlib.pyplot as plt\n\nsquares = [1, 4, 9, 16, 25]\nplt.plot(squares)\nplt.title("平方数", fontsize=14)\nplt.xlabel("n", fontsize=12)\nplt.ylabel("n²", fontsize=12)\nplt.show()'},
    {t:'折线图与散点图：表达趋势与分布', p:'折线图适合连续趋势（气温变化、股价），散点图适合看分布和相关性（身高体重）。两者都能定制：线条颜色和宽度、点的颜色和尺寸、坐标轴范围。plt.style 可以换主题风格（如 seaborn）。图的每个细节都是信息：颜色、标签、标题，都是给别人看的线索。', code:'import matplotlib.pyplot as plt\n\nx = [1, 2, 3, 4, 5]\ny = [1, 8, 27, 64, 125]\n\nplt.scatter(x, y, c="red", s=80)   # 散点，红色，点大小 80\nplt.title("立方数", fontsize=16)\nplt.tick_params(axis="both", labelsize=12)\nplt.show()'},
    {t:'随机游走：用随机画一幅画', p:'随机游走：从原点出发，每次随机选一个方向走一步，走很多步画出来就是一幅抽象画。核心是 random 模块的随机决策。RandomWalk 类：存 x 和 y 两个列表，fill_walk 方法一步步走。这是「程序 + 随机」的第一次结合——你写的代码能产生你没想到的画面。', code:'import random\nfrom random import choice\n\nclass RandomWalk:\n    def __init__(self, num_points=5000):\n        self.num_points = num_points\n        self.x = [0]\n        self.y = [0]\n    def fill_walk(self):\n        while len(self.x) < self.num_points:\n            x_step = choice([-1, 1]) * choice([0, 1, 2])\n            y_step = choice([-1, 1]) * choice([0, 1, 2])\n            if x_step == 0 and y_step == 0:\n                continue\n            self.x.append(self.x[-1] + x_step)\n            self.y.append(self.y[-1] + y_step)\n\nrw = RandomWalk(100)\nrw.fill_walk()\nprint("走了", len(rw.x), "步")'},
    {t:'Plotly 与掷骰子：交互式图表', p:'Plotly 生成交互式图表（可缩放、悬停显示数值），浏览器里直接用。模拟掷骰子：random.randint(1, 6) 掷一次，掷几千次统计每个点数出现的次数，画成直方图。你会看到：掷得越多，各点数出现次数越接近——这就是大数定律，概率论最直观的验证。', code:'from random import randint\n\nclass Die:\n    def __init__(self, num_sides=6):\n        self.num_sides = num_sides\n    def roll(self):\n        return randint(1, self.num_sides)\n\ndie = Die()\nresults = [die.roll() for _ in range(1000)]\n# 统计每个点数出现次数\nfrequencies = [results.count(v) for v in range(1, 7)]\nprint(frequencies)  # 例如 [168, 165, 172, 155, 177, 163]'},
    {t:'CSV 数据：从真实世界读取', p:'CSV（逗号分隔值）是数据交换的通用格式。csv 模块逐行读：csv.reader() 返回行迭代器。真实数据通常有表头（第一行），用 next() 跳过。处理真实数据时：先看结构、再提取需要的列、最后可视化。全球气温、地震记录、股票数据都是 CSV——真实世界的数据，比课堂例题乱得多，但也真实得多。', code:'import csv\n\nwith open("data.csv") as f:\n    reader = csv.reader(f)\n    header = next(reader)      # 跳过表头\n    highs = []\n    for row in reader:\n        if row:                 # 跳过空行\n            highs.append(int(row[1]))  # 第二列是最高温\nprint(highs)'},
    {t:'API：让程序联网取数', p:'API 是网站提供的取数接口：你用请求 URL 拿到数据（通常是 JSON），然后解析、可视化。requests.get(url) 请求，response.json() 解析。GitHub API 不需要登录就能拿到热门仓库数据：仓库名、星标数、描述。你学到的是「程序联网」——从此你的代码不再只是计算，还能连接整个世界。', code:'import requests\n\nurl = "https://api.github.com/search/repositories?q=language:python&sort=stars"\nr = requests.get(url)\nresponse_dict = r.json()\n\nprint("找到仓库数:", response_dict.get("total_count"))\nrepos = response_dict.get("items", [])[:3]\nfor repo in repos:\n    print(repo["name"], "★", repo["stargazers_count"])\n    print("  ", repo["description"])'}
  ],

    {t:'视图与模板：逻辑与页面分工', p:'视图（View）是 Python 函数：接收请求，从数据库取数据，交给模板渲染，返回响应。模板（Template）是 HTML 加模板语法：{{ 变量 }} 显示数据、{% for %} 循环、{% if %} 判断。逻辑和数据在 Python 里，页面长什么样在模板里，职责分开，改页面不用动逻辑。', code:'# views.py\nfrom django.shortcuts import render\nfrom .models import Topic\n\ndef topics(request):\n    """显示所有主题"""\n    topics = Topic.objects.order_by("date_added")\n    context = {"topics": topics}\n    return render(request, "topics.html", context)\n\n# topics.html 模板\n# {% for topic in topics %}\n#   <li>{{ topic.text }}</li>\n# {% empty %}\n#   <li>还没有主题</li>\n# {% endfor %}'},

/* 公式渲染（旧 calculus 解析器，纯函数） */
var _calcPM=function(s){
  if(s===undefined||s===null) return '';
  s=String(s); var i=0, out='';
  /* 裸 Σ/∫ 的上下标写法归一为 \sum/\int（教材式垂直叠放渲染） */
  s = s.replace(/Σ_/g,'\\sum_').replace(/∫_/g,'\\int_').replace(/Σ\^/g,'\\sum^').replace(/∫\^/g,'\\int^');
  function readGroup(){
    var depth=0, j=i;
    while(j<s.length){ if(s[j]==='{')depth++; if(s[j]==='}'){depth--; if(depth===0)break;} j++; }
    var g=s.slice(i+1,j); i=Math.min(j+1,s.length); return g;
  }
  while(i<s.length){
    var c=s[i];
    if(c==='\\'){
      if(s[i+1]==="'"||s[i+1]==='′'){out+='′'; i+=2; continue;}
      var m=/^[a-zA-Z]+/.exec(s.slice(i+1));
      if(m){
        var cmd=m[0]; i+=1+cmd.length;
        switch(cmd){
          case 'frac': {var a=readGroup(),b=readGroup(); out+='<span class="fr" style="display:inline-block;vertical-align:middle;text-align:center;margin:0 2px"><span style="display:block;border-bottom:1px solid currentColor;padding:0 4px">'+parseMath(a)+'</span><span style="display:block;padding:0 4px">'+parseMath(b)+'</span></span>'; break;}
          case 'lim': {var sub=''; if(s[i]==='_'){i++; sub=s[i]==='{'?readGroup():(s[i++]||'');} out+='<i>lim</i>'+(sub?'<sub>'+parseMath(sub)+'</sub>':''); break;}
          case 'int': {var lw='',up=''; if(s[i]==='_'){i++; lw=s[i]==='{'?readGroup():(s[i++]||'');} if(s[i]==='^'){i++; up=s[i]==='{'?readGroup():(s[i++]||'');} out+='<span style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 1px"><span style="font-size:1.35em">∫</span>'+(lw||up?'<span style="display:inline-flex;flex-direction:column;align-items:center;font-size:.7em;line-height:1.08;margin-left:2px">'+(up?'<span>'+parseMath(up)+'</span>':'<span>&nbsp;</span>')+(lw?'<span style="padding:0 1px">'+parseMath(lw)+'</span>':'')+'</span>':'')+'</span>'; break;}
          case 'sum': {var lw2='',up2=''; if(s[i]==='_'){i++; lw2=s[i]==='{'?readGroup():(s[i++]||'');} if(s[i]==='^'){i++; up2=s[i]==='{'?readGroup():(s[i++]||'');} out+='<span style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 1px"><span style="font-size:1.25em">Σ</span>'+(lw2||up2?'<span style="display:inline-flex;flex-direction:column;align-items:center;font-size:.72em;line-height:1.08;margin-left:2px">'+(up2?'<span>'+parseMath(up2)+'</span>':'<span>&nbsp;</span>')+(lw2?'<span style="padding:0 1px">'+parseMath(lw2)+'</span>':'')+'</span>':'')+'</span>'; break;}
          case 'sqrt': {var r=readGroup(); out+='√<span style="border-top:1px solid currentColor;padding:0 3px">'+parseMath(r)+'</span>'; break;}
          case 'pi': out+='π'; break;
          case 'theta': out+='θ'; break;
          case 'alpha': out+='α'; break;
          case 'beta': out+='β'; break;
          case 'gamma': out+='γ'; break;
          case 'delta': out+='δ'; break;
          case 'epsilon': out+='ε'; break;
          case 'varepsilon': out+='ε'; break;
          case 'xi': out+='ξ'; break;
          case 'phi': out+='φ'; break;
          case 'text': { var t=readGroup(); out+='<span>'+parseMath(t)+'</span>'; break; }
          case 'circ': out+='∘'; break;
          case 'deg': out+='°'; break;
          case 'iff': out+='⇔'; break;
          case 'cdots': out+='⋯'; break;
          case 'dots': out+='…'; break;
          case 'prime': out+='′'; break;
          case 'quad': out+='　'; break;
          case 'qquad': out+='　　'; break;
          case 'mathbb': { var b=readGroup(); out+=b; break; }
          case 'overline': { var o=readGroup(); out+='<span style="border-top:1px solid currentColor">'+parseMath(o)+'</span>'; break; }
          case 'left': case 'right': case 'big': case 'Big': case 'bigg': case 'Bigg': i++; break;
          case 'infty': out+='∞'; break;
          case 'to': out+='→'; break;
          case 'Rightarrow': out+='⇒'; break;
          case 'cdot': out+='·'; break;
          case 'times': out+='×'; break;
          case 'pm': out+='±'; break;

function numEq(a,b){

/* 显式回上一级：从导航栈取上一页渲染并同步历史，不依赖浏览器历史回退 */
function doBack(){
  var errMsg='';
  var st=(typeof STACK!=='undefined'&&STACK)?STACK:null;
  var top=null;
  /* 从导航栈取真正的列表页（过滤掉做题页自身） */
  while(st&&st.length){ var t=st.pop(); if(t!=='chapter'&&t!=='exam'){ top=t; break; } }
  var root = (window._cur==='exam')?'vol':((window._lastNav&&window._lastNav.mode==='drill')?'hall':'plan');
  if(!top){ top=root; }
  var ok=false;
  try{ history.replaceState({view:top},''); }catch(e){}
  try{ doRenderView(top,true); ok=(window._cur===top); }catch(err){ errMsg=String(err&&err.message||err); }
  if(!ok && typeof go==='function'){ try{ go(top); ok=(window._cur===top); }catch(e2){ errMsg=String(e2&&e2.message||e2); } }
  if(!ok && top!==root){ try{ doRenderView(root,true); ok=(window._cur===root); }catch(e3){ errMsg=String(e3&&e3.message||e3); } }
  try{
    if(!ok){
      try{ console.error('[doBack] fail top='+top+' cur='+window._cur+' :: '+errMsg); }catch(ce){}
      toast('返回失败，正在回到首页…');
      setTimeout(function(){ try{ window.location.reload(); }catch(e){} }, 500);
    }
  }catch(e){}
  /* 兜底校验：400ms 后仍在做题页则强制回首页 */
  try{
    setTimeout(function(){
      var c=window._cur;
      if(c==='chapter'||c==='exam'){ try{ console.error('[doBack] stuck, force reload cur='+c); }catch(ce2){} window.location.reload(); }
    }, 400);

}

function poolKeyInfo(k){
  var p=String(k).split('_');
  if(p[0][0]==='e'){ var c2=chById(+p[0].slice(1)); return c2?('第 '+c2.id+' 章小卷 · '+(c2.exam&&c2.exam[+p[1]]?c2.exam[+p[1]].q:'')):k; }

}

        +'</div>'
        +'<pre class="pyout" id="epyout'+qi+'"'+(hist!==undefined?' style="display:block"':'')+'>'+(hist!==undefined&&quizPick[k]!==undefined?esc(quizPick[k]):'')+'</pre>'
        +'<div class="py-status" id="epyst'+qi+'"></div>'

        +'</div>';

renderers.stats=function(){
  var s=calcStats(), streak=calcStreak(), rk=curRank(s.pct);
  var tq=(stat&&stat.totalQ)?stat.totalQ:0, tc=(stat&&stat.totalCorrect)?stat.totalCorrect:0;
  var bd=badgeState(s), gotN=bd.filter(function(b){return b.got;}).length;
  var acc = tq ? Math.round(tc/tq*100) : 0;
  var pct=s.pct;
  /* 当前档与下一档（进度条刻度） */
  var curAt=0, nextAt=rk.nextAt, curName=rk.name, nextName=rk.next;
  for(var i=0;i<RANKS.length;i++){ if(pct>=RANKS[i][0]){ curAt=RANKS[i][0]; curName=RANKS[i][1]; } }
  var span=(nextAt!==null&&nextAt!==undefined)?(nextAt-curAt):1;
  var innerPct=Math.max(0,Math.min(1,(pct-curAt)/span));
  /* 荣誉调色板（随档位轮换） */
  var PALS=[
    ['linear-gradient(135deg,#0A84FF,#5E5CE6)','#0A84FF'],
    ['linear-gradient(135deg,#FF9F0A,#FF7A00)','#FF9F0A'],
    ['linear-gradient(135deg,#FF453A,#D70015)','#FF453A'],
    ['linear-gradient(135deg,#34C759,#28A745)','#34C759'],
    ['linear-gradient(135deg,#AF52DE,#7D2AE0)','#AF52DE'],
    ['linear-gradient(135deg,#FFD60A,#FF9500)','#FF9500']
  ];
  var idx=0; for(var pi=0;pi<RANKS.length;pi++){ if(pct>=RANKS[pi][0]) idx=pi; }
  var pal=PALS[(idx+1)%PALS.length];
  var C=pal[1], Cg=pal[0];
  /* 进度环（SVG） */
  var R=54, CIRC=2*Math.PI*R;
  var ring='<div style="position:relative;width:132px;height:132px;flex:none">'
    +'<svg width="132" height="132" viewBox="0 0 132 132" style="transform:rotate(-90deg)">'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="var(--fill)" stroke-width="10"/>'
    +'<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+C+'" stroke-width="10" stroke-linecap="round" '
    +'stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC*(1-pct/100)+'" style="transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)"/>'
    +'</svg>'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<b style="font-size:26px;color:var(--ink);line-height:1">'+pct+'<span style="font-size:14px">%</span></b>'
    +'<span class="cap" style="margin-top:2px">总进度</span></div></div>';
  var h='<div class="kick">OVERVIEW</div><div class="h1">进度总览</div>'
    +'<div class="sub">'+rk.name+' · 距「'+(rk.next||'满级')+'」还差 '+(rk.nextAt!==null&&rk.nextAt!==undefined?rk.nextAt-pct:'0')+'%</div>';
  /* 称号横幅 */
  h+='<div style="border-radius:24px;padding:20px;color:#fff;background:'+Cg+';box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden">'
    +'<div style="position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)"></div>'
    +'<div style="position:absolute;right:30px;bottom:-50px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)"></div>'
    +'<div style="width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;backdrop-filter:blur(4px)">'
    +(idx===0?'🌱':idx>=RANKS.length-2?'👑':'🏆')+'</div>'
    +'<div style="flex:1;min-width:0;position:relative;z-index:1">'
    +'<div style="font-size:11px;font-weight:800;letter-spacing:1.6px;opacity:.85">CURRENT RANK</div>'
    +'<b style="font-size:21px;display:block;margin-top:2px">'+curName+'</b>'
    +'<div style="height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:9px;overflow:hidden">'
    +'<i style="display:block;height:100%;width:'+Math.round(innerPct*100)+'%;background:#fff;border-radius:3px;transition:width .8s"></i></div>'
    +'<div style="font-size:11.5px;opacity:.9;margin-top:5px;display:flex;justify-content:space-between"><span>'+curAt+'%</span><span>'+(rk.next||'满级')+' · '+(nextAt!==null&&nextAt!==undefined?nextAt+'%':'MAX')+'</span></div>'
    +'</div></div>';
  /* 中央行：进度环 + 今日/连签 */
  h+='<div style="display:flex;align-items:center;gap:18px;margin-top:14px">'
    +ring
    +'<div style="flex:1;display:grid;grid-template-columns:1fr;gap:8px">'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🔥</span><div><b style="font-size:15px;display:block">'+streak+' 天</b><span class="cap">连续打卡</span></div></div>'
    +'<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--sh-card)"><span style="font-size:22px">🎯</span><div><b style="font-size:15px;display:block">'+acc+'%</b><span class="cap">答题正确率</span></div></div>'
    +'</div></div>';
  /* 数据六宫格 */
  var D=[
    {ico:'📖',v:s.doneC+'/'+s.totalC,l:'已学章节'},
    {ico:'📝',v:s.examFull+'/'+s.examTotal,l:'小卷已做'},
    {ico:'🧮',v:tq,l:'累计答题'+(tc?'':'')},
    {ico:'✍️',v:tc,l:'累计答对'},
    {ico:'🎖️',v:gotN+'/'+bd.length,l:'徽章解锁'},
    {ico:'🧹',v:s.wrongPool,l:'待订正错题'}
  ];
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">';
  D.forEach(function(d){
    h+='<div style="background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh-card);border:1px solid var(--sep)">'
      +'<div style="font-size:20px;line-height:1">'+d.ico+'</div>'
      +'<b style="font-size:17px;display:block;margin-top:5px">'+d.v+'</b>'
      +'<span class="cap" style="display:block;margin-top:2px">'+d.l+'</span></div>';
  });
  h+='</div>';
  return h;
};

/* toast 单例化：同一时刻只保留一条提示，新提示立即顶掉旧条（鼠哥 2026-09-04） */
function toast(msg){
  var box=document.getElementById('toastBox');
  if(!box) return;
  while(box.firstChild) box.removeChild(box.firstChild);
  var el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="ic t-ic">'+I['check']+'</span><span>'+msg+'</span>';
  box.appendChild(el);
  setTimeout(function(){ el.classList.add('leaving'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); },2200);
}

var startCtx=null;
function ssRow(ic,t,cap){ return '<div class="ss-row"><span class="ic">'+IC(ic)+'</span><div style="flex:1;min-width:0"><b style="display:block">'+t+'</b><span>'+cap+'</span></div></div>'; }
function showStart(kind,id){
  var c=chById(id); if(!c) return;
  startCtx={kind:kind,id:id};
  var kick,title,sub,rows='';
  if(kind==='exam'){
    var st=examStatus(c);
    kick='MINI EXAM '+('0'+id).slice(-2);
    title=esc(c.title)+' · 小卷';
    sub=st.full?'这份卷已结算 · 重做不改变记录':(st.answered>0?'继续上次作答':'答完自动结算点亮打卡');
    rows=ssRow('doc',(c.exam||[]).length+' 题','单选 · 即时批改 · 错题自动归档')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(st.answered>0?ssRow('check','已答 '+st.answered+'/'+st.total,'进度已保留'):'');
  } else {
    var sm=chSummary(c), isD=kind==='drill';
    kick='LESSON '+('0'+id).slice(-2);
    title=esc(c.title);
    sub=chIsDone(c)?'本章已点亮 · 可回来重读重做':(c.full?(isD?'按章刷题 · 答对自动移出错题':'讲义 + 随堂题 · 答完自动结算点亮章节'):'待莱布尼茨开讲');
    rows=ssRow('book',sm.total+' 道随堂题','答完即结算 · 不要求满分')
      +ssRow('bolt','30 分钟参考计时','切后台计时挂起，回来继续')
      +(sm.answered>0?ssRow(isD?'pen':'check','已答 '+sm.answered+'/'+sm.total,isD?'可反复重做':'继续上次进度'):'');
  }
  $('#ssKicker').textContent=kick;
  $('#ssTitle').textContent=title;
  $('#ssSub').textContent=sub;
  $('#ssRows').innerHTML=rows;
  /* 两拍式弹出：先显示落起始帧，再加 .show 触发弹簧过渡（rAF + setTimeout 双保险，防个别环境 rAF 节流导致无动画） */
  var sh=document.getElementById('startSheet');
  clearTimeout(sh._hideT);
  sh.classList.remove('show');
  sh.style.display='block';
  void sh.offsetWidth;
  var tryShow=function(){ sh.classList.add('show'); };
  if(window.requestAnimationFrame){ requestAnimationFrame(tryShow); setTimeout(tryShow, 40); }
  else tryShow();
  tap();
}
function closeStart(){
  startCtx=null;
  var el=document.getElementById('startSheet');
  if(el){
    el.classList.remove('show');
    clearTimeout(el._hideT);
    el._hideT=setTimeout(function(){ if(el && !el.classList.contains('show')) el.style.display='none'; },520);
  }
}

/* ================= Python 代码判题（pyodide 浏览器内运行） ================= */
var PYODIDE_SRC='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
var PYODIDE_INDEX='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
var _pyodide=null,_pyReady=false,_pyLoading=false;
function ensurePy(cb){
  if(_pyReady){ cb(); return; }
  if(_pyLoading){ setTimeout(function(){ ensurePy(cb); },200); return; }
  _pyLoading=true;
  var tag='pyodideScript';
  if(!document.getElementById(tag)){
    var s=document.createElement('script');
    s.id=tag; s.src=PYODIDE_SRC;
    s.onload=function(){ _bootPy(cb); };
    s.onerror=function(){ _pyLoading=false; toast('Python 运行时加载失败，请检查网络后重试'); };
    document.head.appendChild(s);
  } else {
    _bootPy(cb);
  }
}
function _bootPy(cb){
  try{
    if(typeof loadPyodide==='undefined'){ setTimeout(function(){ _bootPy(cb); },300); return; }
    loadPyodide({indexURL:PYODIDE_INDEX}).then(function(p){
      _pyodide=p; _pyReady=true; _pyLoading=false;
      try{
        _pyodide.setStdout({batched:function(t){ _pyBuf += t+'\n'; }});
        _pyodide.setStderr({batched:function(t){ _pyBuf += t+'\n'; }});
      }catch(e){}
      cb();
    }).catch(function(e){ _pyLoading=false; toast('Python 运行时初始化失败'); });
  }catch(e){ setTimeout(function(){ _bootPy(cb); },300); }
}
var _pyBuf='';
function pyRun(src){
  return new Promise(function(res,rej){
    ensurePy(function(){
      _pyBuf='';
      try{
        var r = _pyodide.runPython(src);
        var got = _pyBuf + (r!==undefined && r!==null ? String(r)+'\n' : '');
        res({out: got.replace(/\n+$/,''), err:''});
      }catch(e){
        var msg = String((e && e.message) || e);
        var trace = _pyBuf || '';
        res({out: trace, err: msg});
      }
    });
  });
}
function normOut(str){
  var lines=String(str||'').split('\n').map(function(l){return l.trim();});
  while(lines.length && lines[0]==='') lines.shift();
  while(lines.length && lines[lines.length-1]==='') lines.pop();
  return lines.join('\n');
}
function pyJudge(src,expect){
  return pyRun(src).then(function(r){
    var gotT=r.out.trim();
    if(r.err){ return {ok:false, msg:'运行出错：'+r.err, out:r.out, err:r.err}; }
    var exps=String(expect||'').split('|').map(function(x){return x.trim();});
    if(!String(expect||'').trim()){ return {ok:true, msg:'运行无异常，通过', out:r.out}; } /* expect 空=跑通即过 */
    for(var i=0;i<exps.length;i++){
      var e=exps[i];
      if(e===gotT || normOut(e)===normOut(r.out)){ return {ok:true, msg:'✓ 输出正确，通过！', out:r.out}; }
      if(e.indexOf('\n')<0 && gotT.indexOf('\n')<0 && /^-?\d+(\.\d+)?$/.test(e) && /^-?\d+(\.\d+)?$/.test(gotT)){
        if(parseFloat(e)===parseFloat(gotT)){ return {ok:true, msg:'✓ 输出正确，通过！', out:r.out}; }
      }
    }
    return {ok:false, msg:'✗ 输出不对，期望：「'+exps.join(' 或 ')+'」', out:r.out, want:exps.join(' 或 ')};
  });
}

/* ---------- 进度打包 / 合并（与旧引擎同语义：并集去重不互覆） ---------- */
function sbPack(){
  return {
    ch: load('ch', []), hall: load('hall', []), wrong: load('wrong', []),
    fixed: load('fixed', []), log: load('log', []), quizStat: load('quizStat', {}),
    tstat: load('tstat', {}), quizPick: load('quizPick', {}), settle: load('settle', {})
  };
}
var SB_MERGE_ARR = ['ch','hall','wrong','fixed','log'];
var SB_MERGE_OBJ = ['quizStat','tstat','quizPick','settle'];
function sbSanitize(d){ return d && typeof d === 'object' ? d : {}; }
function sbMerge(local, cloud){
  var out = {}; local = sbSanitize(local); cloud = sbSanitize(cloud);
  SB_MERGE_ARR.forEach(function(k){
    var a = local[k] || [], b = cloud[k] || [];
    if(!Array.isArray(a)) a = []; if(!Array.isArray(b)) b = [];
    var seen = {}, m = [];
    a.concat(b).forEach(function(x){ var kk = (typeof x === 'object' && x !== null) ? JSON.stringify(x) : String(x); if(!seen[kk]){ seen[kk] = 1; m.push(x); } });
    out[k] = m;
  });
  SB_MERGE_OBJ.forEach(function(k){
    var o = {}, a = local[k] || {}, b = cloud[k] || {};
    if(typeof a !== 'object') a = {}; if(typeof b !== 'object') b = {};
    Object.keys(a).forEach(function(x){ o[x] = a[x]; }); Object.keys(b).forEach(function(x){ o[x] = b[x]; });
    out[k] = o;
  });
  return out;
}
function sbApplyLocal(m){
  try{
    if(m.ch){ chDone = m.ch; store('ch', chDone); }
    if(m.hall){ hallDone = m.hall; store('hall', hallDone); }
    if(m.wrong){ wrongPool = m.wrong; store('wrong', wrongPool); }
    if(m.fixed){ fixedPool = m.fixed; store('fixed', fixedPool); }
    if(m.quizStat){ quizStat = m.quizStat; store('quizStat', quizStat); }
    if(m.quizPick){ quizPick = m.quizPick; store('quizPick', quizPick); }
    if(m.settle){ settleStore = m.settle; store('settle', settleStore); }
    if(m.tstat){ todayStat = m.tstat; store('tstat', todayStat); }
  }catch(e){}
}

  h += '<div class="card" style="border-radius:var(--r-l);text-align:center;padding:22px" id="rankBox"><div style="color:var(--muted)">加载中…</div></div>';
  setTimeout(function(){
    fetch(SB_URL + '/rest/v1/leaderboard?select=user_id,username,avatar,pct,done,rank_name&order=pct.desc,updated_at.asc&app=eq.' + SB_APP + '&limit=100', { headers: sbAuthHeaders() })

function sbRankEmpty(tip){

    + '<span style="font-size:40px">🏆</span><div class="h2" style="margin-top:10px">' + tip + '</div>'
    + '<div style="margin-top:12px"><a href="' + SB_PORTAL + '" class="btn-go" style="text-decoration:none;display:inline-flex">去总院登录</a></div></div>';
}
function paintRank(rows, u){
  var box = document.getElementById('rankBox'); if(!box) return;
  if(!rows || !rows.length){ box.innerHTML = sbRankEmpty('还没有人上榜，快去学习成为第一名！'); return; }
  var medals = ['🥇','🥈','🥉'];
  var html = '';
  var myRank = -1, me = u.id;
  rows.forEach(function(r, i){
    if(r.user_id === me) myRank = i + 1;
    var isMe = r.user_id === me;
    html += '<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;margin-top:8px;' + (isMe ? 'background:var(--accent-soft);border:1px solid var(--accent)' : 'background:var(--fill-soft)') + '">'
      + '<span style="width:34px;text-align:center;font-size:18px;flex:none">' + ((i < 3) ? medals[i] : '<b style="font-size:14px;color:var(--muted)">' + (i + 1) + '</b>') + '</span>'
      + '<span style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none">' + esc(r.avatar || '🐹') + '</span>'
      + '<span style="flex:1;min-width:0;text-align:left"><b style="display:block;font-size:15px">' + esc(r.username) + (isMe ? ' <span style="font-size:11px;color:var(--accent)">我</span>' : '') + '</b>'
      + '<span style="font-size:12px;color:var(--muted)">' + esc(r.rank_name || '') + ' · 已学 ' + r.done + ' 章</span></span>'
      + '<b style="font-size:18px;color:' + (r.pct >= 80 ? 'var(--green)' : r.pct >= 60 ? 'var(--gold)' : 'var(--muted)') + '">' + r.pct + '%</b></div>';
  });
  if(myRank > 0) html = '<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px">你当前第 <b style="color:var(--accent)">' + myRank + '</b> 名</div>' + html;
  box.innerHTML = html;
}
renderers.rank = function(){ return sbRankHTML(); };

var BD_TAG = '[讨论] ';
renderers.board=function(){
  var u=sbUser?sbUser():null;
  var h='<div class="kick">BOARD</div><div class="h1">讨论区</div>'
    +'<div class="sub">同学间说说话 · 分享进度与心得（登录后发言）</div>';

    h+='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:30px 20px">'
      +'<span style="font-size:40px">💬</span><div class="h2" style="margin-top:10px">登录后参与讨论</div>'
      +'<div class="cap" style="margin-top:6px;line-height:1.7">先去总院登录一次，就能在这和大家聊天了。</div>'
      +'<div style="margin-top:14px"><a href="' + SB_PORTAL + '" class="btn-go" style="text-decoration:none;display:inline-flex">去总院登录</a></div></div>';

    +'<input id="bdText" placeholder="说点什么…（按 Enter 发送）" style="flex:1;border:1.5px solid var(--sep);border-radius:14px;padding:12px 14px;font:15px inherit;font-family:inherit;background:var(--card);color:var(--ink)">'
    +'<button id="bdSend" style="flex:none;border:none;border-radius:14px;background:var(--accent);color:#fff;padding:0 22px;font:600 14px inherit;font-family:inherit;cursor:pointer">发送</button></div>'
    +'<div id="boardList"><div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载中…</div></div>';

function bdLoad(){
  var list=document.getElementById('boardList'); if(!list) return;
  list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载中…</div>';
  fetch(SB_URL+'/rest/v1/feedback?select=user_id,username,avatar,content,created_at&app=eq.'+SB_APP+'&order=created_at.desc&limit=60', { headers: sbAuthHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){ bdPaint(rows||[]); })
    .catch(function(){ list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:24px;color:var(--muted)">加载失败，请检查网络</div>'; });
}
function bdPaint(rows){
  var list=document.getElementById('boardList'); if(!list) return;
  var mine=(sbUser?sbUser():{id:''}).id;
  var items=rows.filter(function(x){ return x && x.content && x.content.indexOf(BD_TAG)===0; });
  if(!items.length){
    list.innerHTML='<div class="card" style="border-radius:var(--r-l);text-align:center;padding:30px"><span style="font-size:36px">💬</span><div class="cap" style="margin-top:8px">还没有人发言，来抢沙发！</div></div>';
    return;
  }
  var html='';
  items.forEach(function(x){
    var t=new Date(x.created_at);
    var p=function(n){return (n<10?'0':'')+n;};
    var isMe=(mine && x.user_id===mine);
    html+='<div class="card" style="border-radius:var(--r-l);padding:14px 16px;margin-bottom:10px;border-color:'+(isMe?'var(--accent)':'var(--sep)')+'">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
      +'<span style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0A84FF,#5E5CE6);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff">'+esc(x.avatar||'🐹')+'</span>'
      +'<b style="font-size:13.5px">'+esc(x.username||'同学')+(isMe?'<span style="color:var(--accent);font-size:11px;margin-left:5px">我</span>':'')+'</b>'
      +'<span style="font-size:11px;color:var(--muted)">'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes())+'</span></div>'
      +'<div style="font-size:14.5px;color:var(--ink2);line-height:1.7;white-space:pre-wrap;word-break:break-word">'+esc(x.content.slice(BD_TAG.length))+'</div></div>';
  });
  list.innerHTML=html;
}
function bdSend(){
  var u=(typeof sbUser==='function')?sbUser():null;
  if(!u){ toast('登录后才能发言'); return; }
  var el=document.getElementById('bdText');
  var v=(el&&el.value||'').trim();
  if(!v){ toast('先写点什么'); return; }
  var h=sbAuthHeaders(); if(!h){ toast('登录已失效'); return; }
  var hh=Object.assign({}, h, { 'Prefer': 'return=minimal' });
  fetch(SB_URL+'/rest/v1/feedback', { method:'POST', headers: hh, body: JSON.stringify({ user_id: u.id, username: u.nick, avatar: u.avatar, content: BD_TAG + v, app: SB_APP }) })
    .then(function(r){ if(r.ok){ if(el) el.value=''; bdLoad(); } else { toast('发送失败，稍后再试'); } })
    .catch(function(){ toast('发送失败，请检查网络'); });

/* ============ CodeMirror 代码编辑器（共享模块：python3/c3） ============ */
var CM_SRCS = [
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/selection/active-line.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldcode.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/brace-fold.min.js',
  'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.min.js'
];
var _cmBusy=false,_cmReady=false,_cmQueue=[];
function cmModeOf(ta){ return ta.getAttribute('data-cm')==='c' ? 'text/x-csrc' : 'python'; }
function ensureCM(cb){
  if(typeof CodeMirror!=='undefined'&&_cmReady){ cb(); return; }
  if(_cmBusy){ _cmQueue.push(cb); return; }
  _cmBusy=true;
  var i=0;
  function next(){
    if(i>=CM_SRCS.length){ _cmReady=true; _cmBusy=false; cb(); var q=_cmQueue; _cmQueue=[]; q.forEach(function(f){ try{f();}catch(e){} }); return; }
    var s=document.createElement('script');
    s.src=CM_SRCS[i++];
    s.onload=next; s.onerror=next;
    document.head.appendChild(s);
  }
  next();
}
/* 渲染完成后把 .py-ta 变成 CodeMirror（保底重扫，幂等） */
function initCodeMirrors(){
  if(typeof CodeMirror==='undefined'){ ensureCM(function(){ initCodeMirrors(); }); return; }
  document.querySelectorAll('textarea.py-ta:not(.cm-ready)').forEach(function(ta){
    ta.classList.add('cm-ready');
    try{
      var readOnly = ta.hasAttribute('readonly') || ta.disabled;
      var cm = CodeMirror.fromTextArea(ta, {
        mode: cmModeOf(ta),
        lineNumbers: true,
        indentUnit: 4, tabSize: 4, indentWithTabs: false,
        matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true,
        foldGutter: true,
        gutters: ['CodeMirror-foldgutter','CodeMirror-linenumbers'],
        theme: 'darcula',
        readOnly: readOnly,
        extraKeys: {
          'Tab': 'indentMore','Shift-Tab': 'indentLess',
          'Ctrl-Enter': function(m){ cmRunCurrent(m); },
          'Ctrl-/': 'toggleComment'
        }
      });
      ta.cm = cm;
      cm.on('keyup', function(m){ });
    }catch(e){ ta.classList.remove('cm-ready'); }
  });
}
function cmVal(ta){ if(ta&&ta.cm) return ta.cm.getValue(); return ta?ta.value:''; }
function cmSet(ta,val){ if(ta&&ta.cm){ ta.cm.setValue(String(val==null?'':val)); ta.cm.focus(); } else if(ta){ ta.value=val==null?'':val; ta.focus(); } }
/* Ctrl-Enter 触发就近运行 */
function cmRunCurrent(cm){
  var wrap=cm.getWrapperElement();
  var box=wrap?wrap.closest('.codebox'):null;
  if(!box) return;
  var runBtn=box.querySelector('[data-pyrun],[data-crun],[data-epyrun],[data-ecrun]');
  if(runBtn){ runBtn.click(); }
}
/* renderView 完成后自动初始化编辑器（debounce，防重复扫） */
var _cmScanTimer=null;
function cmScanLater(){
  if(_cmScanTimer) clearTimeout(_cmScanTimer);
  _cmScanTimer=setTimeout(function(){ initCodeMirrors(); }, 80);
}
